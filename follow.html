 $$('[data-t]',el).forEach(b=>b.onclick=()=>{$$('[data-t]',el).forEach(x=>x.classList.toggle('on',x===b));b.dataset.t==='s'?S():F()});S()};

/* c08 — synergy calculator, then the case */
LABS.synergy=(el,m,done)=>{el.innerHTML=`<div class="grid g3">${numIn('sy1','Cost synergies, run-rate (SAR m/yr)',60)}${numIn('sy2','Revenue synergies (SAR m/yr)',150)}${numIn('sy3','Margin on extra revenue (%)',20)}${numIn('sy4','Tax rate (%)',20)}${numIn('sy5','Capitalisation multiple (×)',10)}${numIn('sy6','One-off integration cost (SAR m)',90)}${numIn('sy7','Probability revenue synergies happen (%)',50)}${numIn('sy8','Premium paid over market value (SAR m)',450)}</div><div id="syo"></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h4>Now run the case</h4><div id="sysim"></div>`;
 const calc=()=>{const cs=V('sy1',el),rs=V('sy2',el)*V('sy3',el)/100*V('sy7',el)/100,tax=V('sy4',el)/100,mult=V('sy5',el),ic=V('sy6',el),prem=V('sy8',el);const val=(cs+rs)*(1-tax)*mult-ic;const net=val-prem;
  $('#syo',el).innerHTML=`<div class="readout ${net>=0?'ok':'bad'}"><div class="kv"><span>Risk-adjusted pre-tax synergies</span><span>SAR ${fmt(cs+rs,1)}m / yr</span><span>Value of synergies (after tax × multiple − integration)</span><span>SAR ${fmt(val)}m</span><span>Premium paid</span><span>SAR ${fmt(prem)}m</span><span><b>Value created for the acquirer</b></span><span>SAR ${fmt(net)}m</span></div><p class="note" style="margin:8px 0 0">Revenue synergies are discounted twice here: by margin (you earn profit, not revenue) and by probability. Cost synergies are usually more bankable.</p></div>${bars([{l:'Cost syn.',v:cs*(1-tax)*mult},{l:'Rev. syn.',v:rs*(1-tax)*mult},{l:'Integration',v:-ic,c:'var(--bad)'},{l:'Premium',v:-prem,c:'var(--bad)'},{l:'Net',v:net,c:net>=0?'var(--ok)':'var(--bad)'}],{h:200})}`};
 $$('input',el).forEach(x=>x.oninput=calc);calc();runSim($('#sysim',el),SIMS.mna,{onDone:()=>done()})};

/* c10 — economic value to the customer, then the case */
LABS.evc=(el,m,done)=>{el.innerHTML=`<p class="note">Economic Value to the Customer (EVC) = price of the next-best alternative + the value of your differentiation. It is the price ceiling; your cost is the floor.</p><div class="grid g3">${numIn('ev1','Next-best alternative price (SAR k/yr)',90)}${numIn('ev2','Downtime hours avoided by alternative / yr',6)}${numIn('ev3','Downtime hours avoided by ours / yr',12)}${numIn('ev4','Cost of 1 hour downtime (SAR k)',20)}${numIn('ev5','Our cost to serve (SAR k/yr)',40)}${numIn('ev6','Share of differentiation value we keep (%)',50)}</div><div id="evo"></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h4>Now run the case</h4><div id="evsim"></div>`;
 const calc=()=>{const alt=V('ev1',el),dv=(V('ev3',el)-V('ev2',el))*V('ev4',el),evc=alt+dv,cost=V('ev5',el),price=alt+dv*V('ev6',el)/100;
  $('#evo',el).innerHTML=`<div class="readout"><div class="kv"><span>Differentiation value</span><span>SAR ${fmt(dv)}k</span><span>EVC (price ceiling)</span><span>SAR ${fmt(evc)}k</span><span>Floor (cost to serve)</span><span>SAR ${fmt(cost)}k</span><span><b>Suggested price</b></span><span>SAR ${fmt(price)}k</span><span>Customer's saving vs EVC</span><span>SAR ${fmt(evc-price)}k</span></div></div>${bars([{l:'Cost',v:cost,c:'var(--line)'},{l:'Alternative',v:alt,c:'#7C8BA3'},{l:'Our price',v:price},{l:'EVC',v:evc,c:'var(--navy2)'}],{h:190})}`};
 $$('input',el).forEach(x=>x.oninput=calc);calc();runSim($('#evsim',el),SIMS.pricing,{onDone:()=>done()})};

/* c11 — timed exhibit drill */
LABS.exhibits=(el,m,done)=>{const N=6;const start=()=>{const r=RNG(Date.now()%1e9);let i=0,ok=0;const t0=Date.now();
  const draw=()=>{if(i>=N){const s=Math.round((Date.now()-t0)/1000);logEvent('exhibits',m.id,ok+'/'+N+' in '+s+'s');save();el.innerHTML=`<div class="readout ${ok>=5?'ok':''}"><b>${ok}/${N} in ${s} s</b> (target under 4 minutes). Habit to build: read the title, units and source <i>before</i> the bars.</div><button class="sbtn alt" id="ag">Again</button>`;$('#ag',el).onclick=start;if(ok>=4)done();return}
   const x=genExhibit(r);el.innerHTML=`<div class="row"><b>Exhibit ${i+1} of ${N}</b><span class="spacer"></span><span class="timer" id="et">0s</span></div><div class="exhibit">${x.tbl}</div><p><b>${x.q}</b></p>${x.num?`<div class="row"><input class="tin" id="ea" type="number" step="any" inputmode="decimal" style="max-width:160px"><button class="sbtn" id="eb">Submit</button></div>`:x.o.map((o,j)=>`<button class="qopt" data-j="${j}">${o}</button>`).join('')}<div id="ew"></div>`;
   const fin=g=>{if(g)ok++;$('#ew',el).innerHTML=`<div class="readout ${g?'ok':'bad'}">${x.w}</div><div class="ctl"><span class="spacer"></span><button class="sbtn" id="en">Next →</button></div>`;$('#en',el).onclick=()=>{i++;draw()};$$('.qopt,#eb',el).forEach(b=>b.disabled=true)};
   if(x.num){const s=()=>{const v=$('#ea',el).value;if(v==='')return;fin(Math.abs(parseFloat(v)-x.ans)<=x.tol)};$('#eb',el).onclick=s;$('#ea',el).onkeydown=e=>{if(e.key==='Enter')s()}}else $$('.qopt',el).forEach(b=>b.onclick=()=>{const g=+b.dataset.j===x.a;b.classList.add(g?'right':'wrong');fin(g)})};
  const tm=setInterval(()=>{const e=$('#et',el);if(!e){clearInterval(tm);return}e.textContent=Math.round((Date.now()-t0)/1000)+'s'},500);draw()};
 el.innerHTML=`<p class="note">Six illustrative exhibits, generated fresh each run. Answer fast and accurately; interviewers judge both.</p><button class="sbtn" id="st">Start</button>`;$('#st',el).onclick=start};

/* c12 — storyline builder */
LABS.story=(el,m,done)=>{const C=CUST('story');if(!C.k)Object.assign(C,{s:'',c:'',q:'',g:'',k:[{t:'',s:['','']},{t:'',s:['','']},{t:'',s:['','']}]});
 const draw=()=>{el.innerHTML=`<p class="note">Use a real problem from work if you can (keep client names out), or the default: a CEO asking whether to automate a packaging line.</p><div class="grid g3"><div><label class="f">Situation (agreed facts)</label><textarea data-f="s" style="min-height:70px">${esc(C.s)}</textarea></div><div><label class="f">Complication (what changed)</label><textarea data-f="c" style="min-height:70px">${esc(C.c)}</textarea></div><div><label class="f">Question (that the reader now asks)</label><textarea data-f="q" style="min-height:70px">${esc(C.q)}</textarea></div></div><label class="f">Governing thought (the answer, in one sentence)</label><textarea data-f="g" style="min-height:56px">${esc(C.g)}</textarea>
  <div class="grid g3">${C.k.map((k,i)=>`<div class="card" style="box-shadow:none;margin:8px 0"><label class="f">Key line ${i+1}</label><input class="tin" data-k="${i}" value="${esc(k.t)}" placeholder="A reason or step, phrased as a claim">${k.s.map((s,j)=>`<input class="tin" style="margin-top:6px;font-size:.88rem" data-k="${i}" data-s="${j}" value="${esc(s)}" placeholder="Support ${j+1}">`).join('')}</div>`).join('')}</div>
  <div class="ctl"><button class="sbtn" id="rn">Build the pyramid</button><button class="sbtn alt" id="ex">Example</button></div><div id="py"></div>`;
  $$('[data-f]',el).forEach(x=>x.oninput=()=>C[x.dataset.f]=x.value);$$('[data-k]',el).forEach(x=>x.oninput=()=>{const k=C.k[+x.dataset.k];if(x.dataset.s!=null)k.s[+x.dataset.s]=x.value;else k.t=x.value});
  $('#rn',el).onclick=()=>{save();$('#py',el).innerHTML=`<div class="pyr"><div class="box gt">${esc(C.g||'Governing thought')}</div><div class="lvl2">${C.k.map(k=>`<div class="col"><div class="box"><b>${esc(k.t||'Key line')}</b></div>${k.s.map(s=>`<div class="box sup">${esc(s||'…')}</div>`).join('')}</div>`).join('')}</div></div><div class="readout"><b>Check it like a partner would:</b><ol style="margin:.3rem 0;padding-left:1.2rem"><li>Does the governing thought answer the Question directly?</li><li>Do the three key lines, read alone, convince someone of it?</li><li>Are the key lines one kind of thing (all reasons, or all steps)?</li><li>Is the order deliberate (time, structure, or importance)?</li></ol>Read only the bold lines aloud — that is your executive summary.</div>`;const ok=C.g.trim()&&C.q.trim()&&C.k.every(k=>k.t.trim());if(ok)done();else toast('Fill the question, governing thought and three key lines')};
  $('#ex',el).onclick=()=>{Object.assign(C,{s:'Packaging line 3 runs two shifts with 14 operators and meets current demand.',c:'Demand will grow 30% by 2027 and recruiting experienced operators has taken five months per hire.',q:'Should we automate line 3 now?',g:'Automate line 3 in 2026: it pays back in under three years, removes the hiring bottleneck, and the risks are manageable.',k:[{t:'It pays back in 2.6 years',s:['Capex SAR 18m vs SAR 7m/yr savings','Robust to ±20% volume']},{t:'It removes the hiring constraint on growth',s:['Frees 9 operators for lines 1–2','Avoids 5-month hiring lead time']},{t:'Delivery risk is manageable',s:['Vendor has 3 GCC references','Phased cutover over Eid shutdown']}]});draw()}};draw()};

/* c13/c14 — critique engine (slides or messages) */
function critique(el,items,done,kind){let i=0,pts=0,max=0;
 const draw=()=>{if(i>=items.length){const sc=pts/max;el.innerHTML=`<div class="readout ${sc>=.7?'ok':''}"><b>${Math.round(sc*100)}%.</b> ${kind==='slide'?'The best slides pass the "title test": read only the titles of a deck and you get the whole argument.':'Busy seniors read the first two lines. Put the answer and the ask there.'}</div><button class="sbtn alt" id="ag">Again</button>`;$('#ag',el).onclick=()=>{i=0;pts=0;max=0;draw()};if(sc>=.6)done();return}
  const it0=items[i],pm=perm(it0.titles.length),it=Object.assign({},it0,{titles:pm.map(k=>it0.titles[k]),best:pm.indexOf(it0.best)});max+=1+it.issues.length;el.innerHTML=`<div class="eyebrow">${i+1} of ${items.length}</div>${it.show}<p><b>1. ${it.tq}</b></p>${it.titles.map((t,j)=>`<button class="qopt" data-j="${j}">${t}</button>`).join('')}<div id="p2" class="hide"><p style="margin-top:14px"><b>2. Which problems does the ${kind} have? Tick all that apply.</b></p><div class="rubric">${it.all.map((x,j)=>`<label><input type="checkbox" data-x="${j}"><span>${x}</span></label>`).join('')}</div><div class="ctl"><button class="sbtn" id="ci">Check</button></div></div><div id="fb"></div>`;
  $$('.qopt',el).forEach(b=>b.onclick=()=>{const g=+b.dataset.j===it.best;if(g)pts++;$$('.qopt',el).forEach(x=>{x.disabled=true;if(+x.dataset.j===it.best)x.classList.add('right');else if(x===b)x.classList.add('wrong')});$('#p2',el).classList.remove('hide')});
  $('#ci',el).onclick=()=>{let g=0;$$('[data-x]',el).forEach(x=>{const j=+x.dataset.x,is=it.issues.includes(j);if(x.checked===is&&is)g++;if(x.checked&&!is)g--;x.parentElement.style.color=is?'var(--ok)':x.checked?'var(--bad)':''});pts+=Math.max(0,g);$('#ci',el).disabled=true;$('#fb',el).innerHTML=`<div class="model"><b>Why.</b> ${it.why}</div><label class="f">Rewrite it your way (optional, saved to your notebook of drafts)</label><textarea id="rw"></textarea><div class="ctl"><span class="spacer"></span><button class="sbtn" id="nx">Next →</button></div>`;$('#nx',el).onclick=()=>{const v=$('#rw',el).value.trim();if(v){const C=CUST('drafts');(C.list=C.list||[]).push({t:Date.now(),kind,v});save()}i++;draw()}}};draw()}
const ISSUES_S=['Title is a topic, not a message','More than one message on the slide','Chart does not prove the title','Missing units, period or source','Clutter: 3-D, too many colours, gridlines','Text too dense to read in 30 seconds'];
LABS.slides=(el,m,done)=>{const sl=(t,body,src)=>`<div class="slide"><div class="st">${t}</div><div class="sb">${body}</div><div class="src">${src||''}</div></div>`;
 const bar=(vals,labels,hl)=>`<svg viewBox="0 0 300 140" style="width:100%;height:100%">${vals.map((v,i)=>`<rect x="${20+i*55}" y="${120-v}" width="38" height="${v}" fill="${i===hl?'#C9A227':'#9AA7BA'}"/><text x="${39+i*55}" y="${115-v}" font-size="9" text-anchor="middle" fill="#1A1F2B">${v}</text><text x="${39+i*55}" y="134" font-size="8" text-anchor="middle" fill="#555">${labels[i]}</text>`).join('')}</svg>`;
 critique(el,[
  {show:sl('Fuel and power cost',bar([48,55,63,70],['2022','2023','2024','2025'],3),''),tq:'Pick the best action title.',titles:['Fuel and power cost','Fuel and power cost per tonne rose 46% since 2022 and drives most of the margin decline','Energy costs increased','Analysis of variable cost per tonne, 2022–2025'],best:1,all:ISSUES_S,issues:[0,3],why:'A topic title forces the reader to work out the point. The action title states the "so what" in a full sentence (ideally under two lines). The chart is also missing units (SAR per tonne) and a source.'},
  {show:sl('Our recommendation: enter the market via a joint venture, and also cut costs by 12%, and the competitor landscape is fragmenting','<div style="font-size:.8em;line-height:1.35">• Market growing 9% p.a. • JV partners: 3 shortlisted; partner A has distribution in 13 regions, partner B has land in KAEC, partner C has a licence • Cost reduction from procurement (4%), energy (5%), overhead (3%) • Fragmentation: top-5 share fell from 61% to 48% • Next steps: due diligence, board approval, PMO, KPI dashboard, quarterly review</div>','Source: team analysis'),tq:'What is the best fix?',titles:['Shrink the font so it all fits','Split into separate slides: one per message, each with its own evidence','Add a chart to the right','Move the bullets into a table'],best:1,all:ISSUES_S,issues:[1,5],why:'One slide, one message. This slide carries three (entry mode, cost-out, market structure) plus next steps, so none of them lands. Split it, and make each title the message.'},
  {show:sl('Segment B is the most profitable segment',bar([62,40,88,35],['A','B','C','D'],1),'Revenue by segment, SAR m, 2025. Source: client finance'),tq:'What is wrong with this slide?',titles:['Nothing — the title is an action title','The chart shows revenue, but the title claims profitability; the evidence does not prove the title','The colours are wrong','It needs a source'],best:1,all:ISSUES_S,issues:[2],why:'The title is a proper message, but the chart is revenue, not profit — and B is not even the largest. Every slide must pass the test "does the body prove the title?" Partners catch this in seconds.'},
  {show:sl('Three levers close 80% of the cost gap to best-in-class peers','<div style="display:flex;gap:4%;width:100%;font-size:.85em"><div style="flex:1;border-top:3px solid #C9A227;padding-top:4px"><b>Energy</b><br>Waste-heat recovery and alternative fuels: SAR 58m</div><div style="flex:1;border-top:3px solid #C9A227;padding-top:4px"><b>Maintenance</b><br>Shift from reactive to planned: SAR 31m</div><div style="flex:1;border-top:3px solid #C9A227;padding-top:4px"><b>Procurement</b><br>Consolidate 140 suppliers to 60: SAR 22m</div></div>','Annual run-rate savings by 2027, SAR m. Source: team analysis, peer benchmark'),tq:'How would you rate this title?',titles:['Weak — too long','Strong — it is a specific, quantified message that the three columns support','Weak — should be "Cost levers"','Weak — titles should be questions'],best:1,all:ISSUES_S,issues:[],why:'This is what good looks like: a quantified claim, three MECE supports, units, period and source. No problems to tick — knowing when a slide is done is a skill too.'}
 ],done,'slide')};
const ISSUES_E=['The ask or answer is buried','Too long for the reader','Vague: no numbers, owners or dates','Tone wrong for the audience','No clear next step'];
LABS.email=(el,m,done)=>{const msg=t=>`<div class="exhibit" style="white-space:pre-wrap;font-size:.92rem">${t}</div>`;
 critique(el,[
  {show:msg('Subject: Update\n\nHi Ahmed,\n\nHope you are well. This week we had several meetings with the client, including with the plant team on Monday and finance on Wednesday. We also received part of the data request, though some files are still missing. The team has been working on the baseline model and has made good progress. There were some questions on the scope of the energy workstream. Also, the steering committee might move.\n\nLet me know if you have any questions.\n\nBest,\nMajed'),tq:'Which opening line is best for this weekly update to your manager?',titles:['Hope you are well.','Three things this week: baseline model is 70% done; finance data is still missing (need your help); SteerCo may move to the 18th.','This week was busy with many meetings.','Please see below for an update.'],best:1,all:ISSUES_E,issues:[0,2,4],why:'Lead with the answer: status in one line, then the ask. The original buries the two things the manager must act on (missing data, SteerCo date) and has no owners, dates or next step.'},
  {show:msg('Subject: Request\n\nDear Dr. Khalid,\n\nWe need the maintenance logs by tomorrow otherwise the analysis will be late. Please send.\n\nMajed'),tq:'This goes to the client\'s plant director. Best rewrite of the core sentence?',titles:['Keep it — it is short and clear','"Could your team share the 2023–25 maintenance logs by Thursday? They let us size the planned-maintenance opportunity for your SteerCo on the 18th. Happy to collect them in person."','"Kindly send the logs ASAP."','"As per our data request, please be reminded to send the logs."'],best:1,all:ISSUES_E,issues:[2,3],why:'Short is good; curt is not. A senior client needs to know exactly what (which logs, which years), by when, and why it matters to <i>him</i>. Offering to collect lowers the effort for his team.'},
  {show:msg('Subject: Recommendation on supplier consolidation – decision needed by Sunday\n\nAhmed,\n\nRecommendation: consolidate packaging suppliers from 14 to 5. It saves SAR 6.2m a year (4.1% of spend) with no single-source risk above 30%.\n\nDecision needed: your OK by Sunday to share with the CPO on Monday.\n\nDetail and risks are in the attached two pages.\n\nMajed'),tq:'How would you rate this message?',titles:['Too blunt for a manager','Strong: answer first, quantified, a clear ask with a date, detail attached','Too short','Should start with background'],best:1,all:ISSUES_E,issues:[],why:'This is the standard: subject line carries the ask and deadline, first line is the answer, numbers are specific, the ask is explicit. Nothing to tick.'}
 ],done,'message')};

/* c15 — full mock */
LABS.mock=(el,m,done)=>{el.innerHTML=`<p class="note">A full case, timed at 30 minutes. Talk out loud as you write — record yourself on your phone if you can. Afterwards, rate yourself on the four dimensions interviewers use. For a real interviewer, use <a href="#/rooms">Online rooms → Partner case</a>.</p><div id="mk"></div>`;
 runSim($('#mk',el),SIMS.mock,{onDone:(sc)=>{const box=document.createElement('div');box.className='card';box.style.marginTop='12px';box.innerHTML=`<h3>Rate yourself honestly (1–5)</h3>${DIMS.map((d,i)=>`<label class="f">${d}</label><div class="conf" data-d="${i}">${[1,2,3,4,5].map(v=>`<button data-v="${v}">${v}</button>`).join('')}</div>`).join('')}<div class="ctl"><button class="sbtn gold" id="ms">Save my mock score</button></div><div id="mo"></div>`;el.appendChild(box);const r=[0,0,0,0];
  $$('.conf[data-d]',box).forEach(c=>$$('button',c).forEach(b=>b.onclick=()=>{r[+c.dataset.d]=+b.dataset.v;$$('button',c).forEach(x=>x.classList.toggle('on',x===b))}));
  $('#ms',box).onclick=()=>{if(r.some(x=>!x)){toast('Rate all four');return}const self=r.reduce((a,b)=>a+b,0)/20;const tot=(sc+self)/2;const p=P(m.id);if(tot>(p.mock||0))p.mock=tot;logEvent('mock',m.id,'Mock '+Math.round(tot*100)+'% (case '+Math.round(sc*100)+'%, self '+Math.round(self*100)+'%)');save();checkBadges();$('#mo',box).innerHTML=`<div class="readout ${tot>=.8?'ok':''}"><b>Mock score ${Math.round(tot*100)}%</b> (half case points, half self-rating). Best so far: ${Math.round(p.mock*100)}%.</div>`;done()}}})};

/* ================= Case simulations (illustrative figures; companies are fictional) ================= */
SIMS.cement={title:'Margin squeeze at Najd Cement',partner:true,mins:25,steps:[
 {t:'info',h:`<p class="dropcap">Najd Cement is a listed Saudi producer with three kilns and revenue of about SAR 1.6bn. Its EBITDA margin has fallen from about 38% in 2022 to about 22% in 2025. The share price has halved. The new CEO has asked your team one question: <b>why has margin collapsed, and what should we do about it?</b></p><p>You are in the first meeting with the CEO. He turns to you.</p>`},
 {t:'open',q:'How would you structure this problem?',hint:'Take 60 seconds. Draw it before you write it.',model:'Profit = revenue − cost. Revenue = price × volume, cut by product (OPC, SRC, blended), region and channel (bagged vs bulk). Costs split into variable per tonne (fuel & power, raw materials, logistics, packaging) and fixed (labour, maintenance, overhead, depreciation). Then step outside the company: is the whole industry suffering (oversupply, demand from construction, energy-price reform, export permits) or only Najd? Lead with a hypothesis: "My first guess is that variable cost per tonne — energy — has risen, because that hit the whole sector after energy-price reform."',rubric:['Split revenue into price and volume','Split cost into variable (per tonne) and fixed','Checked whether it is a company or an industry problem','Stated a hypothesis to prioritise']},
 {t:'info',h:`<div class="exhibit"><div class="eyebrow">Exhibit 1 · Najd Cement operating data</div><table class="t"><tr><th></th><th>2022</th><th>2025</th></tr><tr><td>Volume sold (Mt)</td><td>7.5</td><td>7.2</td></tr><tr><td>Average price (SAR/t)</td><td>240</td><td>225</td></tr><tr><td>Variable cost (SAR/t)</td><td>105</td><td>128</td></tr><tr><td>Fixed cost (SAR m)</td><td>330</td><td>345</td></tr></table></div>`},
 {t:'calc',q:'What was EBITDA in 2025 (SAR m)?',ans:353.4,tol:3,unit:'SAR m',dp:1,model:'Revenue 7.2 × 225 = 1,620. Variable cost 7.2 × 128 = 921.6. EBITDA = 1,620 − 921.6 − 345 = 353.4 (21.8% margin). For 2022: 1,800 − 787.5 − 330 = 682.5 (37.9%).'},
 {t:'mcq',q:'EBITDA fell by about SAR 329m. Which driver explains most of the fall?',o:['Lower price','Lower volume','Higher variable cost per tonne','Higher fixed cost'],a:2,w:'Variable cost: (128 − 105) × 7.2 = −165.6m. Price: (225 − 240) × 7.2 = −108m. Volume: −0.3 × (240 − 105) = −40.5m. Fixed: −15m. Total −329.1m. Always quantify each driver before you dive — it tells you where to spend the next week.'},
 {t:'info',h:`<div class="exhibit"><div class="eyebrow">Exhibit 2 · Variable cost per tonne (SAR)</div><table class="t"><tr><th></th><th>2022</th><th>2025</th></tr><tr><td>Fuel & power</td><td>48</td><td>70</td></tr><tr><td>Raw materials</td><td>30</td><td>31</td></tr><tr><td>Logistics</td><td>22</td><td>22</td></tr><tr><td>Packaging</td><td>5</td><td>5</td></tr><tr><td><b>Total</b></td><td><b>105</b></td><td><b>128</b></td></tr></table></div>`},
 {t:'calc',q:'What share of the variable-cost increase comes from fuel & power (%)?',ans:95.7,tol:1.5,unit:'%',dp:1,model:'Fuel & power rose 22 of the 23 SAR/t increase: 22 / 23 = 95.7%. The problem is energy, almost entirely.'},
 {t:'open',q:'Brainstorm levers to restore margin. Be structured.',model:'<ul><li><b>Energy cost:</b> waste-heat recovery, kiln efficiency and maintenance, alternative fuels (tyres, refuse-derived fuel), solar PPA for grinding power, renegotiated power tariff.</li><li><b>Clinker factor:</b> shift mix to blended cements that use less clinker per tonne.</li><li><b>Price and mix:</b> premium products, regional pricing, bulk vs bagged.</li><li><b>Volume:</b> exports to absorb surplus capacity (subject to permits), new segments (precast, infrastructure).</li><li><b>Fixed cost:</b> mothball the least efficient kiln if utilisation stays low.</li></ul>',rubric:['Started with energy, where the problem is','Grouped levers (cost / price / volume or similar)','Included a structural lever such as clinker factor or kiln closure','Mentioned feasibility, cost or time for at least one lever']},
 {t:'calc',q:'A waste-heat recovery unit costs SAR 120m and saves SAR 8 per tonne on 7.2 Mt. Simple payback in years?',ans:2.08,tol:.1,unit:'years',dp:1,model:'Saving 8 × 7.2 = SAR 57.6m a year. Payback 120 / 57.6 ≈ 2.1 years — attractive, and it attacks the root cause.'},
 {t:'open',q:'The CEO says: "I have 60 seconds before the board. What do I tell them?"',model:'"Margin fell 16 points because energy cost per tonne rose almost 50%; that alone explains about half of the decline, with lower prices most of the rest. We recommend three moves: first, approve waste-heat recovery now — SAR 120m, about two-year payback; second, raise the share of blended cement to cut fuel per tonne; third, a 6-week review of pricing and the least efficient kiln. Together these should recover 6–9 points of margin within two years. Next step: board approval for the WHR tender this quarter."',rubric:['Answer first (the cause, quantified)','Two or three prioritised actions','Numbers: impact, cost or timing','A clear next step or decision for the board']}],
 wrap:'The best answers quantify the bridge (price, volume, variable, fixed) before brainstorming, so every lever is tied to where the money went. Note how one exhibit turned a generic "costs went up" into "energy per tonne" — always ask for the next level of breakdown.'};

SIMS.fermi={title:'Guided estimation: replacement tyres in Saudi Arabia',steps:[
 {t:'info',h:'<p>An interviewer asks: <b>"How many replacement car tyres are sold in Saudi Arabia each year, and what is that worth?"</b> Real numbers are not the point; a clear, defensible logic is. Use the assumptions below (they are round numbers for practice, not official statistics).</p><div class="exhibit"><div class="eyebrow">Assumptions</div><div class="kv"><span>Population</span><span>35 m</span><span>Average household size</span><span>5.5</span><span>Cars per household</span><span>1.6</span><span>Kilometres per car per year</span><span>25,000</span><span>Tyre life</span><span>50,000 km</span><span>Average tyre price</span><span>SAR 400</span></div></div>'},
 {t:'open',q:'Before calculating: lay out your estimation logic as an equation.',model:'Tyres per year = cars × 4 tyres × (km per year ÷ tyre life). Cars = households × cars per household; households = population ÷ household size. Value = tyres × price. Say it out loud before any maths.',rubric:['Wrote the chain as an equation first','Used households (or adults) to get to cars','Converted tyre life into replacements per year']},
 {t:'calc',q:'How many cars (millions)?',ans:10.18,tol:.15,unit:'m cars',dp:2,model:'35 / 5.5 = 6.36m households × 1.6 = 10.2m cars. Round early: "about 10 million".'},
 {t:'calc',q:'Replacement tyres per year (millions)?',ans:20.36,tol:.5,unit:'m tyres',dp:1,model:'Each car drives 25,000 km; a set lasts 50,000 km, so half a set per year = 2 tyres. 10.18 × 2 = 20.4m tyres.'},
 {t:'calc',q:'Market value (SAR bn)?',ans:8.15,tol:.2,unit:'SAR bn',dp:2,model:'20.4m × SAR 400 ≈ SAR 8.1bn.'},
 {t:'open',q:'How would you sanity-check this number?',model:'Triangulate from the supply side: number of tyre shops × tyres sold per shop per day; or import statistics (most tyres are imported). Also test sensitivity: if tyre life is 40,000 km, the answer rises 25%. Commercial vehicles and fleets are excluded — say so.',rubric:['Proposed a second, independent method (supply side or imports)','Named the most sensitive assumption','Stated what is excluded from the scope']}],
 wrap:'Interviewers score the structure and the sanity check more than the final number.'};

SIMS.entry={title:'HanVolt: should we build a battery-pack plant in Saudi Arabia?',partner:true,mins:25,steps:[
 {t:'info',h:'<p class="dropcap">HanVolt is a Korean battery-pack assembler with USD 2bn in revenue, supplying several global car makers. Saudi Arabia is building a domestic electric-vehicle industry and offers incentives for local manufacturing. HanVolt\'s board asks: <b>should we build a pack-assembly plant in the Kingdom, opening in 2028?</b></p>'},
 {t:'open',q:'How would you structure the decision?',model:'Four questions. (1) Is the market attractive — size and growth of EV and storage demand, policy and incentives? (2) Can we win — who else will supply, what is our cost vs importing? (3) Do the economics work — volume needed to break even, NPV vs exporting from Korea? (4) How should we enter and what are the risks — greenfield, JV, partner OEM offtake, talent, supply chain?',rubric:['Market attractiveness','Competition and our ability to win','Economics: breakeven or NPV','Entry mode and risks']},
 {t:'info',h:'<div class="exhibit"><div class="eyebrow">Exhibit · Planning assumptions for 2030 (illustrative)</div><div class="kv"><span>Saudi light-vehicle sales</span><span>750,000</span><span>EV share of sales</span><span>20%</span><span>EVs assembled locally</span><span>60,000</span><span>Average pack value</span><span>USD 9,000</span><span>HanVolt contribution margin</span><span>12%</span><span>Plant fixed cost</span><span>USD 18m / yr</span><span>Plant capex</span><span>USD 120m</span></div></div>'},
 {t:'calc',q:'Value of the total Saudi EV pack market in 2030 (USD m)?',ans:1350,tol:20,unit:'USD m',model:'750,000 × 20% = 150,000 EVs × USD 9,000 = USD 1.35bn. But most of these cars will be imported with packs already inside.'},
 {t:'calc',q:'If HanVolt wins 15% of locally assembled EVs, what is its revenue (USD m)?',ans:81,tol:2,unit:'USD m',model:'15% × 60,000 = 9,000 packs × 9,000 = USD 81m.'},
 {t:'calc',q:'Break-even volume for the plant (packs per year)?',ans:16667,tol:200,unit:'packs',model:'Contribution per pack 12% × 9,000 = USD 1,080. 18m / 1,080 ≈ 16,700 packs.'},
 {t:'mcq',q:'What does this imply?',o:['Build now: the market is USD 1.35bn','Local OEM demand alone does not cover fixed costs: we need more anchor volume or a lighter entry','Abandon Saudi Arabia','Raise prices by 50%'],a:1,w:'9,000 packs against a 16,700 breakeven. The headline market is large, but the addressable part is the locally assembled share. You need more anchors (two or three OEMs, energy-storage packs, GCC exports) or a lower-fixed-cost entry.'},
 {t:'open',q:'What entry approach would you recommend?',model:'Phase it. Start with a smaller assembly line or a JV with a local partner, conditional on a binding offtake from at least one local OEM. Add stationary energy-storage packs to fill capacity. Use incentives (industrial-fund financing, local-content preference in tenders) to cut capex and fixed cost. Set go/no-go triggers for phase 2: e.g. contracted volume above 20,000 packs.',rubric:['Phased or option-based entry rather than all-in','Secured anchor demand (offtake, multiple OEMs or storage)','Used local incentives or a partner to lower risk','Explicit triggers or milestones']},
 {t:'open',q:'Summarise your recommendation to HanVolt\'s board in four sentences.',model:'"Yes to Saudi Arabia, but not a full plant yet. The headline market is USD 1.35bn, but locally assembled demand gives us about 9,000 packs — half our breakeven. We recommend a phased JV entry tied to OEM offtake and energy-storage volume, with a full plant only once contracted volume passes 20,000 packs. This keeps our first-mover position while capping the downside at roughly USD 40m."',rubric:['Clear yes / no / conditional answer first','The key number behind it (breakeven gap)','The recommended path','Risk or downside quantified']}],
 wrap:'The trap is the big headline market. Strong candidates move quickly from "total market" to "what we can actually serve from this plant" and compare it to breakeven.'};

SIMS.mna={title:'Al-Wafra Dairy and Nakheel Juices: is the price right?',partner:true,mins:20,steps:[
 {t:'info',h:'<p class="dropcap">Al-Wafra Dairy (revenue SAR 4bn) wants to buy Nakheel Juices (revenue SAR 1.2bn, market value about SAR 1.5bn). Nakheel\'s owners ask SAR 1.95bn — a premium of SAR 450m. Al-Wafra\'s CEO asks: <b>is the deal worth it at this price?</b></p>'},
 {t:'open',q:'How do you decide whether the premium is justified?',model:'Value to us = standalone value + value of synergies − integration costs. The premium is justified only if synergy value exceeds it. Split synergies into cost (procurement, distribution, overhead, plants) and revenue (cross-selling, channels), then risk-adjust. Also check strategic fit and alternatives (build our own juice line, partner).',rubric:['Premium vs synergy value is the core test','Split cost vs revenue synergies','Included integration costs','Mentioned alternatives or strategic fit']},
 {t:'info',h:'<div class="exhibit"><div class="eyebrow">Exhibit · Synergy estimates</div><div class="kv"><span>Combined cost of goods sold</span><span>SAR 3.0bn</span><span>Procurement savings</span><span>1.5% of combined COGS</span><span>Distribution overlap savings</span><span>SAR 15m / yr</span><span>Cross-selling revenue</span><span>SAR 150m / yr at 20% margin</span><span>Probability revenue synergies happen</span><span>50%</span><span>Tax rate</span><span>20%</span><span>Capitalisation multiple</span><span>10×</span><span>One-off integration cost</span><span>SAR 90m</span></div></div>'},
 {t:'calc',q:'Run-rate cost synergies (SAR m per year)?',ans:60,tol:1,unit:'SAR m',model:'1.5% × 3,000 = 45, plus 15 distribution = 60.'},
 {t:'calc',q:'Value of all synergies, after tax and integration cost (SAR m)?',ans:510,tol:8,unit:'SAR m',model:'Risk-adjusted revenue synergy profit: 150 × 20% × 50% = 15. Total 75 × (1 − 20%) × 10 = 600, minus 90 integration = 510.'},
 {t:'calc',q:'What is the highest price Al-Wafra should pay (walk-away price, SAR m)?',ans:2010,tol:15,unit:'SAR m',model:'Market value 1,500 + synergy value 510 = 2,010. At the asking 1,950, Al-Wafra keeps only SAR 60m of value — a thin margin for error.'},
 {t:'mcq',q:'Which synergy estimate deserves the most scrutiny before signing?',o:['Procurement savings','Distribution overlap','Cross-selling revenue','Tax rate'],a:2,w:'Revenue synergies are the least reliable — customers and retailers react, and they depend on execution. Many acquirers capture cost synergies but miss revenue ones. That is why we risk-weighted them at 50%.'},
 {t:'open',q:'Your recommendation to the CEO?',model:'"Proceed only at or below about SAR 1.9bn, or with an earn-out. At SAR 1.95bn we keep just SAR 60m of value, and that depends on integration going well. Cost synergies of SAR 60m a year are bankable; cross-selling is upside. Before signing: validate procurement savings with two category deep-dives and lock in the key Nakheel managers."',rubric:['Clear position on the price','Used the walk-away logic','Separated bankable from uncertain synergies','Named concrete pre-signing actions']}],
 wrap:'In M&A cases, the question is almost never "is this a good company?" — it is "is it worth more to us than we pay?"'};

SIMS.costout={title:'Jubail Compounds: cut conversion cost by 15%',partner:true,mins:25,steps:[
 {t:'info',h:'<p class="dropcap">Jubail Compounds turns polymer resin into compounded plastics on three lines. Conversion cost (everything except the resin itself) is SAR 420m a year. The parent company wants a <b>15% reduction — SAR 63m — within 18 months</b>, without cutting safety or quality.</p>'},
 {t:'open',q:'How would you approach a cost-reduction target like this?',model:'Build a cost baseline by nature (energy, labour, maintenance, yield loss, overhead) and by line. For each bucket, split into volume × rate (e.g. kWh per tonne × price per kWh). Benchmark against best-in-class plants to size the gap. Then sort levers into quick wins vs structural, and check the sum against the target.',rubric:['Baseline by cost bucket','Driver logic (volume × rate) or benchmarking','Quick wins vs structural levers','Tested the total against the target']},
 {t:'info',h:'<div class="exhibit"><div class="eyebrow">Exhibit · Conversion cost, SAR m per year</div><table class="t"><tr><th>Bucket</th><th>SAR m</th></tr><tr><td>Energy</td><td>134</td></tr><tr><td>Yield loss (scrap of resin)</td><td>80</td></tr><tr><td>Labour</td><td>76</td></tr><tr><td>Overhead</td><td>67</td></tr><tr><td>Maintenance</td><td>63</td></tr><tr><td><b>Total</b></td><td><b>420</b></td></tr></table><small class="muted">Resin purchases are SAR 2.0bn a year. Yield loss is 4.0% of resin; best-in-class is 2.5%.</small></div>'},
 {t:'calc',q:'Saving if yield loss falls from 4.0% to 2.5% (SAR m per year)?',ans:30,tol:.5,unit:'SAR m',model:'1.5% × 2,000 = SAR 30m. Yield is often the biggest hidden lever in process industries because it multiplies the most expensive input.'},
 {t:'info',h:'<div class="exhibit"><div class="eyebrow">Line 2 performance</div><div class="kv"><span>Availability</span><span>80%</span><span>Performance</span><span>85%</span><span>Quality</span><span>96%</span></div></div>'},
 {t:'calc',q:'What is line 2\'s OEE (%)?',ans:65.3,tol:.4,unit:'%',dp:1,model:'OEE = 0.80 × 0.85 × 0.96 = 65.3%. World-class for continuous processes is often quoted around 85%.'},
 {t:'mcq',q:'If line 2 reaches 80% OEE, how does that save money?',o:['Labour cost falls automatically','It releases capacity, which only saves money if you can run fewer shifts or lines, or sell the extra output','Energy prices fall','It does not matter'],a:1,w:'OEE gains create capacity, not cash. The cash comes from what you do with it: close a shift, idle a line, or fill it with profitable volume. Always ask "how does this hit the P&L?"'},
 {t:'calc',q:'Identified savings so far: yield SAR 30m, energy efficiency 12% of energy cost, planned maintenance cutting maintenance by 20%. Total (SAR m)?',ans:58.7,tol:.5,unit:'SAR m',dp:1,model:'30 + 0.12 × 134 (16.1) + 0.20 × 63 (12.6) = 58.7. Gap to target: about SAR 4.3m.'},
 {t:'open',q:'How do you close the gap and what do you tell the plant manager?',model:'Close the SAR 4m gap through overhead (shared services with sister sites, contract renegotiation) or by converting line-2 OEE gains into one fewer shift. Message: "We can hit SAR 63m within 18 months; 80% comes from yield, energy and maintenance, which also make the plant more reliable. Start with yield — it is the largest and fastest."',rubric:['Specific lever for the remaining gap','Answer-first message with the total','Sequencing: what to start first and why','Acknowledged a risk (safety, quality, people)']}],
 wrap:'Cost cases reward engineers who connect the operating metric (yield, OEE, kWh/t) to the money. That is exactly your edge.'};

SIMS.pricing={title:'Pricing PumpSense, a predictive-maintenance service',partner:true,mins:20,steps:[
 {t:'info',h:'<p class="dropcap">Dammam Flow Systems makes industrial pumps. It has developed <b>PumpSense</b>: sensors plus analytics that predict failures. A competitor sells a basic monitoring service. The commercial director asks: <b>what should we charge per plant per year?</b></p>'},
 {t:'open',q:'What approaches could you use to set the price?',model:'Three lenses. Cost-plus: sets the floor (our cost to serve). Competitor-based: the reference point customers already know. Value-based: what the service is worth to the customer — the ceiling. The price should sit between the floor and the ceiling, anchored on the value we create relative to the alternative.',rubric:['Cost as the floor','Competitor or alternative as reference','Customer value as the ceiling','Concluded that price sits in a range between them']},
 {t:'info',h:'<div class="exhibit"><div class="eyebrow">Exhibit · Per plant per year</div><div class="kv"><span>Cost of one hour of unplanned downtime</span><span>SAR 20k</span><span>Competitor service price</span><span>SAR 90k</span><span>Downtime hours avoided by competitor</span><span>6</span><span>Downtime hours avoided by PumpSense</span><span>12</span><span>Our cost to serve</span><span>SAR 40k</span></div></div>'},
 {t:'calc',q:'Economic value to the customer of PumpSense (SAR k per year)?',ans:210,tol:3,unit:'SAR k',model:'EVC = alternative price + extra value = 90 + (12 − 6) × 20 = 210. That is the most a rational customer would pay.'},
 {t:'mcq',q:'Which price would you recommend?',o:['SAR 40k — cost','SAR 95k — just above competitor','SAR 150k — shares the extra value','SAR 210k — full EVC'],a:2,w:'SAR 150k captures half the SAR 120k differentiation value and leaves the customer SAR 60k better off than with the competitor — a reason to switch. Pricing at EVC leaves no incentive; pricing near the competitor gives away the value you created.'},
 {t:'calc',q:'400 plants are addressable; you expect 10% adoption by year 3 at SAR 150k. Year-3 revenue (SAR m)?',ans:6,tol:.1,unit:'SAR m',dp:1,model:'400 × 10% × 150k = SAR 6m. Modest — so check whether the real prize is pump sales pulled through by PumpSense.'},
 {t:'open',q:'How would you launch it to reduce the customer\'s perceived risk?',model:'Pilot at 3–5 plants with a performance guarantee (e.g. refund if fewer than 8 hours avoided). Consider outcome-based pricing (fee per hour of downtime avoided) or tiers (basic / advanced). Bundle with new pump sales. Build case studies from the pilots for the wider launch.',rubric:['Pilot or reference customers','Risk-sharing: guarantee or outcome-based price','Tiering or bundling','Link to the core pump business']}],
 wrap:'Value-based pricing needs a number for the customer\'s pain. Interviewers want to see you find that number and then deliberately leave some of it on the table.'};

SIMS.mock={title:'Full mock: Red Sea Foods cannot meet demand',partner:true,mins:30,steps:[
 {t:'info',h:'<p class="dropcap">Red Sea Foods runs a plant in Jeddah that makes canned beans and sauces. Demand is growing, and in the four peak months around Ramadan the plant misses about 20% of orders. The CEO is considering a new line costing SAR 45m. <b>Should they build it, and if not, what should they do?</b></p>'},
 {t:'open',q:'Structure your approach.',model:'Is it a capacity problem at all? (1) Demand: how big is the gap, how long, how certain is growth? (2) Capacity: where is the bottleneck and how much does the plant really produce? (3) Options: run longer (shifts), debottleneck, outsource or co-pack, build stock before the peak, smooth demand, or a new line. (4) Economics: compare each option\'s cost with the contribution recovered.',rubric:['Sized the demand gap and its seasonality','Searched for the bottleneck before buying capacity','Listed options beyond building a line','Planned to compare options on economics']},
 {t:'info',h:'<div class="exhibit"><div class="eyebrow">Exhibit 1 · Capacity by process step (cans per hour)</div><table class="t"><tr><th>Step</th><th>Cans / hour</th></tr><tr><td>Preparation</td><td>5,000</td></tr><tr><td>Cooking</td><td>4,200</td></tr><tr><td>Filling</td><td>3,000</td></tr><tr><td>Sealing</td><td>3,600</td></tr><tr><td>Labelling</td><td>4,800</td></tr></table><small class="muted">The plant runs 2 shifts × 8 hours, 26 days a month. Peak demand: 1.5m cans a month.</small></div>'},
 {t:'mcq',q:'Which step is the bottleneck?',o:['Preparation','Cooking','Filling','Sealing'],a:2,w:'Filling, at 3,000 cans per hour — the slowest step sets the pace of the whole line.'},
 {t:'calc',q:'Current plant capacity (thousand cans per month)?',ans:1248,tol:10,unit:'k cans',model:'3,000 × 16 h × 26 days = 1,248,000 cans. Gap to peak demand: 252k a month (17%).'},
 {t:'calc',q:'If only filling moves to three shifts (with buffer stock in between), what is the new plant capacity (thousand cans per month)?',ans:1497.6,tol:5,unit:'k cans',dp:1,model:'Filling now does 3,000 × 24 × 26 = 1,872k. But sealing, still on two shifts, caps the line at 3,600 × 16 × 26 = 1,497.6k — just short of 1.5m. The bottleneck moves. Add sealing to the third shift too (then cooking caps at 1,747k).'},
 {t:'calc',q:'Each can earns SAR 3.50 contribution. What contribution is lost each year from unmet peak demand today (SAR m)?',ans:3.53,tol:.06,unit:'SAR m',dp:2,model:'252k × 4 peak months = 1.008m cans × 3.5 = SAR 3.53m a year. Against a SAR 45m line, payback would be about 13 years.'},
 {t:'mcq',q:'What do you recommend?',o:['Build the new line now','Run filling and sealing on a third shift in the four peak months; build stock before Ramadan; revisit the line when demand passes ~1.75m','Turn away peak orders','Outsource all production'],a:1,w:'A third shift on filling and sealing for four months costs far less than SAR 45m and recovers the lost contribution. The new line becomes the right answer only when demand outgrows cooking at about 1.75m cans a month.'},
 {t:'open',q:'The CEO walks in. Give your 60-second recommendation.',model:'"Don\'t build the line yet. You lose about SAR 3.5m of contribution a year in the peak, and the SAR 45m line would take 13 years to pay back. The constraint is filling — and once that is fixed, sealing. Add a third shift on both during the four peak months and pre-build stock in the weeks before Ramadan. That closes the gap this year for a fraction of the cost. Revisit the new line when monthly demand passes 1.75m cans, which is when cooking becomes the limit."',rubric:['Answer first, with the decision','Key numbers (lost contribution, payback)','Spotted that the bottleneck moves','Trigger for when to revisit the investment']}],
 wrap:'This case rewards engineering instincts: find the bottleneck, then check where it moves. Many candidates jump to the SAR 45m line because the CEO mentioned it.'};
