CASES.push(
{id:'w05',title:'Al-Ahsa Foods: Profitable and Out of Cash',teaser:'Record profits, a growing order book — and the CFO says the company cannot make payroll in eight weeks.',byline:'Teaching case · Accounting and working capital · Fictional company, illustrative data',
 body:`<p class="dropcap">When Saleh Al-Mulhim, CEO of Al-Ahsa Foods, presented the 2025 results to his board, the room applauded. Revenue had grown 38% to SAR 620m on new contracts with two national supermarket chains and a government catering programme. Net income was up 45%. Three weeks later his CFO, Reem Al-Harbi, asked for a private meeting. "On current trends," she said, "we will breach our overdraft limit in eight weeks. We may not be able to pay suppliers — or salaries — in December."</p>
<p>Saleh was stunned. How could a company with record profits run out of cash? Reem walked him through the numbers (Exhibit 1). The government catering contract paid on 120-day terms, and invoices were often delayed further by documentation queries. The supermarkets demanded higher stock levels in their distribution centres. Meanwhile, the company's date and grain suppliers — many of them small farms — had begun asking for faster payment as their own costs rose.</p>
<p>The plant director had a different worry. To serve the new volume, he had approved SAR 45m of capex for a second packing line, funded from cash. "We can't slow that down," he said. "The supermarkets will fine us for missed deliveries."</p>
<p>The bank had offered to raise the overdraft limit, but at a higher rate and with a covenant on net debt to EBITDA. Saleh needed a plan for the board within a week.</p>`,
 exhibits:[{t:'Selected figures (SAR m)',h:`<table class="t"><tr><th></th><th>2024</th><th>2025</th></tr><tr><td>Revenue</td><td>450</td><td>620</td></tr><tr><td>Cost of goods sold</td><td>315</td><td>434</td></tr><tr><td>Net income</td><td>31</td><td>45</td></tr><tr><td>Receivables</td><td>62</td><td>136</td></tr><tr><td>Inventory</td><td>52</td><td>95</td></tr><tr><td>Payables</td><td>43</td><td>36</td></tr><tr><td>Depreciation</td><td>12</td><td>14</td></tr><tr><td>Capex</td><td>15</td><td>45</td></tr></table>`,s:'Year-end balances.'}],
 questions:[
  {q:'Calculate operating cash flow and free cash flow for 2025. Why do they differ so much from net income?',note:'NWC 2024 = 62 + 52 − 43 = 71; 2025 = 136 + 95 − 36 = 195; increase 124. OCF = 45 + 14 − 124 = −65. FCF = −65 − 45 = −110. Growth was funded through working capital: receivables doubled, inventory nearly doubled, payables fell. Profit grew, but cash went into the balance sheet.',pts:['NWC increase ≈ SAR 124m','Operating cash flow ≈ −SAR 65m','Free cash flow ≈ −SAR 110m','Explained: receivables, inventory and payables absorbed the cash']},
  {q:'Compute DSO, DIO and DPO for both years. Which moved most?',note:'2024: DSO 50, DIO 60, DPO 50 → CCC 60 days. 2025: DSO 80, DIO 80, DPO 30 → CCC 130 days. DSO (+30) and DPO (−20) moved most; the cycle more than doubled. The government contract terms and supplier pressure are the root causes.',pts:['2024 CCC ≈ 60 days','2025 CCC ≈ 130 days','Identified DSO and DPO as the biggest shifts','Linked them to contract terms and suppliers']},
  {q:'What actions would release cash fastest, and what are the trade-offs?',note:'Collections: dedicated team for government invoices, fix documentation errors, e-invoicing; supply-chain or receivables financing (factoring) for the government contract. Inventory: agree consignment or VMI with supermarkets, cut slow SKUs. Payables: keep small farmers on fair terms (supply risk), but negotiate with larger suppliers. Capex: phase the line or lease equipment. Trade-offs: financing costs, customer relationships, supply security.',pts:['Receivables actions (process + financing)','Inventory actions with retail customers','Thoughtful approach to supplier terms','Capex phasing or leasing']},
  {q:'What should Saleh tell the board?',note:'Answer first: "We are growing faster than our cash can fund. The cash cycle has doubled to 130 days, absorbing SAR 124m. We will release SAR 60–80m within six months through collections, inventory agreements and receivables financing; phase the packing line; and accept the bank\'s facility as a bridge only." Add KPIs: CCC monthly, and a rule that new contracts must meet payment-term thresholds.',pts:['Answer first, with the cause quantified','A target for cash release and timing','Bridge financing positioned correctly','Governance: KPIs and contract rules going forward']}]},

{id:'w06',title:'Gulf Polymers: The SAR 900m Question',teaser:'A board must decide on a new specialty-polymers plant. The NPV is positive — at one discount rate.',byline:'Teaching case · Corporate finance and valuation · Fictional company, illustrative data',
 body:`<p class="dropcap">Gulf Polymers' strategy director, Dr. Nasser Al-Qahtani, had spent nine months on the business case for a SAR 900m specialty-polymers plant in Jubail. Specialty grades sold at a premium over commodity polyethylene and would reduce the company's exposure to commodity price cycles. His model showed an NPV of SAR 210m and an IRR of 12.4% (Exhibit 1).</p>
<p>At the investment committee, the CFO challenged the discount rate. "You used our group WACC of 9%," she said. "But specialty polymers are a new business for us, with new customers and technology risk. A pure-play specialty chemicals company has a beta closer to 1.3 than our 0.9." The head of commercial raised a second point: the volume ramp-up assumed the plant reached 85% utilisation in year three, while the technology licensor's reference plants had taken five years.</p>
<p>Nasser believed the project was strategically right. The CEO agreed in principle but wanted to know how robust the economics were before taking it to the board.</p>`,
 exhibits:[{t:'Base-case business case',h:`<table class="t"><tr><th>Item</th><th>Value</th></tr><tr><td>Capex (years 0–1)</td><td>SAR 900m</td></tr><tr><td>Steady-state free cash flow (from year 4)</td><td>SAR 135m / yr</td></tr><tr><td>Discount rate used</td><td>9% (group WACC)</td></tr><tr><td>NPV</td><td>SAR 210m</td></tr><tr><td>IRR</td><td>12.4%</td></tr><tr><td>Group: unlevered beta 0.9; specialty peers: 1.3</td><td>Rf 4.5%, ERP 6%, target debt 30%, Kd 6%, tax 20%</td></tr></table>`,s:'Illustrative figures for teaching.'}],
 questions:[
  {q:'Should the project be discounted at the group WACC? Estimate a project-specific WACC.',note:'No: the discount rate should reflect the project\'s risk, not the company\'s. Relever the peer beta 1.3 at 30/70 debt/equity: βL = 1.3 × (1 + 0.8 × 0.43) ≈ 1.75; Ke ≈ 4.5 + 1.75 × 6 ≈ 15%; WACC ≈ 0.7 × 15 + 0.3 × 6 × 0.8 ≈ 12%. At about 12%, the project is close to break-even (IRR 12.4%).',pts:['Project risk, not company risk, sets the rate','Used peer beta and relevered','Project WACC around 11.5–12.5%','Concluded NPV is near zero at that rate']},
  {q:'How does a slower ramp-up affect value, and how would you show it?',note:'Delaying full cash flows by two years at ~12% cuts the PV of those flows significantly (each year of delay costs about 11% of their value). Show a sensitivity or scenario table: ramp-up (3 vs 5 years) × discount rate (9/10.5/12%). Decision-makers need to see where NPV turns negative.',pts:['Delay reduces PV via discounting','Proposed scenarios or a sensitivity table','Combined ramp-up and discount-rate effects','Identified the break-even conditions']},
  {q:'Is there a way to keep the strategic option while reducing risk?',note:'Options: a phased plant (smaller first train, expand on proof), a JV with the technology licensor or a customer (shares risk and brings market access), offtake agreements before final investment decision, toll manufacturing to test the market. These create real options — the right but not obligation to expand.',pts:['Phasing or staged investment','Partner or JV to share risk','Offtake contracts before commitment','Explained the value of flexibility (real options)']},
  {q:'What recommendation would you take to the board?',note:'"The project is strategically attractive but, at a risk-appropriate rate of about 12%, its value is close to zero under the base case and negative with a slower ramp-up. We recommend proceeding with a phased first train of ~SAR 400m, conditional on offtake for 50% of capacity, with expansion triggered by utilisation above 80% for two quarters."',pts:['Clear answer with the key number','Acknowledged the strategic rationale','Conditions or triggers for proceeding','Risk mitigation built into the plan']}]},

{id:'w07',title:'Riyadh WaterTech: The New Manager',teaser:'A 29-year-old engineer is promoted over two veterans. Three months in, the team is quietly failing.',byline:'Teaching case · Organisational behaviour and leadership · Fictional company and people',
 body:`<p class="dropcap">Abeer Al-Shammari was promoted to head of operations at Riyadh WaterTech, a fast-growing water-treatment services company, at 29. She had built the company's predictive-maintenance analytics and impressed the CEO with her results. Her new team of 14 field engineers and supervisors included two veterans, Khalid and Fahad, each with over 15 years' experience, who had both expected the role.</p>
<p>Abeer moved quickly. In her first month she introduced a new digital work-order system, a weekly KPI review, and a rule that all maintenance decisions above SAR 20,000 needed her approval. Response times initially improved. By month three, however, the picture had changed (Exhibit 1). Two engineers had resigned. Khalid had stopped attending the weekly review, citing site emergencies. Fahad was polite in meetings but, Abeer heard, told his crews that "the new system is for head office, not for fixing pumps." A major client complained that a supervisor had waited two days for an approval during a pump failure.</p>
<p>The CEO asked Abeer for a plan. "You were right about the analytics," he said. "But I need the team with you."</p>`,
 exhibits:[{t:'Operations dashboard',h:`<table class="t"><tr><th>Metric</th><th>Before Abeer</th><th>Month 1</th><th>Month 3</th></tr><tr><td>Average response time (hours)</td><td>9.5</td><td>7.2</td><td>10.8</td></tr><tr><td>Work orders closed on time</td><td>78%</td><td>86%</td><td>71%</td></tr><tr><td>Engineer resignations (cumulative)</td><td>—</td><td>0</td><td>2</td></tr><tr><td>Weekly review attendance</td><td>—</td><td>100%</td><td>58%</td></tr></table>`,s:'Illustrative data.'}],
 questions:[
  {q:'What went wrong? Diagnose using ideas from motivation and leadership.',note:'Abeer changed a lot, fast, without building legitimacy or involvement. The approval rule removed autonomy from experienced staff (a key motivator) and slowed urgent decisions. The veterans\' expertise and status were not recognised. Initial gains came from novelty and compliance, not commitment.',pts:['Too much change too fast without involvement','Loss of autonomy for experienced engineers','Veterans\' status and expertise not recognised','Compliance vs commitment distinction']},
  {q:'How should Abeer work with Khalid and Fahad?',note:'Meet each one-on-one, acknowledge their experience and the disappointment of not getting the role, and ask for their view on what is not working. Give them real ownership: e.g. Khalid leads emergency-response standards, Fahad co-designs the work-order system with field crews. Agree expectations clearly — including that open undermining is not acceptable.',pts:['Private one-on-one conversations first','Acknowledge expertise and the promotion context','Give them meaningful ownership','Set clear expectations on behaviour']},
  {q:'What should she change about the systems she introduced?',note:'Keep the analytics and KPIs, but redesign with the team: raise or remove the SAR 20k approval threshold for emergencies (approve after, not before), let crews shape the work-order fields, make the weekly review about removing obstacles, not reporting. Show quick wins that make engineers\' lives easier.',pts:['Keep the valuable parts (data, KPIs)','Fix the approval rule for emergencies','Co-design with users','Make reviews useful to the team']},
  {q:'What is Abeer\'s 60-day plan for the CEO?',note:'Weeks 1–2: one-on-ones, listening tour with all 14, immediate emergency-approval fix. Weeks 3–6: co-design workstreams led by Khalid and Fahad; publish what changed from their input. Weeks 7–8: reset KPIs and review format; measure response time, on-time closure, attendance, and retention. Ask the CEO for coaching support and to publicly back the team-designed changes.',pts:['Listening first, quick fix immediately','Involves veterans visibly','Measurable targets','Asks for the right support']}]},

{id:'w08',title:'Najran Dates: Pricing for the World',teaser:'A family date company wants to export premium dates to Europe. Price like a commodity, or like chocolate?',byline:'Teaching case · Marketing and pricing strategy · Fictional company, illustrative data',
 body:`<p class="dropcap">Najran Dates had grown from a family farm into a processor packing 18,000 tonnes a year, mostly sold in bulk to Saudi wholesalers at thin margins. The founder's daughter, Hessa, now commercial director, had a bigger idea: premium boxed dates for European gift and specialty-food retailers, positioned against fine chocolate rather than other dates.</p>
<p>Her first trade fair in Paris produced strong interest — and confusing price signals. A large supermarket buyer offered to list a 500g box at a retail price of €6.99, implying an ex-factory price of about €3.20. A specialty-food chain suggested a 250g gift box at €14.90 retail (ex-factory about €6.50), but in much smaller volumes. A luxury department store wanted an exclusive 12-piece filled-date collection at €29 retail.</p>
<p>Hessa's father worried about the risk: "We are farmers, not chocolatiers. Bulk is safe." Her operations manager noted that premium packaging would add €0.90 per 250g box, and that filled dates required a new clean room. Exhibit 1 summarises her early estimates.</p>`,
 exhibits:[{t:'Export options (year-3 estimates, illustrative)',h:`<table class="t"><tr><th>Option</th><th>Ex-factory price</th><th>Unit cost</th><th>Volume (units/yr)</th><th>Extra fixed cost / yr</th></tr><tr><td>Supermarket 500g</td><td>€3.20</td><td>€2.30</td><td>900,000</td><td>€0.25m</td></tr><tr><td>Specialty 250g gift box</td><td>€6.50</td><td>€2.60</td><td>180,000</td><td>€0.20m</td></tr><tr><td>Luxury filled collection</td><td>€13.00</td><td>€5.10</td><td>25,000</td><td>€0.45m</td></tr></table>`,s:'Unit cost includes packaging and freight.'}],
 questions:[
  {q:'Calculate the annual profit contribution of each option after extra fixed costs.',note:'Supermarket: (3.20 − 2.30) × 900k = €810k − 250k = €560k. Specialty: 3.90 × 180k = €702k − 200k = €502k. Luxury: 7.90 × 25k = €197.5k − 450k = −€252.5k. Supermarket and specialty are close; luxury loses money at these volumes.',pts:['Supermarket ≈ €560k','Specialty ≈ €500k','Luxury ≈ −€250k','Noted supermarket and specialty are similar in profit']},
  {q:'Beyond year-3 profit, how do the options differ strategically?',note:'Supermarket: high volume, low margin, buyer power, risk of being delisted, builds no brand. Specialty: higher margin per unit, builds brand and price positioning, less dependence on one buyer, platform for growth. Luxury: brand halo but loss-making and operationally demanding. Positioning choices are hard to reverse: starting cheap makes premium later difficult.',pts:['Buyer power and dependency in supermarket channel','Brand-building value of specialty','Luxury as halo vs cost','Positioning is hard to reverse']},
  {q:'What positioning and 4Ps would you recommend?',note:'Position as "premium Arabian dates — the gift alternative to chocolate" for European specialty retail. Product: 250g gift box, provenance story (Najran, family farm), selected varieties. Price: €14.90 retail, holding the premium. Place: specialty chains and online; avoid mass supermarkets initially. Promotion: Ramadan and Christmas gifting, tastings, storytelling.',pts:['Clear positioning statement','Product and packaging tied to the story','Price consistent with the position','Channel and promotion choices that fit']},
  {q:'What should Hessa propose to her father?',note:'A staged plan: launch the specialty gift box with two chains (low extra fixed cost, positive contribution), keep bulk domestic sales as the cash base, defer the luxury line until the brand earns it, and set a review after 18 months with clear KPIs (sell-through, repeat orders, margin). This reframes the risk: the core business continues, the brand option is cheap to test.',pts:['Staged, low-risk plan','Keeps the existing business as the base','Defers loss-making option','KPIs and a decision point']}]}
);

/* ================= Cases of the week, batch 4 (fictional companies and people, illustrative data) ================= */
CASES.push(
{id:'w13',title:'Sanad Health: Pivot or Persevere?',teaser:'Downloads are up, retention is collapsing, and the runway is ten months. The founders disagree on what the data says.',byline:'Teaching case · Lean start-up and metrics · Fictional company, illustrative data',
 body:`<p class="dropcap">Sanad Health launched a mobile app in Riyadh helping families manage elderly parents' medications: reminders, refill orders and a shared family view. After an Instagram campaign, downloads jumped to 24,000 in four months. The CEO, Raed, wanted to raise a seed round on that growth.</p>
<p>His co-founder and CTO, Dana, pointed at the cohort data (Exhibit 1). Most users stopped within a month. Interviews revealed a pattern: the adult children who downloaded the app loved the idea, but their parents rarely used phones for medications; family pharmacists and home nurses did most of the actual managing. Three private home-care agencies had asked whether they could use Sanad for their nurses — and offered to pay.</p>
<p>Raed worried a pivot to B2B would throw away the consumer brand and slow growth. Dana argued the consumer model was not working and the agencies were the first real customers. They had ten months of runway.</p>`,
 exhibits:[{t:'Monthly cohort retention (consumer app)',h:`<table class="t"><tr><th>Cohort</th><th>Month 1</th><th>Month 2</th><th>Month 3</th></tr><tr><td>June</td><td>22%</td><td>9%</td><td>5%</td></tr><tr><td>July</td><td>19%</td><td>8%</td><td>4%</td></tr><tr><td>August</td><td>17%</td><td>6%</td><td>—</td></tr></table><p class="note">Paid subscribers: 310 at SAR 19/month. CAC from Instagram: about SAR 38 per download. Home-care agencies interested: 3 (combined 220 nurses), indicated price SAR 60 per nurse per month.</p>`,s:'Illustrative data.'}],
 questions:[
  {q:'What do the cohort numbers tell you that total downloads hide?',note:'Retention decays to ~4–5% by month 3 and is getting worse in newer cohorts: no product–market fit in the consumer segment. Downloads are a vanity metric; with ~SAR 38 CAC per download and few paying users, CAC per paying customer is in the thousands against SAR 19/month revenue.',pts:['Retention is low and declining by cohort','Downloads are a vanity metric','Rough CAC per paying user is very high','Concluded no PMF in consumer segment']},
  {q:'Compare the economics of the consumer and agency opportunities.',note:'Consumer: 310 × 19 = SAR 5.9k MRR. Agencies: 220 nurses × 60 = SAR 13.2k MRR from three customers, likely higher retention (workflow tool), lower CAC (direct sales to few buyers), and referenceable for other agencies and hospitals. B2B has longer sales cycles but stronger signal: they asked and offered to pay.',pts:['Consumer MRR ≈ SAR 6k','Agency MRR ≈ SAR 13k from 3 customers','Retention and CAC advantages of B2B','Noted the strength of inbound demand']},
  {q:'What experiment would settle the disagreement quickly?',note:'Run a 6-week paid pilot with the three agencies (pre-agreed price, success metrics: weekly active nurses, missed-dose incidents, renewal intent), while freezing consumer marketing spend. Pass line written in advance: e.g., ≥ 70% weekly active nurses and 2 of 3 agencies willing to sign annual contracts.',pts:['Paid pilot, not free','Defined metrics and pass line','Time-boxed','Stops spending on what is not working']},
  {q:'What should they tell investors?',note:'Honest story: consumer launch generated learning, not PMF; the real customer is the care provider. Raise on early B2B traction (pilot results, contracts, pipeline of agencies and hospitals) rather than downloads. Investors back founders who read data honestly and pivot fast.',pts:['Transparent about the consumer results','Pivot framed as learning','Traction metrics that matter for B2B','Timing the raise after pilot evidence']}]},

{id:'w14',title:'Nakhla Robotics: Two Term Sheets',teaser:'One investor offers a higher valuation; the other offers cleaner terms. The founders have 72 hours.',byline:'Teaching case · Venture financing · Fictional company, illustrative data',
 body:`<p class="dropcap">Nakhla Robotics built autonomous drones for inspecting date-palm plantations and solar farms. After two years and SAR 2m of angel money, it had SAR 3.1m of annual recurring revenue and was raising a SAR 10m Series A. Two investors sent term sheets the same week (Exhibit 1).</p>
<p>Fund A, a large regional VC, offered the higher valuation but with a 1.5× participating liquidation preference, two of five board seats and a full-ratchet anti-dilution clause. Fund B, a smaller industrial-tech fund with portfolio companies in agriculture and energy, offered a lower valuation with 1× non-participating preference, one board seat and broad-based weighted-average anti-dilution.</p>
<p>Co-founder Faisal wanted Fund A: "Higher valuation means less dilution. And they are the bigger name." His co-founder Nora wasn't sure: "What happens if we sell for SAR 80m instead of SAR 400m?"</p>`,
 exhibits:[{t:'Term sheet summary',h:`<table class="t"><tr><th>Term</th><th>Fund A</th><th>Fund B</th></tr><tr><td>Investment</td><td>SAR 10m</td><td>SAR 10m</td></tr><tr><td>Pre-money valuation</td><td>SAR 40m</td><td>SAR 30m</td></tr><tr><td>Liquidation preference</td><td>1.5× participating</td><td>1× non-participating</td></tr><tr><td>Anti-dilution</td><td>Full ratchet</td><td>Broad-based weighted average</td></tr><tr><td>Board seats (of 5)</td><td>2</td><td>1</td></tr><tr><td>Sector expertise</td><td>Generalist</td><td>Agri and energy portfolio</td></tr></table>`,s:'Ignore other shareholders for simplicity. Illustrative.'}],
 questions:[
  {q:'What ownership does each fund get?',note:'Fund A: 10 ÷ 50 = 20%. Fund B: 10 ÷ 40 = 25%. Faisal is right that Fund A dilutes less on paper.',pts:['Fund A 20%','Fund B 25%','Correct post-money for each','Acknowledged the dilution difference']},
  {q:'Compare what the investor and everyone else receive at a SAR 80m exit.',note:'Fund A: preference 1.5 × 10 = 15, then 20% of remaining 65 = 13 → 28; common gets 52. Fund B: max(10, 25% × 80 = 20) = 20; common gets 60. Despite the higher valuation, the founders and team get SAR 8m more with Fund B at a SAR 80m exit.',pts:['Fund A investor ≈ SAR 28m','Fund B investor ≈ SAR 20m','Common: SAR 52m vs SAR 60m','Concluded Fund B is better for founders at this exit']},
  {q:'What other terms change the picture?',note:'Full ratchet: in a down round, Fund A\'s price resets to the new low price, heavily diluting founders. Two board seats plus possible protective provisions shift control. Fund B\'s sector network could accelerate sales in agriculture and energy. At very large exits (SAR 400m+), the differences narrow, but downside protection matters for founders.',pts:['Full ratchet risk in a down round','Board control','Value of sector expertise','Exit-size sensitivity']},
  {q:'What should the founders do in the next 72 hours?',note:'Model the waterfall at SAR 50m, 100m, 200m and 400m exits. Go back to Fund A: ask for 1× non-participating and weighted-average anti-dilution at their valuation (a common outcome), or accept Fund B if A refuses. Reference-check both funds with portfolio founders. Get a lawyer to review. Decide on total package, not headline valuation.',pts:['Model several exit scenarios','Negotiate terms, not just price','Reference checks on investors','Legal review and decide on the package']}]},

{id:'w15',title:'Qahwa Box: Growth That Loses Money',teaser:'A coffee-subscription start-up doubled its subscribers in a quarter. Its contribution per box is negative.',byline:'Teaching case · Unit economics · Fictional company, illustrative data',
 body:`<p class="dropcap">Qahwa Box delivered monthly boxes of speciality coffee from Saudi and international roasters to subscribers in Riyadh, Jeddah and Dammam. A first-month discount of 60% and influencer campaigns doubled subscribers to 6,200 in a quarter. The founders, Sultan and Hind, were preparing a seed raise around the growth.</p>
<p>Their new finance lead, an ex-auditor named Yazeed, built the unit economics (Exhibit 1) and asked for a meeting. "Every box we ship loses money, and most of the discounted customers leave after the first box. Growing faster makes us poorer."</p>
<p>Sultan objected: "Every subscription business loses money at first. Scale will bring down delivery and coffee costs." Hind wanted to know which levers actually mattered.</p>`,
 exhibits:[{t:'Unit economics per box (SAR)',h:`<table class="t"><tr><th>Item</th><th>Full-price box</th><th>First-month discounted box</th></tr><tr><td>Price</td><td>149</td><td>60</td></tr><tr><td>Coffee</td><td>62</td><td>62</td></tr><tr><td>Packaging</td><td>14</td><td>14</td></tr><tr><td>Delivery</td><td>28</td><td>28</td></tr><tr><td>Payment fees</td><td>4</td><td>2</td></tr><tr><td>Customer support & returns</td><td>9</td><td>9</td></tr></table><p class="note">Monthly churn: 14% for full-price subscribers; 65% of discounted first-month subscribers cancel before month 2. CAC: SAR 85 per subscriber (influencers + ads).</p>`,s:'Illustrative data.'}],
 questions:[
  {q:'Calculate contribution per box for full-price and discounted boxes.',note:'Full price: 149 − (62 + 14 + 28 + 4 + 9 = 117) = SAR 32. Discounted: 60 − (62 + 14 + 28 + 2 + 9 = 115) = −SAR 55. Each discounted first box loses SAR 55 on top of CAC.',pts:['Full-price contribution ≈ SAR 32','Discounted box ≈ −SAR 55','Listed all variable costs','Linked losses to the discount']},
  {q:'What is the LTV of a full-price subscriber, and how does it compare with CAC including the discount?',note:'Lifetime ≈ 1 ÷ 0.14 ≈ 7.1 months; LTV ≈ 32 × 7.1 ≈ SAR 229. But only 35% of discounted sign-ups become full-price subscribers. Effective acquisition cost per retained subscriber ≈ (85 + 55) ÷ 0.35 ≈ SAR 400 > LTV 229. The model destroys value at current churn and discounting.',pts:['Lifetime ≈ 7 months','LTV ≈ SAR 230','Effective CAC per retained subscriber ≈ SAR 400','Concluded LTV < CAC']},
  {q:'Which levers matter most?',note:'Churn (14% monthly is high for subscriptions — personalisation, flexible skip/pause, quality), the discount design (smaller discount or discount on month 3 to reward retention), delivery cost (pick-up points, route density in fewer cities), and price/mix (premium tiers, gifting). Scale helps coffee costs only modestly.',pts:['Churn reduction','Redesign the discount','Delivery cost via density or pick-up','Price tiers or gifting']},
  {q:'What should the founders tell seed investors?',note:'Be candid: growth was bought with discounts that do not retain. Show the plan and early evidence: new offer with lower discount, pause option, density in Riyadh first, target contribution per box ≥ SAR 40 and churn ≤ 8%. Raise on improving cohort retention and unit economics, not on subscriber count.',pts:['Candid about current economics','Specific plan with targets','Evidence from a test cohort','Metrics investors should track']}]},

{id:'w16',title:'Two Engineers and a Napkin',teaser:'Two friends want to build an industrial-IoT start-up. One has the idea, the other will quit his job. How should they split the company?',byline:'Teaching case · Founding teams and equity · Fictional people, illustrative situation',
 body:`<p class="dropcap">Over dinner in Al Khobar, Omar and Bader sketched a start-up on a napkin: low-cost sensors and software to predict failures in water-treatment plants. Omar, a process engineer at a utility, had the idea after years of watching pumps fail. Bader, a software engineer at a large tech company, would build the product.</p>
<p>The plan: Bader quits his job next month and works full time; Omar stays at the utility for a year "to keep a salary for the family" and works evenings and weekends, bringing the first pilot customer through his network. Omar proposed a 60/40 split in his favour "because it's my idea and my customer". Bader felt uneasy but didn't want to argue with a friend.</p>
<p>A third friend, Sara, a strong saleswoman in industrial equipment, had expressed interest in joining in six months if the pilot worked. An angel investor they met asked one question: "Who owns what, and what happens if one of you leaves?"</p>`,
 exhibits:[{t:'Contributions over the next 12 months (estimated)',h:`<table class="t"><tr><th></th><th>Omar</th><th>Bader</th></tr><tr><td>Time commitment</td><td>Part time (~15 h/week)</td><td>Full time</td></tr><tr><td>Salary given up</td><td>None</td><td>~SAR 360k</td></tr><tr><td>Contribution</td><td>Idea, domain insight, first customer access</td><td>Product, technology, early operations</td></tr><tr><td>Cash invested</td><td>SAR 50k</td><td>SAR 50k</td></tr></table>`,s:'Illustrative situation.'}],
 questions:[
  {q:'Is a 60/40 split in Omar\'s favour fair? Argue from future contribution.',note:'Ideas are cheap; execution creates value. Over the next year Bader takes more risk (gives up salary) and does most of the work. Omar\'s domain insight and customer access are real but part-time. A fair outcome is closer to equal, or weighted toward Bader until Omar commits full time — with vesting so that commitment is what earns equity.',pts:['Ideas are worth less than execution','Bader\'s risk and full-time work','Omar\'s genuine contributions acknowledged','Proposed a fairer split or conditional structure']},
  {q:'What mechanisms protect both founders if someone leaves?',note:'Four-year vesting with a one-year cliff for both; good-leaver/bad-leaver clauses; a founders\' agreement on roles, decision-making and IP assignment to the company; a commitment milestone (e.g., Omar full time once the pilot is signed or seed is raised).',pts:['Vesting with cliff for both','Leaver provisions','IP assigned to the company','Commitment milestone for Omar']},
  {q:'How should they plan for Sara and future hires?',note:'Reserve an option pool (e.g., 10–15%) now. If Sara joins as a co-founder-level hire, her equity should come with vesting and reflect stage and risk at joining (typically lower than the original founders). Don\'t promise percentages casually over dinner.',pts:['Option pool planned early','Later joiners get vested equity','Equity reflects risk at joining time','Avoid informal promises']},
  {q:'What should they agree before Bader resigns?',note:'A written founders\' agreement: equity split with vesting, roles (CEO/CTO), decision rules and deadlock resolution, Omar\'s commitment date, IP assignment, how they will fund the first months, and what happens if the pilot fails. Have the hard conversation now — friendship survives honesty more easily than resentment.',pts:['Written founders\' agreement','Roles and decision rules','Commitment dates and funding plan','Have the conversation before, not after']}]}
);

{id:'e01',track:'eng',title:'Manufacturing systems and process types',mins:25,blurb:'Project, job shop, batch, line, continuous — and why fit matters.',
 lab:{key:'ppm',name:'Product–process matrix',intro:'Match eight products to the process type that fits them.'},
 cards:[
  {h:'Five process types',b:`<ul><li><b>Project:</b> one-off, large, often at the customer's site.</li><li><b>Job shop:</b> high variety, low volume, flexible equipment, varied routings.</li><li><b>Batch:</b> moderate variety, products made in runs with changeovers.</li><li><b>Line:</b> standard products, high volume, paced flow.</li><li><b>Continuous:</b> commodities, very high volume, around the clock.</li></ul>`},
  {h:'The product–process matrix',b:`<p>Hayes and Wheelwright: as products move from low-volume custom to high-volume standard, the process should move from job shop to continuous flow. Firms "off the diagonal" carry cost or flexibility penalties.</p>`},
  {h:'Layouts follow process',b:`<p>Job shops use <b>process (functional) layouts</b>, grouping similar machines. Lines use <b>product layouts</b>. Cellular layouts group the machines for a product family to get flow with variety.</p>`},
  {h:'Make-to-stock vs make-to-order',b:`<p>MTS builds to forecast (fast delivery, inventory risk); MTO builds after the order (custom, longer lead time); ATO assembles from stocked modules (a common compromise).</p>`},
  {h:'Why consultants care',b:`<p>Many manufacturing problems in a strategy engagement are fit problems: a plant designed for long runs now asked for high variety, or a job shop chasing commodity volume. Diagnose fit before optimising details.</p>`}],
 quiz:[
  {q:'High variety, low volume, flexible equipment describes…',o:['Continuous flow','Job shop','Assembly line','Project'],a:1,w:'Each job may follow a different route.'},
  {q:'A refinery is a classic…',o:['Batch process','Continuous process','Job shop','Project'],a:1,w:'Commodity output, 24/7 flow.'},
  {q:'Cellular layouts aim to combine…',o:['Low volume with low variety','Flow efficiency with some product variety','Projects and lines','MTS and MTO'],a:1,w:'Cells give flow to product families.'},
  {q:'Assemble-to-order means…',o:['Everything built after the order','Modules stocked, final assembly after the order','Everything to forecast','One-off projects'],a:1,w:'A balance between speed and customisation.'},
  {q:'A firm "off the diagonal" of the product–process matrix typically…',o:['Gains a cost advantage','Faces cost or flexibility penalties','Has no inventory','Needs no changeovers'],a:1,w:'Process and product do not fit.'},
  {q:'Process (functional) layouts group…',o:['All steps of one product','Similar machines together','Only robots','Warehouses'],a:1,w:'Typical of job shops.'}],
 srs:[{q:'Five process types?',a:'Project, job shop, batch, line, continuous.'},{q:'Product–process matrix?',a:'Process choice should move from job shop to continuous as volume rises and variety falls.'},{q:'MTS, MTO, ATO?',a:'Make-to-stock, make-to-order, assemble-to-order.'},{q:'Cellular layout?',a:'Machines grouped by product family to get flow with variety.'}],
 read:[{t:'Link Manufacturing Process and Product Life Cycles',s:'Harvard Business Review, 1979',n:'Hayes & Wheelwright',u:HBRS('Hayes Wheelwright product process')},{t:'MIT OCW: manufacturing systems',s:'MIT OpenCourseWare',u:OCW('manufacturing systems')},{t:'Cellular manufacturing',s:'Wikipedia',u:WIKI('Cellular_manufacturing')}]},

{id:'e02',track:'eng',title:'Capacity, utilisation and bottlenecks',mins:30,blurb:'Why lines rarely run at the speed of their slowest machine — and what buffers do.',
 lab:{key:'linesim',name:'Line throughput simulator',intro:'Simulate 2,000 units through a three-station line with random cycle times.'},
 cards:[
  {h:'Capacity measures',b:`<ul><li><b>Design capacity:</b> maximum output in ideal conditions.</li><li><b>Effective capacity:</b> after planned losses (changeovers, maintenance).</li><li><b>Actual output.</b></li></ul><div class="formula">Utilisation = actual ÷ design · Efficiency = actual ÷ effective</div>`},
  {h:'Theory of Constraints',b:`<p>Goldratt's five steps: identify the constraint, exploit it, subordinate everything else to it, elevate it, repeat. An hour lost at the bottleneck is lost for the whole system.</p>`},
  {h:'Variability steals capacity',b:`<p>With random cycle times, a slow cycle at one station starves the next or blocks the previous one. Without buffers, throughput falls well below the bottleneck rate.</p>`},
  {h:'Buffers vs lean',b:`<p>Buffers protect throughput but add inventory and lead time. Lean reduces variability first (standard work, TPM, SMED) so buffers can be cut safely.</p>`},
  {h:'Drum-buffer-rope',b:`<p>The bottleneck sets the pace (drum), a time buffer protects it, and material release is tied to its pace (rope) so WIP does not pile up elsewhere.</p>`}],
 quiz:[
  {q:'Design capacity 1,000/day, actual 720. Utilisation?',o:['72%','85%','138%','28%'],a:0,w:'720 ÷ 1,000.'},
  {q:'First step of the Theory of Constraints?',o:['Elevate the constraint','Identify the constraint','Buy new machines','Reduce all inventories'],a:1,w:'You cannot improve what you have not found.'},
  {q:'Why does a line with random cycle times produce less than its bottleneck rate?',o:['Workers are slow','Blocking and starving between stations','Measurement error','Demand is low'],a:1,w:'Variability propagates without buffers.'},
  {q:'In drum-buffer-rope, the "rope" is…',o:['The conveyor','Linking material release to the bottleneck\'s pace','A safety stock','A maintenance plan'],a:1,w:'It prevents WIP flooding the system.'},
  {q:'Lean\'s view of buffers?',o:['Add as many as possible','Reduce variability first, then cut buffers','Buffers are free','Ignore them'],a:1,w:'Buffers hide problems.'},
  {q:'An hour gained at a non-bottleneck is…',o:['An hour gained for the system','A mirage — system output does not change','Twice as valuable','Equal to an hour at the bottleneck'],a:1,w:'Goldratt\'s famous point.'}],
 srs:[{q:'Utilisation vs efficiency?',a:'Utilisation = actual ÷ design capacity; efficiency = actual ÷ effective capacity.'},{q:'TOC five focusing steps?',a:'Identify, exploit, subordinate, elevate, repeat.'},{q:'Drum-buffer-rope?',a:'Bottleneck sets pace, buffer protects it, release tied to its pace.'},{q:'Why variability reduces throughput?',a:'Stations block and starve each other without buffers.'}],
 read:[{t:'Theory of constraints',s:'Wikipedia',u:WIKI('Theory_of_constraints')},{t:'MIT OCW: manufacturing systems analysis',s:'MIT OpenCourseWare',u:OCW('manufacturing systems analysis')},{t:'Bottleneck management',s:'HBR search',u:HBRS('bottleneck operations')}]},

{id:'e03',track:'eng',title:'Line balancing',mins:35,blurb:'Takt time, precedence and the ranked positional weight heuristic.',
 lab:{key:'balance',name:'Line balancer (precedence, takt, RPW)',intro:'Assign ten tasks to stations without breaking precedence or takt.'},
 cards:[
  {h:'Takt time',b:`<div class="formula">Takt = available production time ÷ customer demand</div><p>The pace the customer sets. 8 hours (28,800 s) ÷ 480 units = 60 s per unit.</p>`},
  {h:'Minimum stations',b:`<div class="formula">N_min = ⌈ total work content ÷ takt ⌉</div><p>A lower bound; precedence and task sizes often force more.</p>`},
  {h:'Efficiency and balance delay',b:`<div class="formula">Efficiency = total work ÷ (stations × takt) · Balance delay = 1 − efficiency</div><p>Idle time per cycle is the cost of imperfect balance.</p>`},
  {h:'RPW heuristic',b:`<p>Positional weight = task time + times of all its successors. Assign tasks in descending weight to the current station if precedence and takt allow; else open a new station. Simple, usually good, not always optimal.</p>`},
  {h:'In practice',b:`<p>Split long tasks, rebalance when demand changes, use multi-skilled operators to flex, and remember that ergonomics and quality matter as much as the arithmetic.</p>`}],
 quiz:[
  {q:'7 hours available, demand 420 units. Takt?',o:['60 s','1 min','Both A and B','30 s'],a:2,w:'25,200 s ÷ 420 = 60 s = 1 minute.'},
  {q:'Work content 186 s, takt 60 s. Minimum stations?',o:['3','4','5','186'],a:1,w:'186 ÷ 60 = 3.1 → 4.'},
  {q:'4 stations, takt 60 s, work 186 s. Efficiency?',o:['77.5%','96%','62%','100%'],a:0,w:'186 ÷ 240 = 77.5%.'},
  {q:'Positional weight of a task is…',o:['Its own time','Its time plus all successors\' times','Its number of predecessors','Takt − time'],a:1,w:'Prioritises tasks that unlock most work.'},
  {q:'A task longer than takt…',o:['Is impossible','Needs splitting, parallel stations or faster methods','Should be ignored','Defines takt'],a:1,w:'Otherwise the line cannot meet demand.'},
  {q:'If demand rises, takt…',o:['Rises','Falls','Unchanged','Doubles always'],a:1,w:'More units in the same time means less time per unit.'}],
 srs:[{q:'Takt time?',a:'Available time ÷ demand.'},{q:'Minimum number of stations?',a:'Ceiling of work content ÷ takt.'},{q:'Line efficiency?',a:'Work content ÷ (stations × takt).'},{q:'RPW?',a:'Assign tasks by descending (own time + all successors\' time).'}],
 read:[{t:'Assembly line balancing',s:'Wikipedia',u:WIKI('Assembly_line')},{t:'Takt time',s:'Wikipedia',u:WIKI('Takt_time')},{t:'MIT OCW: production systems',s:'MIT OpenCourseWare',u:OCW('production planning')}]},

{id:'e04',track:'eng',title:'Lean: the 8 wastes and value-stream mapping',mins:30,blurb:'See flow, see waste: lead time is mostly waiting.',
 lab:{key:'vsm',name:'Value-stream map calculator',intro:'Compute lead time and process cycle efficiency; cut inventory to shorten flow.'},
 cards:[
  {h:'Value from the customer\'s view',b:`<p>Value-added steps change the product in a way the customer will pay for, done right first time. Everything else is waste or necessary non-value-added work.</p>`},
  {h:'The 8 wastes (DOWNTIME)',b:`<p><b>D</b>efects · <b>O</b>verproduction · <b>W</b>aiting · <b>N</b>on-utilised talent · <b>T</b>ransport · <b>I</b>nventory · <b>M</b>otion · <b>E</b>xtra processing. Overproduction is the worst: it creates the others.</p>`},
  {h:'Value-stream mapping',b:`<p>Map material and information flow door to door for one product family: process boxes with cycle time, changeover and uptime; inventory triangles; the timeline of waiting vs value-added time.</p><div class="formula">Lead time ≈ Σ inventory ÷ daily demand</div>`},
  {h:'Process cycle efficiency',b:`<div class="formula">PCE = value-added time ÷ total lead time</div><p>Often far below 1% in traditional plants. The gap is the opportunity.</p>`},
  {h:'Future state',b:`<p>Design flow: produce to takt, continuous flow where possible, supermarkets and pull where not, one pacemaker process, level the mix. Then plan the kaizen bursts to get there.</p>`}],
 quiz:[
  {q:'Which waste is considered the worst because it creates others?',o:['Motion','Overproduction','Transport','Defects'],a:1,w:'Making too much, too early, hides problems and creates inventory.'},
  {q:'Inventory 2,000 units, daily demand 400. Days of lead time?',o:['0.2','5','2,400','800'],a:1,w:'2,000 ÷ 400 = 5 days.'},
  {q:'Process cycle efficiency is…',o:['Uptime','Value-added time ÷ lead time','Output ÷ input','OEE'],a:1,w:'How much of the lead time actually adds value.'},
  {q:'The "N" in DOWNTIME stands for…',o:['Noise','Non-utilised talent','Nesting','Negotiation'],a:1,w:'Unused skills and ideas of people.'},
  {q:'A VSM covers…',o:['One machine','One product family door to door, material and information','The whole company','Finance only'],a:1,w:'Scope matters.'},
  {q:'Why reduce inventory step by step?',o:['To save space only','Lower inventory exposes problems you then fix','To stop production','It looks good'],a:1,w:'The "lower the water to see the rocks" principle.'}],
 srs:[{q:'8 wastes (DOWNTIME)?',a:'Defects, Overproduction, Waiting, Non-utilised talent, Transport, Inventory, Motion, Extra processing.'},{q:'Lead time from a VSM?',a:'Σ inventory ÷ daily demand (+ processing time).'},{q:'PCE?',a:'Value-added time ÷ total lead time.'},{q:'Worst waste and why?',a:'Overproduction: it creates inventory and hides other problems.'}],
 read:[{t:'Decoding the DNA of the Toyota Production System',s:'Harvard Business Review',u:'https://hbr.org/1999/09/decoding-the-dna-of-the-toyota-production-system'},{t:'Lean Enterprise Institute',s:'lean.org',n:'Lexicon and VSM resources',u:'https://www.lean.org/'},{t:'Value-stream mapping',s:'Wikipedia',u:WIKI('Value-stream_mapping')}]},

{id:'e05',track:'eng',title:'Lean tools: 5S, SMED, kanban, pull',mins:30,blurb:'The toolkit that turns lean principles into daily practice.',
 lab:{key:'kanban',name:'Kanban and SMED calculator',intro:'Size a kanban loop and value a changeover reduction.'},
 cards:[
  {h:'5S',b:`<p>Sort, Set in order, Shine, Standardise, Sustain. A visual workplace where abnormalities are obvious. Not housekeeping for its own sake: the foundation for standard work.</p>`},
  {h:'SMED',b:`<p>Single-Minute Exchange of Die (Shingo): separate internal setup (machine stopped) from external (machine running), convert internal to external, streamline both. Shorter changeovers allow smaller batches.</p>`},
  {h:'Kanban and pull',b:`<div class="formula">N = D × L × (1 + α) ÷ C</div><p>Cards authorise production or withdrawal only when downstream consumes. Fewer cards = less inventory; remove cards deliberately to expose problems.</p>`},
  {h:'Heijunka',b:`<p>Level the volume and mix of production over time (e.g., ABAC instead of AAAA BBBB) so upstream processes see steady demand. Requires short changeovers.</p>`},
  {h:'Jidoka and poka-yoke',b:`<p>Build quality in: machines and people stop when something is wrong (jidoka, andon), and mistake-proofing devices make errors impossible or obvious (poka-yoke).</p>`}],
 quiz:[
  {q:'D = 100/hr, L = 3 hr, α = 10%, C = 25. Kanbans?',o:['12','13.2 → 14','11','30'],a:1,w:'100 × 3 × 1.1 ÷ 25 = 13.2 → round up to 14.'},
  {q:'First step of SMED?',o:['Buy faster machines','Separate internal and external setup','Increase batch size','Skip quality checks'],a:1,w:'Most gains come from organising what is already done.'},
  {q:'The 5S in order?',o:['Sort, Set in order, Shine, Standardise, Sustain','Shine, Sort, Sustain, Set, Standardise','Safety, Speed, Scale, Sort, Save','Sort, Shine, Ship, Store, Sustain'],a:0,w:'Sustain is the hardest.'},
  {q:'Heijunka means…',o:['Mistake-proofing','Levelling production volume and mix','Stopping the line','Visual control'],a:1,w:'Smooth demand on upstream processes.'},
  {q:'A poka-yoke is…',o:['A kanban card','A mistake-proofing device','A maintenance plan','A KPI'],a:1,w:'E.g. a fixture that only fits the right way.'},
  {q:'Why do short changeovers matter for pull?',o:['They do not','They make small batches and levelled mix economical','They raise inventory','They cut demand'],a:1,w:'SMED enables heijunka and pull.'}],
 srs:[{q:'Kanban formula?',a:'N = D × L × (1 + α) ÷ C, rounded up.'},{q:'SMED core idea?',a:'Separate internal from external setup; convert internal to external; streamline.'},{q:'5S?',a:'Sort, Set in order, Shine, Standardise, Sustain.'},{q:'Jidoka vs poka-yoke?',a:'Jidoka: stop on abnormality; poka-yoke: mistake-proofing devices.'}],
 read:[{t:'Single-minute exchange of die',s:'Wikipedia',u:WIKI('Single-minute_exchange_of_die')},{t:'Kanban',s:'Wikipedia',u:WIKI('Kanban')},{t:'Lean Enterprise Institute',s:'lean.org',u:'https://www.lean.org/'}]},

{id:'e06',track:'eng',title:'OEE and TPM',mins:30,blurb:'Measure equipment losses and organise to eliminate them.',
 lab:{key:'oee',name:'OEE calculator with loss waterfall',intro:'Compute A × P × Q and see where the minutes go.'},
 cards:[
  {h:'OEE',b:`<div class="formula">OEE = Availability × Performance × Quality</div><ul><li>A = run time ÷ planned time</li><li>P = (ideal cycle × total count) ÷ run time</li><li>Q = good count ÷ total count</li></ul>`},
  {h:'Six big losses',b:`<p>Availability: breakdowns, setups/adjustments. Performance: minor stops, reduced speed. Quality: start-up rejects, production rejects. Each maps to specific countermeasures.</p>`},
  {h:'Benchmarks',b:`<p>World-class OEE is often quoted around 85% for discrete manufacturing; many plants run at 40–60%. Compare trends on the same line, not across different industries.</p>`},
  {h:'TPM',b:`<p>Total Productive Maintenance: operators own basic care (autonomous maintenance), planned maintenance, focused improvement, early equipment management, training. Goal: zero breakdowns, zero defects.</p>`},
  {h:'Use OEE honestly',b:`<p>OEE is a diagnostic for one asset, not a target to game. Watch for inflated ideal cycle times (performance above 100%) and excluded "planned" downtime that hides losses.</p>`}],
 quiz:[
  {q:'A 90%, P 80%, Q 95%. OEE?',o:['68.4%','85%','72%','95%'],a:0,w:'0.9 × 0.8 × 0.95 = 0.684.'},
  {q:'Minor stops reduce…',o:['Availability','Performance','Quality','Planned time'],a:1,w:'Short stops are usually counted as speed loss.'},
  {q:'Performance above 100% suggests…',o:['Excellent operators','The ideal cycle time is set too slow','High quality','Low downtime'],a:1,w:'Fix the standard.'},
  {q:'Autonomous maintenance means…',o:['Robots maintain machines','Operators do basic cleaning, inspection, lubrication','No maintenance','Outsourcing'],a:1,w:'A TPM pillar.'},
  {q:'Which is an availability loss?',o:['Rejects','Breakdowns','Reduced speed','Rework'],a:1,w:'Unplanned stops.'},
  {q:'Best use of OEE?',o:['Compare all plants worldwide','Track and diagnose losses on the same asset over time','Pay bonuses','Replace financial KPIs'],a:1,w:'A diagnostic, not a league table.'}],
 srs:[{q:'OEE formula?',a:'Availability × Performance × Quality.'},{q:'Six big losses?',a:'Breakdowns, setups; minor stops, reduced speed; start-up rejects, production rejects.'},{q:'TPM goal?',a:'Zero breakdowns and zero defects through operator ownership and planned maintenance.'},{q:'Typical world-class OEE quote?',a:'About 85% (discrete manufacturing).'}],
 read:[{t:'Overall equipment effectiveness',s:'Wikipedia',u:WIKI('Overall_equipment_effectiveness')},{t:'Total productive maintenance',s:'Wikipedia',u:WIKI('Total_productive_maintenance')},{t:'Maintenance and reliability',s:'HBR search',u:HBRS('predictive maintenance')}]},

{id:'e07',track:'eng',title:'Six Sigma and process capability',mins:35,blurb:'DMAIC, Cp, Cpk and defects per million.',
 lab:{key:'cpk',name:'Capability calculator',intro:'Centre the process or shrink its spread to meet the customer\'s Cpk.'},
 cards:[
  {h:'DMAIC',b:`<p><b>Define</b> the problem and CTQs · <b>Measure</b> the baseline (and the measurement system) · <b>Analyse</b> root causes with data · <b>Improve</b> and pilot · <b>Control</b> to sustain.</p>`},
  {h:'Capability indices',b:`<div class="formula">Cp = (USL − LSL) ÷ 6σ · Cpk = min(USL − μ, μ − LSL) ÷ 3σ</div><p>Cp: could the process fit if centred? Cpk: does it, where it actually sits? Common requirement: Cpk ≥ 1.33 (automotive often 1.67 for critical features).</p>`},
  {h:'Sigma levels',b:`<p>"Six Sigma" quality ≈ 3.4 defects per million opportunities, assuming a 1.5σ long-term shift. A 3σ process produces about 66,800 DPMO long-term.</p>`},
  {h:'Measure the measurement',b:`<p>Before trusting data, run a gauge R&R: if measurement variation is large relative to tolerance, you cannot see the process clearly.</p>`},
  {h:'Lean Six Sigma',b:`<p>Lean removes waste and speeds flow; Six Sigma reduces variation. Most programmes combine them: flow problems need lean, variation problems need statistics.</p>`}],
 quiz:[
  {q:'USL 10.1, LSL 9.9, σ 0.025. Cp?',o:['1.33','2.67','0.75','1.0'],a:0,w:'0.2 ÷ 0.15 = 1.33.'},
  {q:'Same process, mean 10.05. Cpk?',o:['0.67','1.33','2.0','1.0'],a:0,w:'min(0.05, 0.15) ÷ 0.075 = 0.67.'},
  {q:'Cp high but Cpk low means…',o:['Too much variation','The process is off-centre','The spec is wrong','Nothing'],a:1,w:'Centre it first: usually the cheaper fix.'},
  {q:'DMAIC stands for…',o:['Design, Make, Assess, Inspect, Close','Define, Measure, Analyse, Improve, Control','Detect, Monitor, Act, Improve, Check','Define, Map, Analyse, Implement, Celebrate'],a:1,w:'The Six Sigma improvement cycle.'},
  {q:'Six Sigma quality is about…',o:['6 defects per hundred','3.4 defects per million opportunities','Zero defects','1% defects'],a:1,w:'With the conventional 1.5σ shift.'},
  {q:'Why do a gauge R&R first?',o:['It is required by ISO only','To check the measurement system can see the variation you care about','To calibrate prices','It replaces SPC'],a:1,w:'Bad measurement leads to wrong conclusions.'}],
 srs:[{q:'Cp and Cpk formulas?',a:'Cp = (USL−LSL)/6σ; Cpk = min(USL−μ, μ−LSL)/3σ.'},{q:'DMAIC?',a:'Define, Measure, Analyse, Improve, Control.'},{q:'Six Sigma DPMO?',a:'≈ 3.4 defects per million opportunities (with 1.5σ shift).'},{q:'Common Cpk requirement?',a:'≥ 1.33 (1.67 for critical automotive features).'}],
 read:[{t:'Process capability index',s:'Wikipedia',u:WIKI('Process_capability_index')},{t:'Six Sigma',s:'Wikipedia',u:WIKI('Six_Sigma')},{t:'NIST/SEMATECH e-Handbook of Statistical Methods',s:'NIST',n:'Process capability and SPC chapters',u:'https://www.itl.nist.gov/div898/handbook/'}]},

{id:'e08',track:'eng',title:'Statistical process control',mins:30,blurb:'Separate signal from noise with control charts.',
 lab:{key:'spc',name:'X̄ control chart: find the signal',intro:'New data every time. Spot the first out-of-control subgroup.'},
 cards:[
  {h:'Common vs special causes',b:`<p>Shewhart: every process varies. <b>Common-cause</b> variation is the system's natural noise; <b>special causes</b> are assignable events (a worn tool, a new batch). Control charts tell them apart.</p>`},
  {h:'X̄–R charts',b:`<div class="formula">UCL/LCL (X̄) = X̿ ± A₂R̄ · UCL (R) = D₄R̄ · LCL (R) = D₃R̄</div><p>For subgroups of 5: A₂ = 0.577, D₃ = 0, D₄ = 2.114. Use X̄–R for continuous measurements in small subgroups.</p>`},
  {h:'Out-of-control rules',b:`<ul><li>A point beyond a control limit</li><li>7 (or 8) consecutive points on one side of the centre line</li><li>6 points steadily rising or falling</li><li>2 of 3 points beyond 2σ on the same side</li></ul>`},
  {h:'Control limits ≠ spec limits',b:`<p>Control limits come from the process (voice of the process); spec limits come from the customer (voice of the customer). A process can be in control and still incapable.</p>`},
  {h:'Don\'t tamper',b:`<p>Adjusting a stable process in response to common-cause noise increases variation (Deming's funnel experiment). React only to signals.</p>`}],
 quiz:[
  {q:'X̿ 50, R̄ 2, n = 5 (A₂ 0.577). UCL for X̄?',o:['51.15','52','50.58','54.2'],a:0,w:'50 + 0.577 × 2 = 51.15.'},
  {q:'Eight points in a row above the centre line suggest…',o:['Normal noise','A process shift (special cause)','Good quality','Bad specifications'],a:1,w:'A run rule signal.'},
  {q:'Control limits are based on…',o:['Customer specs','The process\'s own variation','Management targets','Industry averages'],a:1,w:'Voice of the process.'},
  {q:'Adjusting a stable process after every reading…',o:['Reduces variation','Increases variation (tampering)','Has no effect','Is required'],a:1,w:'Deming\'s funnel.'},
  {q:'A process in control is always capable.',o:['True','False'],a:1,w:'Stable, yes; within spec, not necessarily.'},
  {q:'For defect proportions you would use…',o:['X̄–R chart','p-chart','Gantt chart','Pareto only'],a:1,w:'Attribute data use p or np charts.'}],
 srs:[{q:'Common vs special cause?',a:'Common: inherent system noise. Special: assignable event to find and fix.'},{q:'X̄ chart limits?',a:'X̿ ± A₂R̄ (A₂ = 0.577 for n = 5).'},{q:'Two key run rules?',a:'Point beyond a limit; 7–8 consecutive points on one side.'},{q:'Control vs spec limits?',a:'Control = voice of process; spec = voice of customer.'}],
 read:[{t:'NIST e-Handbook: process control',s:'NIST',u:'https://www.itl.nist.gov/div898/handbook/'},{t:'Control chart',s:'Wikipedia',u:WIKI('Control_chart')},{t:'Western Electric rules',s:'Wikipedia',u:WIKI('Western_Electric_rules')}]},

{id:'e09',track:'eng',title:'Quality systems: FMEA and root cause',mins:30,blurb:'Prevent failures before they happen; find the true cause when they do.',
 lab:{key:'fmea',name:'FMEA builder',intro:'Rate five pump-assembly failure modes and drive every RPN below 100.'},
 cards:[
  {h:'FMEA',b:`<p>Failure Mode and Effects Analysis: for each step, list how it could fail, the effect, causes and controls. Rate Severity, Occurrence, Detection (1–10).</p><div class="formula">RPN = S × O × D</div>`},
  {h:'Using RPN well',b:`<p>Prioritise high RPN but also any high severity (9–10 = safety or regulatory). Newer standards (AIAG-VDA) use Action Priority tables instead of raw RPN for this reason.</p>`},
  {h:'Root-cause tools',b:`<ul><li><b>5 Whys:</b> keep asking why until you reach a process cause you can fix.</li><li><b>Fishbone (Ishikawa):</b> brainstorm causes by Man, Machine, Method, Material, Measurement, Environment.</li><li><b>Pareto:</b> 80% of problems often come from 20% of causes.</li></ul>`},
  {h:'8D problem solving',b:`<p>Common in automotive: team, describe, contain, root cause, corrective action, validate, prevent recurrence, recognise the team. Containment protects the customer while you investigate.</p>`},
  {h:'ISO 9001',b:`<p>A quality management system standard: process approach, risk-based thinking, documented procedures, internal audits, management review, continual improvement. Certification is often a condition for supplying large Saudi buyers.</p>`}],
 quiz:[
  {q:'S 8, O 4, D 5. RPN?',o:['17','160','32','40'],a:1,w:'8 × 4 × 5 = 160.'},
  {q:'Which rating usually changes only with a design change?',o:['Severity','Occurrence','Detection','RPN'],a:0,w:'Severity is about the effect, not the cause.'},
  {q:'A failure mode with S 10, O 2, D 2 (RPN 40) should…',o:['Be ignored','Still be addressed because severity is critical','Wait for RPN > 100','Be deleted'],a:1,w:'Safety-critical effects need action regardless.'},
  {q:'The 6 Ms of a fishbone include…',o:['Money, Marketing, Media','Man, Machine, Method, Material, Measurement, Mother nature (environment)','Mission, Metrics, Meetings','Make, Move, Measure'],a:1,w:'Categories to structure cause brainstorming.'},
  {q:'In 8D, containment is done to…',o:['Find the root cause','Protect the customer while investigating','Close the case','Reward the team'],a:1,w:'Stop bad parts escaping first.'},
  {q:'Lowering Detection rating means…',o:['Defects become harder to detect','Better ability to detect before the customer','Higher severity','Fewer failures occur'],a:1,w:'D = 1 means almost certain detection.'}],
 srs:[{q:'RPN?',a:'Severity × Occurrence × Detection.'},{q:'5 Whys?',a:'Ask "why" repeatedly until reaching a fixable process cause.'},{q:'Fishbone categories?',a:'Man, Machine, Method, Material, Measurement, Environment.'},{q:'8D first actions?',a:'Form team, describe problem, contain (protect customer) before root cause.'}],
 read:[{t:'Failure mode and effects analysis',s:'Wikipedia',u:WIKI('Failure_mode_and_effects_analysis')},{t:'Ishikawa diagram',s:'Wikipedia',u:WIKI('Ishikawa_diagram')},{t:'ISO 9001 quality management',s:'ISO',n:'The 2015 edition has been replaced by ISO 9001:2026',u:'https://www.iso.org/iso-9001-quality-management.html'}]},

{id:'e10',track:'eng',title:'Demand forecasting',mins:30,blurb:'Moving averages, exponential smoothing and forecast error.',
 lab:{key:'forecast',name:'Forecasting workbench',intro:'Fit two simple methods to a year of demand with a Ramadan peak.'},
 cards:[
  {h:'Forecasts are always wrong',b:`<p>The goal is to be less wrong, know how wrong, and plan for it. Aggregate forecasts (families, regions, longer horizons) are more accurate than item-level ones.</p>`},
  {h:'Time-series methods',b:`<ul><li><b>Moving average:</b> mean of the last n periods.</li><li><b>Exponential smoothing:</b> F_{t+1} = αA_t + (1 − α)F_t.</li><li><b>Holt/Winters:</b> add trend and seasonality.</li></ul>`},
  {h:'Error metrics',b:`<div class="formula">MAD = mean |A − F| · MAPE = mean |A − F| ÷ A · Bias = mean (A − F)</div><p>Track bias: a forecast that is consistently high or low is worse than a noisy one.</p>`},
  {h:'Seasonality in the Kingdom',b:`<p>Ramadan, Eid, Hajj, school terms and summer heat drive strong seasonal patterns, and the Hijri calendar shifts about 11 days a year against the Gregorian one. Seasonal indices must follow the right calendar.</p>`},
  {h:'S&OP',b:`<p>Sales and Operations Planning aligns the demand plan, supply plan and financial plan monthly, with an executive decision meeting. Forecasting is one input, not the whole process.</p>`}],
 quiz:[
  {q:'Demand 100, 120, 110. Three-period moving average forecast?',o:['110','120','100','330'],a:0,w:'(100 + 120 + 110) ÷ 3.'},
  {q:'α = 0.3, last forecast 100, actual 120. Next forecast?',o:['106','114','120','100'],a:0,w:'0.3 × 120 + 0.7 × 100 = 106.'},
  {q:'A high α makes the forecast…',o:['Slower to react','Faster to react but noisier','Seasonal','Unbiased'],a:1,w:'More weight on the latest actual.'},
  {q:'Bias measures…',o:['Average absolute error','Systematic over- or under-forecasting','Seasonality','Volatility'],a:1,w:'Mean signed error.'},
  {q:'Why do Ramadan peaks move each Gregorian year?',o:['Random','The Hijri calendar is about 11 days shorter','Climate','Promotions'],a:1,w:'Use Hijri-aware seasonal indices.'},
  {q:'Forecasts are more accurate when…',o:['More detailed (SKU, daily)','Aggregated (family, monthly)','Made by one person','Made further ahead'],a:1,w:'Errors partly cancel in aggregates.'}],
 srs:[{q:'Exponential smoothing?',a:'F(t+1) = αA(t) + (1−α)F(t).'},{q:'MAPE?',a:'Mean of |actual − forecast| ÷ actual.'},{q:'Why track bias?',a:'Systematic error leads to chronic over- or under-stocking.'},{q:'S&OP?',a:'Monthly process aligning demand, supply and financial plans with executive decisions.'}],
 read:[{t:'Forecasting: Principles and Practice',s:'Hyndman & Athanasopoulos (free online)',u:'https://otexts.com/fpp3/'},{t:'Exponential smoothing',s:'Wikipedia',u:WIKI('Exponential_smoothing')},{t:'Sales and operations planning',s:'HBR search',u:HBRS('sales and operations planning')}]},

{id:'e11',track:'eng',title:'Inventory: EOQ and safety stock',mins:30,blurb:'How much to order, when to order, and how much buffer to hold.',
 lab:{key:'eoq',name:'EOQ, safety stock and reorder point',intro:'Explore the total-cost curve and the price of service level.'},
 cards:[
  {h:'Why hold inventory?',b:`<p>Cycle stock (ordering in batches), safety stock (uncertainty), pipeline stock (in transit), anticipation stock (seasons, Ramadan) and decoupling stock between processes.</p>`},
  {h:'EOQ',b:`<div class="formula">EOQ = √(2DS ÷ H)</div><p>Balances ordering cost (falls with bigger orders) and holding cost (rises). The curve is flat near the optimum: 20% off EOQ costs little.</p>`},
  {h:'Safety stock',b:`<div class="formula">SS = z × σ_d × √L</div><p>z from the service level (95% → 1.645; 99% → 2.33). Going from 95% to 99% raises safety stock about 40%.</p>`},
  {h:'Reorder point',b:`<div class="formula">ROP = d × L + SS</div><p>Order when inventory position (on hand + on order − backorders) reaches the ROP.</p>`},
  {h:'ABC classification',b:`<p>Typically 20% of items are 80% of value (A items): manage tightly. C items: simple rules, larger safety stocks. Combine with XYZ (demand variability) for policy.</p>`}],
 quiz:[
  {q:'D 10,000, S 50, H 4. EOQ?',o:['500','250','1,000','5,000'],a:0,w:'√(2 × 10,000 × 50 ÷ 4) = √250,000 = 500.'},
  {q:'z 1.645, σ_d 20, L 9 days. Safety stock?',o:['about 99','about 296','30','180'],a:0,w:'1.645 × 20 × 3 = 98.7.'},
  {q:'d 50/day, L 9, SS 99. ROP?',o:['549','450','99','500'],a:0,w:'450 + 99.'},
  {q:'Raising service level from 95% to 99%…',o:['Barely changes safety stock','Raises it about 40%','Halves it','Eliminates it'],a:1,w:'z goes from 1.645 to 2.33.'},
  {q:'A items in ABC analysis are…',o:['Cheapest items','The few items with most of the value','Obsolete items','All items equally'],a:1,w:'Manage them most closely.'},
  {q:'Ordering 20% more than EOQ raises total cost…',o:['About 20%','Only slightly','By half','To infinity'],a:1,w:'The cost curve is flat near the minimum.'}],
 srs:[{q:'EOQ?',a:'√(2DS/H).'},{q:'Safety stock?',a:'z × σ_d × √L.'},{q:'Reorder point?',a:'Average demand during lead time + safety stock.'},{q:'ABC?',a:'Classify by value: A few items, most value — manage tightly.'}],
 read:[{t:'Economic order quantity',s:'Wikipedia',u:WIKI('Economic_order_quantity')},{t:'Safety stock',s:'Wikipedia',u:WIKI('Safety_stock')},{t:'MIT OCW: supply chain planning',s:'MIT OpenCourseWare',u:OCW('supply chain planning')}]},

{id:'e12',track:'eng',title:'Supply-chain design, bullwhip and localisation',mins:35,blurb:'Why small demand changes become big swings upstream, and how Saudi localisation reshapes networks.',
 lab:{key:'bullwhip',name:'Bullwhip simulator',intro:'A four-tier chain reacts to a demand step. Tame the factory\'s orders.'},
 cards:[
  {h:'The bullwhip effect',b:`<p>Order variability grows as you move upstream. Causes: forecasting from orders instead of real demand, order batching, price promotions, rationing games, and long lead times.</p>`},
  {h:'Cures',b:`<ul><li>Share point-of-sale data and forecasts</li><li>Shorter lead times</li><li>Smaller, more frequent orders</li><li>Everyday low pricing instead of promotions</li><li>Vendor-managed inventory</li></ul>`},
  {h:'Network design',b:`<p>Where to put plants and warehouses trades off transport cost, service time, inventory (more sites = more safety stock), tariffs and resilience. Total landed cost, not unit price, decides sourcing.</p>`},
  {h:'Saudi localisation',b:`<p>Local-content requirements in government and giga-project procurement, IKTVA-style supplier programmes in energy, and industrial-fund incentives push manufacturers to localise. Strong localisation cases combine an anchor buyer, scale, a supplier base and skills.</p>`},
  {h:'Resilience',b:`<p>Single-source, long, just-in-time chains are efficient but fragile. Dual sourcing, regional buffers and supplier visibility cost money; the question is how much disruption risk the business can absorb.</p>`}],
 quiz:[
  {q:'The bullwhip effect means…',o:['Demand falls upstream','Order variability increases upstream','Prices rise downstream','Inventory disappears'],a:1,w:'Small retail changes become large factory swings.'},
  {q:'Which reduces bullwhip?',o:['Big quarterly promotions','Sharing point-of-sale data','Longer lead times','Bigger batches'],a:1,w:'Upstream sees real demand.'},
  {q:'More warehouses usually means…',o:['Less total inventory','More total safety stock, shorter delivery times','Lower transport cost always','No trade-offs'],a:1,w:'Inventory pooling is lost.'},
  {q:'Sourcing decisions should compare…',o:['Unit price only','Total landed cost and risk','Supplier logos','Lead time only'],a:1,w:'Freight, duties, inventory, quality, risk.'},
  {q:'A strong localisation case usually needs…',o:['Only a subsidy','Anchor demand, scale, suppliers and skills','A large office','A foreign brand'],a:1,w:'Incentives alone rarely make a plant viable.'},
  {q:'Rationing games cause bullwhip because…',o:['Buyers over-order when supply is short','Prices fall','Lead times shrink','Forecasts improve'],a:0,w:'Inflated orders distort demand signals.'}],
 srs:[{q:'Four causes of bullwhip?',a:'Forecasting from orders, batching, promotions, rationing (plus long lead times).'},{q:'Bullwhip cures?',a:'Share POS data, shorten lead times, smaller orders, stable pricing, VMI.'},{q:'Total landed cost?',a:'Unit price + freight + duties + inventory + quality + risk costs.'},{q:'Localisation success factors?',a:'Anchor demand, scale, supplier base, skills, plus incentives.'}],
 read:[{t:'The Bullwhip Effect in Supply Chains',s:'MIT Sloan Management Review, 1997',n:'Lee, Padmanabhan & Whang',u:'https://sloanreview.mit.edu/article/the-bullwhip-effect-in-supply-chains/'},{t:'Bullwhip effect',s:'Wikipedia',u:WIKI('Bullwhip_effect')},{t:'Supply chain resilience',s:'HBR search',u:HBRS('supply chain resilience')}]},

{id:'e13',track:'eng',title:'Operations research I: linear programming',mins:35,blurb:'Optimise a product mix under capacity constraints.',
 lab:{key:'lp',name:'Two-variable LP solver',intro:'See the feasible region and evaluate its corners.'},
 cards:[
  {h:'Formulation',b:`<p>Decision variables (what you choose), objective (maximise profit or minimise cost), constraints (capacity, demand, materials), and non-negativity. Getting the formulation right is most of the work.</p>`},
  {h:'Corner-point principle',b:`<p>For a linear programme, the optimum lies at a corner (vertex) of the feasible region, or along an edge if two corners tie. The simplex method walks from corner to better corner.</p>`},
  {h:'Binding constraints and shadow prices',b:`<p>A binding constraint is used fully at the optimum. Its shadow price is the increase in the objective from one more unit of that resource — the value of an extra machine hour or shift.</p>`},
  {h:'Sensitivity analysis',b:`<p>How far can a profit coefficient or resource change before the optimal mix changes? Solvers report these ranges; managers should read them before acting.</p>`},
  {h:'Where LP is used',b:`<p>Product mix, blending (refining, feed, cement raw mix), transportation and distribution, workforce scheduling, and capital budgeting (with integer variables). Excel Solver handles most business-sized problems.</p>`}],
 quiz:[
  {q:'In an LP, the optimum is found…',o:['In the middle of the feasible region','At a corner point (or along an edge)','Outside the region','Anywhere'],a:1,w:'Linear objectives push to the boundary.'},
  {q:'A constraint with slack at the optimum has a shadow price of…',o:['Zero','Infinity','One','Negative always'],a:0,w:'Extra units of an unused resource add nothing.'},
  {q:'Shadow price of finishing hours is SAR 25. Overtime costs SAR 40/hour. Add overtime?',o:['Yes','No: it costs more than it earns','Only on weekends','Cannot tell'],a:1,w:'Value per hour (25) is below cost (40).'},
  {q:'Which is a decision variable in a product-mix LP?',o:['Machine hours available','Number of chairs to make','Profit per chair','Market size'],a:1,w:'What management chooses.'},
  {q:'Blending a refinery or cement raw mix is a typical use of…',o:['Queuing theory','Linear programming','CPM','SPC'],a:1,w:'Minimise cost subject to quality specs.'},
  {q:'Corners: (0,80) → 9,600; (40,80) → 12,400; (120,0) → 8,400. Optimum?',o:['(0,80)','(40,80)','(120,0)','(0,0)'],a:1,w:'Highest objective among corners.'}],
 srs:[{q:'Parts of an LP?',a:'Decision variables, objective, constraints, non-negativity.'},{q:'Corner-point principle?',a:'An LP optimum lies at a vertex of the feasible region (or along an edge on ties).'},{q:'Shadow price?',a:'Objective improvement from one more unit of a binding constraint\'s resource.'},{q:'Slack constraint shadow price?',a:'Zero.'}],
 read:[{t:'MIT 15.053 Optimization Methods in Management Science',s:'MIT OpenCourseWare',u:OCW('optimization methods in management science')},{t:'Linear programming',s:'Wikipedia',u:WIKI('Linear_programming')},{t:'Shadow price',s:'Wikipedia',u:WIKI('Shadow_price')}]},

{id:'e14',track:'eng',title:'Operations research II: queuing and scheduling',mins:30,blurb:'Waiting lines, server staffing and sequencing jobs.',
 lab:{key:'queue',name:'M/M/c queue calculator',intro:'Staff a hospital pharmacy to a waiting-time target.'},
 cards:[
  {h:'Queue basics',b:`<p>Arrival rate λ, service rate μ per server, c servers. Utilisation ρ = λ ÷ (cμ). If ρ ≥ 1, the queue grows forever.</p>`},
  {h:'Waiting explodes near 100%',b:`<p>For a single server, average wait in queue Wq = ρ ÷ (μ − λ). At 80% utilisation, waits are 4× the service time; at 95%, 19×. Small capacity additions near saturation cut waiting dramatically.</p>`},
  {h:'Pooling',b:`<p>One shared queue feeding several servers beats separate queues per server — the same staff, shorter average waits (think airport check-in vs supermarket lanes).</p>`},
  {h:'Johnson\'s rule',b:`<p>Two machines in sequence, n jobs: pick the shortest remaining time; if it is on machine 1, schedule that job as early as possible; if on machine 2, as late as possible. Minimises makespan.</p>`},
  {h:'Dispatch rules',b:`<p>Shortest processing time minimises average flow time; earliest due date minimises maximum lateness; first come first served is fair but rarely optimal.</p>`}],
 quiz:[
  {q:'λ = 50/hr, μ = 12/hr per server, c = 5. Utilisation?',o:['83%','120%','60%','100%'],a:0,w:'50 ÷ 60.'},
  {q:'Single server, λ = 8, μ = 10 per hour. Wq?',o:['0.4 h (24 min)','0.1 h','0.8 h','2 h'],a:0,w:'ρ = 0.8; Wq = 0.8 ÷ (10 − 8) = 0.4 h.'},
  {q:'Pooling queues generally…',o:['Increases waits','Reduces average waits with the same staff','Has no effect','Needs more servers'],a:1,w:'Servers are never idle while someone waits elsewhere.'},
  {q:'Johnson\'s rule minimises…',o:['Average lateness','Makespan on two machines','Cost','Number of jobs'],a:1,w:'Total completion time for a two-stage flow shop.'},
  {q:'Which rule minimises average flow time?',o:['FCFS','SPT (shortest processing time)','EDD','Random'],a:1,w:'Short jobs first.'},
  {q:'If ρ ≥ 1…',o:['Waits are short','The queue grows without limit','Servers are idle','Johnson\'s rule applies'],a:1,w:'Demand exceeds capacity.'}],
 srs:[{q:'Utilisation in M/M/c?',a:'ρ = λ ÷ (cμ).'},{q:'M/M/1 waiting time?',a:'Wq = ρ ÷ (μ − λ).'},{q:'Johnson\'s rule?',a:'Shortest time first; if on machine 1 schedule early, if on machine 2 schedule late.'},{q:'SPT vs EDD?',a:'SPT minimises average flow time; EDD minimises maximum lateness.'}],
 read:[{t:'Erlang C / queueing theory',s:'Wikipedia',u:WIKI('Queueing_theory')},{t:'Johnson\'s rule',s:'Wikipedia',u:WIKI('Johnson%27s_rule')},{t:'MIT OCW: queues and probabilistic models',s:'MIT OpenCourseWare',u:OCW('queueing')}]},

{id:'e15',track:'eng',title:'Industry 4.0',mins:30,blurb:'IIoT, digital twins, automation — and the business case behind them.',
 lab:{key:'i40',name:'Automation business case',intro:'Test whether a robotic cell pays back, and which benefit it hinges on.'},
 cards:[
  {h:'What Industry 4.0 means',b:`<p>Connecting machines, products and people through sensors, data platforms and analytics: IIoT, cloud and edge computing, advanced robotics, additive manufacturing, digital twins and AI-driven decisions.</p>`},
  {h:'Digital twins',b:`<p>A live virtual model of an asset, line or plant fed by real data. Uses: predictive maintenance, what-if simulation, virtual commissioning, operator training.</p>`},
  {h:'Start with the problem',b:`<p>Pilots fail when they start with technology. Start with a costly loss (downtime, scrap, energy) on a specific line, prove value in weeks, then scale. "Pilot purgatory" is the common failure mode.</p>`},
  {h:'The business case',b:`<p>Count labour, but also quality, uptime, energy, safety, flexibility and the capacity to run extra shifts. Include integration, cybersecurity, maintenance and skills costs that vendor quotes leave out.</p>`},
  {h:'The Saudi context',b:`<p>National programmes (e.g., the industrial strategy and Future Factories-type initiatives) encourage automation as Saudisation targets favour higher-skilled jobs. Skills — technicians, data engineers — are often the binding constraint.</p>`}],
 quiz:[
  {q:'A digital twin is…',o:['A backup server','A live virtual model of an asset fed by real data','A duplicate factory','A CAD drawing only'],a:1,w:'It mirrors the real asset\'s state.'},
  {q:'"Pilot purgatory" means…',o:['Pilots that never scale','Pilots that fail on day one','Pilots run by pilots','Successful scaling'],a:0,w:'Many I4.0 pilots never reach full deployment.'},
  {q:'Best starting point for an Industry 4.0 programme?',o:['Buy the newest platform','A specific costly loss on a specific line','Automate everything at once','Hire a vendor'],a:1,w:'Value first, technology second.'},
  {q:'Commonly underestimated costs?',o:['Robot price','Integration, cybersecurity, skills and maintenance','Electricity','Floor space'],a:1,w:'They often decide the real return.'},
  {q:'Capex SAR 12m, net benefit SAR 3.4m/yr. Payback?',o:['3.5 years','0.28 years','4 years','12 years'],a:0,w:'12 ÷ 3.4 ≈ 3.5.'},
  {q:'Predictive maintenance relies on…',o:['Fixed calendars','Sensor data and models predicting failure','Waiting for breakdowns','Manual checklists only'],a:1,w:'Condition data → intervene before failure.'}],
 srs:[{q:'Industry 4.0 core technologies?',a:'IIoT, cloud/edge, robotics, additive, digital twins, AI/analytics.'},{q:'Digital twin uses?',a:'Predictive maintenance, what-if simulation, virtual commissioning, training.'},{q:'Pilot purgatory?',a:'Pilots that show promise but never scale.'},{q:'Hidden costs in automation cases?',a:'Integration, cybersecurity, maintenance, software and skills.'}],
 read:[{t:'Digital twin',s:'Wikipedia',u:WIKI('Digital_twin')},{t:'Industry 4.0',s:'HBR search',u:HBRS('industry 4.0 manufacturing')},{t:'MIT OCW: manufacturing and automation',s:'MIT OpenCourseWare',u:OCW('automation')}]},

{id:'e16',track:'eng',title:'Project management: CPM and earned value',mins:35,blurb:'Critical path, slack and whether a project is on time and budget.',
 lab:{key:'cpm',name:'Critical path + EVM tracker',intro:'Find the critical path of a commissioning project, then read its earned value.'},
 cards:[
  {h:'Plan the work',b:`<p>Work breakdown structure (deliverables → work packages), durations, dependencies, resources. A good WBS is MECE: all the work, no overlaps.</p>`},
  {h:'Critical path method',b:`<p>Forward pass gives earliest start/finish; backward pass gives latest. Slack = LS − ES. Tasks with zero slack form the critical path: any delay there delays the project.</p>`},
  {h:'PERT',b:`<div class="formula">Expected time = (optimistic + 4 × most likely + pessimistic) ÷ 6</div><p>Adds uncertainty to durations; the critical path can shift when estimates change.</p>`},
  {h:'Earned value',b:`<ul><li>PV: planned value of work scheduled</li><li>EV: budgeted value of work actually done</li><li>AC: actual cost</li></ul><div class="formula">SPI = EV ÷ PV · CPI = EV ÷ AC · EAC ≈ BAC ÷ CPI</div>`},
  {h:'Compressing schedules',b:`<p>Crashing adds resources to critical tasks (costs money); fast-tracking overlaps tasks (adds risk). Only critical-path tasks shorten the project.</p>`}],
 quiz:[
  {q:'Slack of a critical task is…',o:['Positive','Zero','Negative always','Equal to duration'],a:1,w:'By definition.'},
  {q:'PERT: optimistic 4, most likely 6, pessimistic 14. Expected?',o:['7','6','8','24'],a:0,w:'(4 + 24 + 14) ÷ 6 = 7.'},
  {q:'EV 1,000, PV 1,200. SPI?',o:['0.83','1.2','200','1.0'],a:0,w:'Behind schedule.'},
  {q:'EV 1,000, AC 1,150. CPI?',o:['0.87','1.15','150','1.0'],a:0,w:'Over budget.'},
  {q:'BAC 2,000, CPI 0.87. EAC?',o:['about 2,300','1,740','2,000','2,870'],a:0,w:'2,000 ÷ 0.87 ≈ 2,299.'},
  {q:'Shortening a non-critical task…',o:['Shortens the project','Does not shorten the project','Always raises cost','Moves the critical path'],a:1,w:'It only adds slack.'}],
 srs:[{q:'Slack?',a:'LS − ES (or LF − EF); zero on the critical path.'},{q:'PERT expected time?',a:'(o + 4m + p) ÷ 6.'},{q:'SPI and CPI?',a:'SPI = EV ÷ PV; CPI = EV ÷ AC; < 1 means behind / over budget.'},{q:'EAC (typical)?',a:'BAC ÷ CPI.'}],
 read:[{t:'Critical path method',s:'Wikipedia',u:WIKI('Critical_path_method')},{t:'Earned value management',s:'Wikipedia',u:WIKI('Earned_value_management')},{t:'Project Management Institute',s:'PMI',u:'https://www.pmi.org/'}]}
]);
