{id:'s01',track:'startup',title:'Opportunity recognition',mins:25,blurb:'Where good start-up ideas come from, and how to compare them honestly.',
 lab:{key:'oppscore',name:'Opportunity scoring matrix',intro:'Score up to three ideas on weighted criteria.'},
 cards:[
  {h:'Problems before ideas',b:`<p>Great start-ups usually begin with a painful, frequent, expensive problem that the founders understand from the inside. Ideas that start from a technology looking for a use fail more often.</p>`},
  {h:'Where to look',b:`<ul><li>Your own work: inefficiencies you see every day (consulting and manufacturing are full of them)</li><li>Change: new regulation, technology, behaviour (why now?)</li><li>Workarounds: spreadsheets and WhatsApp groups doing a job badly</li><li>Underserved segments: SMEs, regions outside Riyadh</li></ul>`},
  {h:'Founder–market fit',b:`<p>Investors ask "why you?". Domain insight, access to customers, technical ability and staying power matter. An industrial engineer with plant experience has an edge in industrial software and services.</p>`},
  {h:'Saudi tailwinds',b:`<p>Vision 2030 programmes, localisation, digital government, tourism, logistics, fintech regulation (SAMA sandbox) and a large young population create openings. Tailwinds help, but customers still have to pay.</p>`},
  {h:'Score, then test',b:`<p>A scoring matrix forces honest comparison but is only as good as the evidence behind each score. The next step after scoring is always talking to customers.</p>`}],
 quiz:[
  {q:'The strongest start-up ideas usually begin with…',o:['A new technology','A painful, frequent, expensive problem','A large market report','A competitor\'s product'],a:1,w:'Pain drives willingness to pay.'},
  {q:'"Why now?" asks…',o:['Why the founder is in a hurry','What has changed that makes this possible or needed now','When the funding closes','Why investors should hurry'],a:1,w:'Timing: regulation, technology, behaviour.'},
  {q:'Founder–market fit means…',o:['The founder likes the market','The founders have unusual insight or access in this market','The market is large','Low competition'],a:1,w:'Why this team will win.'},
  {q:'A workaround (spreadsheets, WhatsApp groups) signals…',o:['No problem exists','A real problem people already spend effort on','A saturated market','Regulation'],a:1,w:'Effort spent is evidence of pain.'},
  {q:'After scoring ideas, the next step is…',o:['Build the product','Raise money','Talk to customers to test the scores','Hire a team'],a:2,w:'Evidence before investment.'},
  {q:'Vision 2030 tailwinds guarantee success.',o:['True','False'],a:1,w:'Customers must still pay.'}],
 srs:[{q:'Best source of start-up ideas?',a:'Painful, frequent, expensive problems the founders understand from inside.'},{q:'"Why now?"',a:'What changed (technology, regulation, behaviour) that opens the opportunity now.'},{q:'Founder–market fit?',a:'The team\'s unusual insight or access in the market.'},{q:'What does a workaround signal?',a:'People already spend effort on the problem: evidence of pain.'}],
 read:[{t:'How to Get Startup Ideas',s:'Paul Graham',u:'http://paulgraham.com/startupideas.html'},{t:'Why the Lean Start-Up Changes Everything',s:'Harvard Business Review, 2013',u:'https://hbr.org/2013/05/why-the-lean-start-up-changes-everything'},{t:'Opportunity recognition',s:'HBR search',u:HBRS('entrepreneurial opportunity')}]},

{id:'s02',track:'startup',title:'Customer discovery',mins:30,blurb:'Interview customers so you learn the truth, not compliments.',
 lab:{key:'momtest',name:'Mom Test question drill',intro:'Sort eight interview questions into good and bad.'},
 cards:[
  {h:'Get out of the building',b:`<p>Steve Blank: no facts exist inside the building. Customer discovery tests whether the problem exists, who has it, and whether they will pay — before you build.</p>`},
  {h:'The Mom Test',b:`<ul><li>Talk about their life, not your idea.</li><li>Ask about specifics in the past, not opinions about the future.</li><li>Talk less, listen more.</li></ul><p>Even your mother can't lie to you if you ask good questions.</p>`},
  {h:'Signals that matter',b:`<p>Compliments are noise. Real signals: they describe the problem unprompted, they have tried to solve it, they spend money or time on it, and they commit — a meeting with their boss, a pilot, a deposit, an introduction.</p>`},
  {h:'Problem/solution fit',b:`<p>You have it when a defined segment confirms the problem is top-3 for them and reacts strongly to your proposed solution with commitments. Usually 20–40 interviews in.</p>`},
  {h:'In the Gulf',b:`<p>Relationships and introductions matter; politeness norms make honest negative feedback rarer. Ask about past behaviour and look for commitments even more carefully.</p>`}],
 quiz:[
  {q:'Which is a Mom Test–style question?',o:['Would you buy this?','Tell me about the last time this problem happened','Do you like my idea?','How much would you pay?'],a:1,w:'Specific past behaviour.'},
  {q:'The strongest evidence from an interview is…',o:['"Great idea!"','A commitment: pilot, deposit or introduction','A long meeting','A like on social media'],a:1,w:'Commitments cost them something.'},
  {q:'Why avoid pitching during discovery interviews?',o:['It is rude','People start reacting to your idea and being polite instead of describing their reality','It takes too long','Investors dislike it'],a:1,w:'You want their story, not their opinion of yours.'},
  {q:'Problem/solution fit means…',o:['The product is built','A defined segment confirms the problem and commits to your solution','You have revenue','You raised money'],a:1,w:'Evidence before scale.'},
  {q:'A customer says "I would definitely use that". This is…',o:['Strong evidence','A weak signal until backed by commitment','A contract','Irrelevant'],a:1,w:'Future intentions are unreliable.'},
  {q:'Roughly how many interviews to see clear patterns?',o:['2–3','20–40','500','None'],a:1,w:'Patterns appear after dozens.'}],
 srs:[{q:'Three Mom Test rules?',a:'Talk about their life not your idea; ask about specific past behaviour; talk less, listen more.'},{q:'Strong interview signals?',a:'Commitments: time, money, reputation (pilot, deposit, introduction).'},{q:'Problem/solution fit?',a:'Defined segment confirms the problem and commits to the proposed solution.'},{q:'Customer discovery purpose?',a:'Test problem, segment and willingness to pay before building.'}],
 read:[{t:'The Mom Test',s:'Rob Fitzpatrick',u:'https://www.momtestbook.com/'},{t:'Why the Lean Start-Up Changes Everything',s:'Harvard Business Review',n:'Steve Blank',u:'https://hbr.org/2013/05/why-the-lean-start-up-changes-everything'},{t:'Steve Blank\'s blog',s:'steveblank.com',u:'https://steveblank.com/'}]},

{id:'s03',track:'startup',title:'Jobs-to-be-done and the value proposition',mins:30,blurb:'Understand the job customers hire your product to do.',
 lab:{key:'vpc',name:'Value-proposition canvas',intro:'Map jobs, pains and gains against what you offer.'},
 cards:[
  {h:'Jobs to be done',b:`<p>Christensen: customers don't buy products; they "hire" them to get a job done in a particular circumstance. Jobs have functional, emotional and social dimensions.</p>`},
  {h:'The milkshake lesson',b:`<p>Morning commuters hired a milkshake for a boring drive: it lasted long and filled them up. Competing "products" were bananas and bagels, not other milkshakes. Define competition by the job.</p>`},
  {h:'Value-proposition canvas',b:`<p>Customer profile: jobs, pains, gains. Value map: products, pain relievers, gain creators. Fit is when the value map addresses the most important pains and gains.</p>`},
  {h:'Prioritise',b:`<p>Not all pains are equal. Rank by severity and frequency. A product that relieves one extreme pain beats one that addresses ten mild ones.</p>`},
  {h:'B2B buyers have jobs too',b:`<p>In industrial sales, the user (maintenance engineer), buyer (procurement) and decision-maker (plant director) each hire the product for different jobs: fewer failures, lower cost, safer audits.</p>`}],
 quiz:[
  {q:'In JTBD, customers…',o:['Buy features','"Hire" products to get a job done in a circumstance','Prefer cheapest products','Follow advertising'],a:1,w:'Christensen\'s framing.'},
  {q:'The morning milkshake\'s real competitors were…',o:['Other milkshakes','Bananas, bagels and other commute snacks','Coffee machines','Restaurants'],a:1,w:'Competition is defined by the job.'},
  {q:'Which is an emotional dimension of a job?',o:['Fix the pump','Feel confident in front of the plant director','Lower cost','Reduce downtime'],a:1,w:'How they want to feel.'},
  {q:'Fit in the value-proposition canvas means…',o:['Many features','Pain relievers and gain creators match the most important pains and gains','Low price','A big team'],a:1,w:'Focus on what matters most to the customer.'},
  {q:'In B2B, the user and the buyer…',o:['Are always the same','Often hire the product for different jobs','Do not matter','Want the same features'],a:1,w:'Map each role\'s job.'},
  {q:'Better to relieve…',o:['Ten mild pains','One severe, frequent pain','No pains','Only gains'],a:1,w:'Severity and frequency drive value.'}],
 srs:[{q:'Jobs-to-be-done?',a:'Customers hire products to make progress on a job in a specific circumstance.'},{q:'Three job dimensions?',a:'Functional, emotional, social.'},{q:'Value-proposition canvas parts?',a:'Customer: jobs, pains, gains. Value map: products, pain relievers, gain creators.'},{q:'Competition in JTBD?',a:'Anything hired for the same job, not only similar products.'}],
 read:[{t:'Know Your Customers\' Jobs to Be Done',s:'Harvard Business Review, 2016',u:'https://hbr.org/2016/09/know-your-customers-jobs-to-be-done'},{t:'Value Proposition Canvas',s:'Strategyzer',u:'https://www.strategyzer.com/library/the-value-proposition-canvas'},{t:'Marketing Myopia',s:'Harvard Business Review',u:'https://hbr.org/2004/07/marketing-myopia'}]},

{id:'s04',track:'startup',title:'Lean canvas',mins:30,blurb:'A one-page business plan made of testable hypotheses.',
 lab:{key:'leancanvas',name:'Lean canvas builder',intro:'Nine boxes, saved to your profile; copy it into a deck or email.'},
 cards:[
  {h:'Why a canvas',b:`<p>Business plans are written once and ignored. A lean canvas fits on one page, takes 20 minutes, and is updated as you learn. Every box is a hypothesis.</p>`},
  {h:'The nine boxes',b:`<p>Problem · Customer segments · Unique value proposition · Solution · Channels · Revenue streams · Cost structure · Key metrics · Unfair advantage.</p>`},
  {h:'Fill it in order',b:`<p>Start with Customer segments and Problem; then UVP; then Solution; then Channels, Revenue, Costs; Key metrics; Unfair advantage last — and leave it blank if you don't have one yet. Honesty beats decoration.</p>`},
  {h:'Unfair advantage',b:`<p>Something that cannot easily be copied or bought: insider information, a community, a dataset, regulatory approval, the right expert. "First mover" and "passion" are not unfair advantages.</p>`},
  {h:'Riskiest assumption first',b:`<p>Rank the boxes by risk and test the riskiest one next. Early on it is almost always Problem or Customer segment — not Solution.</p>`}],
 quiz:[
  {q:'Which box should usually be filled first?',o:['Unfair advantage','Customer segments and Problem','Revenue','Key metrics'],a:1,w:'Start from the customer.'},
  {q:'Which is a real unfair advantage?',o:['Passion','Being first','A proprietary dataset from local operating conditions','A nice logo'],a:2,w:'Hard to copy or buy.'},
  {q:'A lean canvas is best treated as…',o:['A finished plan','A set of hypotheses to test and update','A legal document','An investor contract'],a:1,w:'It changes as you learn.'},
  {q:'Early-stage riskiest assumption is usually…',o:['The logo','Problem or customer segment','Office location','Payment gateway'],a:1,w:'Do people have the problem?'},
  {q:'Key metrics should…',o:['Be vanity numbers like page views','Measure real progress: activation, retention, revenue','Be secret','Be many'],a:1,w:'Actionable metrics, not vanity.'},
  {q:'If you have no unfair advantage yet, you should…',o:['Invent one','Leave the box blank honestly','Say "first mover"','Skip the canvas'],a:1,w:'It is fine early on.'}],
 srs:[{q:'Lean canvas boxes?',a:'Problem, segments, UVP, solution, channels, revenue, costs, key metrics, unfair advantage.'},{q:'Unfair advantage?',a:'Something that cannot easily be copied or bought.'},{q:'Fill order?',a:'Segments and problem first; unfair advantage last.'},{q:'What to test next?',a:'The riskiest assumption, usually problem or segment early on.'}],
 read:[{t:'Lean Canvas',s:'LEANSTACK (Ash Maurya)',u:'https://www.leanstack.com/lean-canvas'},{t:'Business Model Canvas',s:'Strategyzer',u:'https://www.strategyzer.com/library/the-business-model-canvas'},{t:'Why the Lean Start-Up Changes Everything',s:'Harvard Business Review',u:'https://hbr.org/2013/05/why-the-lean-start-up-changes-everything'}]},

{id:'s05',track:'startup',title:'Market sizing: TAM, SAM, SOM',mins:25,blurb:'Size the market bottom-up so investors believe it.',
 lab:{key:'tam',name:'TAM/SAM/SOM calculator',intro:'A bottom-up sizing for a predictive-maintenance start-up.'},
 cards:[
  {h:'Three circles',b:`<ul><li><b>TAM:</b> total demand if everyone who could buy did.</li><li><b>SAM:</b> the part your product and channels can serve.</li><li><b>SOM:</b> what you can realistically win in a few years.</li></ul>`},
  {h:'Bottom-up beats top-down',b:`<p>"1% of a USD 10bn market" convinces no one. Count customers × price: 8,000 plants × 30 pumps × SAR 1,500. Show every assumption and its source.</p>`},
  {h:'Make SOM credible',b:`<p>Rebuild SOM from your sales capacity: sales reps × meetings per month × conversion × deal size. If it does not match your SOM, one of them is wrong.</p>`},
  {h:'Market growth',b:`<p>Investors like markets that grow on their own. Show the driver: regulation, digitisation, new capacity, population.</p>`},
  {h:'Sources in the Kingdom',b:`<p>GASTAT (General Authority for Statistics), ministry and authority reports, industrial-city data, chambers of commerce, and listed-company reports on Tadawul. Triangulate at least two.</p>`}],
 quiz:[
  {q:'SOM is…',o:['Total market','Serviceable market','The share you can realistically capture','Sales overhead'],a:2,w:'Obtainable market.'},
  {q:'Which sizing is most credible to investors?',o:['Top-down percentage of a huge market','Bottom-up count of customers × price','A guess','Competitor revenue only'],a:1,w:'Transparent assumptions.'},
  {q:'2,000 customers × SAR 6,000 a year = TAM of…',o:['SAR 12m','SAR 1.2m','SAR 120m','SAR 3m'],a:0,w:'2,000 × 6,000 = 12,000,000.'},
  {q:'How to check SOM?',o:['Ask friends','Rebuild it from sales capacity and conversion','Halve TAM','Copy a competitor'],a:1,w:'Bottom-up from the go-to-market plan.'},
  {q:'SAM is smaller than TAM because…',o:['Of taxes','Your product, channels or geography cannot serve everyone','Of competitors only','Of inflation'],a:1,w:'Serviceable = reachable with your model.'},
  {q:'A good source for Saudi statistics is…',o:['Social media','GASTAT and sector authorities','Guessing','Only foreign reports'],a:1,w:'Official data first, triangulated.'}],
 srs:[{q:'TAM/SAM/SOM?',a:'Total, serviceable, obtainable market.'},{q:'Bottom-up sizing?',a:'Number of customers × units × price, with sourced assumptions.'},{q:'Check SOM how?',a:'Rebuild from sales capacity × conversion × deal size.'},{q:'Saudi statistics source?',a:'GASTAT plus sector authorities and listed-company reports.'}],
 read:[{t:'General Authority for Statistics (GASTAT)',s:'Saudi Arabia',u:'https://www.stats.gov.sa/'},{t:'Market sizing',s:'HBR search',u:HBRS('market sizing startup')},{t:'Fermi problem',s:'Wikipedia',u:WIKI('Fermi_problem')}]},

{id:'s06',track:'startup',title:'Business and revenue models',mins:25,blurb:'How the money flows decides almost everything else.',
 lab:{key:'bizmodel',name:'Business-model pattern drill',intro:'Match eight businesses to their revenue model.'},
 cards:[
  {h:'Business model vs revenue model',b:`<p>A business model is how you create, deliver and capture value. The revenue model is the capture part: who pays, for what, how often, at what price.</p>`},
  {h:'Common patterns',b:`<ul><li>Subscription / SaaS</li><li>Marketplace (take rate)</li><li>Transaction fees</li><li>Freemium</li><li>Razor and blade</li><li>Licensing</li><li>Advertising</li><li>Hardware + service</li></ul>`},
  {h:'Each has its own physics',b:`<p>SaaS lives on retention. Marketplaces need liquidity on both sides and fight disintermediation. Freemium needs huge top-of-funnel and good conversion. Hardware needs margins and service attach.</p>`},
  {h:'Recurring revenue',b:`<p>Investors pay more for predictable recurring revenue (subscriptions, contracts) than for one-off project revenue. Consulting-style service businesses are valuable but valued lower.</p>`},
  {h:'Business Model Canvas',b:`<p>Osterwalder's nine blocks: customer segments, value propositions, channels, customer relationships, revenue streams, key resources, key activities, key partners, cost structure. Good for established models; the lean canvas suits early start-ups.</p>`}],
 quiz:[
  {q:'A marketplace typically earns…',o:['Subscriptions only','A take rate on transactions between buyers and sellers','Advertising only','Licences'],a:1,w:'Commission per transaction.'},
  {q:'SaaS success depends most on…',o:['Office design','Retention (low churn)','Number of features','One big customer'],a:1,w:'Recurring revenue compounds only if customers stay.'},
  {q:'Razor and blade means…',o:['Expensive device, cheap consumables','Cheap device, profitable consumables','Free everything','Licences'],a:1,w:'Lock-in through consumables.'},
  {q:'Why do investors value recurring revenue more?',o:['It is larger','It is predictable and compounds','Tax','Fashion'],a:1,w:'Predictability lowers risk.'},
  {q:'Disintermediation threatens…',o:['SaaS','Marketplaces','Hardware','Licensing'],a:1,w:'Buyers and sellers bypass the platform.'},
  {q:'Freemium needs…',o:['Few users','Large top-of-funnel and good conversion to paid','No product','High prices'],a:1,w:'Most free users never pay.'}],
 srs:[{q:'Eight common revenue models?',a:'Subscription/SaaS, marketplace, transaction fee, freemium, razor-blade, licensing, advertising, hardware+service.'},{q:'Marketplace challenges?',a:'Two-sided liquidity and disintermediation.'},{q:'Why recurring revenue?',a:'Predictable, compounding, valued higher.'},{q:'Business Model Canvas blocks?',a:'Segments, value props, channels, relationships, revenue, resources, activities, partners, costs.'}],
 read:[{t:'Business Model Canvas',s:'Strategyzer',u:'https://www.strategyzer.com/library/the-business-model-canvas'},{t:'Reinventing Your Business Model',s:'Harvard Business Review, 2008',u:'https://hbr.org/2008/12/reinventing-your-business-model'},{t:'Business models',s:'HBR search',u:HBRS('business model innovation')}]},

{id:'s07',track:'startup',title:'Unit economics',mins:30,blurb:'Does each customer make money? LTV, CAC and payback.',
 lab:{key:'ltv',name:'LTV / CAC calculator',intro:'Find the lever that makes the unit economics work.'},
 cards:[
  {h:'Unit economics',b:`<p>Profit or loss on one unit — a customer, an order, a delivery — before fixed costs. If units lose money, growth makes losses bigger.</p>`},
  {h:'CAC',b:`<div class="formula">CAC = sales and marketing spend ÷ new customers acquired</div><p>Include salaries of sales staff, not just ads. Separate paid from organic channels.</p>`},
  {h:'LTV',b:`<div class="formula">LTV = ARPU × gross margin ÷ churn rate</div><p>Use gross margin, not revenue. Churn is the biggest driver: 5% monthly churn means a 20-month average life; 2.5% means 40.</p>`},
  {h:'Rules of thumb',b:`<p>LTV/CAC ≥ 3 and CAC payback ≤ 12 months for SaaS-like businesses. Too high a ratio can mean under-investing in growth.</p>`},
  {h:'Contribution per order',b:`<p>For delivery, e-commerce and marketplaces, check contribution per order: price − product cost − delivery − payment − returns − support. Many start-ups discover it is negative only after scaling.</p>`}],
 quiz:[
  {q:'ARPU SAR 200/month, margin 60%, churn 4%. LTV?',o:['SAR 3,000','SAR 5,000','SAR 120','SAR 4,800'],a:0,w:'200 × 0.6 ÷ 0.04 = 3,000.'},
  {q:'LTV 3,000, CAC 1,500. Ratio?',o:['0.5','2','3','4.5'],a:1,w:'Below the 3× rule of thumb.'},
  {q:'Halving churn from 4% to 2%…',o:['Has no effect','Doubles LTV','Halves LTV','Raises CAC'],a:1,w:'Lifetime doubles.'},
  {q:'CAC should include…',o:['Only ad spend','All sales and marketing costs, including salaries','Product costs','Rent only'],a:1,w:'Fully loaded.'},
  {q:'CAC 2,400, monthly gross profit per customer 175. Payback?',o:['about 14 months','2 months','24 months','5 months'],a:0,w:'2,400 ÷ 175 ≈ 13.7.'},
  {q:'If unit economics are negative, growth…',o:['Fixes them automatically','Makes losses bigger','Is irrelevant','Lowers churn'],a:1,w:'Fix the unit first.'}],
 srs:[{q:'LTV formula?',a:'ARPU × gross margin ÷ churn.'},{q:'CAC?',a:'Total sales & marketing spend ÷ new customers.'},{q:'Rules of thumb?',a:'LTV/CAC ≥ 3; payback ≤ 12 months.'},{q:'Biggest LTV lever?',a:'Churn: halving it doubles lifetime value.'}],
 read:[{t:'SaaS Metrics 2.0',s:'For Entrepreneurs (David Skok)',u:'https://www.forentrepreneurs.com/saas-metrics-2/'},{t:'Customer lifetime value',s:'HBR search',u:HBRS('customer lifetime value')},{t:'Unit economics',s:'Wikipedia',u:WIKI('Unit_economics')}]},

{id:'s08',track:'startup',title:'MVP and experiments',mins:30,blurb:'Build the smallest thing that tests the riskiest assumption.',
 lab:{key:'experiment',name:'Experiment card + sample size',intro:'Design a test with a clear pass/fail line, and see how many people you need.'},
 cards:[
  {h:'Build–measure–learn',b:`<p>Eric Ries: the unit of progress is validated learning. Each loop should test a hypothesis as cheaply and quickly as possible.</p>`},
  {h:'MVP types',b:`<ul><li><b>Landing page / smoke test:</b> measure sign-ups or deposits.</li><li><b>Concierge:</b> deliver the service manually.</li><li><b>Wizard of Oz:</b> looks automated, humans behind it.</li><li><b>Single-feature product.</b></li><li><b>Pilot</b> with one paying customer.</li></ul>`},
  {h:'Write the pass line first',b:`<p>"We are right if ≥ 10% of plant managers pay a SAR 500 deposit." Deciding the threshold afterwards invites self-deception.</p>`},
  {h:'Pivot or persevere',b:`<p>If experiments keep missing, change one element of the model: segment, problem, channel, revenue model or technology. A pivot keeps what you learned.</p>`},
  {h:'Statistics with small numbers',b:`<p>Early start-ups rarely have the traffic for statistically significant A/B tests. Look for strong qualitative signals and big effects; use proper tests once traffic grows.</p>`}],
 quiz:[
  {q:'An MVP is…',o:['A cheap version of the final product','The smallest thing that tests the riskiest assumption','A beta release','A prototype for investors'],a:1,w:'Learning, not product.'},
  {q:'A concierge MVP…',o:['Is fully automated','Delivers the service manually to learn','Is a hotel app','Uses AI'],a:1,w:'Do things that don\'t scale.'},
  {q:'Why set the pass threshold before running the test?',o:['Tradition','To avoid rationalising any result as success','Investors require it','To save time'],a:1,w:'Pre-commitment keeps you honest.'},
  {q:'A pivot means…',o:['Giving up','Changing one element of the model based on learning','Raising money','Hiring'],a:1,w:'Structured change.'},
  {q:'Detecting 10% → 15% conversion at 95%/80% needs roughly…',o:['50 per group','about 680 per group','10,000 per group','5 per group'],a:1,w:'Small differences need big samples.'},
  {q:'With little traffic, early start-ups should…',o:['Run many small A/B tests','Look for big effects and strong commitments','Skip testing','Buy traffic only'],a:1,w:'Use signals that need small samples.'}],
 srs:[{q:'Build–measure–learn unit of progress?',a:'Validated learning.'},{q:'Five MVP types?',a:'Smoke test, concierge, Wizard of Oz, single feature, paid pilot.'},{q:'Experiment card fields?',a:'We believe… we will… measure… we are right if…'},{q:'Pivot?',a:'Change one model element (segment, problem, channel, revenue, tech) while keeping learning.'}],
 read:[{t:'The Lean Startup',s:'Eric Ries',u:'https://theleanstartup.com/principles'},{t:'The Discipline of Business Experimentation',s:'Harvard Business Review, 2014',u:'https://hbr.org/2014/12/the-discipline-of-business-experimentation'},{t:'Do Things That Don\'t Scale',s:'Paul Graham',u:'http://paulgraham.com/ds.html'}]},

{id:'s09',track:'startup',title:'Go-to-market',mins:30,blurb:'Channels, funnels and the first hundred customers.',
 lab:{key:'funnel',name:'Funnel model',intro:'See how conversion rates drive customers and CAC.'},
 cards:[
  {h:'Pick a beachhead',b:`<p>Win one narrow segment completely before expanding (Geoffrey Moore's beachhead). For an industrial start-up: one sector, one region, one buyer type.</p>`},
  {h:'Channel–product fit',b:`<p>Price and complexity decide channels: low-price self-serve products need digital channels; high-value B2B needs direct sales, pilots and references. Mismatch is a common cause of failure.</p>`},
  {h:'The funnel',b:`<p>Awareness → interest → sign-up → activation → paid → retained → referral. Measure each conversion; fix the leakiest step first.</p>`},
  {h:'B2B in Saudi Arabia',b:`<p>Expect longer cycles with large enterprises and government: procurement registration, local-content scoring, pilots. Partners (distributors, integrators) can open doors but take margin.</p>`},
  {h:'Founder-led sales',b:`<p>Founders should sell the first customers themselves: it is the fastest way to learn objections and pricing. Hire sales only when the playbook is repeatable.</p>`}],
 quiz:[
  {q:'A beachhead market is…',o:['The largest market','A narrow segment you can dominate first','A tourist market','The last market'],a:1,w:'Focus to win.'},
  {q:'A SAR 50/month self-serve app should mainly use…',o:['Field sales','Digital self-serve channels','Government tenders','Trade fairs only'],a:1,w:'Low price can\'t pay for sales people.'},
  {q:'20,000 visitors, 4% sign up, 40% activate, 20% pay. Paying customers?',o:['64','320','800','160'],a:0,w:'20,000 × 0.04 × 0.4 × 0.2 = 64.'},
  {q:'Fix which funnel step first?',o:['Top always','The leakiest step','The last always','None'],a:1,w:'Biggest gain per effort.'},
  {q:'When should a start-up hire its first sales people?',o:['Day one','When the founders have a repeatable playbook','Never','After Series C'],a:1,w:'Founder-led sales first.'},
  {q:'Selling to government in KSA often requires…',o:['Nothing special','Registration, local-content considerations and pilots','Only a website','A foreign partner always'],a:1,w:'Plan for longer cycles.'}],
 srs:[{q:'Beachhead?',a:'Narrow segment you can win completely first.'},{q:'Channel–product fit?',a:'Channel cost must suit product price and complexity.'},{q:'Funnel stages?',a:'Awareness, interest, sign-up, activation, paid, retained, referral.'},{q:'When to hire sales?',a:'After founder-led sales produce a repeatable playbook.'}],
 read:[{t:'Crossing the Chasm',s:'Geoffrey Moore (summary)',u:WIKI('Crossing_the_Chasm')},{t:'Go-to-market strategy',s:'HBR search',u:HBRS('go-to-market startup')},{t:'Y Combinator Startup Library',s:'Y Combinator',u:'https://www.ycombinator.com/library'}]},

{id:'s10',track:'startup',title:'Financial model and runway',mins:35,blurb:'Burn, runway, and whether you are default alive.',
 lab:{key:'runway',name:'Runway model with hiring plan',intro:'Project cash month by month and extend the runway.'},
 cards:[
  {h:'Burn and runway',b:`<div class="formula">Net burn = cash out − cash in (per month) · Runway = cash ÷ net burn</div><p>Use net burn, but watch gross burn: revenue can disappear faster than costs.</p>`},
  {h:'Default alive or dead',b:`<p>Paul Graham: assuming costs stay as planned and revenue keeps growing at the current rate, will you reach profitability before the money runs out? Know the answer every month.</p>`},
  {h:'Build a simple model',b:`<p>Drivers, not plugs: customers × price; hires × salary; marketing → customers via CAC. Monthly for 24 months. Three scenarios: base, downside, upside.</p>`},
  {h:'Fundraising timing',b:`<p>Raising usually takes 3–6 months or more. Start with 9–12 months of runway left; investors smell desperation.</p>`},
  {h:'Hiring is the big lever',b:`<p>People are most of the cost. Tie hires to milestones (e.g., second sales hire after 10 paying customers) rather than to the calendar.</p>`}],
 quiz:[
  {q:'Cash SAR 2.4m, net burn SAR 200k/month. Runway?',o:['12 months','24 months','6 months','2.4 months'],a:0,w:'2.4m ÷ 200k.'},
  {q:'"Default alive" means…',o:['The company has investors','On current trends it reaches profit before cash runs out','The founders are optimistic','It is profitable today'],a:1,w:'Paul Graham\'s test.'},
  {q:'When to start fundraising?',o:['With 1 month left','With about 9–12 months of runway left','After running out','Never'],a:1,w:'Raising takes time.'},
  {q:'A driver-based model links revenue to…',o:['Guesses','Customers × price, with customers from the funnel','Last year +10%','Competitor revenue'],a:1,w:'Transparent and testable.'},
  {q:'The biggest cost lever in most start-ups is…',o:['Office coffee','Hiring','Software subscriptions','Marketing materials'],a:1,w:'Salaries dominate.'},
  {q:'Net burn vs gross burn?',o:['Same thing','Net = outflows − inflows; gross = total outflows','Gross is smaller','Net ignores revenue'],a:1,w:'Watch both.'}],
 srs:[{q:'Runway?',a:'Cash ÷ monthly net burn.'},{q:'Default alive?',a:'On current trajectory, profitable before cash runs out.'},{q:'When to raise?',a:'With 9–12 months of runway left.'},{q:'Biggest cost lever?',a:'Hiring; tie hires to milestones.'}],
 read:[{t:'Default Alive or Default Dead?',s:'Paul Graham',u:'http://paulgraham.com/aord.html'},{t:'Startup financial modelling',s:'HBR search',u:HBRS('startup cash burn')},{t:'Y Combinator Startup Library',s:'Y Combinator',u:'https://www.ycombinator.com/library'}]},

{id:'s11',track:'startup',title:'Fundraising stages and instruments',mins:30,blurb:'Pre-seed to Series A; SAFEs, convertibles and priced rounds.',
 lab:{key:'valuation',name:'Pre/post-money and SAFE calculator',intro:'Compute ownership and see how a SAFE converts.'},
 cards:[
  {h:'Stages',b:`<p>Pre-seed (founders, friends, angels) → Seed (product–market fit search) → Series A (scale a working model) → B, C… Each stage buys evidence that de-risks the next.</p>`},
  {h:'Pre- and post-money',b:`<div class="formula">Post-money = Pre-money + New investment · Investor % = Investment ÷ Post-money</div>`},
  {h:'SAFEs and convertible notes',b:`<p>Instruments that convert into shares at a future priced round, usually with a valuation <b>cap</b> and/or <b>discount</b>. Quick and cheap, but they stack up dilution founders often underestimate. Notes are debt with interest and maturity; SAFEs are not.</p>`},
  {h:'Who invests',b:`<p>Angels and angel networks, accelerators, VC funds (many in the Kingdom backed by fund-of-funds programmes), corporate VCs, and government funds. Choose investors for value beyond money: network, sector knowledge, follow-on capacity.</p>`},
  {h:'Due diligence',b:`<p>Expect checks on company registration, cap table, contracts, IP ownership, financials and the founders. Clean paperwork from day one saves deals.</p>`}],
 quiz:[
  {q:'Pre-money SAR 12m, investment SAR 3m. Investor %?',o:['25%','20%','15%','33%'],a:1,w:'3 ÷ 15.'},
  {q:'A SAFE converts at…',o:['A fixed date','The next priced round, at the better of cap or discount','Never','The current valuation'],a:1,w:'Cap and/or discount protect early risk.'},
  {q:'A convertible note differs from a SAFE because…',o:['It never converts','It is debt with interest and maturity','It has no cap','It is equity today'],a:1,w:'Notes are debt.'},
  {q:'Seed money is typically used to…',o:['Buy a building','Search for product–market fit','Pay dividends','IPO'],a:1,w:'Find what works.'},
  {q:'Cap SAR 8m vs discounted round price equivalent to SAR 9.6m. SAFE converts at…',o:['SAR 8m','SAR 9.6m','SAR 12m','Average'],a:0,w:'The lower effective valuation.'},
  {q:'Good investors bring…',o:['Only money','Network, expertise and follow-on capacity','Control','Office space'],a:1,w:'Smart money.'}],
 srs:[{q:'Post-money?',a:'Pre-money + investment.'},{q:'Investor ownership?',a:'Investment ÷ post-money.'},{q:'SAFE conversion?',a:'At the next priced round using the better of cap or discount.'},{q:'Note vs SAFE?',a:'Note is debt (interest, maturity); SAFE is not.'}],
 read:[{t:'Y Combinator SAFE documents',s:'Y Combinator',u:'https://www.ycombinator.com/documents'},{t:'Venture capital',s:'HBR search',u:HBRS('venture capital fundraising')},{t:'Saudi Venture Capital Company',s:'SVC',u:'https://svc.com.sa/'}]},

{id:'s12',track:'startup',title:'Cap tables and dilution',mins:30,blurb:'Who owns what after each round — and the option-pool shuffle.',
 lab:{key:'captable',name:'Multi-round cap table',intro:'Model a seed and Series A with an option pool.'},
 cards:[
  {h:'The cap table',b:`<p>A record of who owns what: founders, employees (options), investors, by class of share. Keep it clean and current from day one.</p>`},
  {h:'Dilution',b:`<p>Each round issues new shares, so everyone's percentage falls. Dilution is fine if the company's value rises faster: 60% of a SAR 50m company beats 100% of SAR 2m.</p>`},
  {h:'Option pool',b:`<p>Shares reserved for future employees (often 10–15%). Investors usually require it to be created in the pre-money, so it dilutes founders only — the "option-pool shuffle".</p>`},
  {h:'Vesting',b:`<p>Founder and employee shares typically vest over four years with a one-year cliff, so someone who leaves early does not keep a large stake. Investors will insist on it.</p>`},
  {h:'Co-founder splits',b:`<p>Split based on future contribution and commitment, not just the idea. Equal splits are common but should reflect reality. Put vesting on everyone, including yourself.</p>`}],
 quiz:[
  {q:'Founders own 70% before a round that sells 20% of the post-money. After?',o:['56%','50%','70%','64%'],a:0,w:'70% × 0.8.'},
  {q:'Creating the option pool in the pre-money dilutes…',o:['Only new investors','Only existing holders (founders)','Everyone equally','Nobody'],a:1,w:'The option-pool shuffle.'},
  {q:'A one-year cliff means…',o:['No shares ever','Nothing vests until month 12, then a year\'s worth at once','Shares vest daily from day one','Shares expire'],a:1,w:'Protects against early departures.'},
  {q:'Dilution is acceptable when…',o:['Never','The value of the remaining stake rises','Investors are friends','The pool is small'],a:1,w:'Smaller share of a bigger pie.'},
  {q:'Typical vesting period?',o:['6 months','4 years','10 years','None'],a:1,w:'With a 1-year cliff.'},
  {q:'Co-founder equity should mainly reflect…',o:['Who had the idea','Future contribution and commitment','Age','Who pays for dinner'],a:1,w:'Ideas are cheap; execution is not.'}],
 srs:[{q:'Option-pool shuffle?',a:'Pool created pre-money, diluting only existing holders.'},{q:'Standard vesting?',a:'4 years with a 1-year cliff.'},{q:'Dilution after selling x% of post-money?',a:'Existing % × (1 − x).'},{q:'Co-founder split basis?',a:'Future contribution and commitment, with vesting for all.'}],
 read:[{t:'Cap table',s:'Wikipedia',u:WIKI('Capitalization_table')},{t:'Founder equity and vesting',s:'HBR search',u:HBRS('founder equity split')},{t:'Y Combinator Startup Library',s:'Y Combinator',u:'https://www.ycombinator.com/library'}]},

{id:'s13',track:'startup',title:'Term sheets',mins:30,blurb:'The terms that matter more than the valuation.',
 lab:{key:'waterfall',name:'Liquidation-preference waterfall',intro:'See who gets what at different exit values.'},
 cards:[
  {h:'Economics and control',b:`<p>Term sheets cover <b>economics</b> (valuation, liquidation preference, anti-dilution, option pool) and <b>control</b> (board seats, protective provisions, information rights).</p>`},
  {h:'Liquidation preference',b:`<p>Investors get their money back (1×) before common shareholders in a sale. <b>Non-participating</b>: the larger of the preference or their share. <b>Participating</b>: preference first, then their share of the rest. 1× non-participating is the founder-friendly norm.</p>`},
  {h:'Anti-dilution',b:`<p>Protects investors if a later round is at a lower price. Broad-based weighted average is standard; full ratchet is harsh on founders.</p>`},
  {h:'Board and protective provisions',b:`<p>Who sits on the board decides who controls hiring the CEO, budgets and sales. Protective provisions give investors vetoes on major actions. Keep founder control as long as is reasonable.</p>`},
  {h:'Negotiate the whole package',b:`<p>A high valuation with a 2× participating preference can leave founders with less than a lower valuation with clean terms. Model the waterfall at realistic exit values and get a good lawyer.</p>`}],
 quiz:[
  {q:'1× non-participating preference: investor put in 10, owns 25%, exit 30. Investor gets…',o:['10','7.5','17.5','30'],a:0,w:'Max(10, 7.5) = 10.'},
  {q:'Same but participating. Investor gets…',o:['10','15','7.5','17.5'],a:1,w:'10 + 25% × 20 = 15.'},
  {q:'Which anti-dilution clause is harshest for founders?',o:['Broad-based weighted average','Full ratchet','None','Narrow-based'],a:1,w:'It reprices all earlier shares to the new low price.'},
  {q:'Protective provisions give investors…',o:['Dividends','Veto rights over major decisions','Board chair','Salaries'],a:1,w:'Control terms.'},
  {q:'Preferences matter most in…',o:['Huge exits','Modest exits','IPOs only','Never'],a:1,w:'In huge exits, investors convert to common anyway.'},
  {q:'The founder-friendly market norm is…',o:['3× participating','1× non-participating','No preference ever','2× participating'],a:1,w:'Standard in healthy markets.'}],
 srs:[{q:'Non-participating vs participating?',a:'Non-part: max(preference, pro-rata share). Part: preference + pro-rata share of remainder.'},{q:'Harshest anti-dilution?',a:'Full ratchet.'},{q:'Term-sheet categories?',a:'Economics and control.'},{q:'When do preferences bite?',a:'Modest exits.'}],
 read:[{t:'Venture Deals',s:'Brad Feld & Jason Mendelson',u:'https://www.venturedeals.com/'},{t:'Term sheets',s:'HBR search',u:HBRS('term sheet venture capital')},{t:'Liquidation preference',s:'Wikipedia',u:WIKI('Liquidation_preference')}]},

{id:'s14',track:'startup',title:'The Saudi ecosystem',mins:30,blurb:'Who does what for founders in the Kingdom.',
 lab:{key:'ecosystem',name:'Funding and support navigator',intro:'Build a starting map of bodies relevant to your venture, then check who does what.'},
 cards:[
  {h:'A deliberately built ecosystem',b:`<p>Since 2016 the Kingdom has built an entrepreneurship ecosystem through dedicated authorities, government-backed funds and programmes, alongside a fast-growing private VC and angel community. Programmes evolve quickly: always check the official source.</p>`},
  {h:'Support and finance bodies',b:`<ul><li><b>Monsha'at:</b> the SME authority, front door to many programmes.</li><li><b>Kafalah:</b> loan guarantees for SMEs.</li><li><b>Social Development Bank:</b> financing for small and emerging businesses.</li><li><b>SIDF:</b> industrial project financing.</li></ul>`},
  {h:'Equity and innovation',b:`<ul><li><b>SVC:</b> invests in private-capital funds (VC, PE, venture debt) and co-invests.</li><li><b>RDIA:</b> national research, development and innovation funding.</li><li>University programmes such as KAUST's for deep tech.</li><li>A growing base of private VCs, angels and corporate VCs.</li></ul>`},
  {h:'Licensing and regulation',b:`<p>MISA handles investment licences (including for foreign founders); the Ministry of Commerce handles commercial registration; sector regulators matter for fintech (SAMA sandbox), health, education and telecoms.</p>`},
  {h:'How to use it well',b:`<p>Public programmes are a complement, not a business model. Strong founders use them for non-dilutive capital, credibility and access, while proving customers will pay.</p>`}],
 quiz:[

/* ================= Engineering Refresher labs ================= */
/* generic classification drill */
function classifyLab(el,done,cfg){let html=`<p class="note">${cfg.intro||''}</p>`+cfg.items.map((it,i)=>`<div style="margin:8px 0"><div style="font-size:.93rem">${it[0]}</div><select class="tin" data-c="${i}" style="margin-top:4px"><option value="">— choose —</option>${cfg.cats.map(c=>`<option>${c}</option>`).join('')}</select></div>`).join('')+`<div class="ctl"><button class="sbtn" id="cc">Check</button></div><div id="cm"></div>`;el.innerHTML=html;
 $('#cc',el).onclick=()=>{let n=0;$$('[data-c]',el).forEach(s=>{const it=cfg.items[+s.dataset.c],g=s.value===it[1];if(g)n++;s.style.borderColor=s.value?g?'var(--ok)':'var(--bad)':'';s.title=it[2]||''});const need=cfg.pass||Math.ceil(cfg.items.length*.75);
  $('#cm',el).innerHTML=`<div class="readout ${n>=need?'ok':''}"><b>${n}/${cfg.items.length}.</b> ${cfg.why}</div>${cfg.items.map(it=>`<div class="note">• ${it[0].replace(/<[^>]+>/g,'').slice(0,60)}… → <b>${it[1]}</b>${it[2]?': '+it[2]:''}</div>`).join('')}`;if(n>=need)done()}}

/* e01 — product-process matrix */
LABS.ppm=(el,m,done)=>classifyLab(el,done,{intro:'Match each product to the process type that usually fits its volume and variety.',cats:['Project','Job shop','Batch','Assembly line','Continuous flow'],
 items:[['A desalination plant built once for a client','Project','one-off, huge, at the customer site'],['Custom machined parts for 40 different pump models, 5–50 each','Job shop','high variety, low volume, routing differs per job'],['Bakery producing 12 bread types, each in runs of a few thousand','Batch','moderate variety, runs then changeover'],['Car assembly of one platform at 60 cars per hour','Assembly line','standard product, high volume, paced line'],['Petrochemical cracker producing ethylene','Continuous flow','commodity, very high volume, 24/7'],['Ready-mix concrete, mixed per order in shifts','Batch','discrete orders mixed in batches'],['Satellite assembled for a space agency','Project','one-of-a-kind, long duration'],['Bottled water filling at 30,000 bottles per hour','Continuous flow','near-continuous, highly automated']],
 why:'Volume and variety move together: high variety needs flexible general-purpose equipment; high volume pays for dedicated, automated flow. Mismatches (a job shop making commodity volume) cost money.'});

/* e02 — line simulation: variability and buffers */
function lineSim(n,means,cv,buf,seed){const r=RNG(seed),K=means.length;const nrm=()=>{let u=0,v=0;while(!u)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
 const S=Array.from({length:K},()=>new Float64Array(n)),D=Array.from({length:K},()=>new Float64Array(n));
 for(let j=0;j<n;j++)for(let i=0;i<K;i++){const s=Math.max(i?D[i-1][j]:0,j?D[i][j-1]:0);const p=Math.max(.1*means[i],means[i]*(1+cv*nrm()));S[i][j]=s;let d=s+p;if(i<K-1&&j-buf-1>=0)d=Math.max(d,S[i+1][j-buf-1]);D[i][j]=d}
 return n/D[K-1][n-1]}
LABS.linesim=(el,m,done)=>calcLab(el,m,done,{inputs:[['t1','Station 1 mean time (s)',58],['t2','Station 2 mean time (s)',60],['t3','Station 3 mean time (s)',59],['cv','Variability (CV of time, %)',40],['b','Buffer slots between stations',0]],
 compute:v=>{const means=[v.t1,v.t2,v.t3].map(x=>Math.max(1,x));const bn=Math.max(...means),ideal=3600/bn;const th=lineSim(2000,means,Math.max(0,v.cv)/100,Math.max(0,Math.round(v.b)),7)*3600;const ratio=th/ideal;
  const curve=[0,1,2,3,5,8].map(b=>[b,lineSim(1500,means,Math.max(0,v.cv)/100,b,7)*3600/ideal*100]);
  return{out:{ratio},html:`<div class="grid g3"><div class="stat"><small>Bottleneck capacity</small><b>${fmt(ideal,1)} /hr</b></div><div class="stat"><small>Simulated throughput</small><b>${fmt(th,1)} /hr</b></div><div class="stat"><small>Share of bottleneck rate</small><b>${pct(ratio)}</b></div></div>${plotXY({x0:0,x1:8,y0:Math.min(...curve.map(c=>c[1]))-5,y1:100,h:200,fx:t=>fmt(t),fy:t=>fmt(t)+'%',series:[{pts:curve,l:'throughput vs buffer'}],vlines:[[Math.min(8,v.b),'var(--navy2)','you']],xl:'buffer slots'})}<p class="note">2,000 units simulated with random processing times. Without buffers, a slow cycle at one station blocks or starves its neighbours.</p>`}},
 challenge:{text:'This line is well balanced, which makes it fragile. With 40% variability, find the <b>smallest buffer</b> that gets throughput to <b>95% or more</b> of the bottleneck rate.',test:(v,o)=>o.ratio>=.95&&v.cv>=40,why:'Variability plus tight coupling destroys capacity. Buffers (or less variability: standard work, TPM) protect the bottleneck. Lean reduces variability first so it can then remove buffers.'}});

/* e03 — line balancing with RPW */
const LB={tasks:{A:[45,''],B:[11,'A'],C:[9,'B'],D:[50,''],E:[15,'D'],F:[12,'C'],G:[12,'C'],H:[12,'E'],I:[12,'E'],J:[8,'FGHI']},takt:60};
function rpw(){const T=LB.tasks,ks=Object.keys(T);const succ=k=>{const s=new Set();const go=x=>ks.forEach(y=>{if(T[y][1].includes(x)&&!s.has(y)){s.add(y);go(y)}});go(k);return s};const w={};ks.forEach(k=>{w[k]=T[k][0]+[...succ(k)].reduce((a,y)=>a+T[y][0],0)});
 const order=ks.slice().sort((a,b)=>w[b]-w[a]);const asg={},done=new Set();let st=1,load=0;while(done.size<ks.length){const c=order.find(k=>!done.has(k)&&[...T[k][1]].every(p=>done.has(p))&&load+T[k][0]<=LB.takt);if(c){asg[c]=st;load+=T[c][0];done.add(c)}else{st++;load=0}}return{asg,w}}
LABS.balance=(el,m,done)=>{const T=LB.tasks,ks=Object.keys(T),tot=ks.reduce((a,k)=>a+T[k][0],0),nmin=Math.ceil(tot/LB.takt);const C=CUST('lb');C.a=C.a||{};
 const draw=()=>{el.innerHTML=`<p class="note">Demand 480 units per 8-hour shift → <b>takt time ${LB.takt} s</b>. Total work content ${tot} s → theoretical minimum <b>${nmin} stations</b>. Assign each task to a station without breaking precedence or exceeding takt.</p><div class="tablewrap"><table class="t" style="min-width:420px"><tr><th>Task</th><th>Time (s)</th><th>Must follow</th><th>Station</th></tr>${ks.map(k=>`<tr><td><b>${k}</b></td><td>${T[k][0]}</td><td>${T[k][1].split('').join(', ')||'—'}</td><td><select class="tin" data-k="${k}" style="padding:4px 6px;max-width:90px"><option value="">—</option>${[1,2,3,4,5,6].map(s=>`<option ${C.a[k]==s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div><div class="ctl"><button class="sbtn" id="ck">Check balance</button><button class="sbtn alt" id="rp">Show RPW heuristic</button></div><div id="out"></div>`;
  $$('[data-k]',el).forEach(s=>s.onchange=()=>{C.a[s.dataset.k]=s.value?+s.value:undefined;save()});
  $('#ck',el).onclick=()=>{const a=C.a;const miss=ks.filter(k=>!a[k]);if(miss.length){$('#out',el).innerHTML=`<div class="readout bad">Assign every task (missing: ${miss.join(', ')}).</div>`;return}const errs=[];ks.forEach(k=>[...T[k][1]].forEach(p=>{if(a[p]>a[k])errs.push(`${k} is before its predecessor ${p}`)}));const ns=Math.max(...ks.map(k=>a[k]));const loads=Array.from({length:ns},(_,i)=>ks.filter(k=>a[k]===i+1).reduce((s,k)=>s+T[k][0],0));loads.forEach((l,i)=>{if(l>LB.takt)errs.push(`Station ${i+1} has ${l} s > takt`)});const used=loads.filter(l=>l>0).length,eff=tot/(used*LB.takt);
   $('#out',el).innerHTML=`${bars(loads.map((l,i)=>({l:'St '+(i+1),v:l,c:l>LB.takt?'var(--bad)':'var(--gold2)'})),{h:180,f:x=>x+'s'})}<div class="readout ${errs.length?'bad':'ok'}">${errs.length?errs.join('<br>'):`<b>Valid balance: ${used} stations, efficiency ${pct(eff)}, balance delay ${pct(1-eff)}.</b> ${used<=nmin?'You hit the theoretical minimum.':'Can you do it with '+nmin+'?'}`}</div>`;if(!errs.length&&used<=nmin+1)done()};
  $('#rp',el).onclick=()=>{const {asg,w}=rpw();$('#out',el).innerHTML=`<div class="model"><b>Ranked positional weight:</b> weight = task time + time of all tasks that follow it. Assign in descending weight, respecting precedence and takt.<br>${ks.slice().sort((a,b)=>w[b]-w[a]).map(k=>`${k} (${w[k]}) → station ${asg[k]}`).join(' · ')}</div>`}};draw()};

/* e04 — value-stream map calculator */
LABS.vsm=(el,m,done)=>calcLab(el,m,done,{inputs:[['dd','Daily customer demand (units)',400],['i1','Raw material stock (units)',4000],['c1','Stamping cycle time (s)',30],['i2','WIP after stamping (units)',2400],['c2','Welding cycle time (s)',45],['i3','WIP after welding (units)',1600],['c3','Assembly cycle time (s)',55],['i4','Finished goods (units)',1200]],
 compute:v=>{const inv=[v.i1,v.i2,v.i3,v.i4],lt=inv.reduce((a,b)=>a+b/v.dd,0),va=v.c1+v.c2+v.c3,pce=va/(lt*8*3600);
  return{out:{lt,pce},html:`<div class="row" style="gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:6px 0">${inv.map((x,i)=>`<div style="text-align:center;min-width:64px"><div style="font-size:1.4rem;color:var(--gold)">▲</div><small>${fmt(x/v.dd,1)} days</small></div>${i<3?`<div class="stat" style="min-width:90px;text-align:center;padding:8px"><b style="font-size:1rem">${['Stamping','Welding','Assembly'][i]}</b><small>${[v.c1,v.c2,v.c3][i]} s</small></div>`:''}`).join('')}</div><div class="grid g3"><div class="stat"><small>Production lead time</small><b>${fmt(lt,1)} days</b></div><div class="stat"><small>Value-added time</small><b>${fmt(va)} s</b></div><div class="stat"><small>Process cycle efficiency</small><b>${(pce*100).toFixed(3)}%</b><small>(8-hour working days)</small></div></div><p class="note">Lead time = Σ inventory ÷ daily demand. Value is added for seconds; parts wait for days.</p>`}},
 challenge:{text:'Cut production lead time to <b>10 days or less</b> by reducing inventory. Which buffer would you attack first, and why?',test:(v,o)=>o.lt<=10,why:'Inventory hides problems (breakdowns, quality, long changeovers). Lower it step by step and fix what surfaces — the future-state map is a plan for exactly that.'}});

/* e05 — kanban and SMED */
LABS.kanban=(el,m,done)=>calcLab(el,m,done,{inputs:[['d','Demand (units/hour)',120],['l','Replenishment lead time (hours)',4],['a','Safety factor (%)',10],['c','Units per container',50],['co','Changeover time (minutes)',90],['n','Changeovers per day',3],['ext','Share of changeover that can be done while running (%)',40]],
 compute:v=>{const k=v.d*v.l*(1+v.a/100)/v.c,kr=Math.ceil(k),saved=v.co*v.ext/100*v.n;
  return{out:{kr},html:`<div class="grid g2"><div class="stat"><div class="eyebrow">Kanban</div>${kv([['Cards needed (exact)',fmt(k,2)],['Cards to issue',fmt(kr),1],['Max inventory in loop',fmt(kr*v.c)+' units']])}<div class="formula">N = D × L × (1 + α) ÷ C</div></div><div class="stat"><div class="eyebrow">SMED</div>${kv([['Changeover now',v.co+' min'],['After converting external work',fmt(v.co*(1-v.ext/100))+' min'],['Production time released per day',fmt(saved)+' min',1]])}<p class="note">Internal setup stops the machine; external setup can be done while it runs. Step 1 of SMED is separating them.</p></div></div>`}},
 challenge:{text:'With the current inputs, how many <b>kanban cards</b> should be issued?',ask:{ans:(v,o)=>o.kr,tol:0,dp:0,unit:'cards',why:()=>'Always round up. Then reduce cards over time: each card removed lowers inventory and exposes the next problem to solve.'}}});

/* e06 — OEE */
LABS.oee=(el,m,done)=>calcLab(el,m,done,{inputs:[['pt','Planned production time (min)',420],['dt','Downtime (min)',60],['ict','Ideal cycle time (s/unit)',30],['tc','Total units produced',620],['gc','Good units',590]],
 compute:v=>{const rt=v.pt-v.dt,A=rt/v.pt,Pf=v.ict*v.tc/60/rt,Q=v.gc/v.tc,o=A*Pf*Q;const lossA=v.dt,lossP=rt-v.ict*v.tc/60,lossQ=(v.tc-v.gc)*v.ict/60;
  return{out:{o},html:`<div class="grid g4 g2m"><div class="stat"><small>Availability</small><b>${pct(A)}</b></div><div class="stat"><small>Performance</small><b>${pct(Pf)}</b></div><div class="stat"><small>Quality</small><b>${pct(Q)}</b></div><div class="stat"><small>OEE</small><b>${pct(o)}</b></div></div>${bars([{l:'Planned',v:v.pt,c:'var(--navy2)'},{l:'Downtime',v:-lossA,c:'var(--bad)'},{l:'Speed loss',v:-lossP,c:'var(--bad)'},{l:'Quality loss',v:-lossQ,c:'var(--bad)'},{l:'Fully productive',v:v.gc*v.ict/60,c:'var(--ok)'}],{h:200,f:x=>fmt(x)+'m'})}<p class="note">Loss waterfall in minutes. ${Pf>1?'<b>Performance above 100% means the ideal cycle time is wrong.</b>':''}</p>`}},
 challenge:{text:'Reach <b>OEE of 75%</b> without changing planned time or the ideal cycle time. First try cutting only downtime — and notice what happens.',test:(v,o,v0)=>o.o>=.75&&v.pt===v0.pt&&v.ict===v0.ict&&v.gc<=v.tc,why:'OEE = good units × ideal cycle ÷ planned time. Cutting downtime alone just turns the lost minutes into a performance loss; OEE only rises when the recovered time produces more good parts.'}});

/* e07 — process capability */
LABS.cpk=(el,m,done)=>calcLab(el,m,done,{inputs:[['lsl','Lower spec limit (mm)',9.90,.01],['usl','Upper spec limit (mm)',10.10,.01],['mu','Process mean (mm)',10.03,.005],['sd','Process standard deviation (mm)',.025,.001]],
 compute:v=>{const cp=(v.usl-v.lsl)/(6*v.sd),cpk=Math.min(v.usl-v.mu,v.mu-v.lsl)/(3*v.sd),out=(1-ncdf((v.usl-v.mu)/v.sd))+ncdf((v.lsl-v.mu)/v.sd),ppm=out*1e6;const x0=Math.min(v.lsl,v.mu-4*v.sd)-v.sd,x1=Math.max(v.usl,v.mu+4*v.sd)+v.sd;const pts=Array.from({length:81},(_,i)=>{const x=x0+(x1-x0)*i/80;return[x,Math.exp(-(((x-v.mu)/v.sd)**2)/2)]});
  return{out:{cpk},html:`<div class="grid g4 g2m"><div class="stat"><small>Cp</small><b>${fmt(cp,2)}</b></div><div class="stat"><small>Cpk</small><b>${fmt(cpk,2)}</b></div><div class="stat"><small>Out of spec</small><b>${fmt(ppm,ppm<10?1:0)} ppm</b></div><div class="stat"><small>Sigma level (short-term)</small><b>${fmt(3*cpk,1)}σ</b></div></div>${plotXY({x0,x1,y0:0,y1:1.1,h:190,fx:t=>t.toFixed(2),fy:()=>'',series:[{pts}],vlines:[[v.lsl,'var(--bad)','LSL'],[v.usl,'var(--bad)','USL'],[v.mu,'var(--navy2)','mean']]})}<div class="formula">Cp = (USL − LSL) ÷ 6σ · Cpk = min(USL − μ, μ − LSL) ÷ 3σ</div>`}},
 challenge:{text:'The customer requires <b>Cpk ≥ 1.33</b>. Reach it. Is centring the process or reducing variation the cheaper first move here?',test:(v,o,v0)=>o.cpk>=1.33&&v.lsl===v0.lsl&&v.usl===v0.usl,why:'Centring (Cp vs Cpk gap) is usually a quick adjustment; reducing σ needs root-cause work. Check Cp first: if Cp is already ≥ 1.33, just centre.'}});

/* e08 — SPC X-bar / R */
LABS.spc=(el,m,done)=>{let seed=Date.now()%1e9;const run=()=>{const r=RNG(seed),nrm=()=>{let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())};const k=12+Math.floor(r()*8),sh=.9;const sub=Array.from({length:25},(_,i)=>Array.from({length:5},()=>50+nrm()*1+(i>=k?sh*1.4:0)));
  const xb=sub.map(s=>s.reduce((a,b)=>a+b,0)/5),R=sub.map(s=>Math.max(...s)-Math.min(...s));const base=xb.slice(0,10),rb=R.slice(0,10);const X=base.reduce((a,b)=>a+b,0)/10,Rb=rb.reduce((a,b)=>a+b,0)/10;const ucl=X+.577*Rb,lcl=X-.577*Rb;
  let first=-1;for(let i=0;i<25&&first<0;i++){if(xb[i]>ucl||xb[i]<lcl)first=i+1;else if(i>=6){const w=xb.slice(i-6,i+1);if(w.every(x=>x>X)||w.every(x=>x<X))first=i+1}}
  el.innerHTML=`<p class="note">25 subgroups of 5 shaft diameters. Limits are set from the first 10 subgroups (A₂ = 0.577 for n = 5). Find the <b>first subgroup</b> that signals the process is out of control: a point outside the limits, or 7 in a row on one side of the centre line.</p>${plotXY({x0:1,x1:25,y0:Math.min(lcl,...xb)-.3,y1:Math.max(ucl,...xb)+.3,h:230,fx:t=>fmt(t),fy:t=>t.toFixed(1),series:[{pts:xb.map((x,i)=>[i+1,x]),c:'var(--navy2)'},{pts:[[1,ucl],[25,ucl]],c:'var(--bad)',dash:1,l:'UCL'},{pts:[[1,X],[25,X]],c:'var(--mut)',dash:1,l:'CL'},{pts:[[1,lcl],[25,lcl]],c:'var(--bad)',dash:1,l:'LCL'}],dots:xb.map((x,i)=>[i+1,x,'var(--gold2)',3.5])})}<p class="note">X̄ chart · UCL ${ucl.toFixed(2)} · CL ${X.toFixed(2)} · LCL ${lcl.toFixed(2)} · R̄ ${Rb.toFixed(2)}</p><div class="row"><input class="tin" id="sg" type="number" style="max-width:120px" placeholder="subgroup #"><button class="sbtn" id="sc">Check</button><button class="sbtn alt" id="nw">New data</button></div><div id="sm"></div>`;
  $('#nw',el).onclick=()=>{seed++;run()};$('#sc',el).onclick=()=>{const g=+$('#sg',el).value;const ok=first>0&&g===first;$('#sm',el).innerHTML=`<div class="readout ${ok?'ok':'bad'}">${first<0?'No signal in this sample — press New data.':ok?`<b>Correct: subgroup ${first}.</b> The shift actually began at subgroup ${k+1}. Control charts separate special causes (find and fix) from common-cause noise (do not tamper).`:`<b>Not quite: the first signal is subgroup ${first}.</b> Check both rules: beyond a limit, and 7 consecutive points on one side.`}</div>`;if(ok)done()}};run()};

/* e09 — FMEA */
LABS.fmea=(el,m,done)=>{const C=CUST('fmea');if(!C.r)C.r=[['Seal leaks under pressure','Wrong seal material',8,5,6],['Shaft misalignment','Assembly fixture worn',7,4,5],['Impeller cracks','Casting porosity',9,3,7],['Bearing overheats','Insufficient grease',6,6,4],['Wrong part label','Manual labelling',4,5,3]];
 const draw=()=>{const rows=C.r.map((r,i)=>({r,i,rpn:r[2]*r[3]*r[4]})).sort((a,b)=>b.rpn-a.rpn);const mx=rows[0].rpn;
  el.innerHTML=`<p class="note">Pump-assembly FMEA. Rate Severity, Occurrence and Detection from 1 to 10 (10 = worst; for Detection, 10 = almost impossible to detect). RPN = S × O × D. Propose actions by lowering O (prevention) or D (detection) — severity rarely changes without a redesign.</p><div class="tablewrap"><table class="t" style="min-width:560px"><tr><th>Failure mode</th><th>Cause</th><th>S</th><th>O</th><th>D</th><th>RPN</th></tr>${rows.map(({r,i,rpn})=>`<tr><td>${r[0]}</td><td>${r[1]}</td>${[2,3,4].map(j=>`<td><input class="tin" type="number" min="1" max="10" data-i="${i}" data-j="${j}" value="${r[j]}" style="padding:4px;max-width:58px"></td>`).join('')}<td><b style="color:${rpn>=150?'var(--bad)':rpn>=100?'var(--gold)':'var(--ok)'}">${rpn}</b></td></tr>`).join('')}</table></div><div class="readout ${mx<100?'ok':''}">Highest RPN: <b>${mx}</b>. ${mx<100?'All modes below 100.':'Bring every mode below 100 — and note the severity-9 item: many companies act on high severity regardless of RPN.'}</div>`;
  $$('input[data-i]',el).forEach(x=>x.onchange=()=>{C.r[+x.dataset.i][+x.dataset.j]=Math.max(1,Math.min(10,+x.value||1));save();draw();const mx2=Math.max(...C.r.map(r=>r[2]*r[3]*r[4]));if(mx2<100)done()})};draw()};

/* e10 — forecasting */
const FD=[880,940,860,960,900,1000,930,1040,960,1060,990,1090];
LABS.forecast=(el,m,done)=>calcLab(el,m,done,{inputs:[['n','Moving average periods',3],['al','Exponential smoothing α (0–1)',.3,.05]],
 compute:v=>{const n=Math.max(1,Math.min(6,Math.round(v.n))),a=Math.max(0,Math.min(1,v.al));const ma=FD.map((_,t)=>t>=n?FD.slice(t-n,t).reduce((x,y)=>x+y,0)/n:null);const es=[];es[0]=FD[0];for(let t=1;t<FD.length;t++)es[t]=a*FD[t-1]+(1-a)*es[t-1];
  const err=f=>{let ad=0,ap=0,c=0;FD.forEach((d,t)=>{if(t>=n&&f[t]!=null){ad+=Math.abs(d-f[t]);ap+=Math.abs(d-f[t])/d;c++}});return{mad:ad/c,mape:ap/c*100}};const e1=err(ma),e2=err(es);
  let best=0,bm=1e9;for(let x=0;x<=100;x++){const s=[FD[0]];for(let t=1;t<FD.length;t++)s[t]=x/100*FD[t-1]+(1-x/100)*s[t-1];const e=err(s).mape;if(e<bm){bm=e;best=x/100}}
  return{out:{best},html:`${plotXY({x0:1,x1:12,y0:700,y1:1300,h:210,fx:t=>['J','F','M','A','M','J','J','A','S','O','N','D'][Math.round(t)-1]||'',series:[{pts:FD.map((d,t)=>[t+1,d]),c:'var(--navy2)',l:'demand'},{pts:ma.map((f,t)=>f==null?null:[t+1,f]).filter(Boolean),c:'var(--mut)',dash:1,l:'MA'},{pts:es.map((f,t)=>[t+1,f]),c:'var(--gold2)',l:'ES'}]})}<div class="tablewrap"><table class="t"><tr><th>Method</th><th>MAD</th><th>MAPE</th></tr><tr><td>${n}-period moving average</td><td>${fmt(e1.mad,1)}</td><td>${fmt(e1.mape,1)}%</td></tr><tr><td>Exponential smoothing, α = ${a}</td><td>${fmt(e2.mad,1)}</td><td>${fmt(e2.mape,1)}%</td></tr></table></div><p class="note">Demand has an upward trend plus noise. Simple smoothing always lags a trend (look at the second half); Holt's method adds a trend term, and Winters adds seasonality such as Ramadan peaks.</p>`}},
 challenge:{text:'Tune α to <b>minimise MAPE</b> for exponential smoothing (within ±0.05 of the best).',test:(v,o)=>Math.abs(v.al-o.best)<=.05,why:'A high α reacts fast but chases noise; a low α is stable but slow. The "best" α on history is a starting point — check it on new data before trusting it.'}});

/* e11 — EOQ, safety stock, reorder point */
LABS.eoq=(el,m,done)=>calcLab(el,m,done,{inputs:[['D','Annual demand (units)',24000],['S','Cost per order (SAR)',600],['H','Holding cost per unit per year (SAR)',12],['L','Lead time (days)',10],['sd','Std dev of daily demand (units)',18],['sl','Service level (%)',95,.5],['q','Your order quantity',2000]],
 compute:v=>{const eoq=Math.sqrt(2*v.D*v.S/v.H),d=v.D/360;const zt=[[90,1.28],[95,1.645],[97.5,1.96],[99,2.33],[99.5,2.58],[99.9,3.09]];let z=1.645;zt.forEach(([p,zz])=>{if(v.sl>=p)z=zz});const ss=z*v.sd*Math.sqrt(v.L),rop=d*v.L+ss;const tc=q=>v.D/q*v.S+q/2*v.H;const q0=Math.max(100,eoq*.2),q1=eoq*2.5;const pts=Array.from({length:40},(_,i)=>{const q=q0+(q1-q0)*i/39;return[q,tc(q)]});
  return{out:{rop,eoq},html:`<div class="grid g4 g2m"><div class="stat"><small>EOQ</small><b>${fmt(eoq)}</b></div><div class="stat"><small>Safety stock (z = ${z})</small><b>${fmt(ss)}</b></div><div class="stat"><small>Reorder point</small><b>${fmt(rop)}</b></div><div class="stat"><small>Annual cost at your Q</small><b>SAR ${fmt(tc(v.q))}</b><small>vs ${fmt(tc(eoq))} at EOQ</small></div></div>${plotXY({x0:q0,x1:q1,y0:0,y1:Math.max(...pts.map(p=>p[1])),h:200,fx:t=>fmt(t),series:[{pts,l:'ordering + holding'}],vlines:[[eoq,'var(--ok)','EOQ'],[Math.min(q1,Math.max(q0,v.q)),'var(--navy2)','you']],xl:'order quantity'})}<div class="formula">EOQ = √(2DS ÷ H) · Safety stock = z × σ_d × √L · ROP = d × L + SS (360-day year)</div>`}},
 challenge:{text:'What is the <b>reorder point</b> at the current inputs (units)?',ask:{ans:(v,o)=>o.rop,tol:3,dp:0,unit:'units',why:()=>'Notice how flat the total-cost curve is near EOQ: being 20% off barely matters. Safety stock, by contrast, grows fast as service level approaches 100%.'}}});

/* e12 — bullwhip (simplified beer game) */
function beer(beta,share,ss){const W=30,L=2,T=4;const dem=t=>t<5?4:8;const tiers=Array.from({length:T},()=>({inv:12,back:0,pipe:Array(L).fill(4),fc:4}));const orders=Array.from({length:T},()=>[]);
 for(let t=0;t<W;t++){let incoming=dem(t);for(let k=0;k<T;k++){const s=tiers[k];s.inv+=s.pipe.shift();const need=incoming+s.back,ship=Math.min(s.inv,need);s.inv-=ship;s.back=need-ship;const sig=share?dem(t):incoming;s.fc=.4*sig+.6*s.fc;const ip=s.inv-s.back+s.pipe.reduce((a,b)=>a+b,0);const tgt=s.fc*(L+1)+ss;const o=Math.max(0,s.fc+beta*(tgt-ip));orders[k].push(o);s.pipe.push(o);incoming=o}}
 const vr=a=>{const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)};const cust=Array.from({length:W},(_,t)=>dem(t));return{orders,cust,amp:vr(orders[3])/vr(cust)}}
LABS.bullwhip=(el,m,done)=>calcLab(el,m,done,{inputs:[['beta','Inventory correction speed β (0–1)',.8,.05],['share','Share end-customer demand upstream? (1 = yes, 0 = no)',0],['ss','Safety stock target (units)',4]],
 compute:v=>{const r=beer(Math.max(0,Math.min(1,v.beta)),v.share>=1,v.ss);const names=['Retailer','Wholesaler','Distributor','Factory'],cols=['#7C8BA3','#5B7DB1','var(--navy2)','var(--bad)'];const mx=Math.max(...r.orders.flat(),8);
  return{out:{amp:r.amp},html:`${plotXY({x0:0,x1:29,y0:0,y1:mx*1.05,h:230,fx:t=>'w'+fmt(t),series:[{pts:r.cust.map((d,t)=>[t,d]),c:'var(--gold2)',l:'customers'},...r.orders.map((o,k)=>({pts:o.map((x,t)=>[t,x]),c:cols[k],l:k===3?'factory':''}))]})}<p class="note">Customer demand steps from 4 to 8 in week 5. Each tier forecasts from the orders it sees and corrects its inventory with speed β; lead time 2 weeks.</p><div class="grid g2"><div class="stat"><small>Factory order swings ÷ customer demand swings (std dev)</small><b>${fmt(r.amp,1)}×</b></div><div class="stat"><small>Peak factory order</small><b>${fmt(Math.max(...r.orders[3]),1)}</b><small>vs customer peak 8</small></div></div>`}},
 challenge:{text:'Bring factory order amplification <b>below 2.2×</b>. You will need both levers: slower correction and sharing end-customer demand.',test:(v,o)=>o.amp<2.2,why:'Bullwhip comes from each tier reacting to its neighbour\'s orders, with delays and over-correction. Sharing end-customer data, smoothing orders and shortening lead times are the cures.'}});

/* e13 — linear programming (2 variables) */
LABS.lp=(el,m,done)=>calcLab(el,m,done,{inputs:[['p1','Profit per chair (SAR)',70],['p2','Profit per table (SAR)',120],['a1','Carpentry h per chair',2],['b1','Carpentry h per table',4],['r1','Carpentry hours available',400],['a2','Finishing h per chair',2],['b2','Finishing h per table',2],['r2','Finishing hours available',240],['mx','Max tables (market)',80]],
 compute:v=>{const cons=[[v.a1,v.b1,v.r1],[v.a2,v.b2,v.r2],[0,1,v.mx],[-1,0,0],[0,-1,0]];const pts=[];for(let i=0;i<cons.length;i++)for(let j=i+1;j<cons.length;j++){const [a,b,c]=cons[i],[d,e,f]=cons[j];const det=a*e-b*d;if(Math.abs(det)<1e-9)continue;const x=(c*e-b*f)/det,y=(a*f-c*d)/det;if(cons.every(([p,q,r])=>p*x+q*y<=r+1e-6))pts.push([x,y])}
  const uniq=pts.filter((p,i)=>pts.findIndex(q=>Math.abs(q[0]-p[0])<1e-6&&Math.abs(q[1]-p[1])<1e-6)===i);const cx=uniq.reduce((a,p)=>a+p[0],0)/uniq.length,cy=uniq.reduce((a,p)=>a+p[1],0)/uniq.length;uniq.sort((p,q)=>Math.atan2(p[1]-cy,p[0]-cx)-Math.atan2(q[1]-cy,q[0]-cx));
  let best=null,bz=-1;uniq.forEach(p=>{const z=v.p1*p[0]+v.p2*p[1];if(z>bz){bz=z;best=p}});const X1=Math.max(...uniq.map(p=>p[0]),1)*1.2,Y1=Math.max(...uniq.map(p=>p[1]),1)*1.3;
  const W=560,H=260,L=46,B=30;const sx=x=>L+x/X1*(W-L-12),sy=y=>H-B-y/Y1*(H-B-12);
  const svg=`<div class="chart"><svg viewBox="0 0 ${W} ${H}"><polygon points="${uniq.map(p=>sx(p[0])+','+sy(p[1])).join(' ')}" fill="var(--goldsoft)" stroke="var(--gold2)" stroke-width="2"/>${uniq.map(p=>`<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="4" fill="${p===best?'var(--ok)':'var(--navy2)'}"/><text x="${sx(p[0])+6}" y="${sy(p[1])-6}" style="fill:var(--ink)">(${fmt(p[0])}, ${fmt(p[1])})</text>`).join('')}<text x="${W-12}" y="${H-8}" text-anchor="end">chairs →</text><text x="${L}" y="12">tables ↑</text></svg></div>`;
  return{out:{bz},html:svg+`<div class="readout">Corner points of the feasible region are marked. The optimum of a linear programme is always at a corner (or along an edge).</div><details><summary class="note">Show the optimum</summary><p>Best corner: <b>${fmt(best[0])} chairs, ${fmt(best[1])} tables</b>, profit <b>SAR ${fmt(bz)}</b>.</p></details>`}},
 challenge:{text:'Evaluate the corner points yourself: what is the <b>maximum profit</b> (SAR)?',ask:{ans:(v,o)=>o.bz,tol:1,dp:0,unit:'SAR',why:()=>'Shadow prices tell you what one more hour of a binding constraint is worth — the starting point for "should we add a finishing shift?" questions.'}}});

/* e14 — M/M/c queue + Johnson's rule */
function mmc(l,mu,c){const a=l/mu,rho=a/c;if(rho>=1)return{rho,wq:Infinity};let s=0,f=1;for(let k=0;k<c;k++){if(k>0)f*=k;s+=Math.pow(a,k)/f}const fc=f*(c>0?c:1);const top=Math.pow(a,c)/fc/(1-rho);const p0=1/(s+top);const lq=p0*Math.pow(a,c)*rho/(fc*(1-rho)**2);return{rho,p0,lq,wq:lq/l,pw:top*p0}}
LABS.queue=(el,m,done)=>calcLab(el,m,done,{inputs:[['l','Arrivals per hour (λ)',50],['mu','Service rate per server per hour (μ)',12],['c','Number of servers (c)',5],['tg','Target average wait (minutes)',2,.5]],
 compute:v=>{const c=Math.max(1,Math.round(v.c)),q=mmc(v.l,v.mu,c);const cs=Array.from({length:8},(_,i)=>Math.max(1,Math.ceil(v.l/v.mu))+i).map(k=>[k,Math.min(30,mmc(v.l,v.mu,k).wq*60)]);
  return{out:{wq:q.wq*60},html:q.rho>=1?'<div class="readout bad">Utilisation ≥ 100%: the queue grows without limit. Add servers.</div>':`<div class="grid g4 g2m"><div class="stat"><small>Utilisation ρ</small><b>${pct(q.rho)}</b></div><div class="stat"><small>Probability a customer waits</small><b>${pct(q.pw)}</b></div><div class="stat"><small>Avg queue length Lq</small><b>${fmt(q.lq,2)}</b></div><div class="stat"><small>Avg wait Wq</small><b>${fmt(q.wq*60,2)} min</b></div></div>${plotXY({x0:cs[0][0],x1:cs[cs.length-1][0],y0:0,y1:Math.max(...cs.map(x=>x[1]))*1.1||1,h:190,fx:t=>fmt(t),fy:t=>fmt(t,1),series:[{pts:cs,l:'wait (min)'}],vlines:[[c,'var(--navy2)','you']],xl:'servers'})}<div class="formula">M/M/c (Erlang C): Poisson arrivals, exponential service, c servers.</div>`}},
 challenge:{text:'A hospital pharmacy gets 50 prescriptions an hour; each pharmacist fills 12 an hour. Find the <b>fewest pharmacists</b> that keep the average wait at or below 2 minutes.',test:(v,o)=>v.l===50&&v.mu===12&&v.tg===2&&o.wq<=2&&mmc(50,12,Math.round(v.c)-1).wq*60>2,why:'Five servers run at 83% utilisation and the wait is long; one more server cuts it sharply. Near full utilisation, a little capacity buys a lot of waiting time.'}});

/* e15 — automation business case + Industry 4.0 maturity */
LABS.i40=(el,m,done)=>calcLab(el,m,done,{inputs:[['capex','Capex: robots, sensors, integration (SAR m)',12],['lab','Labour cost saved per year (SAR m)',2.4],['qual','Scrap and rework saved per year (SAR m)',0.9],['dt','Downtime cost avoided per year (SAR m)',0.8],['mnt','Extra maintenance and software per year (SAR m)',0.7],['yrs','Useful life (years)',8],['r','Discount rate (%)',10]],
 compute:v=>{const cf=v.lab+v.qual+v.dt-v.mnt;const c=[-v.capex,...Array(Math.max(1,Math.round(v.yrs))).fill(cf)];const n=npvf(v.r/100,c),i=irrf(c),pb=cf>0?v.capex/cf:Infinity;
  return{out:{pb},html:`<div class="grid g4 g2m"><div class="stat"><small>Net annual benefit</small><b>${sar(cf,2)}</b></div><div class="stat"><small>NPV</small><b style="color:${n>=0?'var(--ok)':'var(--bad)'}">${sar(n,1)}</b></div><div class="stat"><small>IRR</small><b>${isFinite(i)?pct(i):'—'}</b></div><div class="stat"><small>Payback</small><b>${isFinite(pb)?fmt(pb,1)+' yrs':'never'}</b></div></div><p class="note">Automation cases that rely only on labour savings are often weak. Quality, uptime, safety, and the ability to run more shifts usually decide them.</p>`}},
 challenge:{text:'What is the <b>simple payback</b> in years at the current inputs?',ask:{ans:(v,o)=>o.pb,tol:.1,dp:1,unit:'years',why:()=>'Then test the case without the quality and downtime benefits: if it collapses, those are the benefits to verify in a pilot before scaling.'}}});

/* e16 — CPM + earned value */
const CPMT={A:['Site survey',3,''],B:['Design',5,'A'],C:['Procure equipment',8,'B'],D:['Civil works',6,'B'],E:['Install equipment',4,'CD'],F:['Train operators',3,'B'],G:['Commission',2,'EF'],H:['Handover',1,'G']};
function cpm(){const ks=Object.keys(CPMT),es={},ef={},ls={},lf={};ks.forEach(k=>{es[k]=Math.max(0,...[...CPMT[k][2]].map(p=>ef[p]));ef[k]=es[k]+CPMT[k][1]});const end=Math.max(...ks.map(k=>ef[k]));ks.slice().reverse().forEach(k=>{const sc=ks.filter(s=>CPMT[s][2].includes(k));lf[k]=sc.length?Math.min(...sc.map(s=>ls[s])):end;ls[k]=lf[k]-CPMT[k][1]});return{es,ef,ls,lf,end}}
LABS.cpm=(el,m,done)=>{const r=cpm(),ks=Object.keys(CPMT);
 el.innerHTML=`<h4>Critical path (weeks)</h4><div class="tablewrap"><table class="t" style="min-width:520px"><tr><th>Task</th><th>Duration</th><th>After</th><th>ES</th><th>EF</th><th>LS</th><th>LF</th><th>Slack</th></tr>${ks.map(k=>{const sl=r.ls[k]-r.es[k];return`<tr style="${sl===0?'font-weight:700':''}"><td>${k} · ${CPMT[k][0]}</td><td>${CPMT[k][1]}</td><td>${CPMT[k][2].split('').join(', ')||'—'}</td><td>${r.es[k]}</td><td>${r.ef[k]}</td><td>${r.ls[k]}</td><td>${r.lf[k]}</td><td style="color:${sl===0?'var(--bad)':'var(--ok)'}">${sl}</td></tr>`}).join('')}</table></div><p class="note">Bold rows have zero slack: the critical path. ES/EF: earliest start/finish (forward pass). LS/LF: latest (backward pass).</p>
 <div class="row"><span>Project duration (weeks)?</span><input class="tin" id="pd" type="number" style="max-width:100px"><span>Critical path (e.g. ABCEGH)?</span><input class="tin" id="cp" style="max-width:140px;text-transform:uppercase"><button class="sbtn" id="pc">Check</button></div><div id="pm"></div>
 <h4 style="margin-top:16px">Earned value at week 12</h4><div class="grid g4 g2m">${numIn('bac','Budget at completion (SAR k)',2000)}${numIn('pv','Planned value to date (SAR k)',1200)}${numIn('ev','Earned value (SAR k)',1000)}${numIn('ac','Actual cost (SAR k)',1150)}</div><div id="eo"></div>`;
 const ev=()=>{const bac=V('bac',el),pv=V('pv',el),e=V('ev',el),ac=V('ac',el);const spi=e/pv,cpi=e/ac;$('#eo',el).innerHTML=kv([['Schedule variance (EV − PV)',fmt(e-pv)],['Cost variance (EV − AC)',fmt(e-ac)],['SPI',fmt(spi,2)+(spi<1?' — behind schedule':' — on/ahead')],['CPI',fmt(cpi,2)+(cpi<1?' — over budget':' — on/under budget')],['Estimate at completion (BAC ÷ CPI)',fmt(bac/cpi),1]])};$$('#bac,#pv,#ev,#ac',el).forEach(x=>x.oninput=ev);ev();
 const crit=ks.filter(k=>r.ls[k]===r.es[k]).join('');$('#pc',el).onclick=()=>{const ok=+$('#pd',el).value===r.end&&$('#cp',el).value.toUpperCase().replace(/[^A-Z]/g,'')===crit;$('#pm',el).innerHTML=`<div class="readout ${ok?'ok':'bad'}">${ok?'<b>Correct.</b> Any delay on these tasks delays handover; tasks with slack (like training) can float.':`<b>Duration ${r.end} weeks, critical path ${crit.split('').join('→')}.</b> Do the forward pass: each task starts when its latest predecessor finishes.`}</div>`;if(ok)done()}};

/* ================= MBA Core labs (working models; all figures illustrative) ================= */
/* calcLab: inputs → live model → a challenge that makes you use the model */
function calcLab(el,m,done,cfg){const v0={};cfg.inputs.forEach(([id,l,val])=>v0[id]=val);
  el.innerHTML=`<div class="grid g3 g2m">${cfg.inputs.map(([id,l,val,st])=>numIn('k_'+id,l,val,{step:st})).join('')}</div><div id="kout" style="margin-top:12px"></div>${cfg.challenge?`<div class="card gold" style="box-shadow:none;margin-top:12px"><div class="eyebrow">Challenge</div><p style="margin:.3rem 0">${cfg.challenge.text}</p>${cfg.challenge.ask?`<div class="row"><input class="tin" id="kask" type="number" step="any" inputmode="decimal" style="max-width:180px"><span class="note">${cfg.challenge.ask.unit||''}</span><button class="sbtn" id="kchk">Check</button></div>`:''}<div id="kmsg"></div></div>`:''}`;
  let out={},hit=false;const read=()=>{const v={};cfg.inputs.forEach(([id])=>v[id]=V('k_'+id,el));return v};
  const run=()=>{const v=read();const r=cfg.compute(v,v0);out=r.out||{};$('#kout',el).innerHTML=r.html;
    if(cfg.challenge&&cfg.challenge.test&&!hit&&cfg.challenge.test(v,out,v0)){hit=true;$('#kmsg',el).innerHTML=`<div class="readout ok"><b>Challenge met.</b> ${cfg.challenge.why||''}</div>`;done()}};
  $$('input[id^="k_"]',el).forEach(x=>x.oninput=run);run();
  const ck=$('#kchk',el);if(ck)ck.onclick=()=>{const a=cfg.challenge.ask;const v=read();const t=a.ans(v,out);const g=parseFloat($('#kask',el).value);const ok=Math.abs(g-t)<=a.tol;$('#kmsg',el).innerHTML=`<div class="readout ${ok?'ok':'bad'}"><b>${ok?'Correct.':'Not quite: '+fmt(t,a.dp==null?1:a.dp)+' '+(a.unit||'')}</b> ${a.why?a.why(v,out):''}</div>`;if(ok)done()}}
/* simple XY plot */
function plotXY(o){const W=560,H=o.h||230,L=46,B=30,T=12,Rr=12;const X=x=>L+(x-o.x0)/(o.x1-o.x0)*(W-L-Rr),Y=y=>H-B-(y-o.y0)/(o.y1-o.y0)*(H-B-T);
  const ticks=(a,b,n)=>Array.from({length:n+1},(_,i)=>a+(b-a)*i/n);
  let s=`<div class="chart"><svg viewBox="0 0 ${W} ${H}">`;
  ticks(o.y0,o.y1,4).forEach(t=>{s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width=".6"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end">${o.fy?o.fy(t):fmt(t)}</text>`});
  ticks(o.x0,o.x1,5).forEach(t=>{s+=`<text x="${X(t)}" y="${H-10}" text-anchor="middle">${o.fx?o.fx(t):fmt(t)}</text>`});
  if(o.y0<0&&o.y1>0)s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mut)" stroke-width="1"/>`;
  (o.series||[]).forEach(se=>{s+=`<polyline fill="none" stroke="${se.c||'var(--gold2)'}" stroke-width="2.2" ${se.dash?'stroke-dasharray="5 4"':''} points="${se.pts.map(p=>X(p[0]).toFixed(1)+','+Y(Math.max(o.y0,Math.min(o.y1,p[1]))).toFixed(1)).join(' ')}"/>`;if(se.l){const p=se.pts[se.pts.length-1];s+=`<text x="${X(p[0])-4}" y="${Y(Math.max(o.y0,Math.min(o.y1,p[1])))-6}" text-anchor="end" style="fill:${se.c||'var(--gold2)'};font-weight:600">${se.l}</text>`}});
  (o.dots||[]).forEach(d=>{s+=`<circle cx="${X(d[0])}" cy="${Y(d[1])}" r="${d[3]||4}" fill="${d[2]||'var(--navy2)'}" opacity=".85"/>${d[4]?`<text x="${X(d[0])+7}" y="${Y(d[1])+4}" style="fill:var(--ink)">${esc(d[4])}</text>`:''}`});
  (o.vlines||[]).forEach(([x,c,l])=>{s+=`<line x1="${X(x)}" x2="${X(x)}" y1="${T}" y2="${H-B}" stroke="${c||'var(--bad)'}" stroke-dasharray="4 3"/>${l?`<text x="${X(x)+4}" y="${T+10}" style="fill:${c||'var(--bad)'}">${l}</text>`:''}`});
  if(o.xl)s+=`<text x="${W-Rr}" y="${H-B-6}" text-anchor="end">${o.xl}</text>`;
  return s+`</svg></div>`}
const kv=rows=>`<div class="kv">${rows.map(([a,b,bold])=>`<span>${bold?'<b>'+a+'</b>':a}</span><span>${bold?'<b>'+b+'</b>':b}</span>`).join('')}</div>`;
const sar=(n,d=1)=>'SAR '+fmt(n,d)+'m';

/* m01 — linked three statements */
LABS.three=(el,m,done)=>calcLab(el,m,done,{inputs:[['rev','Revenue (SAR m)',500],['gm','Gross margin (%)',35],['opex','Operating expenses (SAR m)',90],['da','Depreciation (SAR m)',20],['int','Interest (SAR m)',8],['tax','Tax / zakat rate (%)',20],['dso','Receivable days (DSO)',60],['dio','Inventory days (DIO)',45],['dpo','Payable days (DPO)',30],['capex','Capex (SAR m)',40]],
 compute:v=>{const cogs=v.rev*(1-v.gm/100),gp=v.rev-cogs,ebit=gp-v.opex-v.da,ebt=ebit-v.int,tx=Math.max(0,ebt*v.tax/100),ni=ebt-tx;const ar=v.rev*v.dso/365,inv=cogs*v.dio/365,ap=cogs*v.dpo/365,nwc=ar+inv-ap,dn=nwc-89,cfo=ni+v.da-dn,fcf=cfo-v.capex;
  return{out:{fcf,ni,cfo},html:`<div class="grid g3"><div class="stat"><div class="eyebrow">Income statement</div>${kv([['Revenue',fmt(v.rev,1)],['Gross profit',fmt(gp,1)],['EBIT',fmt(ebit,1)],['Net income',fmt(ni,1),1]])}</div><div class="stat"><div class="eyebrow">Cash flow</div>${kv([['Net income',fmt(ni,1)],['+ Depreciation',fmt(v.da,1)],['− Increase in working capital',fmt(dn,1)],['Operating cash flow',fmt(cfo,1),1],['− Capex',fmt(v.capex,1)],['Free cash flow',fmt(fcf,1),1]])}</div><div class="stat"><div class="eyebrow">Balance sheet (year end)</div>${kv([['Receivables',fmt(ar,1)],['Inventory',fmt(inv,1)],['Payables',fmt(ap,1)],['Net working capital',fmt(nwc,1),1],['Last year NWC','89.0'],['Cash (opening 50)',fmt(50+fcf,1),1]])}</div></div><p class="note">The links: net income starts the cash flow; depreciation is added back because it is not cash; working capital moves on the balance sheet change cash; free cash flow lands in the cash line.</p>`}},
 challenge:{text:'Without touching revenue, margin, costs, tax or capex, get <b>free cash flow to SAR 40m or more</b>. Only the three working-capital day counts may change.',test:(v,o,v0)=>o.fcf>=40&&['rev','gm','opex','da','int','tax','capex'].every(k=>v[k]===v0[k]),why:'Same profit, more cash. Collecting faster or holding less stock releases cash; this is why CFOs watch working capital as closely as margin.'}});

/* m02 — cash conversion cycle */
LABS.ccc=(el,m,done)=>calcLab(el,m,done,{inputs:[['rev','Annual revenue (SAR m)',800],['cogs','Annual cost of goods sold (SAR m)',560],['dso','Receivable days (DSO)',55],['dio','Inventory days (DIO)',70],['dpo','Payable days (DPO)',40]],
 compute:(v,v0)=>{const c=v.dso+v.dio-v.dpo;const tied=x=>x.rev*x.dso/365+x.cogs*x.dio/365-x.cogs*x.dpo/365;const rel=tied(v0)-tied(v);
