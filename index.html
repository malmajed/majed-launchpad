 items:[['An analyst uses public information plus her own channel checks with suppliers to conclude a company will miss earnings, and recommends selling.','No violation','mosaic theory: public + non-material nonpublic pieces'],['A manager discloses to clients that he will receive a referral fee from a broker, then uses that broker.','No violation','VI(C) satisfied by disclosure'],['A member who is not yet a charterholder writes "CFA (expected 2027)".','Violation','VII(B): no partial or expected designation'],['A firm uses a client\'s confidential holdings in a marketing presentation without consent.','Violation','III(E) Preservation of Confidentiality'],['An employee starts setting up a competing business on weekends, without using employer time or client lists, and has not yet solicited clients.','No violation','IV(A) allows preparations if no breach of duty'],['A research analyst changes a rating after pressure from the investment-banking team.','Violation','I(B) Independence and Objectivity'],['An adviser keeps records of the analysis behind recommendations for seven years in electronic form.','No violation','V(C) Record Retention satisfied'],['A portfolio manager trades ahead of a scheduled index rebalancing using information the market already knows.','No violation','public information, no manipulation'],['A member is convicted of repeated fraud unrelated to her job.','Violation','I(D) Misconduct: dishonesty reflects on professional integrity']],pass:7,
 why:'Ethics is the highest-weighted Level I topic and can tip a borderline result. Practise "violation or not" with a reason, every time.'});

/* a04 — time value of money */
LABS.tvm=(el,m,done)=>calcLab(el,m,done,{inputs:[['apr','Stated annual rate (%)',6,.1],['mf','Compounding periods per year',12],['yrs','Years',10],['pmt','Payment per period',500],['fv','Lump sum at end',0],['due','Annuity due? (1 = yes)',0]],
 compute:v=>{const i=v.apr/100/v.mf,N=Math.round(v.yrs*v.mf),af=i?(1-Math.pow(1+i,-N))/i:N,pv=v.pmt*af*(v.due>=1?(1+i):1)+v.fv*Math.pow(1+i,-N),fvA=v.pmt*(i?(Math.pow(1+i,N)-1)/i:N)*(v.due>=1?(1+i):1)+v.fv,ear=Math.pow(1+i,v.mf)-1;
  return{out:{pv},html:`<div class="grid g3"><div class="stat"><small>Present value</small><b>${fmt(pv,2)}</b></div><div class="stat"><small>Future value of payments</small><b>${fmt(fvA,2)}</b></div><div class="stat"><small>Effective annual rate</small><b>${pct(ear,3)}</b></div></div><div class="formula">PV(annuity) = PMT × [1 − (1 + r)^−N] ÷ r · EAR = (1 + APR/m)^m − 1 · Annuity due = ordinary × (1 + r)</div>`}},
 challenge:{text:'What is the <b>present value</b> at the current inputs (to 2 decimals)?',ask:{ans:(v,o)=>o.pv,tol:.5,dp:2,why:()=>'On exam day, set your calculator\'s P/Y to 1 and enter the periodic rate and number of periods yourself — it avoids the most common TVM error.'}}});

/* a05 — hypothesis test of a mean (t-test) */
function lgam(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const k of c)s+=k/++y;return-t+Math.log(2.5066282746310005*s/x)}
function tcdf(t,df){const pdf=x=>Math.exp(lgam((df+1)/2)-lgam(df/2)-.5*Math.log(df*Math.PI)-(df+1)/2*Math.log(1+x*x/df));const n=400,h=Math.abs(t)/n;let s=pdf(0)+pdf(Math.abs(t));for(let i=1;i<n;i++)s+=(i%2?4:2)*pdf(i*h);const half=s*h/3;return t>=0?.5+half:.5-half}
LABS.ttest=(el,m,done)=>calcLab(el,m,done,{inputs:[['xb','Sample mean return (%)',1.4,.01],['mu','Hypothesised mean (%)',0,.01],['s','Sample standard deviation (%)',4.2,.01],['n','Sample size',36],['al','Significance level (%)',5]],
 compute:v=>{const n=Math.max(2,Math.round(v.n)),se=v.s/Math.sqrt(n),t=(v.xb-v.mu)/se,df=n-1,p=2*(1-tcdf(Math.abs(t),df));let lo=0,hi=10;for(let k=0;k<60;k++){const mi=(lo+hi)/2;if(2*(1-tcdf(mi,df))>v.al/100)lo=mi;else hi=mi}const tc=(lo+hi)/2;
  return{out:{t},html:`<div class="grid g4 g2m"><div class="stat"><small>Standard error</small><b>${fmt(se,3)}</b></div><div class="stat"><small>t-statistic (df ${df})</small><b>${fmt(t,3)}</b></div><div class="stat"><small>Critical t (two-tailed)</small><b>±${fmt(tc,3)}</b></div><div class="stat"><small>p-value</small><b>${fmt(p,4)}</b></div></div><div class="readout ${Math.abs(t)>tc?'ok':''}"><b>${Math.abs(t)>tc?'Reject H₀':'Fail to reject H₀'}</b> at ${v.al}%: ${Math.abs(t)>tc?'the mean return is significantly different from the hypothesised value.':'the evidence is not strong enough.'}</div><div class="formula">t = (x̄ − μ₀) ÷ (s ÷ √n), df = n − 1. Type I error: rejecting a true H₀ (probability = α). Type II: failing to reject a false H₀.</div>`}},
 challenge:{text:'What is the <b>t-statistic</b> at the current inputs?',ask:{ans:(v,o)=>o.t,tol:.01,dp:3,why:()=>'Exam tip: state the hypotheses, the test statistic, the critical value and the decision — in that order.'}}});

/* a06 — monetary policy: Taylor rule and real rates */
LABS.taylor=(el,m,done)=>calcLab(el,m,done,{inputs:[['rn','Neutral real rate (%)',1,.1],['pi','Inflation (%)',4,.1],['pt','Inflation target (%)',2,.1],['gap','Output gap (% of potential)',-1,.1],['cur','Current policy rate (%)',4.5,.25]],
 compute:v=>{const i=v.rn+v.pi+.5*(v.pi-v.pt)+.5*v.gap,real=v.cur-v.pi,neutralNom=v.rn+v.pt;const stance=v.cur>neutralNom+.25?'contractionary (above the neutral nominal rate)':v.cur<neutralNom-.25?'expansionary (below the neutral nominal rate)':'roughly neutral';
  return{out:{i},html:`<div class="grid g3"><div class="stat"><small>Taylor-rule policy rate</small><b>${fmt(i,2)}%</b></div><div class="stat"><small>Neutral nominal rate</small><b>${fmt(neutralNom,2)}%</b><small>neutral real + target inflation</small></div><div class="stat"><small>Current real policy rate</small><b>${fmt(real,2)}%</b></div></div><div class="readout">Current stance: <b>${stance}</b>.</div><div class="formula">Taylor rule: i = r_neutral + π + 0.5(π − π*) + 0.5(output gap) · Fisher: nominal ≈ real + expected inflation</div>`}},
 challenge:{text:'What policy rate does the Taylor rule suggest at the current inputs?',ask:{ans:(v,o)=>o.i,tol:.05,dp:2,unit:'%',why:()=>'For pegged currencies like the riyal, domestic policy rates largely follow the anchor currency instead of a Taylor rule — a good discussion point.'}}});

/* a07 — exchange rates: forwards and cross rates */
LABS.fxfwd=(el,m,done)=>calcLab(el,m,done,{inputs:[['s','Spot (SAR per USD)',3.75,.0001],['ip','SAR interest rate (%/yr)',5.5,.05],['ib','USD interest rate (%/yr)',5,.05],['days','Days to forward',180],['eur','USD per EUR spot',1.08,.0001]],
 compute:v=>{const t=v.days/360,F=v.s*(1+v.ip/100*t)/(1+v.ib/100*t),pts=(F-v.s)*1e4,cross=v.eur*v.s;
  return{out:{F},html:`<div class="grid g3"><div class="stat"><small>Forward (SAR/USD)</small><b>${F.toFixed(4)}</b></div><div class="stat"><small>Forward points</small><b>${fmt(pts,1)}</b><small>${pts>0?'USD at a forward premium':'USD at a forward discount'}</small></div><div class="stat"><small>Cross rate SAR per EUR</small><b>${cross.toFixed(4)}</b></div></div><div class="formula">Covered interest parity: F(price/base) = S × (1 + i_price × t) ÷ (1 + i_base × t). The currency with the higher interest rate trades at a forward discount.</div>`}},
 challenge:{text:'What is the 180-day <b>forward rate</b> (4 decimals)?',ask:{ans:(v,o)=>o.F,tol:.0005,dp:4,why:()=>'Forward rates are not forecasts; they simply reflect interest-rate differentials (no arbitrage).'}}});

/* a08 — ratios from financial statements */
LABS.ratios=(el,m,done)=>calcLab(el,m,done,{inputs:[['rev','Revenue',1000],['cogs','Cost of sales',620],['opex','Operating expenses',220],['int','Interest expense',20],['tax','Tax rate (%)',20],['ca','Current assets',400],['inv','of which inventory',150],['cl','Current liabilities',250],['ta','Total assets',1200],['debt','Total debt',400],['eq','Total equity',600]],
 compute:v=>{const ebit=v.rev-v.cogs-v.opex,ni=(ebit-v.int)*(1-v.tax/100);const R=[['Gross margin',pct((v.rev-v.cogs)/v.rev)],['Operating margin',pct(ebit/v.rev)],['Net margin',pct(ni/v.rev)],['Current ratio',fmt(v.ca/v.cl,2)+'×'],['Quick ratio',fmt((v.ca-v.inv)/v.cl,2)+'×'],['Debt-to-equity',fmt(v.debt/v.eq,2)+'×'],['Interest coverage',fmt(ebit/v.int,1)+'×'],['ROA',pct(ni/v.ta)],['ROE',pct(ni/v.eq)],['Inventory turnover',fmt(v.cogs/v.inv,2)+'×']];
  return{out:{roe:ni/v.eq*100},html:`<div class="tablewrap"><table class="t">${R.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join('')}</table></div><p class="note">Simplified: year-end balances used instead of averages. On the exam, check whether averages are required.</p>`}},
 challenge:{text:'What is <b>ROE</b> at the current inputs (%)?',ask:{ans:(v,o)=>o.roe,tol:.1,dp:1,unit:'%'}}});

/* a09 — cash flow from operations (indirect) */
LABS.cfo=(el,m,done)=>calcLab(el,m,done,{inputs:[['ni','Net income',120],['da','Depreciation and amortisation',40],['gain','Gain on sale of equipment',10],['dar','Increase in receivables',25],['dinv','Decrease in inventory',8],['dap','Increase in payables',12],['capex','Capital expenditure',70],['div','Dividends paid',30]],
 compute:v=>{const cfo=v.ni+v.da-v.gain-v.dar+v.dinv+v.dap,fcff=cfo-v.capex;
  return{out:{cfo},html:kv([['Net income',fmt(v.ni)],['+ D&A (non-cash)',fmt(v.da)],['− Gain on sale (investing activity)',fmt(-v.gain)],['− Increase in receivables',fmt(-v.dar)],['+ Decrease in inventory',fmt(v.dinv)],['+ Increase in payables',fmt(v.dap)],['Cash flow from operations',fmt(cfo),1],['Free cash flow (CFO − capex, simplified)',fmt(fcff),1]])+`<p class="note">Dividends paid (${fmt(v.div)}) are financing under US GAAP; IFRS allows operating or financing classification for dividends paid and interest paid — a classic exam point.</p>`}},
 challenge:{text:'What is <b>cash flow from operations</b>?',ask:{ans:(v,o)=>o.cfo,tol:.5,dp:0}}});

/* a10 — inventory methods */
LABS.inventory=(el,m,done)=>calcLab(el,m,done,{inputs:[['u0','Beginning units',100],['c0','Beginning cost per unit',10],['u1','Purchase 1 units',200],['c1','Purchase 1 cost',12],['u2','Purchase 2 units',150],['c2','Purchase 2 cost',14],['sold','Units sold',300],['p','Selling price per unit',20]],
 compute:v=>{const lots=[[v.u0,v.c0],[v.u1,v.c1],[v.u2,v.c2]],tu=lots.reduce((a,l)=>a+l[0],0),tc=lots.reduce((a,l)=>a+l[0]*l[1],0),s=Math.min(v.sold,tu);
  const take=ord=>{let r=s,c=0;for(const [u,k] of ord){const q=Math.min(u,r);c+=q*k;r-=q}return c};const fifo=take(lots),lifo=take(lots.slice().reverse()),wa=tc/tu*s,rev=s*v.p;
  return{out:{fifo},html:`<div class="tablewrap"><table class="t"><tr><th>Method</th><th>COGS</th><th>Ending inventory</th><th>Gross profit</th></tr><tr><td>FIFO</td><td>${fmt(fifo)}</td><td>${fmt(tc-fifo)}</td><td>${fmt(rev-fifo)}</td></tr><tr><td>Weighted average</td><td>${fmt(wa,1)}</td><td>${fmt(tc-wa,1)}</td><td>${fmt(rev-wa,1)}</td></tr><tr><td>LIFO (US GAAP only)</td><td>${fmt(lifo)}</td><td>${fmt(tc-lifo)}</td><td>${fmt(rev-lifo)}</td></tr></table></div><p class="note">With rising prices, LIFO gives the highest COGS and lowest ending inventory; FIFO the reverse. IFRS does not permit LIFO.</p>`}},
 challenge:{text:'What is <b>COGS under FIFO</b>?',ask:{ans:(v,o)=>o.fifo,tol:.5,dp:0}}});

/* a11 — reporting quality red flags */
LABS.quality=(el,m,done)=>classifyLab(el,done,{intro:'Does each choice make reported earnings look better now (aggressive) or worse now (conservative)?',cats:['Aggressive','Conservative'],
 items:[['Extending the useful life of equipment from 8 to 12 years','Aggressive','lower annual depreciation'],['Recognising revenue on shipment to distributors with generous return rights','Aggressive','channel stuffing risk'],['Raising the allowance for doubtful accounts well above historical losses','Conservative','higher bad-debt expense now'],['Capitalising routine maintenance as an asset','Aggressive','expense deferred to the balance sheet'],['Writing down inventory at the first sign of obsolescence','Conservative','lower profit now'],['Lowering the assumed warranty claims rate without new evidence','Aggressive','lower provision'],['Expensing development costs that could qualify for capitalisation','Conservative','lower profit now'],['Classifying a recurring cost as "non-recurring" in adjusted earnings','Aggressive','flatters non-GAAP measures']],pass:6,
 why:'Warning signs: profits growing faster than operating cash flow, rising receivables days, frequent "one-off" charges, and changes in estimates that always help earnings.'});

/* a13 — buying on margin */
LABS.margin=(el,m,done)=>calcLab(el,m,done,{inputs:[['p0','Purchase price per share',50],['im','Initial margin (%)',40],['mm','Maintenance margin (%)',25],['p1','Sale price per share',56],['d','Dividend per share',1],['r','Margin loan interest (% for the period)',6]],
 compute:v=>{const call=v.p0*(1-v.im/100)/(1-v.mm/100),eq0=v.p0*v.im/100,loan=v.p0-eq0,ret=(v.p1+v.d-v.p0-loan*v.r/100)/eq0,unlev=(v.p1+v.d-v.p0)/v.p0;
  return{out:{call},html:`<div class="grid g3"><div class="stat"><small>Margin call price</small><b>${fmt(call,2)}</b></div><div class="stat"><small>Leverage ratio</small><b>${fmt(1/(v.im/100),2)}×</b></div><div class="stat"><small>Return on equity invested</small><b>${pct(ret)}</b><small>vs ${pct(unlev)} unleveraged</small></div></div><div class="formula">Margin call price = P₀ × (1 − initial margin) ÷ (1 − maintenance margin)</div>`}},
 challenge:{text:'At what price does the investor receive a <b>margin call</b>?',ask:{ans:(v,o)=>o.call,tol:.01,dp:2}}});

/* a14 — dividend discount models */
LABS.ddm=(el,m,done)=>calcLab(el,m,done,{inputs:[['d0','Last dividend D₀',2],['g1','High growth rate (%)',12,.1],['n','Years of high growth',3],['g2','Long-run growth (%)',4,.1],['r','Required return (%)',10,.1],['eps','Next year EPS',5]],
 compute:v=>{const r=v.r/100,g1=v.g1/100,g2=v.g2/100,n=Math.max(0,Math.round(v.n));if(r<=g2)return{out:{},html:'<div class="readout bad">Required return must exceed long-run growth.</div>'};let pv=0,d=v.d0;for(let t=1;t<=n;t++){d*=1+g1;pv+=d/Math.pow(1+r,t)}const dn1=d*(1+g2),tv=dn1/(r-g2),val=pv+tv/Math.pow(1+r,n);const gordon=v.d0*(1+g2)/(r-g2);const d1=n?v.d0*(1+g1):v.d0*(1+g2);
  return{out:{val},html:`<div class="grid g3"><div class="stat"><small>Two-stage DDM value</small><b>${fmt(val,2)}</b></div><div class="stat"><small>Gordon (constant g₂) value</small><b>${fmt(gordon,2)}</b></div><div class="stat"><small>Justified forward P/E</small><b>${fmt(val/v.eps,1)}×</b></div></div><div class="formula">Gordon: V₀ = D₁ ÷ (r − g) · Two-stage: PV of high-growth dividends + PV of [D_(n+1) ÷ (r − g₂)] · Justified forward P/E = payout ÷ (r − g)</div>`}},
 challenge:{text:'What is the <b>two-stage DDM value</b> at the current inputs?',ask:{ans:(v,o)=>o.val,tol:.05,dp:2}}});

/* a15 — bond price and yield */
function bondPrice(face,c,yrs,y,f){const n=Math.round(yrs*f),cp=face*c/100/f,i=y/100/f;let p=0;for(let t=1;t<=n;t++)p+=cp/Math.pow(1+i,t);return p+face/Math.pow(1+i,n)}
LABS.bond=(el,m,done)=>calcLab(el,m,done,{inputs:[['face','Par value',100],['c','Coupon rate (%)',5,.05],['yrs','Years to maturity',8],['y','Yield to maturity (%)',6,.05],['f','Coupons per year',2]],
 compute:v=>{const p=bondPrice(v.face,v.c,v.yrs,v.y,v.f),cy=v.face*v.c/100/p;const pts=Array.from({length:41},(_,k)=>{const y=Math.max(.1,v.y-4+k*.2);return[y,bondPrice(v.face,v.c,v.yrs,y,v.f)]});
  return{out:{p},html:`<div class="grid g3"><div class="stat"><small>Price</small><b>${fmt(p,3)}</b><small>${p>v.face?'premium':p<v.face?'discount':'par'}</small></div><div class="stat"><small>Current yield</small><b>${pct(cy,2)}</b></div><div class="stat"><small>Coupon vs YTM</small><b>${v.c>v.y?'coupon > YTM':'coupon < YTM'}</b></div></div>${plotXY({x0:pts[0][0],x1:pts[40][0],y0:Math.min(...pts.map(q=>q[1]))*.95,y1:Math.max(...pts.map(q=>q[1]))*1.02,h:200,fx:t=>fmt(t,1)+'%',fy:t=>fmt(t),series:[{pts,l:'price–yield'}],vlines:[[v.y,'var(--tc)','YTM']],xl:'yield'})}<p class="note">The curve is convex: prices rise more when yields fall than they drop when yields rise by the same amount.</p>`}},
 challenge:{text:'What is the bond\'s <b>price</b> (3 decimals)?',ask:{ans:(v,o)=>o.p,tol:.01,dp:3}}});

/* a16 — duration and convexity */
LABS.duration=(el,m,done)=>calcLab(el,m,done,{inputs:[['c','Annual coupon (%)',6,.05],['yrs','Years to maturity',5],['y','Yield (%)',5,.05],['dy','Yield change (basis points)',100]],
 compute:v=>{const n=Math.round(v.yrs),y=v.y/100;let p=0,mac=0;for(let t=1;t<=n;t++){const cf=v.c+(t===n?100:0),pv=cf/Math.pow(1+y,t);p+=pv;mac+=t*pv}mac/=p;const mod=mac/(1+y);const h=.0001,pu=bondPrice(100,v.c,n,(y+h)*100,1),pd=bondPrice(100,v.c,n,(y-h)*100,1);const conv=(pu+pd-2*p)/(p*h*h);const d=v.dy/1e4,est=-mod*d+.5*conv*d*d,act=bondPrice(100,v.c,n,(y+d)*100,1)/p-1;
  return{out:{mod},html:`<div class="grid g4 g2m"><div class="stat"><small>Macaulay duration</small><b>${fmt(mac,3)}</b></div><div class="stat"><small>Modified duration</small><b>${fmt(mod,3)}</b></div><div class="stat"><small>Convexity</small><b>${fmt(conv,2)}</b></div><div class="stat"><small>Price change for ${v.dy} bp</small><b>${pct(est,2)}</b><small>actual ${pct(act,2)}</small></div></div><div class="formula">%ΔP ≈ −ModDur × Δy + ½ × Convexity × (Δy)² · ModDur = MacDur ÷ (1 + y)</div>`}},
 challenge:{text:'What is the <b>modified duration</b> (3 decimals)?',ask:{ans:(v,o)=>o.mod,tol:.005,dp:3}}});

/* a17 — credit: expected loss and tranching */
LABS.credit=(el,m,done)=>calcLab(el,m,done,{inputs:[['pd','Probability of default (%/yr)',2,.1],['rr','Recovery rate (%)',40],['exp','Exposure (SAR m)',100],['loss','Collateral pool loss (%)',18,.5],['sen','Senior tranche (%)',70],['mez','Mezzanine tranche (%)',20]],
 compute:v=>{const lgd=1-v.rr/100,el2=v.pd/100*lgd*v.exp,spread=v.pd*lgd;const eqT=100-v.sen-v.mez,L=v.loss;const eqL=Math.min(L,eqT),mzL=Math.min(Math.max(0,L-eqT),v.mez),snL=Math.max(0,L-eqT-v.mez);
  return{out:{el:el2},html:`<div class="grid g3"><div class="stat"><small>Loss given default</small><b>${pct(lgd)}</b></div><div class="stat"><small>Expected loss</small><b>SAR ${fmt(el2,2)}m</b></div><div class="stat"><small>Approx. credit spread</small><b>${fmt(spread*100,0)} bp</b><small>≈ PD × LGD</small></div></div><h4 style="margin-top:10px">Securitisation waterfall: losses hit the junior tranche first</h4><div class="tablewrap"><table class="t"><tr><th>Tranche</th><th>Size</th><th>Loss absorbed</th><th>Tranche loss</th></tr><tr><td>Equity</td><td>${eqT}%</td><td>${fmt(eqL,1)}%</td><td>${pct(eqT?eqL/eqT:0)}</td></tr><tr><td>Mezzanine</td><td>${v.mez}%</td><td>${fmt(mzL,1)}%</td><td>${pct(v.mez?mzL/v.mez:0)}</td></tr><tr><td>Senior</td><td>${v.sen}%</td><td>${fmt(snL,1)}%</td><td>${pct(v.sen?snL/v.sen:0)}</td></tr></table></div>`}},
 challenge:{text:'What is the <b>expected loss</b> in SAR millions?',ask:{ans:(v,o)=>o.el,tol:.01,dp:2,unit:'SAR m'}}});

/* a18 — option payoffs, put-call parity, one-period binomial */
LABS.options=(el,m,done)=>calcLab(el,m,done,{inputs:[['s','Underlying price S₀',100],['k','Strike K',100],['u','Up factor u',1.2,.01],['d','Down factor d',.8,.01],['r','Risk-free rate for the period (%)',5,.1],['prem','Call premium paid (for payoff chart)',8,.1]],
 compute:v=>{const R=1+v.r/100,q=(R-v.d)/(v.u-v.d),cu=Math.max(0,v.s*v.u-v.k),cd=Math.max(0,v.s*v.d-v.k),c=(q*cu+(1-q)*cd)/R,pu=Math.max(0,v.k-v.s*v.u),pdn=Math.max(0,v.k-v.s*v.d),p=(q*pu+(1-q)*pdn)/R,parity=c+v.k/R-v.s;
  const xs=Array.from({length:41},(_,i)=>v.s*.5+i*v.s/40);
  return{out:{c},html:`<div class="grid g4 g2m"><div class="stat"><small>Risk-neutral prob. of up</small><b>${fmt(q,4)}</b></div><div class="stat"><small>Call value</small><b>${fmt(c,3)}</b></div><div class="stat"><small>Put value</small><b>${fmt(p,3)}</b></div><div class="stat"><small>Put via parity: c + PV(K) − S</small><b>${fmt(parity,3)}</b></div></div>${plotXY({x0:xs[0],x1:xs[40],y0:-v.prem*1.5,y1:v.s*.6,h:200,fx:t=>fmt(t),series:[{pts:xs.map(x=>[x,Math.max(0,x-v.k)-v.prem]),l:'long call profit'},{pts:xs.map(x=>[x,Math.max(0,v.k-x)-v.prem]),c:'var(--navy2)',dash:1,l:'long put profit'}],vlines:[[v.k,'var(--mut)','K']],xl:'price at expiry'})}<div class="formula">q = (1 + r − d) ÷ (u − d) · c₀ = [q·c_u + (1 − q)·c_d] ÷ (1 + r) · Put–call parity: S + p = c + PV(K)</div>`}},
 challenge:{text:'What is the one-period binomial <b>call value</b>?',ask:{ans:(v,o)=>o.c,tol:.01,dp:3}}});

/* a19 — hedge-fund fees and real-estate cap rates */
LABS.altfees=(el,m,done)=>calcLab(el,m,done,{inputs:[['a0','Assets at start (USD m)',100],['g','Gross return (%)',15,.1],['mf','Management fee (% of start assets)',2,.1],['inc','Incentive fee (%)',20],['hwm','High-water mark (USD m)',100],['noi','Property NOI (SAR m)',12],['cap','Cap rate (%)',7.5,.1]],
 compute:v=>{const end=v.a0*(1+v.g/100),mfee=v.a0*v.mf/100,afterM=end-mfee,inc=Math.max(0,afterM-Math.max(v.hwm,v.a0))*v.inc/100,net=(afterM-inc)/v.a0-1,valRE=v.noi/(v.cap/100);
  return{out:{net:net*100},html:`<div class="grid g4 g2m"><div class="stat"><small>Management fee</small><b>${fmt(mfee,2)}</b></div><div class="stat"><small>Incentive fee</small><b>${fmt(inc,2)}</b></div><div class="stat"><small>Net return to investors</small><b>${pct(net,2)}</b></div><div class="stat"><small>Property value (NOI ÷ cap)</small><b>SAR ${fmt(valRE,1)}m</b></div></div><p class="note">Here the incentive fee is calculated net of the management fee, above the high-water mark, with no hurdle. Exam questions specify the basis — read it carefully.</p>`}},
 challenge:{text:'What is the <b>net return</b> to investors (%)?',ask:{ans:(v,o)=>o.net,tol:.02,dp:2,unit:'%'}}});

/* a20 — two-asset frontier and CAPM */
LABS.frontier=(el,m,done)=>calcLab(el,m,done,{inputs:[['r1','Asset 1 expected return (%)',8,.1],['s1','Asset 1 std dev (%)',12,.1],['r2','Asset 2 expected return (%)',13,.1],['s2','Asset 2 std dev (%)',22,.1],['rho','Correlation',.2,.05],['rf','Risk-free rate (%)',4,.1],['beta','A stock\'s beta',1.3,.05],['rm','Market expected return (%)',10,.1]],
 compute:v=>{const p=w=>{const r=w*v.r1+(1-w)*v.r2,s=Math.sqrt(w*w*v.s1*v.s1+(1-w)*(1-w)*v.s2*v.s2+2*w*(1-w)*v.rho*v.s1*v.s2);return[s,r]};const pts=Array.from({length:51},(_,i)=>p(i/50));const wmin=(v.s2*v.s2-v.rho*v.s1*v.s2)/(v.s1*v.s1+v.s2*v.s2-2*v.rho*v.s1*v.s2);const mv=p(Math.max(0,Math.min(1,wmin)));const capm=v.rf+v.beta*(v.rm-v.rf);
  return{out:{w:wmin*100},html:`${plotXY({x0:0,x1:Math.max(v.s1,v.s2)*1.15,y0:Math.min(v.r1,v.r2,v.rf)*.8,y1:Math.max(v.r1,v.r2)*1.1,h:220,fx:t=>fmt(t)+'%',fy:t=>fmt(t,1)+'%',series:[{pts,l:'portfolios of 1 and 2'}],dots:[[v.s1,v.r1,'var(--navy2)',5,'1'],[v.s2,v.r2,'var(--navy2)',5,'2'],[mv[0],mv[1],'var(--ok)',6,'min-var']],xl:'risk (std dev)'})}<div class="grid g3"><div class="stat"><small>Min-variance weight in asset 1</small><b>${pct(wmin)}</b></div><div class="stat"><small>Min-variance risk / return</small><b>${fmt(mv[0],2)}% / ${fmt(mv[1],2)}%</b></div><div class="stat"><small>CAPM required return</small><b>${fmt(capm,2)}%</b></div></div><div class="formula">σ²_p = w₁²σ₁² + w₂²σ₂² + 2w₁w₂ρσ₁σ₂ · E(R) = R_f + β[E(R_m) − R_f]</div>`}},
 challenge:{text:'What weight in asset 1 gives the <b>minimum-variance portfolio</b> (%)?',ask:{ans:(v,o)=>o.w,tol:.2,dp:1,unit:'%',why:()=>'Lower the correlation and watch the curve bend further left: diversification is the only free lunch in finance.'}}});

/* ================= CFA Level II labs (original exercises; all figures illustrative) ================= */
const stat=(l,v,s)=>`<div class="stat"><small>${l}</small><b>${v}</b>${s?`<small>${s}</small>`:''}</div>`;
const zinv=p=>{let lo=-8,hi=8;for(let i=0;i<80;i++){const mi=(lo+hi)/2;if(ncdf(mi)<p)lo=mi;else hi=mi}return(lo+hi)/2};

/* b01 — ethics vignettes: violation or not */
LABS.eth2=(el,m,done)=>classifyLab(el,done,{intro:'Level II ethics is about judgement in context. Violation or not? (Original scenarios.)',cats:['Violation','No violation'],
 items:[['A buy-side analyst overhears, in a lift, a CFO saying that quarterly sales "collapsed". The firm has not announced results. She tells her PM, who sells the stock.','Violation','II(A): material nonpublic information, however it was obtained'],
 ['A portfolio manager receives a gift basket worth about USD 80 from a broker at year end and tells his supervisor.','No violation','I(B): modest gifts are acceptable; disclosure is good practice'],
 ['A research head asks an analyst to keep a "buy" rating because the bank is underwriting the company\'s bond. The analyst keeps the rating although her model says "sell".','Violation','I(B) Independence and Objectivity'],
 ['A manager builds a block order, then allocates the fills pro rata to all participating accounts at the average price.','No violation','III(B) Fair Dealing: pro rata at average price is the recommended procedure'],
 ['A fund markets a five-year composite but omits two terminated accounts that performed badly.','Violation','III(D) Performance Presentation: survivorship bias'],
 ['An analyst who left Firm A uses her memory of public contacts and her general skills at Firm B, but takes no files.','No violation','IV(A): skills and memory of public information are hers'],
 ['A wealth adviser invests a client\'s whole portfolio in a high-fee house fund without considering the client\'s IPS, and does not disclose the fees.','Violation','III(C) Suitability and V(B): disclose services and costs (2024 Standards)'],
 ['A candidate states on her CV: "Passed Level II of the CFA Program in 2026" after receiving her result.','No violation','VII(B): factual statements about passed levels are allowed']],
 why:'At Level II, the facts are richer and the question is usually "which action, if any, violates the Standards?" Read every sentence for who knew what, when.'});

/* b02 — multiple regression output */
LABS.regr=(el,m,done)=>calcLab(el,m,done,{inputs:[['n','Observations n',60],['k','Independent variables k',3],['r2','R²',.42,.01],['b','Slope coefficient on X₁',.85,.01],['se','Standard error of that slope',.30,.01],['al','Significance level (%)',5]],
 compute:v=>{const df=v.n-v.k-1,adj=1-(1-v.r2)*(v.n-1)/df,F=(v.r2/v.k)/((1-v.r2)/df),t=v.b/v.se,p=2*(1-tcdf(Math.abs(t),df));let lo=0,hi=20;for(let i=0;i<60;i++){const mi=(lo+hi)/2;if(2*(1-tcdf(mi,df))>v.al/100)lo=mi;else hi=mi}const crit=(lo+hi)/2;
  return{out:{adj,F,t},html:`<div class="grid g4 g2m">${stat('Adjusted R²',fmt(adj,3),'penalises extra variables')}${stat('F-statistic',fmt(F,2),`df ${v.k}, ${df}`)}${stat('t on X₁',fmt(t,3),`critical ±${fmt(crit,3)}`)}${stat('p-value',fmt(p,4),p<v.al/100?'significant':'not significant')}</div><div class="formula">Adj R² = 1 − (1 − R²)(n − 1) ÷ (n − k − 1) · F = (RSS ÷ k) ÷ (SSE ÷ (n − k − 1)) = (R² ÷ k) ÷ ((1 − R²) ÷ (n − k − 1))</div><p class="note">Add a useless variable (k + 1, same R²) and adjusted R² falls. Check the classic violations next: heteroskedasticity (Breusch–Pagan), serial correlation (Breusch–Godfrey) and multicollinearity (VIF above 5–10).</p>`}},
 challenge:{text:'What is the <b>adjusted R²</b> at the current inputs (3 decimals)?',ask:{ans:(v,o)=>o.adj,tol:.002,dp:3,why:()=>'Adjusted R² can fall when you add a variable; R² never can. That is why model-selection questions use adjusted R², AIC or BIC.'}}});

/* b03 — machine learning: match technique to problem */
LABS.mlpick=(el,m,done)=>classifyLab(el,done,{intro:'Pick the most suitable machine-learning approach for each problem.',cats:['Penalised regression (LASSO)','Classification (logistic, SVM, CART)','Clustering (k-means, hierarchical)','Dimension reduction (PCA)','Neural network / deep learning','Reinforcement learning'],
 items:[['Predict whether each of 50,000 SME loans defaults next year (yes/no) from 40 labelled features.','Classification (logistic, SVM, CART)','supervised, categorical target'],
 ['Forecast monthly stock returns from 300 candidate predictors, most of them probably irrelevant, keeping only the useful ones.','Penalised regression (LASSO)','supervised, continuous target, shrinks weak coefficients to zero'],
 ['Group 2,000 retail-bank customers into segments when no labels exist.','Clustering (k-means, hierarchical)','unsupervised grouping'],
 ['Summarise 30 highly correlated yield-curve points into a few uncorrelated factors.','Dimension reduction (PCA)','unsupervised; level, slope and curvature'],
 ['An agent learns an order-execution policy by trial and error, rewarded for lower slippage.','Reinforcement learning','actions, states and rewards'],
 ['Score sentiment in millions of earnings-call sentences where the patterns are highly non-linear.','Neural network / deep learning','complex non-linear relationships, large data'],
 ['An auditor wants a flagging rule for fraudulent expense claims that she can read and explain.','Classification (logistic, SVM, CART)','a classification tree (CART) is interpretable'],
 ['Find stocks that behave alike to build diversified buckets, with no target variable.','Clustering (k-means, hierarchical)','unsupervised; similarity, not prediction']],
 why:'First ask: is there a labelled target (supervised) or not (unsupervised)? Then: is the target continuous (regression) or categorical (classification)? Overfitting is controlled by regularisation and cross-validation.'});

/* b04 — FX forward mark-to-market and growth accounting */
LABS.fxmtm=(el,m,done)=>calcLab(el,m,done,{inputs:[['nt','Notional (USD m) bought forward',10],['f0','Contract forward rate (SAR/USD)',3.76,.0001],['s','Spot now (SAR/USD)',3.77,.0001],['days','Days remaining',90],['ip','SAR rate (%/yr)',5.5,.05],['ib','USD rate (%/yr)',5,.05],['al','Capital share α',.4,.01],['gk','Capital growth (%)',4,.1],['gl','Labour growth (%)',2,.1],['ga','TFP growth (%)',1,.1]],
 compute:v=>{const t=v.days/360,ft=v.s*(1+v.ip/100*t)/(1+v.ib/100*t),mtm=v.nt*1e6*(ft-v.f0)/(1+v.ip/100*t),gy=v.ga+v.al*v.gk+(1-v.al)*v.gl;
  return{out:{mtm:mtm/1000},html:`<div class="grid g3">${stat('Forward for the remaining term',fmt(ft,4))}${stat('Mark-to-market',`SAR ${fmt(mtm/1000,1)}k`,mtm>=0?'gain to the USD buyer':'loss to the USD buyer')}${stat('Potential GDP growth',fmt(gy,2)+'%',`per-capita ≈ ${fmt(gy-v.gl,2)}%`)}</div><div class="formula">MTM = Notional × (F<sub>t</sub> − F<sub>0</sub>) ÷ (1 + i<sub>price</sub> × days ÷ 360) · g<sub>Y</sub> = g<sub>A</sub> + α·g<sub>K</sub> + (1 − α)·g<sub>L</sub></div><p class="note">Value the forward by entering an offsetting contract today and discounting the difference at the price-currency rate. For growth, only TFP raises per-capita growth permanently in the neoclassical model.</p>`}},
 challenge:{text:'What is the <b>mark-to-market value</b> to the party that bought USD forward, in SAR thousands?',ask:{ans:(v,o)=>o.mtm,tol:.2,dp:1,unit:'SAR k'}}});

/* b05 — equity method with excess purchase price */
LABS.equitym=(el,m,done)=>calcLab(el,m,done,{inputs:[['pp','Price paid for the stake',400],['sh','Stake (%)',30],['bv','Investee book value at purchase',1000],['fv','Fair value above book of PP&E (whole investee)',200],['life','Remaining life of that PP&E (years)',10],['ni','Investee net income (year 1)',150],['dv','Investee dividends (year 1)',60]],
 compute:v=>{const s=v.sh/100,excess=v.pp-s*v.bv,ppe=s*v.fv,gw=excess-ppe,amort=ppe/v.life,inc=s*v.ni-amort,end=v.pp+inc-s*v.dv;
  return{out:{end},html:`<div class="grid g4 g2m">${stat('Excess purchase price',fmt(excess,1))}${stat('of which goodwill',fmt(gw,1),'not amortised')}${stat('Equity income',fmt(inc,1),`share of NI less ${fmt(amort,1)} amortisation`)}${stat('Investment, end of year 1',fmt(end,1))}</div><div class="formula">Ending = cost + share of NI − amortisation of excess − share of dividends</div><p class="note">Dividends reduce the investment balance; they are not income under the equity method. With control (usually above 50%) you would consolidate instead, and full goodwill is allowed under IFRS.</p>`}},
 challenge:{text:'What is the <b>investment balance</b> at the end of year 1?',ask:{ans:(v,o)=>o.end,tol:.5,dp:1}}});

/* b06 — defined-benefit pension */
LABS.pension=(el,m,done)=>calcLab(el,m,done,{inputs:[['pbo','DBO at start',1000],['pa','Plan assets at start',900],['r','Discount rate (%)',5,.1],['sc','Current service cost',40],['bp','Benefits paid',50],['al','Actuarial loss (gain if negative)',20],['ar','Actual return on assets',70],['ct','Employer contributions',60]],
 compute:v=>{const ic=v.pbo*v.r/100,pboE=v.pbo+v.sc+ic-v.bp+v.al,paE=v.pa+v.ar+v.ct-v.bp,fs=paE-pboE,ni=v.r/100*(v.pbo-v.pa),pl=v.sc+ni,tppc=v.sc+ic-v.ar+v.al,remeas=v.al-(v.ar-v.r/100*v.pa);
  return{out:{tppc,pboE},html:`<div class="grid g4 g2m">${stat('DBO at end',fmt(pboE,1))}${stat('Plan assets at end',fmt(paE,1))}${stat('Funded status',fmt(fs,1),fs<0?'net liability':'net asset')}${stat('Total periodic pension cost',fmt(tppc,1))}</div><div class="grid g2">${stat('IFRS: profit or loss',fmt(pl,1),'service cost + net interest')}${stat('IFRS: OCI remeasurements',fmt(remeas,1),'actuarial loss − (actual − interest-rate return)')}</div><div class="formula">DBO<sub>end</sub> = DBO + service cost + interest cost − benefits + actuarial loss · TPPC = contributions − change in funded status</div><p class="note">Check: TPPC = ${fmt(v.ct,1)} − (${fmt(fs,1)} − ${fmt(v.pa-v.pbo,1)}) = ${fmt(v.ct-(fs-(v.pa-v.pbo)),1)}. Analysts often reclassify interest cost to financing and the return on assets to investing.</p>`}},
 challenge:{text:'What is the <b>total periodic pension cost</b>?',ask:{ans:(v,o)=>o.tppc,tol:.5,dp:1,why:()=>'TPPC is economic and independent of IFRS or US GAAP presentation: only where it appears (P&L or OCI) differs.'}}});

/* b07 — Modigliani–Miller with taxes */
LABS.mm=(el,m,done)=>calcLab(el,m,done,{inputs:[['r0','Unlevered cost of capital r₀ (%)',10,.1],['rd','Cost of debt (%)',6,.1],['t','Tax rate (%)',20],['de','Debt-to-equity D/E',.5,.05],['ebit','EBIT (perpetual)',100]],
 compute:v=>{const t=v.t/100,re=v.r0+(v.r0-v.rd)*(1-t)*v.de,wD=v.de/(1+v.de),wacc=(1-wD)*re+wD*v.rd*(1-t),vu=v.ebit*(1-t)/(v.r0/100),vl=v.ebit*(1-t)/(wacc/100);
  return{out:{re},html:`<div class="grid g4 g2m">${stat('Cost of equity',fmt(re,2)+'%')}${stat('WACC',fmt(wacc,2)+'%')}${stat('Unlevered value',fmt(vu,1))}${stat('Levered value',fmt(vl,1),`tax shield value ${fmt(vl-vu,1)}`)}</div><div class="formula">MM II with taxes: r<sub>e</sub> = r<sub>0</sub> + (r<sub>0</sub> − r<sub>d</sub>)(1 − t)(D/E) · MM I with taxes: V<sub>L</sub> = V<sub>U</sub> + tD</div><p class="note">With taxes and no distress costs, WACC falls forever as D/E rises. Static trade-off theory adds expected costs of financial distress, giving an optimal (not 100%) debt level. Set tax to 0 and WACC stays at r₀ for any D/E.</p>`}},
 challenge:{text:'What is the <b>cost of equity</b> at the current inputs (%)?',ask:{ans:(v,o)=>o.re,tol:.02,dp:2,unit:'%'}}});

/* b08 — FCFF and FCFE */
LABS.fcf=(el,m,done)=>calcLab(el,m,done,{inputs:[['ni','Net income',200],['da','Depreciation (non-cash charge)',60],['int','Interest expense',40],['t','Tax rate (%)',25],['fci','Fixed capital investment',90],['wci','Working capital investment',20],['nb','Net borrowing',30],['wacc','WACC (%)',9,.1],['re','Cost of equity (%)',11,.1],['g','Stable growth (%)',4,.1],['debt','Market value of debt',600],['sh','Shares (m)',50]],
 compute:v=>{const t=v.t/100,ff=v.ni+v.da+v.int*(1-t)-v.fci-v.wci,fe=ff-v.int*(1-t)+v.nb,firm=ff*(1+v.g/100)/((v.wacc-v.g)/100),eqF=firm-v.debt,eqE=fe*(1+v.g/100)/((v.re-v.g)/100);
  return{out:{ff,fe},html:`<div class="grid g4 g2m">${stat('FCFF',fmt(ff,1))}${stat('FCFE',fmt(fe,1))}${stat('Value per share via FCFF',fmt(eqF/v.sh,2),`firm ${fmt(firm,0)} − debt`)}${stat('Value per share via FCFE',fmt(eqE/v.sh,2))}</div><div class="formula">FCFF = NI + NCC + Int(1 − t) − FCInv − WCInv · FCFE = FCFF − Int(1 − t) + net borrowing</div><p class="note">The two values agree only when assumptions are consistent: here net borrowing, growth and leverage are set independently, so they differ. Use FCFF when leverage is high or changing, FCFE when it is stable. Never subtract interest twice: FCFF is before payments to debt holders.</p>`}},
 challenge:{text:'What is <b>FCFF</b> at the current inputs?',ask:{ans:(v,o)=>o.ff,tol:.5,dp:1}}});

/* b09 — residual income and private-company discounts */
LABS.resinc=(el,m,done)=>calcLab(el,m,done,{inputs:[['b0','Book value per share B₀',20,.1],['roe','Expected ROE (%)',15,.1],['r','Cost of equity (%)',10,.1],['g','Long-run growth (%)',5,.1],['dloc','Discount for lack of control (%)',15],['dlom','Discount for lack of marketability (%)',20]],
 compute:v=>{const ri=(v.roe-v.r)/100*v.b0,val=v.b0+ri/((v.r-v.g)/100),pb=(v.roe-v.g)/(v.r-v.g),tot=1-(1-v.dloc/100)*(1-v.dlom/100);
  return{out:{val},html:`<div class="grid g4 g2m">${stat('Residual income, year 1',fmt(ri,2))}${stat('Single-stage RI value',fmt(val,2))}${stat('Justified P/B',fmt(pb,2)+'×')}${stat('Combined private-company discount',pct(tot,1),'multiplicative, not additive')}</div><div class="formula">RI = NI − r × B<sub>t−1</sub> = (ROE − r) × B<sub>t−1</sub> · V<sub>0</sub> = B<sub>0</sub> + (ROE − r)B<sub>0</sub> ÷ (r − g) · combined discount = 1 − (1 − DLOC)(1 − DLOM)</div><p class="note">Set ROE equal to r and value equals book: a company earning only its cost of equity adds no value. RI suits firms with no dividends or negative FCF but reliable, clean-surplus accounting.</p>`}},
 challenge:{text:'What is the <b>single-stage residual income value</b> per share?',ask:{ans:(v,o)=>o.val,tol:.05,dp:2}}});

/* b10 — binomial interest-rate tree: straight, callable and putable bonds */
function treeBond(c,r0,r1,r2,sg,K,kind){const rates=[[r0],[r1,r1*Math.exp(2*sg)],[r2,r2*Math.exp(2*sg),r2*Math.exp(4*sg)]];let V=[100,100,100,100];
  for(let t=2;t>=0;t--){V=rates[t].map((r,j)=>{let x=(.5*(V[j]+c)+.5*(V[j+1]+c))/(1+r/100);if(t>=1&&kind==='call')x=Math.min(x,K);if(t>=1&&kind==='put')x=Math.max(x,K);return x})}return{v:V[0],rates}}
LABS.ratetree=(el,m,done)=>calcLab(el,m,done,{inputs:[['c','Annual coupon (% of par), 3-year bond',5,.05],['r0','Year-0 one-year rate (%)',3,.01],['r1','Year-1 lower node rate (%)',3.8,.01],['r2','Year-2 lowest node rate (%)',4.2,.01],['sg','Volatility σ (%)',15,.5],['k','Call / put price (from year 1)',100,.5]],
 compute:v=>{const sg=v.sg/100,s=treeBond(v.c,v.r0,v.r1,v.r2,sg,v.k,''),cl=treeBond(v.c,v.r0,v.r1,v.r2,sg,v.k,'call'),pu=treeBond(v.c,v.r0,v.r1,v.r2,sg,v.k,'put');
  return{out:{cl:cl.v,s:s.v},html:`<div class="grid g4 g2m">${stat('Straight bond',fmt(s.v,3))}${stat('Callable bond',fmt(cl.v,3),`call option ${fmt(s.v-cl.v,3)}`)}${stat('Putable bond',fmt(pu.v,3),`put option ${fmt(pu.v-s.v,3)}`)}${stat('Upper nodes',`${fmt(s.rates[1][1],2)}% · ${fmt(s.rates[2][2],2)}%`,'r × e<sup>2σ</sup> per step')}</div><div class="formula">Node value = [½(V<sub>up</sub> + C) + ½(V<sub>down</sub> + C)] ÷ (1 + r<sub>node</sub>) · callable: min(node value, call price) · putable: max(node value, put price)</div><p class="note">V<sub>callable</sub> = V<sub>straight</sub> − V<sub>call</sub>; V<sub>putable</sub> = V<sub>straight</sub> + V<sub>put</sub>. Raise σ: both option values rise, so the callable falls and the putable rises.</p>`}},
 challenge:{text:'What is the value of the <b>callable bond</b> (3 decimals)?',ask:{ans:(v,o)=>o.cl,tol:.01,dp:3}}});

/* b11 — credit valuation adjustment */
LABS.cva=(el,m,done)=>calcLab(el,m,done,{inputs:[['c','Annual coupon (%)',5,.05],['n','Years to maturity',3],['rf','Risk-free rate, flat (%)',3,.05],['h','Hazard rate (%/yr)',2,.1],['rr','Recovery rate (%)',40]],
 compute:v=>{const n=Math.round(v.n),rf=v.rf/100,h=v.h/100;let vnd=0;for(let t=1;t<=n;t++)vnd+=(v.c+(t===n?100:0))/Math.pow(1+rf,t);let cva=0,pos=1,rows='';
  for(let t=1;t<=n;t++){let ex=0;for(let s=t;s<=n;s++)ex+=(v.c+(s===n?100:0))/Math.pow(1+rf,s-t);const lgd=ex*(1-v.rr/100),pod=pos*h;pos*=1-h;const df=1/Math.pow(1+rf,t),pv=lgd*pod*df;cva+=pv;rows+=`<tr><td>${t}</td><td>${fmt(ex,3)}</td><td>${fmt(lgd,3)}</td><td>${pct(pod,3)}</td><td>${fmt(df,4)}</td><td>${fmt(pv,4)}</td></tr>`}
  const fv=vnd-cva;let lo=0,hi=.5;for(let i=0;i<80;i++){const y=(lo+hi)/2;let p=0;for(let t=1;t<=n;t++)p+=(v.c+(t===n?100:0))/Math.pow(1+y,t);if(p>fv)lo=y;else hi=y}const ytm=(lo+hi)/2;
  return{out:{cva},html:`<div class="grid g4 g2m">${stat('Value if default-free',fmt(vnd,3))}${stat('CVA',fmt(cva,3))}${stat('Fair value',fmt(fv,3))}${stat('Credit spread',fmt((ytm-rf)*1e4,0)+' bp')}</div><div class="tablewrap"><table class="t"><tr><th>Date</th><th>Exposure</th><th>LGD</th><th>POD</th><th>DF</th><th>PV of EL</th></tr>${rows}</table></div><div class="formula">POD<sub>t</sub> = hazard × POS<sub>t−1</sub> · CVA = Σ LGD<sub>t</sub> × POD<sub>t</sub> × DF<sub>t</sub></div>`}},
 challenge:{text:'What is the <b>CVA</b> (3 decimals)?',ask:{ans:(v,o)=>o.cva,tol:.01,dp:3,why:()=>'A CDS buyer is paid LGD on default; the CDS spread is roughly hazard × (1 − recovery). The same logic prices both.'}}});

/* b12 — Black–Scholes–Merton and Greeks */
LABS.bsm=(el,m,done)=>calcLab(el,m,done,{inputs:[['s','Underlying price S',100],['k','Strike K',100],['T','Time to expiry (years)',.5,.05],['r','Risk-free rate, continuous (%)',4,.1],['sg','Volatility σ (%)',25,.5],['q','Dividend yield, continuous (%)',0,.1]],
 compute:v=>{const r=v.r/100,sg=v.sg/100,q=v.q/100,sq=sg*Math.sqrt(v.T),d1=(Math.log(v.s/v.k)+(r-q+sg*sg/2)*v.T)/sq,d2=d1-sq,eq=Math.exp(-q*v.T),er=Math.exp(-r*v.T);const c=v.s*eq*ncdf(d1)-v.k*er*ncdf(d2),p=v.k*er*ncdf(-d2)-v.s*eq*ncdf(-d1),nd=Math.exp(-d1*d1/2)/Math.sqrt(2*Math.PI),dc=eq*ncdf(d1),gm=eq*nd/(v.s*sq),vega=v.s*eq*nd*Math.sqrt(v.T)/100;
  return{out:{c},html:`<div class="grid g4 g2m">${stat('Call',fmt(c,3))}${stat('Put',fmt(p,3),'via BSM')}${stat('Call delta',fmt(dc,3),`put delta ${fmt(dc-eq,3)}`)}${stat('Gamma · vega',`${fmt(gm,4)} · ${fmt(vega,3)}`,'vega per 1 vol point')}</div><div class="formula">c = S e<sup>−qT</sup>N(d₁) − K e<sup>−rT</sup>N(d₂) · d₁ = [ln(S/K) + (r − q + σ²/2)T] ÷ σ√T · d₂ = d₁ − σ√T</div><p class="note">d₁ = ${fmt(d1,4)}, d₂ = ${fmt(d2,4)}. Delta hedge: short ${fmt(dc,3)} shares per long call. Gamma is highest near the money close to expiry, where delta hedges need the most rebalancing.</p>`}},
 challenge:{text:'What is the <b>BSM call value</b> (3 decimals)?',ask:{ans:(v,o)=>o.c,tol:.02,dp:3}}});

/* b13 — venture capital method */
LABS.vcm=(el,m,done)=>calcLab(el,m,done,{inputs:[['exit','Expected exit value (USD m)',400],['n','Years to exit',5],['r','Required (target) return (%)',40],['inv','Investment now (USD m)',20],['sh','Founders\' shares (m)',10]],
 compute:v=>{const post=v.exit/Math.pow(1+v.r/100,v.n),pre=post-v.inv,f=v.inv/post,ns=v.sh*f/(1-f),px=v.inv/ns;
  return{out:{f:f*100},html:`<div class="grid g4 g2m">${stat('Post-money value',fmt(post,2))}${stat('Pre-money value',fmt(pre,2))}${stat('Required ownership',pct(f,2))}${stat('New shares · price',`${fmt(ns,3)}m · ${fmt(px,3)}`)}</div><div class="formula">POST = exit value ÷ (1 + r)<sup>N</sup> · f = investment ÷ POST · new shares = founders' shares × f ÷ (1 − f)</div><p class="note">VC target returns are high because they embed the probability of failure. A cleaner approach adjusts the exit value for failure risk and uses a lower discount rate. Dilution from later rounds raises the ownership needed today.</p>`}},
 challenge:{text:'What <b>ownership percentage</b> must the investor receive?',ask:{ans:(v,o)=>o.f,tol:.05,dp:2,unit:'%'}}});

/* b14 — parametric VaR and the fundamental law */
LABS.varlab=(el,m,done)=>calcLab(el,m,done,{inputs:[['pv','Portfolio value (USD m)',50],['mu','Expected annual return (%)',8,.1],['sg','Annual volatility (%)',18,.1],['cl','Confidence level (%)',95,.5],['d','Horizon (trading days)',1],['ic','Information coefficient IC',.05,.01],['br','Breadth BR (independent bets/yr)',100],['tc','Transfer coefficient TC',.9,.05]],
 compute:v=>{const T=v.d/250,z=zinv(v.cl/100),vr=Math.max(0,(z*v.sg/100*Math.sqrt(T)-v.mu/100*T))*v.pv,ir=v.tc*v.ic*Math.sqrt(v.br);
  return{out:{vr},html:`<div class="grid g4 g2m">${stat('z for confidence',fmt(z,3))}${stat(`${v.d}-day VaR`,`USD ${fmt(vr,3)}m`,pct(vr/v.pv,2)+' of value')}${stat('Expected IR',fmt(ir,3),'TC × IC × √BR')}${stat('IR if TC = 1',fmt(v.ic*Math.sqrt(v.br),3))}</div><div class="formula">VaR = [z σ √T − μT] × V · fundamental law: E(R<sub>A</sub>) ≈ TC × IC × √BR × σ<sub>A</sub></div><p class="note">VaR is a minimum loss in the tail, not the worst case; conditional VaR (expected shortfall) averages the tail. Backtest by counting exceedances: at 95% you expect about 5 in 100 days.</p>`}},
 challenge:{text:'What is the parametric <b>VaR</b> in USD millions (3 decimals)?',ask:{ans:(v,o)=>o.vr,tol:.005,dp:3,unit:'USD m'}}});

/* b15 — item-set technique */
LABS.itemset=(el,m,done)=>classifyLab(el,done,{intro:'Good exam practice or a trap?',cats:['Good practice','Trap'],
 items:[['Reading the four questions before the vignette, then reading the vignette with them in mind.','Good practice','you know what data to look for'],
 ['Spending 12 minutes on one hard calculation in the first set.','Trap','each set is worth the same; budget about 18 minutes per set of 4 questions'],
 ['Treating every number in the vignette as needed for an answer.','Trap','vignettes include distractors'],
 ['Checking whether the vignette says "IFRS" or "US GAAP" before answering accounting questions.','Good practice','treatments differ (e.g. interest paid classification)'],
 ['Picking the answer that matches your rough estimate when two choices are close, without checking signs.','Trap','sign and timing errors are the commonest distractors'],
 ['Flagging a question, guessing, and returning if time allows.','Good practice','there is no penalty for wrong answers'],
 ['Re-reading the analyst\'s statement in the vignette before judging whether it is "correct".','Good practice','questions often test one word in the statement'],
 ['Assuming an ethics vignette has a violation in every paragraph.','Trap','several actions are usually fine']],
 why:'Item sets reward reading discipline as much as knowledge: questions first, mark the data, watch IFRS vs US GAAP, and keep moving.'});

/* b16 — Level II mock: which valuation model fits? */
LABS.modelpick=(el,m,done)=>classifyLab(el,done,{intro:'Choose the most appropriate valuation approach for each situation.',cats:['Dividend discount model','Free cash flow to equity','Free cash flow to the firm','Residual income','Market multiples'],
 items:[['A mature utility with stable dividends linked to earnings, valued for a minority investor.','Dividend discount model','dividends reflect the value a minority holder receives'],
 ['A company that pays no dividends, has stable leverage, valued from a control perspective.','Free cash flow to equity','control perspective; leverage stable'],
 ['A highly leveraged company whose capital structure is expected to change; FCFE is negative.','Free cash flow to the firm','value the firm, then subtract debt'],
 ['A fast-growing company with negative free cash flow for years but clean, reliable accounting and book value.','Residual income','value comes mostly from book value'],
 ['A quick check of an IPO price against listed peers.','Market multiples','relative valuation'],
 ['A bank whose cash flows are hard to define but whose book value is marked close to market.','Residual income','book value is meaningful for financial firms'],
 ['A stable company paying out roughly all FCFE as dividends to minority holders.','Dividend discount model','dividends ≈ FCFE, simplest model']],
 why:'Model choice is an exam favourite: match the model to what the investor receives (dividends, FCFE, control) and to what is measurable (cash flow vs book value).'});

/* ================= CFA Level III labs (original exercises; all figures illustrative) ================= */
const irr=cfs=>{let lo=-.99,hi=2;const npv=r=>cfs.reduce((s,c,t)=>s+c/Math.pow(1+r,t),0);if(npv(lo)*npv(hi)>0)return NaN;for(let i=0;i<200;i++){const mi=(lo+hi)/2;if(npv(lo)*npv(mi)<=0)hi=mi;else lo=mi}return(lo+hi)/2};

/* x01 — Grinold–Kroner */
LABS.gk=(el,m,done)=>calcLab(el,m,done,{inputs:[['dy','Dividend yield (%)',3,.1],['inf','Expected inflation (%)',2,.1],['g','Real earnings growth (%)',3,.1],['ds','Change in shares outstanding (%/yr; buybacks negative)',-.5,.1],['dpe','Repricing: change in P/E (%/yr)',.5,.1]],
 compute:v=>{const inc=v.dy-v.ds,ng=v.inf+v.g,er=inc+ng+v.dpe;
  return{out:{er},html:`<div class="grid g4 g2m">${stat('Expected equity return',fmt(er,2)+'%')}${stat('Income return',fmt(inc,2)+'%','D/P − %ΔS')}${stat('Nominal earnings growth',fmt(ng,2)+'%','inflation + real growth')}${stat('Repricing return',fmt(v.dpe,2)+'%','%ΔP/E')}</div><div class="formula">E(R) ≈ D/P + (%ΔE − %ΔS) + %ΔP/E</div><p class="note">Repricing is the most judgemental part: assuming P/E expansion forever is a common error. Net buybacks (negative %ΔS) add to the income return.</p>`}},
 challenge:{text:'What is the <b>expected equity return</b> (%)?',ask:{ans:(v,o)=>o.er,tol:.02,dp:2,unit:'%'}}});

/* x02 — mean–variance utility and the optimal equity weight */
LABS.saa=(el,m,done)=>calcLab(el,m,done,{inputs:[['me','Equity expected return (%)',8,.1],['mb','Bond expected return (%)',4,.1],['se','Equity volatility (%)',18,.1],['sb','Bond volatility (%)',6,.1],['rho','Correlation',.2,.05],['lam','Risk aversion λ',4,.5]],
 compute:v=>{const me=v.me/100,mb=v.mb/100,se=v.se/100,sb=v.sb/100,c=v.rho*se*sb;const U=w=>{const mu=w*me+(1-w)*mb,va=w*w*se*se+(1-w)*(1-w)*sb*sb+2*w*(1-w)*c;return mu-.5*v.lam*va};let ws=(me-mb+v.lam*(sb*sb-c))/(v.lam*(se*se+sb*sb-2*c));const wc=Math.min(1,Math.max(0,ws));
  const pts=Array.from({length:21},(_,k)=>[k*5,U(k/20)*100]);const um=Math.max(...pts.map(p=>p[1])),un=Math.min(...pts.map(p=>p[1]));
  return{out:{w:wc*100},html:`<div class="grid g3">${stat('Optimal equity weight',pct(wc,1),ws!==wc?'constrained to 0–100%':'')}${stat('Expected return',pct(wc*me+(1-wc)*mb,2))}${stat('Risk-adjusted utility',fmt(U(wc)*100,2)+'%','U = E(R) − ½λσ²')}</div>${plotXY({x0:0,x1:100,y0:un-.2,y1:um+.2,h:190,fx:t=>fmt(t)+'%',fy:t=>fmt(t,1)+'%',series:[{pts,l:'utility'}],vlines:[[wc*100,'var(--tc)','optimum']],xl:'equity weight'})}<p class="note">Raise λ and the optimum shifts to bonds. In practice, asset-only optimisation is extended to <b>surplus</b> (assets minus liabilities) for pension plans and to goals-based buckets for individuals.</p>`}},
 challenge:{text:'What <b>equity weight</b> maximises utility (%)?',ask:{ans:(v,o)=>o.w,tol:.5,dp:1,unit:'%'}}});

/* x03 — corridor rebalancing */
LABS.rebal=(el,m,done)=>calcLab(el,m,done,{inputs:[['pv','Portfolio value at start (SAR m)',100],['tw','Target equity weight (%)',60],['cw','Corridor ± (percentage points)',5,.5],['re','Equity return this period (%)',25,.5],['rb','Bond return this period (%)',-2,.5]],
 compute:v=>{const e=v.pv*v.tw/100*(1+v.re/100),b=v.pv*(1-v.tw/100)*(1+v.rb/100),tot=e+b,w=e/tot*100,out=Math.abs(w-v.tw)>v.cw,toT=e-v.tw/100*tot,edge=e-(v.tw+Math.sign(w-v.tw)*v.cw)/100*tot;
  return{out:{toT},html:`<div class="grid g4 g2m">${stat('Equity weight now',fmt(w,2)+'%',`corridor ${fmt(v.tw-v.cw,1)}–${fmt(v.tw+v.cw,1)}%`)}${stat('Rebalance?',out?'Yes: outside corridor':'No: inside corridor')}${stat(toT>=0?'Sell equity to target':'Buy equity to target','SAR '+fmt(Math.abs(toT),2)+'m')}${stat('Trade to corridor edge only','SAR '+fmt(out?Math.abs(edge):0,2)+'m')}</div><p class="note">Wider corridors suit higher transaction costs, higher risk tolerance and assets that are highly correlated with the rest of the portfolio. Narrower corridors suit more volatile assets. Rebalancing is a mild contrarian strategy: it earns most in mean-reverting markets.</p>`}},
 challenge:{text:'How much equity must be sold (SAR m) to <b>restore the target weight</b>?',ask:{ans:(v,o)=>o.toT,tol:.02,dp:2,unit:'SAR m'}}});

/* x04 — core–satellite active risk */
LABS.coresat=(el,m,done)=>calcLab(el,m,done,{inputs:[['w1','Index fund weight (%)',50],['w2','Enhanced index weight (%)',30],['a2','Enhanced: expected alpha (%)',1,.1],['t2','Enhanced: tracking error (%)',2,.1],['a3','Active manager: expected alpha (%)',3,.1],['t3','Active manager: tracking error (%)',6,.1],['fee','Active manager fee above index (%)',.6,.05]],
 compute:v=>{const w2=v.w2/100,w3=Math.max(0,1-v.w1/100-w2),al=w2*v.a2+w3*(v.a3-v.fee),te=Math.sqrt(Math.pow(w2*v.t2,2)+Math.pow(w3*v.t3,2)),ir=te?al/te:0;
  return{out:{te},html:`<div class="grid g4 g2m">${stat('Active manager weight',pct(w3,0),'the remainder')}${stat('Portfolio alpha (after fees)',fmt(al,2)+'%')}${stat('Portfolio active risk',fmt(te,3)+'%','managers\' active returns uncorrelated')}${stat('Information ratio',fmt(ir,2))}</div><div class="formula">Active risk = √(Σ w<sub>i</sub>² × TE<sub>i</sub>²) · alpha = Σ w<sub>i</sub> × α<sub>i</sub></div><p class="note">The passive core costs little and adds no active risk; satellites add alpha at the cost of active risk and fees. Choose active managers when the expected alpha after fees justifies the risk budget.</p>`}},
 challenge:{text:'What is the portfolio\'s <b>total active risk</b> (%)?',ask:{ans:(v,o)=>o.te,tol:.01,dp:3,unit:'%'}}});

/* x05 — closing a duration gap with futures */
LABS.ldi=(el,m,done)=>calcLab(el,m,done,{inputs:[['lpv','Liability PV (SAR m)',500],['ld','Liability duration',12,.1],['amv','Asset market value (SAR m)',450],['ad','Asset duration',8,.1],['fb','Futures BPV per contract (SAR)',95,1],['hr','Hedge ratio (%)',100]],
 compute:v=>{const bl=v.lpv*1e6*v.ld*1e-4,ba=v.amv*1e6*v.ad*1e-4,gap=bl-ba,n=gap*v.hr/100/v.fb;
  return{out:{n},html:`<div class="grid g4 g2m">${stat('Liability BPV','SAR '+fmt(bl,0))}${stat('Asset BPV','SAR '+fmt(ba,0))}${stat('BPV gap','SAR '+fmt(gap,0),gap>0?'assets too short':'assets too long')}${stat(n>=0?'Futures to buy':'Futures to sell',fmt(Math.abs(n),1)+' contracts')}</div><div class="formula">N = (BPV<sub>liabilities</sub> − BPV<sub>assets</sub>) × hedge ratio ÷ BPV<sub>futures</sub></div><p class="note">A hedge ratio below 100% leaves deliberate rate exposure. Immunisation also needs the asset convexity to exceed the liability\'s (with matched duration and PV) and periodic rebalancing. Contingent immunisation allows active management while the surplus stays above a floor.</p>`}},
 challenge:{text:'How many futures contracts close the gap at a 100% hedge ratio?',ask:{ans:(v,o)=>o.n,tol:1,dp:0}}});

/* x06 — implementation shortfall */
LABS.isf=(el,m,done)=>calcLab(el,m,done,{inputs:[['dp','Decision price',50,.01],['ap','Arrival price',50.2,.01],['q','Shares ordered',10000],['fq','Shares filled',8000],['ep','Average execution price',50.4,.01],['cm','Commissions (total)',400],['cp','Closing price when order cancelled',51,.01]],
 compute:v=>{const paper=v.q*v.dp,d=v.fq*(v.ap-v.dp),ex=v.fq*(v.ep-v.ap),op=(v.q-v.fq)*(v.cp-v.dp),tot=d+ex+op+v.cm,bp=x=>x/paper*1e4;
  return{out:{bp:bp(tot)},html:`<div class="tablewrap"><table class="t"><tr><th>Component</th><th>SAR</th><th>bp</th></tr><tr><td>Delay cost</td><td>${fmt(d,0)}</td><td>${fmt(bp(d),1)}</td></tr><tr><td>Execution (trading) cost</td><td>${fmt(ex,0)}</td><td>${fmt(bp(ex),1)}</td></tr><tr><td>Opportunity cost</td><td>${fmt(op,0)}</td><td>${fmt(bp(op),1)}</td></tr><tr><td>Fees</td><td>${fmt(v.cm,0)}</td><td>${fmt(bp(v.cm),1)}</td></tr><tr><th>Implementation shortfall</th><th>${fmt(tot,0)}</th><th>${fmt(bp(tot),1)}</th></tr></table></div><p class="note">IS compares the real portfolio with a paper portfolio traded instantly at the decision price. Delay reflects slowness to reach the market; execution reflects market impact; opportunity cost reflects shares never filled. Urgent, small orders suit aggressive algorithms; large orders in illiquid names suit patient (VWAP, IS-minimising) algorithms or dark pools.</p>`}},
 challenge:{text:'What is the total <b>implementation shortfall</b> in basis points?',ask:{ans:(v,o)=>o.bp,tol:.5,dp:1,unit:'bp'}}});

/* x07 — beta adjustment with futures and currency returns */
LABS.betafut=(el,m,done)=>calcLab(el,m,done,{inputs:[['pv','Portfolio value (SAR m)',200],['b0','Current beta',1.1,.05],['bt','Target beta',.6,.05],['f','Futures price (index points)',2000],['mult','Contract multiplier (SAR per point)',250],['rfc','Foreign asset return in local currency (%)',6,.1],['rfx','Foreign currency return vs SAR (%)',-3,.1]],
 compute:v=>{const n=(v.bt-v.b0)*v.pv*1e6/(v.f*v.mult),rdc=((1+v.rfc/100)*(1+v.rfx/100)-1)*100;
  return{out:{n},html:`<div class="grid g3">${stat(n<0?'Futures to sell':'Futures to buy',fmt(Math.abs(n),1)+' contracts')}${stat('Contract value','SAR '+fmt(v.f*v.mult,0))}${stat('Domestic-currency return',fmt(rdc,2)+'%','(1 + R<sub>FC</sub>)(1 + R<sub>FX</sub>) − 1')}</div><div class="formula">N = (β<sub>target</sub> − β<sub>portfolio</sub>) ÷ β<sub>futures</sub> × portfolio value ÷ (futures price × multiplier)</div><p class="note">Overlays change risk without selling the underlying assets. For currency, a passive hedge locks the forward rate; discretionary and active hedging allow views. Hedging is costlier when the forward points work against you, and SAR-based investors face little USD risk because of the peg.</p>`}},
 challenge:{text:'How many futures contracts must be <b>sold</b> to reach the target beta?',ask:{ans:(v,o)=>-o.n,tol:.5,dp:1}}});

/* x08 — Brinson–Fachler attribution */
LABS.brinson=(el,m,done)=>calcLab(el,m,done,{inputs:[['wpa','Portfolio weight, sector A (%)',70],['wba','Benchmark weight, sector A (%)',50],['rpa','Portfolio return, sector A (%)',10,.1],['rba','Benchmark return, sector A (%)',8,.1],['rpb','Portfolio return, sector B (%)',4,.1],['rbb','Benchmark return, sector B (%)',5,.1]],
 compute:v=>{const wp=[v.wpa/100,1-v.wpa/100],wb=[v.wba/100,1-v.wba/100],rp=[v.rpa,v.rpb],rb=[v.rba,v.rbb],RB=wb[0]*rb[0]+wb[1]*rb[1],RP=wp[0]*rp[0]+wp[1]*rp[1];const al=[0,1].map(i=>(wp[i]-wb[i])*(rb[i]-RB)),se=[0,1].map(i=>wb[i]*(rp[i]-rb[i])),it=[0,1].map(i=>(wp[i]-wb[i])*(rp[i]-rb[i]));const S=a=>a[0]+a[1];
  return{out:{al:S(al)},html:`<div class="tablewrap"><table class="t"><tr><th></th><th>Allocation</th><th>Selection</th><th>Interaction</th></tr><tr><td>Sector A</td><td>${fmt(al[0],2)}</td><td>${fmt(se[0],2)}</td><td>${fmt(it[0],2)}</td></tr><tr><td>Sector B</td><td>${fmt(al[1],2)}</td><td>${fmt(se[1],2)}</td><td>${fmt(it[1],2)}</td></tr><tr><th>Total</th><th>${fmt(S(al),2)}</th><th>${fmt(S(se),2)}</th><th>${fmt(S(it),2)}</th></tr></table></div><div class="grid g3">${stat('Portfolio return',fmt(RP,2)+'%')}${stat('Benchmark return',fmt(RB,2)+'%')}${stat('Active return',fmt(RP-RB,2)+'%','= allocation + selection + interaction')}</div><div class="formula">Allocation = (w<sub>p</sub> − w<sub>b</sub>)(R<sub>b,i</sub> − R<sub>B</sub>) · Selection = w<sub>b</sub>(R<sub>p,i</sub> − R<sub>b,i</sub>) · Interaction = (w<sub>p</sub> − w<sub>b</sub>)(R<sub>p,i</sub> − R<sub>b,i</sub>)</div>`}},
 challenge:{text:'What is the <b>total allocation effect</b> (%)?',ask:{ans:(v,o)=>o.al,tol:.01,dp:2,unit:'%'}}});

/* x09 — GIPS */
LABS.gips=(el,m,done)=>classifyLab(el,done,{intro:'Under the 2020 GIPS standards for firms, is each practice required, recommended or optional, or not permitted?',cats:['Required','Recommended or optional','Not permitted'],
 items:[['Including all actual, fee-paying, discretionary segregated portfolios in at least one composite.','Required','composites must be complete'],
 ['Claiming compliance "except for" one strategy\'s composites.','Not permitted','compliance is all or nothing, firm-wide'],
 ['Having the firm verified by an independent verifier.','Recommended or optional','verification is recommended, not required'],
 ['Moving a portfolio into a better-performing composite after the fact.','Not permitted','composite switches cannot be applied retroactively to improve results'],
 ['Presenting at least five years of compliant performance (or since inception) when first claiming compliance, then building to ten.','Required','minimum track record'],
 ['Linking simulated or model results with actual performance.','Not permitted','hypothetical results must never be linked to actual'],
 ['Obtaining a performance examination of a specific composite.','Recommended or optional','optional, in addition to verification'],
 ['Defining the firm as the entity held out to clients as a distinct business.','Required','the definition sets the scope of compliance']],
 why:'GIPS rests on fair representation and full disclosure. "Must" items are requirements; verification is recommended. Partial claims and cherry-picking are never allowed.'});

/* x10 — constructed-response technique */
LABS.crtech=(el,m,done)=>classifyLab(el,done,{intro:'Strong or weak constructed-response habit?',cats:['Strong answer','Weak answer'],
 items:[['Asked to "determine and justify", states the choice first, then two specific reasons from the case.','Strong answer','command word answered directly'],
 ['Restates the case facts at length before reaching a conclusion.','Weak answer','graders award points for conclusions and reasons, not repetition'],
 ['Shows the formula, the inputs and the result for a calculation.','Strong answer','partial credit is possible when working is shown'],
 ['Gives a conclusion with no justification when the question says "justify".','Weak answer','usually earns at most half the points'],
 ['Uses short bullet points rather than long paragraphs.','Strong answer','clear and fast to grade'],
 ['Writes "it could be either" instead of choosing.','Weak answer','a decision is required'],
 ['Links the recommendation to the client\'s constraints (liquidity, horizon, taxes).','Strong answer','Level III rewards client-specific reasoning'],
 ['Spends far more time on a small-point question than its points justify.','Weak answer','budget time in proportion to points']],
 why:'Constructed responses are graded against a key: answer the command word, be specific to the case, show working, and move on.'});

/* x11 — active share */
LABS.activeshare=(el,m,done)=>calcLab(el,m,done,{inputs:[['p1','Portfolio weight: stock 1 (%)',40],['p2','Portfolio: stock 2 (%)',30],['p3','Portfolio: stock 3 (%)',20],['p4','Portfolio: stock 4 (%)',10],['b1','Benchmark: stock 1 (%)',25],['b2','Benchmark: stock 2 (%)',25],['b3','Benchmark: stock 3 (%)',25],['b4','Benchmark: stock 4 (%)',25]],
 compute:v=>{const P=[v.p1,v.p2,v.p3,v.p4],B=[v.b1,v.b2,v.b3,v.b4],sp=P.reduce((a,b)=>a+b,0),sb=B.reduce((a,b)=>a+b,0),as=.5*P.reduce((a,p,i)=>a+Math.abs(p/sp-B[i]/sb),0)*100;
  return{out:{as},html:`<div class="grid g3">${stat('Active share',fmt(as,1)+'%')}${stat('Weights sum',`${fmt(sp,0)}% · ${fmt(sb,0)}%`,'normalised to 100%')}${stat('Style',as<20?'index-like':as<60?'closet indexer if tracking error is low':'truly active')}</div><div class="formula">Active share = ½ Σ |w<sub>p,i</sub> − w<sub>b,i</sub>|</div><p class="note">Active share measures how different the holdings are; tracking error measures how different the returns are. High active share with low tracking error: diversified stock-picker. Low active share with high tracking error: concentrated factor bets.</p>`}},
 challenge:{text:'What is the <b>active share</b> (%)?',ask:{ans:(v,o)=>o.as,tol:.1,dp:1,unit:'%'}}});

/* x12 — fixed income expected return decomposition */
LABS.fiexp=(el,m,done)=>calcLab(el,m,done,{inputs:[['yi','Yield income / rolling yield component (%)',4.5,.05],['rd','Rolldown return (%)',.4,.05],['dur','Modified duration',6,.1],['dy','Expected yield change (bp)',25],['cx','Convexity',50],['cl','Expected credit losses (%)',.3,.05],['fx','Currency gain or loss (%)',0,.1]],
 compute:v=>{const dy=v.dy/1e4,pc=(-v.dur*dy+.5*v.cx*dy*dy)*100,tot=v.yi+v.rd+pc-v.cl+v.fx;
  return{out:{tot},html:`<div class="grid g4 g2m">${stat('Rolling yield',fmt(v.yi+v.rd,2)+'%','income + rolldown')}${stat('From yield change',fmt(pc,3)+'%','−D·Δy + ½C·Δy²')}${stat('Credit losses',fmt(-v.cl,2)+'%')}${stat('Expected return',fmt(tot,3)+'%')}</div><p class="note">Rolling yield is earned if the curve stays where it is. The yield-change term expresses a view. A barbell has more convexity than a bullet of the same duration, so it gains relatively when rates move a lot or the curve flattens.</p>`}},
 challenge:{text:'What is the bond portfolio\'s <b>expected total return</b> (%)?',ask:{ans:(v,o)=>o.tot,tol:.01,dp:3,unit:'%'}}});

/* x13 — merger arbitrage */
LABS.mergerarb=(el,m,done)=>calcLab(el,m,done,{inputs:[['tp','Target price now',36,.1],['ap','Acquirer price',50,.1],['er','Exchange ratio (acquirer shares per target share)',.8,.01],['mo','Months to completion',6],['p','Probability of completion (%)',85],['fb','Target price if the deal fails',28,.5]],
 compute:v=>{const off=v.ap*v.er,spr=off-v.tp,g=spr/v.tp,ann=Math.pow(1+g,12/v.mo)-1,ev=v.p/100*off+(1-v.p/100)*v.fb,er=ev/v.tp-1;
  return{out:{er:er*100},html:`<div class="grid g4 g2m">${stat('Offer value',fmt(off,2))}${stat('Deal spread',fmt(spr,2),pct(g,2)+' gross')}${stat('Annualised if completed',pct(ann,2))}${stat('Probability-weighted return',pct(er,2))}</div><p class="note">In a stock deal the arbitrageur buys the target and shorts ${fmt(v.er,2)} acquirer shares per target share, locking the spread. The payoff resembles <b>selling a put</b>: small, steady gains, with a large loss if the deal breaks. Event-driven returns rise with deal activity and fall in risk-off markets.</p>`}},
 challenge:{text:'What is the <b>probability-weighted expected return</b> on the target shares (%)?',ask:{ans:(v,o)=>o.er,tol:.05,dp:2,unit:'%'}}});

/* x14 — fixed income strategy views */
LABS.curveview=(el,m,done)=>classifyLab(el,done,{intro:'Pick the positioning that best expresses each view, relative to a benchmark of the same duration where relevant.',cats:['Extend duration','Shorten duration','Barbell','Bullet'],
 items:[['Rates will fall in a parallel shift.','Extend duration','gain more from the rally'],['Rates will rise in a parallel shift.','Shorten duration','lose less'],['The curve will flatten (long rates fall relative to short).','Barbell','long end benefits; more convexity'],['The curve will steepen around the 5-year point while the ends stay put.','Bullet','concentrate where the gain is'],['Interest-rate volatility will rise sharply, direction unknown.','Barbell','long convexity benefits from big moves'],['Volatility will stay low and the curve stable: you want to sell convexity for extra yield.','Bullet','less convexity, more yield']],
 why:'Duration expresses level views; barbells versus bullets express shape and volatility views. Always state the view first, then the trade.'});

/* x15 — private equity fund metrics */
LABS.pefund=(el,m,done)=>calcLab(el,m,done,{inputs:[['cc','Committed capital (USD m)',100],['pi','Paid-in capital',80],['di','Cumulative distributions',60],['nav','Residual NAV',70],['mf','Management fee (% of committed, per year)',2,.1],['yrs','Years since first close',6]],
 compute:v=>{const dpi=v.di/v.pi,rvpi=v.nav/v.pi,tvpi=dpi+rvpi,fees=v.mf/100*v.cc*v.yrs;
  return{out:{tvpi},html:`<div class="grid g4 g2m">${stat('DPI',fmt(dpi,3)+'×','realised')}${stat('RVPI',fmt(rvpi,3)+'×','unrealised')}${stat('TVPI',fmt(tvpi,3)+'×')}${stat('Unfunded commitment','USD '+fmt(v.cc-v.pi,0)+'m',`fees paid ≈ ${fmt(fees,0)}m`)}</div><p class="note">Early in a fund's life, fees and unrealised losses create the <b>J-curve</b>. TVPI depends on appraised NAV, so DPI is the harder test. Compare with public market equivalents and remember unfunded commitments must be kept liquid.</p>`}},
 challenge:{text:'What is the fund\'s <b>TVPI</b>?',ask:{ans:(v,o)=>o.tvpi,tol:.005,dp:3}}});

/* x16 — property DCF */
LABS.redcf=(el,m,done)=>calcLab(el,m,done,{inputs:[['noi','NOI year 1 (SAR m)',10,.1],['g','NOI growth (%)',2,.1],['n','Holding period (years)',5],['ec','Exit cap rate on next year\'s NOI (%)',7,.1],['r','Discount rate (%)',8.5,.1]],
 compute:v=>{const n=Math.round(v.n),r=v.r/100,g=v.g/100;let pv=0;for(let t=1;t<=n;t++)pv+=v.noi*Math.pow(1+g,t-1)/Math.pow(1+r,t);const exit=v.noi*Math.pow(1+g,n)/(v.ec/100),val=pv+exit/Math.pow(1+r,n);
  return{out:{val},html:`<div class="grid g4 g2m">${stat('Value today','SAR '+fmt(val,2)+'m')}${stat('PV of NOI','SAR '+fmt(pv,2)+'m')}${stat('Exit value','SAR '+fmt(exit,2)+'m','in year '+n)}${stat('Going-in cap rate',pct(v.noi/val,2))}</div><p class="note">Value is very sensitive to the exit cap rate. Infrastructure is valued the same way, but with long concession cash flows that are often inflation-linked; brownfield assets have lower risk than greenfield projects.</p>`}},
 challenge:{text:'What is the <b>value of the property</b> today (SAR m)?',ask:{ans:(v,o)=>o.val,tol:.05,dp:2,unit:'SAR m'}}});

/* x17 — fund cash flows: IRR and multiple */
LABS.fundirr=(el,m,done)=>calcLab(el,m,done,{inputs:[['c0','Capital call year 0',40],['c1','Capital call year 1',30],['c2','Capital call year 2',20],['d3','Distribution year 3',10],['d4','Distribution year 4',30],['d5','Distribution year 5',50],['d6','Distribution year 6',60]],
 compute:v=>{const cf=[-v.c0,-v.c1,-v.c2,v.d3,v.d4,v.d5,v.d6],r=irr(cf),paid=v.c0+v.c1+v.c2,dist=v.d3+v.d4+v.d5+v.d6;let cum=0;const pts=cf.map((c,t)=>{cum+=c;return[t,cum]});
  return{out:{r:r*100},html:`<div class="grid g3">${stat('IRR',pct(r,2))}${stat('Multiple (DPI at end)',fmt(dist/paid,2)+'×')}${stat('Peak cash out',fmt(Math.min(...pts.map(p=>p[1])),0))}</div>${plotXY({x0:0,x1:6,y0:Math.min(...pts.map(p=>p[1]))*1.1,y1:Math.max(10,pts[6][1]*1.1),h:180,fx:t=>'Y'+fmt(t),fy:t=>fmt(t),series:[{pts,l:'cumulative net cash flow'}],xl:'year'})}<p class="note">The cumulative curve is the J-curve. IRR rewards early distributions; the multiple ignores timing. Use both, and compare with a public market equivalent.</p>`}},
 challenge:{text:'What is the fund\'s <b>IRR</b> (%)?',ask:{ans:(v,o)=>o.r,tol:.05,dp:2,unit:'%'}}});

/* x18 — choosing a private-markets vehicle */
LABS.pmvehicle=(el,m,done)=>classifyLab(el,done,{intro:'Which route into private markets fits each investor\'s need best?',cats:['Primary fund commitment','Secondary purchase','Co-investment','Evergreen / semi-liquid fund'],
 items:[['A new endowment wants exposure now and to reduce the J-curve.','Secondary purchase','buys mature interests at a discount; earlier distributions'],
 ['A large family office wants to back a manager\'s next 10-year buyout fund.','Primary fund commitment','classic route; full J-curve'],
 ['A sovereign fund wants to invest alongside a GP in one deal with low or no fees.','Co-investment','lower fees, more concentration'],
 ['A wealthy individual wants periodic liquidity and no capital calls.','Evergreen / semi-liquid fund','fully invested; limited redemptions'],
 ['A pension fund wants to diversify across vintages it missed.','Secondary purchase','buys older vintages'],
 ['An investor with a strong deal team wants to build concentrated positions with selected GPs.','Co-investment','needs fast due diligence']],
 why:'Primaries give access but a long J-curve; secondaries shorten it; co-investments cut fees but add concentration; semi-liquid funds trade liquidity promises against cash drag and gating risk.'});

/* x19 — after-tax accumulation */
LABS.taxacc=(el,m,done)=>calcLab(el,m,done,{inputs:[['pv','Initial investment (SAR)',1000000],['r','Pre-tax return (%)',7,.1],['n','Years',20],['t','Tax rate (%)',25]],
 compute:v=>{const r=v.r/100,t=v.t/100,acc=v.pv*Math.pow(1+r*(1-t),v.n),def=v.pv*(Math.pow(1+r,v.n)*(1-t)+t),ex=v.pv*Math.pow(1+r,v.n);
  return{out:{def},html:`<div class="grid g3">${stat('Taxed every year','SAR '+fmt(acc,0))}${stat('Tax deferred to the end','SAR '+fmt(def,0),'gain taxed at sale')}${stat('Tax-exempt','SAR '+fmt(ex,0))}</div><div class="formula">Accrual: (1 + r(1 − t))<sup>n</sup> · Deferred: (1 + r)<sup>n</sup>(1 − t) + t · Exempt: (1 + r)<sup>n</sup></div><p class="note">Deferral is worth more the longer the horizon and the higher the return. <b>Asset location</b>: hold tax-inefficient assets in tax-advantaged accounts. Saudi residents pay no personal income tax on most investments, but Zakat and foreign withholding taxes can apply, and many clients hold assets in taxed jurisdictions.</p>`}},
 challenge:{text:'What is the ending value with <b>tax deferred</b> to the end (SAR)?',ask:{ans:(v,o)=>o.def,tol:50,dp:0,unit:'SAR'}}});

/* x20 — gift vs bequest */
LABS.giftbeq=(el,m,done)=>calcLab(el,m,done,{inputs:[['rg','Return in recipient\'s hands (%)',6,.1],['tig','Recipient\'s tax on investment returns (%)',20],['re','Return in donor\'s hands (%)',6,.1],['tie','Donor\'s tax on investment returns (%)',30],['n','Years until the bequest',15],['tg','Gift tax (%)',0],['te','Estate tax (%)',40]],
 compute:v=>{const fg=Math.pow(1+v.rg/100*(1-v.tig/100),v.n)*(1-v.tg/100),fe=Math.pow(1+v.re/100*(1-v.tie/100),v.n)*(1-v.te/100),rv=fg/fe;
  return{out:{rv},html:`<div class="grid g3">${stat('FV of gift now (per 1)',fmt(fg,3))}${stat('FV of bequest later (per 1)',fmt(fe,3))}${stat('Relative value',fmt(rv,3),rv>1?'gift now is better':'bequest is better')}</div><div class="formula">RV = [1 + r<sub>g</sub>(1 − t<sub>ig</sub>)]<sup>n</sup>(1 − T<sub>g</sub>) ÷ [1 + r<sub>e</sub>(1 − t<sub>ie</sub>)]<sup>n</sup>(1 − T<sub>e</sub>)</div><p class="note">Illustrative of jurisdictions with gift and estate taxes. Saudi Arabia has no estate tax; succession follows Islamic inheritance rules (fixed shares for heirs), with up to one-third bequeathable by will to non-heirs, so planning often focuses on family governance, waqf and holding structures.</p>`}},
 challenge:{text:'What is the <b>relative value</b> of a gift now versus a bequest?',ask:{ans:(v,o)=>o.rv,tol:.005,dp:3}}});

/* x21 — human capital */
LABS.humancap=(el,m,done)=>calcLab(el,m,done,{inputs:[['inc','Expected income next year (SAR)',300000],['g','Income growth (%)',3,.1],['n','Working years left',30],['r','Risk-adjusted discount rate (%)',6,.1],['fin','Financial capital (SAR)',1500000]],
 compute:v=>{const g=v.g/100,r=v.r/100,hc=Math.abs(r-g)<1e-9?v.inc*v.n/(1+r):v.inc/(r-g)*(1-Math.pow((1+g)/(1+r),v.n)),tot=hc+v.fin;
  return{out:{hc},html:`<div class="grid g3">${stat('Human capital','SAR '+fmt(hc,0))}${stat('Financial capital','SAR '+fmt(v.fin,0))}${stat('Human capital share of total wealth',pct(hc/tot,1))}</div><div class="formula">HC = PV of future earnings = I₁ ÷ (r − g) × [1 − ((1 + g) ÷ (1 + r))<sup>n</sup>]</div><p class="note">Bond-like human capital (stable salary) allows more equity in financial capital; equity-like human capital (bonuses, own business, oil-linked sectors) argues for less. Life insurance protects human capital against premature death; annuities protect against longevity risk.</p>`}},
 challenge:{text:'What is the present value of <b>human capital</b> (SAR)?',ask:{ans:(v,o)=>o.hc,tol:50,dp:0,unit:'SAR'}}});

/* x22 — risk identification for a private client */
LABS.pwrisk=(el,m,done)=>classifyLab(el,done,{intro:'Which risk is each fact pattern mainly about?',cats:['Earnings risk','Premature death risk','Longevity risk','Property risk','Liability risk','Health risk'],
 items:[['A surgeon\'s income stops if a hand injury prevents her from operating.','Earnings risk','disability insurance'],['A sole breadwinner with three young children has no life cover.','Premature death risk','term life insurance'],['A retired couple, both 65, fear running out of money in their 90s.','Longevity risk','annuities, longevity pooling'],['A villa in a flood-prone area is uninsured.','Property risk','property insurance'],['A family member drives the family car and could injure someone.','Liability risk','liability cover'],['Long-term care costs could consume savings late in life.','Health risk','health and long-term care cover']],
 why:'Private wealth risk management starts with the balance sheet, including human capital: identify each risk, then decide to avoid, reduce, transfer (insure) or retain it.'});

/* ================= Engineering Refresher labs ================= */
/* generic classification drill */
function classifyLab(el,done,cfg){let html=`<p class="note">${cfg.intro||''}</p>`+cfg.items.map((it,i)=>`<div style="margin:8px 0"><div style="font-size:.93rem">${it[0]}</div><select class="tin" data-c="${i}" style="margin-top:4px"><option value="">— choose —</option>${cfg.cats.map(c=>`<option>${c}</option>`).join('')}</select></div>`).join('')+`<div class="ctl"><button class="sbtn" id="cc">Check</button></div><div id="cm"></div>`;el.innerHTML=html;
 $('#cc',el).onclick=()=>{let n=0;$$('[data-c]',el).forEach(s=>{const it=cfg.items[+s.dataset.c],g=s.value===it[1];if(g)n++;s.style.borderColor=s.value?g?'var(--ok)':'var(--bad)':'';s.title=it[2]||''});const need=cfg.pass||Math.ceil(cfg.items.length*.75);
  $('#cm',el).innerHTML=`<div class="readout ${n>=need?'ok':''}"><b>${n}/${cfg.items.length}.</b> ${cfg.why}</div>${cfg.items.map(it=>`<div class="note">• ${it[0].replace(/<[^>]+>/g,'').slice(0,60)}… → <b>${it[1]}</b>${it[2]?': '+it[2]:''}</div>`).join('')}`;if(n>=need)done()}}

/* e01 — product-process matrix */
LABS.ppm=(el,m,done)=>classifyLab(el,done,{intro:'Match each product to the process type that usually fits its volume and variety.',cats:['Project','Job shop','Batch','Assembly line','Continuous flow'],
 items:[['A desalination plant built once for a client','Project','one-off, huge, at the customer site'],['Custom machined parts for 40 different pump models, 5–50 each','Job shop','high variety, low volume, routing differs per job'],['Bakery producing 12 bread types, each in runs of a few thousand','Batch','moderate variety, runs then changeover'],['Car assembly of one platform at 60 cars per hour','Assembly line','standard product, high volume, paced line'],['Petrochemical cracker producing ethylene','Continuous flow','commodity, very high volume, 24/7'],['Ready-mix concrete, mixed per order in shifts','Batch','discrete orders mixed in batches'],['Satellite assembled for a space agency','Project','one-of-a-kind, long duration'],['Bottled water filling at 30,000 bottles per hour','Continuous flow','near-continuous, highly automated']],
 why:'Volume and variety move together: high variety needs flexible general-purpose equipment; high volume pays for dedicated, automated flow. Mismatches (a job shop making commodity volume) cost money.'});

/* e02 — line simulation: variability and buffers */
function lineSim(n,means,cv,buf,seed){const r=RNG(seed),K=means.length;const nrm=()=>{let u=0,v=0;while(!u)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
 const S=Array.from({length:K},()=>new Float64Array(n)),D=Array.from({length:K},()=>new Float64Array(n));
 for(let j=0;j<n;j++)for(let i=0;i<K;i++){const s=Math.max(i?D[i-1][j]:0,j?D[i][j-1]:0);const p=Math.max(.1*means[i],means[i]*(1+cv*nrm()));S[i][j]=s;let d=s+p;if(i<K-1&&j-buf-1>=0)d=Math.max(d,S[i+1][j-buf-1]);D[i][j]=d}
 return n/D[K-1][n-1]}
LABS.linesim=(el,m,done)=>calcLab(el,m,done,{inputs:[['t1','Station 1 mean time (s)',58],['t2','Station 2 mean time (s)',60],['t3','Station 3 mean time (s)',59],['cv','Variability (CV of time, %)',40],['b','Buffer slots between stations',0]],
 compute:v=>{const means=[v.t1,v.t2,v.t3].map(x=>Math.max(1,x));const bn=Math.max(...means),ideal=3600/bn;const th=lineSim(2000,means,Math.max(0,v.cv)/100,Math.max(0,Math.round(v.b)),7)*3600;const ratio=th/ideal;
  const curve=[0,1,2,3,5,8].map(b=>[b,lineSim(1500,means,Math.max(0,v.cv)/100,b,7)*3600/ideal*100]);
