  return{out:{ratio},html:`<div class="grid g3"><div class="stat"><small>Bottleneck capacity</small><b>${fmt(ideal,1)} /hr</b></div><div class="stat"><small>Simulated throughput</small><b>${fmt(th,1)} /hr</b></div><div class="stat"><small>Share of bottleneck rate</small><b>${pct(ratio)}</b></div></div>${plotXY({x0:0,x1:8,y0:Math.min(...curve.map(c=>c[1]))-5,y1:100,h:200,fx:t=>fmt(t),fy:t=>fmt(t)+'%',series:[{pts:curve,l:'throughput vs buffer'}],vlines:[[Math.min(8,v.b),'var(--navy2)','you']],xl:'buffer slots'})}<p class="note">2,000 units simulated with random processing times. Without buffers, a slow cycle at one station blocks or starves its neighbours.</p>`}},
 challenge:{text:'This line is well balanced, which makes it fragile. With 40% variability, find the <b>smallest buffer</b> that gets throughput to <b>95% or more</b> of the bottleneck rate.',test:(v,o)=>o.ratio>=.95&&v.cv>=40,why:'Variability plus tight coupling destroys capacity. Buffers (or less variability: standard work, TPM) protect the bottleneck. Lean reduces variability first so it can then remove buffers.'}});

/* e03 — line balancing with RPW */
const LB={tasks:{A:[45,''],B:[11,'A'],C:[9,'B'],D:[50,''],E:[15,'D'],F:[12,'C'],G:[12,'C'],H:[12,'E'],I:[12,'E'],J:[8,'FGHI']},takt:60};
function rpw(){const T=LB.tasks,ks=Object.keys(T);const succ=k=>{const s=new Set();const go=x=>ks.forEach(y=>{if(T[y][1].includes(x)&&!s.has(y)){s.add(y);go(y)}});go(k);return s};const w={};ks.forEach(k=>{w[k]=T[k][0]+[...succ(k)].reduce((a,y)=>a+T[y][0],0)});
 const order=ks.slice().sort((a,b)=>w[b]-w[a]);const asg={},done=new Set();let st=1,load=0;while(done.size<ks.length){const c=order.find(k=>!done.has(k)&&[...T[k][1]].every(p=>done.has(p))&&load+T[k][0]<=LB.takt);if(c){asg[c]=st;load+=T[c][0];done.add(c)}else{st++;load=0}}return{asg,w}}
LABS.balance=(el,m,done)=>{const T=LB.tasks,ks=Object.keys(T),tot=ks.reduce((a,k)=>a+T[k][0],0),nmin=Math.ceil(tot/LB.takt);const C=CUST('lb');C.a=C.a||{};
 const draw=()=>{el.innerHTML=`<p class="note">Demand 480 units per 8-hour shift → <b>takt time ${LB.takt} s</b>. Total work content ${tot} s → theoretical minimum <b>${nmin} stations</b>. Assign each task to a station without breaking precedence or exceeding takt.</p><div class="tablewrap"><table class="t" style="min-width:420px"><tr><th>Task</th><th>Time (s)</th><th>Must follow</th><th>Station</th></tr>${ks.map(k=>`<tr><td><b>${k}</b></td><td>${T[k][0]}</td><td>${T[k][1].split('').join(', ')||'—'}</td><td><select class="tin" data-k="${k}" style="padding:4px 6px;max-width:90px"><option value="">—</option>${[1,2,3,4,5,6].map(s=>`<option ${C.a[k]==s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div><div class="ctl"><button class="sbtn" id="ck">Check balance</button><button class="sbtn alt" id="rp">Show RPW heuristic</button></div><div id="out"></div>`;
  $$('[data-k]',el).forEach(s=>s.onchange=()=>{C.a[s.dataset.k]=s.value?+s.value:undefined;save()});
  $('#ck',el).onclick=()=>{const a=C.a;const miss=ks.filter(k=>!a[k]);if(miss.length){$('#out',el).innerHTML=`<div class="readout bad">Assign every task (missing: ${miss.join(', ')}).</div>`;return}const errs=[];ks.forEach(k=>[...T[k][1]].forEach(p=>{if(a[p]>a[k])errs.push(`${k} is before its predecessor ${p}`)}));const ns=Math.max(...ks.map(k=>a[k]));const loads=Array.from({length:ns},(_,i)=>ks.filter(k=>a[k]===i+1).reduce((s,k)=>s+T[k][0],0));loads.forEach((l,i)=>{if(l>LB.takt)errs.push(`Station ${i+1} has ${l} s > takt`)});const used=loads.filter(l=>l>0).length,eff=tot/(used*LB.takt);
   $('#out',el).innerHTML=`${bars(loads.map((l,i)=>({l:'St '+(i+1),v:l,c:l>LB.takt?'var(--bad)':'var(--gold2)'})),{h:180,f:x=>x+'s'})}<div class="readout ${errs.length?'bad':'ok'}">${errs.length?errs.join('<br>'):`<b>Valid balance: ${used} stations, efficiency ${pct(eff)}, balance delay ${pct(1-eff)}.</b> ${used<=nmin?'You hit the theoretical minimum.':'Can you do it with '+nmin+'?'}`}</div>`;if(!errs.length&&used<=nmin+1)done()};
  $('#rp',el).onclick=()=>{const {asg,w}=rpw();$('#out',el).innerHTML=`<div class="model"><b>Ranked positional weight:</b> weight = task time + time of all tasks that follow it. Assign in descending weight, respecting precedence and takt.<br>${ks.slice().sort((a,b)=>w[b]-w[a]).map(k=>`${k} (${w[k]}) → station ${asg[k]}`).join(' · ')}</div>`}};draw()};

/* e04 — value-stream map calculator */
LABS.vsm=(el,m,done)=>calcLab(el,m,done,{inputs:[['dd','Daily customer demand (units)',400],['i1','Raw material stock (units)',4000],['c1','Stamping cycle time (s)',30],['i2','WIP after stamping (units)',2400],['c2','Welding cycle time (s)',45],['i3','WIP after welding (units)',1600],['c3','Assembly cycle time (s)',55],['i4','Finished goods (units)',1200]],
 compute:v=>{const inv=[v.i1,v.i2,v.i3,v.i4],lt=inv.reduce((a,b)=>a+b/v.dd,0),va=v.c1+v.c2+v.c3,pce=va/(lt*8*3600);
  return{out:{lt,pce},html:`<div class="row" style="gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:6px 0">${inv.map((x,i)=>`<div style="text-align:center;min-width:64px"><div style="font-size:1.4rem;color:var(--gold)">▲</div><small>${fmt(x/v.dd,1)} days</small></div>${i<3?`<div class="stat" style="min-width:90px;text-align:center;padding:8px"><b style="font-size:1rem">${['Stamping','Welding','Assembly'][i]}</b><small>${[v.c1,v.c2,v.c3][i]} s</small></div>`:''}`).join('')}</div><div class="grid g3"><div class="stat"><small>Production lead time</small><b>${fmt(lt,1)} days</b></div><div class="stat"><small>Value-added time</small><b>${fmt(va)} s</b></div><div class="stat"><small>Process cycle efficiency</small><b>${(pce*100).toFixed(3)}%</b><small>(8-hour working days)</small></div></div><p class="note">Lead time = Σ inventory ÷ daily demand. Value is added for seconds; parts wait for days.</p>`}},
 challenge:{text:'Cut production lead time to <b>10 days or less</b> by reducing inventory. Which buffer would you attack first, and why?',test:(v,o)=>o.lt<=10,why:'Inventory hides problems (breakdowns, quality, long changeovers). Lower it step by step and fix what surfaces — the future-state map is a plan for exactly that.'}});

/* e05 — kanban and SMED */
LABS.kanban=(el,m,done)=>calcLab(el,m,done,{inputs:[['d','Demand (units/hour)',120],['l','Replenishment lead time (hours)',4],['a','Safety factor (%)',10],['c','Units per container',50],['co','Changeover time (minutes)',90],['n','Changeovers per day',3],['ext','Share of changeover that can be done while running (%)',40]],
 compute:v=>{const k=v.d*v.l*(1+v.a/100)/v.c,kr=Math.ceil(k),saved=v.co*v.ext/100*v.n;
  return{out:{kr},html:`<div class="grid g2"><div class="stat"><div class="eyebrow">Kanban</div>${kv([['Cards needed (exact)',fmt(k,2)],['Cards to issue',fmt(kr),1],['Max inventory in loop',fmt(kr*v.c)+' units']])}<div class="formula">N = D × L × (1 + α) ÷ C</div></div><div class="stat"><div class="eyebrow">SMED</div>${kv([['Changeover now',v.co+' min'],['After converting external work',fmt(v.co*(1-v.ext/100))+' min'],['Production time released per day',fmt(saved)+' min',1]])}<p class="note">Internal setup stops the machine; external setup can be done while it runs. Step 1 of SMED is separating them.</p></div></div>`}},
 challenge:{text:'With the current inputs, how many <b>kanban cards</b> should be issued?',ask:{ans:(v,o)=>o.kr,tol:0,dp:0,unit:'cards',why:()=>'Always round up. Then reduce cards over time: each card removed lowers inventory and exposes the next problem to solve.'}}});

/* e06 — OEE */
LABS.oee=(el,m,done)=>calcLab(el,m,done,{inputs:[['pt','Planned production time (min)',420],['dt','Downtime (min)',60],['ict','Ideal cycle time (s/unit)',30],['tc','Total units produced',620],['gc','Good units',590]],
 compute:v=>{const rt=v.pt-v.dt,A=rt/v.pt,Pf=v.ict*v.tc/60/rt,Q=v.gc/v.tc,o=A*Pf*Q;const lossA=v.dt,lossP=rt-v.ict*v.tc/60,lossQ=(v.tc-v.gc)*v.ict/60;
  return{out:{o},html:`<div class="grid g4 g2m"><div class="stat"><small>Availability</small><b>${pct(A)}</b></div><div class="stat"><small>Performance</small><b>${pct(Pf)}</b></div><div class="stat"><small>Quality</small><b>${pct(Q)}</b></div><div class="stat"><small>OEE</small><b>${pct(o)}</b></div></div>${bars([{l:'Planned',v:v.pt,c:'var(--navy2)'},{l:'Downtime',v:-lossA,c:'var(--bad)'},{l:'Speed loss',v:-lossP,c:'var(--bad)'},{l:'Quality loss',v:-lossQ,c:'var(--bad)'},{l:'Fully productive',v:v.gc*v.ict/60,c:'var(--ok)'}],{h:200,f:x=>fmt(x)+'m'})}<p class="note">Loss waterfall in minutes. ${Pf>1?'<b>Performance above 100% means the ideal cycle time is wrong.</b>':''}</p>`}},
 challenge:{text:'Reach <b>OEE of 75%</b> without changing planned time or the ideal cycle time. First try cutting only downtime — and notice what happens.',test:(v,o,v0)=>o.o>=.75&&v.pt===v0.pt&&v.ict===v0.ict&&v.gc<=v.tc,why:'OEE = good units × ideal cycle ÷ planned time. Cutting downtime alone just turns the lost minutes into a performance loss; OEE only rises when the recovered time produces more good parts.'}});

/* e07 — process capability */
LABS.cpk=(el,m,done)=>calcLab(el,m,done,{inputs:[['lsl','Lower spec limit (mm)',9.90,.01],['usl','Upper spec limit (mm)',10.10,.01],['mu','Process mean (mm)',10.03,.005],['sd','Process standard deviation (mm)',.025,.001]],
 compute:v=>{const cp=(v.usl-v.lsl)/(6*v.sd),cpk=Math.min(v.usl-v.mu,v.mu-v.lsl)/(3*v.sd),out=(1-ncdf((v.usl-v.mu)/v.sd))+ncdf((v.lsl-v.mu)/v.sd),ppm=out*1e6;const x0=Math.min(v.lsl,v.mu-4*v.sd)-v.sd,x1=Math.max(v.usl,v.mu+4*v.sd)+v.sd;const pts=Array.from({length:81},(_,i)=>{const x=x0+(x1-x0)*i/80;return[x,Math.exp(-(((x-v.mu)/v.sd)**2)/2)]});
  return{out:{cpk},html:`<div class="grid g4 g2m"><div class="stat"><small>Cp</small><b>${fmt(cp,2)}</b></div><div class="stat"><small>Cpk</small><b>${fmt(cpk,2)}</b></div><div class="stat"><small>Out of spec</small><b>${fmt(ppm,ppm<10?1:0)} ppm</b></div><div class="stat"><small>Sigma level (short-term)</small><b>${fmt(3*cpk,1)}σ</b></div></div>${plotXY({x0,x1,y0:0,y1:1.1,h:190,fx:t=>t.toFixed(2),fy:()=>'',series:[{pts}],vlines:[[v.lsl,'var(--bad)','LSL'],[v.usl,'var(--bad)','USL'],[v.mu,'var(--navy2)','mean']]})}<div class="formula">Cp = (USL − LSL) ÷ 6σ · Cpk = min(USL − μ, μ − LSL) ÷ 3σ</div>`}},
 challenge:{text:'The customer requires <b>Cpk ≥ 1.33</b>. Reach it. Is centring the process or reducing variation the cheaper first move here?',test:(v,o,v0)=>o.cpk>=1.33&&v.lsl===v0.lsl&&v.usl===v0.usl,why:'Centring (Cp vs Cpk gap) is usually a quick adjustment; reducing σ needs root-cause work. Check Cp first: if Cp is already ≥ 1.33, just centre.'}});

/* e08 — SPC X-bar / R */
LABS.spc=(el,m,done)=>{let seed=Date.now()%1e9;const run=()=>{const r=RNG(seed),nrm=()=>{let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())};const k=12+Math.floor(r()*8),sh=.9;const sub=Array.from({length:25},(_,i)=>Array.from({length:5},()=>50+nrm()*1+(i>=k?sh*1.4:0)));
  const xb=sub.map(s=>s.reduce((a,b)=>a+b,0)/5),R=sub.map(s=>Math.max(...s)-Math.min(...s));const base=xb.slice(0,10),rb=R.slice(0,10);const X=base.reduce((a,b)=>a+b,0)/10,Rb=rb.reduce((a,b)=>a+b,0)/10;const ucl=X+.577*Rb,lcl=X-.577*Rb;
  let first=-1;for(let i=0;i<25&&first<0;i++){if(xb[i]>ucl||xb[i]<lcl)first=i+1;else if(i>=6){const w=xb.slice(i-6,i+1);if(w.every(x=>x>X)||w.every(x=>x<X))first=i+1}}
  el.innerHTML=`<p class="note">25 subgroups of 5 shaft diameters. Limits are set from the first 10 subgroups (A₂ = 0.577 for n = 5). Find the <b>first subgroup</b> that signals the process is out of control: a point outside the limits, or 7 in a row on one side of the centre line.</p>${plotXY({x0:1,x1:25,y0:Math.min(lcl,...xb)-.3,y1:Math.max(ucl,...xb)+.3,h:230,fx:t=>fmt(t),fy:t=>t.toFixed(1),series:[{pts:xb.map((x,i)=>[i+1,x]),c:'var(--navy2)'},{pts:[[1,ucl],[25,ucl]],c:'var(--bad)',dash:1,l:'UCL'},{pts:[[1,X],[25,X]],c:'var(--mut)',dash:1,l:'CL'},{pts:[[1,lcl],[25,lcl]],c:'var(--bad)',dash:1,l:'LCL'}],dots:xb.map((x,i)=>[i+1,x,'var(--gold2)',3.5])})}<p class="note">X̄ chart · UCL ${ucl.toFixed(2)} · CL ${X.toFixed(2)} · LCL ${lcl.toFixed(2)} · R̄ ${Rb.toFixed(2)}</p><div class="row"><input class="tin" id="sg" type="number" style="max-width:120px" placeholder="subgroup #"><button class="sbtn" id="sc">Check</button><button class="sbtn alt" id="nw">New data</button></div><div id="sm"></div>`;
  $('#nw',el).onclick=()=>{seed++;run()};$('#sc',el).onclick=()=>{const g=+$('#sg',el).value;const ok=first>0&&g===first;$('#sm',el).innerHTML=`<div class="readout ${ok?'ok':'bad'}">${first<0?'No signal in this sample — press New data.':ok?`<b>Correct: subgroup ${first}.</b> The shift actually began at subgroup ${k+1}. Control charts separate special causes (find and fix) from common-cause noise (do not tamper).`:`<b>Not quite: the first signal is subgroup ${first}.</b> Check both rules: beyond a limit, and 7 consecutive points on one side.`}</div>`;if(ok)done()}};run()};

/* e09 — FMEA */
LABS.fmea=(el,m,done)=>{const C=CUST('fmea');if(!C.r)C.r=[['Seal leaks under pressure','Wrong seal material',8,5,6],['Shaft misalignment','Assembly fixture worn',7,4,5],['Impeller cracks','Casting porosity',9,3,7],['Bearing overheats','Insufficient grease',6,6,4],['Wrong part label','Manual labelling',4,5,3]];
 const draw=()=>{const rows=C.r.map((r,i)=>({r,i,rpn:r[2]*r[3]*r[4]})).sort((a,b)=>b.rpn-a.rpn);const mx=rows[0].rpn;
  el.innerHTML=`<p class="note">Pump-assembly FMEA. Rate Severity, Occurrence and Detection from 1 to 10 (10 = worst; for Detection, 10 = almost impossible to detect). RPN = S × O × D. Propose actions by lowering O (prevention) or D (detection) — severity rarely changes without a redesign.</p><div class="tablewrap"><table class="t" style="min-width:560px"><tr><th>Failure mode</th><th>Cause</th><th>S</th><th>O</th><th>D</th><th>RPN</th></tr>${rows.map(({r,i,rpn})=>`<tr><td>${r[0]}</td><td>${r[1]}</td>${[2,3,4].map(j=>`<td><input class="tin" type="number" min="1" max="10" data-i="${i}" data-j="${j}" value="${r[j]}" style="padding:4px;max-width:58px"></td>`).join('')}<td><b style="color:${rpn>=150?'var(--bad)':rpn>=100?'var(--gold)':'var(--ok)'}">${rpn}</b></td></tr>`).join('')}</table></div><div class="readout ${mx<100?'ok':''}">Highest RPN: <b>${mx}</b>. ${mx<100?'All modes below 100.':'Bring every mode below 100 — and note the severity-9 item: many companies act on high severity regardless of RPN.'}</div>`;
  $$('input[data-i]',el).forEach(x=>x.onchange=()=>{C.r[+x.dataset.i][+x.dataset.j]=Math.max(1,Math.min(10,+x.value||1));save();draw();const mx2=Math.max(...C.r.map(r=>r[2]*r[3]*r[4]));if(mx2<100)done()})};draw()};

/* e10 — forecasting */
const FD=[880,940,860,960,900,1000,930,1040,960,1060,990,1090];
LABS.forecast=(el,m,done)=>calcLab(el,m,done,{inputs:[['n','Moving average periods',3],['al','Exponential smoothing α (0–1)',.3,.05]],
 compute:v=>{const n=Math.max(1,Math.min(6,Math.round(v.n))),a=Math.max(0,Math.min(1,v.al));const ma=FD.map((_,t)=>t>=n?FD.slice(t-n,t).reduce((x,y)=>x+y,0)/n:null);const es=[];es[0]=FD[0];for(let t=1;t<FD.length;t++)es[t]=a*FD[t-1]+(1-a)*es[t-1];
  const err=f=>{let ad=0,ap=0,c=0;FD.forEach((d,t)=>{if(t>=n&&f[t]!=null){ad+=Math.abs(d-f[t]);ap+=Math.abs(d-f[t])/d;c++}});return{mad:ad/c,mape:ap/c*100}};const e1=err(ma),e2=err(es);
  let best=0,bm=1e9;for(let x=0;x<=100;x++){const s=[FD[0]];for(let t=1;t<FD.length;t++)s[t]=x/100*FD[t-1]+(1-x/100)*s[t-1];const e=err(s).mape;if(e<bm){bm=e;best=x/100}}
  return{out:{best},html:`${plotXY({x0:1,x1:12,y0:700,y1:1300,h:210,fx:t=>['J','F','M','A','M','J','J','A','S','O','N','D'][Math.round(t)-1]||'',series:[{pts:FD.map((d,t)=>[t+1,d]),c:'var(--navy2)',l:'demand'},{pts:ma.map((f,t)=>f==null?null:[t+1,f]).filter(Boolean),c:'var(--mut)',dash:1,l:'MA'},{pts:es.map((f,t)=>[t+1,f]),c:'var(--gold2)',l:'ES'}]})}<div class="tablewrap"><table class="t"><tr><th>Method</th><th>MAD</th><th>MAPE</th></tr><tr><td>${n}-period moving average</td><td>${fmt(e1.mad,1)}</td><td>${fmt(e1.mape,1)}%</td></tr><tr><td>Exponential smoothing, α = ${a}</td><td>${fmt(e2.mad,1)}</td><td>${fmt(e2.mape,1)}%</td></tr></table></div><p class="note">Demand has an upward trend plus noise. Simple smoothing always lags a trend (look at the second half); Holt's method adds a trend term, and Winters adds seasonality such as Ramadan peaks.</p>`}},
 challenge:{text:'Tune α to <b>minimise MAPE</b> for exponential smoothing (within ±0.05 of the best).',test:(v,o)=>Math.abs(v.al-o.best)<=.05,why:'A high α reacts fast but chases noise; a low α is stable but slow. The "best" α on history is a starting point — check it on new data before trusting it.'}});

/* e11 — EOQ, safety stock, reorder point */
LABS.eoq=(el,m,done)=>calcLab(el,m,done,{inputs:[['D','Annual demand (units)',24000],['S','Cost per order (SAR)',600],['H','Holding cost per unit per year (SAR)',12],['L','Lead time (days)',10],['sd','Std dev of daily demand (units)',18],['sl','Service level (%)',95,.5],['q','Your order quantity',2000]],
 compute:v=>{const eoq=Math.sqrt(2*v.D*v.S/v.H),d=v.D/360;const zt=[[90,1.28],[95,1.645],[97.5,1.96],[99,2.33],[99.5,2.58],[99.9,3.09]];let z=1.645;zt.forEach(([p,zz])=>{if(v.sl>=p)z=zz});const ss=z*v.sd*Math.sqrt(v.L),rop=d*v.L+ss;const tc=q=>v.D/q*v.S+q/2*v.H;const q0=Math.max(100,eoq*.2),q1=eoq*2.5;const pts=Array.from({length:40},(_,i)=>{const q=q0+(q1-q0)*i/39;return[q,tc(q)]});
  return{out:{rop,eoq},html:`<div class="grid g4 g2m"><div class="stat"><small>EOQ</small><b>${fmt(eoq)}</b></div><div class="stat"><small>Safety stock (z = ${z})</small><b>${fmt(ss)}</b></div><div class="stat"><small>Reorder point</small><b>${fmt(rop)}</b></div><div class="stat"><small>Annual cost at your Q</small><b>SAR ${fmt(tc(v.q))}</b><small>vs ${fmt(tc(eoq))} at EOQ</small></div></div>${plotXY({x0:q0,x1:q1,y0:0,y1:Math.max(...pts.map(p=>p[1])),h:200,fx:t=>fmt(t),series:[{pts,l:'ordering + holding'}],vlines:[[eoq,'var(--ok)','EOQ'],[Math.min(q1,Math.max(q0,v.q)),'var(--navy2)','you']],xl:'order quantity'})}<div class="formula">EOQ = √(2DS ÷ H) · Safety stock = z × σ_d × √L · ROP = d × L + SS (360-day year)</div>`}},
 challenge:{text:'What is the <b>reorder point</b> at the current inputs (units)?',ask:{ans:(v,o)=>o.rop,tol:3,dp:0,unit:'units',why:()=>'Notice how flat the total-cost curve is near EOQ: being 20% off barely matters. Safety stock, by contrast, grows fast as service level approaches 100%.'}}});

/* e12 — bullwhip (simplified beer game) */
function beer(beta,share,ss){const W=30,L=2,T=4;const dem=t=>t<5?4:8;const tiers=Array.from({length:T},()=>({inv:12,back:0,pipe:Array(L).fill(4),fc:4}));const orders=Array.from({length:T},()=>[]);
 for(let t=0;t<W;t++){let incoming=dem(t);for(let k=0;k<T;k++){const s=tiers[k];s.inv+=s.pipe.shift();const need=incoming+s.back,ship=Math.min(s.inv,need);s.inv-=ship;s.back=need-ship;const sig=share?dem(t):incoming;s.fc=.4*sig+.6*s.fc;const ip=s.inv-s.back+s.pipe.reduce((a,b)=>a+b,0);const tgt=s.fc*(L+1)+ss;const o=Math.max(0,s.fc+beta*(tgt-ip));orders[k].push(o);s.pipe.push(o);incoming=o}}
 const vr=a=>{const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)};const cust=Array.from({length:W},(_,t)=>dem(t));return{orders,cust,amp:vr(orders[3])/vr(cust)}}
LABS.bullwhip=(el,m,done)=>calcLab(el,m,done,{inputs:[['beta','Inventory correction speed β (0–1)',.8,.05],['share','Share end-customer demand upstream? (1 = yes, 0 = no)',0],['ss','Safety stock target (units)',4]],
 compute:v=>{const r=beer(Math.max(0,Math.min(1,v.beta)),v.share>=1,v.ss);const names=['Retailer','Wholesaler','Distributor','Factory'],cols=['#7C8BA3','#5B7DB1','var(--navy2)','var(--bad)'];const mx=Math.max(...r.orders.flat(),8);
  return{out:{amp:r.amp},html:`${plotXY({x0:0,x1:29,y0:0,y1:mx*1.05,h:230,fx:t=>'w'+fmt(t),series:[{pts:r.cust.map((d,t)=>[t,d]),c:'var(--gold2)',l:'customers'},...r.orders.map((o,k)=>({pts:o.map((x,t)=>[t,x]),c:cols[k],l:k===3?'factory':''}))]})}<p class="note">Customer demand steps from 4 to 8 in week 5. Each tier forecasts from the orders it sees and corrects its inventory with speed β; lead time 2 weeks.</p><div class="grid g2"><div class="stat"><small>Factory order swings ÷ customer demand swings (std dev)</small><b>${fmt(r.amp,1)}×</b></div><div class="stat"><small>Peak factory order</small><b>${fmt(Math.max(...r.orders[3]),1)}</b><small>vs customer peak 8</small></div></div>`}},
 challenge:{text:'Bring factory order amplification <b>below 2.2×</b>. You will need both levers: slower correction and sharing end-customer demand.',test:(v,o)=>o.amp<2.2,why:'Bullwhip comes from each tier reacting to its neighbour\'s orders, with delays and over-correction. Sharing end-customer data, smoothing orders and shortening lead times are the cures.'}});

/* e13 — linear programming (2 variables) */
LABS.lp=(el,m,done)=>calcLab(el,m,done,{inputs:[['p1','Profit per chair (SAR)',70],['p2','Profit per table (SAR)',120],['a1','Carpentry h per chair',2],['b1','Carpentry h per table',4],['r1','Carpentry hours available',400],['a2','Finishing h per chair',2],['b2','Finishing h per table',2],['r2','Finishing hours available',240],['mx','Max tables (market)',80]],
 compute:v=>{const cons=[[v.a1,v.b1,v.r1],[v.a2,v.b2,v.r2],[0,1,v.mx],[-1,0,0],[0,-1,0]];const pts=[];for(let i=0;i<cons.length;i++)for(let j=i+1;j<cons.length;j++){const [a,b,c]=cons[i],[d,e,f]=cons[j];const det=a*e-b*d;if(Math.abs(det)<1e-9)continue;const x=(c*e-b*f)/det,y=(a*f-c*d)/det;if(cons.every(([p,q,r])=>p*x+q*y<=r+1e-6))pts.push([x,y])}
  const uniq=pts.filter((p,i)=>pts.findIndex(q=>Math.abs(q[0]-p[0])<1e-6&&Math.abs(q[1]-p[1])<1e-6)===i);const cx=uniq.reduce((a,p)=>a+p[0],0)/uniq.length,cy=uniq.reduce((a,p)=>a+p[1],0)/uniq.length;uniq.sort((p,q)=>Math.atan2(p[1]-cy,p[0]-cx)-Math.atan2(q[1]-cy,q[0]-cx));
  let best=null,bz=-1;uniq.forEach(p=>{const z=v.p1*p[0]+v.p2*p[1];if(z>bz){bz=z;best=p}});const X1=Math.max(...uniq.map(p=>p[0]),1)*1.2,Y1=Math.max(...uniq.map(p=>p[1]),1)*1.3;
  const W=560,H=260,L=46,B=30;const sx=x=>L+x/X1*(W-L-12),sy=y=>H-B-y/Y1*(H-B-12);
  const svg=`<div class="chart"><svg viewBox="0 0 ${W} ${H}"><polygon points="${uniq.map(p=>sx(p[0])+','+sy(p[1])).join(' ')}" fill="var(--goldsoft)" stroke="var(--gold2)" stroke-width="2"/>${uniq.map(p=>`<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="4" fill="${p===best?'var(--ok)':'var(--navy2)'}"/><text x="${sx(p[0])+6}" y="${sy(p[1])-6}" style="fill:var(--ink)">(${fmt(p[0])}, ${fmt(p[1])})</text>`).join('')}<text x="${W-12}" y="${H-8}" text-anchor="end">chairs →</text><text x="${L}" y="12">tables ↑</text></svg></div>`;
  return{out:{bz},html:svg+`<div class="readout">Corner points of the feasible region are marked. The optimum of a linear programme is always at a corner (or along an edge).</div><details><summary class="note">Show the optimum</summary><p>Best corner: <b>${fmt(best[0])} chairs, ${fmt(best[1])} tables</b>, profit <b>SAR ${fmt(bz)}</b>.</p></details>`}},
 challenge:{text:'Evaluate the corner points yourself: what is the <b>maximum profit</b> (SAR)?',ask:{ans:(v,o)=>o.bz,tol:1,dp:0,unit:'SAR',why:()=>'Shadow prices tell you what one more hour of a binding constraint is worth — the starting point for "should we add a finishing shift?" questions.'}}});

/* e14 — M/M/c queue + Johnson's rule */
function mmc(l,mu,c){const a=l/mu,rho=a/c;if(rho>=1)return{rho,wq:Infinity};let s=0,f=1;for(let k=0;k<c;k++){if(k>0)f*=k;s+=Math.pow(a,k)/f}const fc=f*(c>0?c:1);const top=Math.pow(a,c)/fc/(1-rho);const p0=1/(s+top);const lq=p0*Math.pow(a,c)*rho/(fc*(1-rho)**2);return{rho,p0,lq,wq:lq/l,pw:top*p0}}
LABS.queue=(el,m,done)=>calcLab(el,m,done,{inputs:[['l','Arrivals per hour (λ)',50],['mu','Service rate per server per hour (μ)',12],['c','Number of servers (c)',5],['tg','Target average wait (minutes)',2,.5]],
 compute:v=>{const c=Math.max(1,Math.round(v.c)),q=mmc(v.l,v.mu,c);const cs=Array.from({length:8},(_,i)=>Math.max(1,Math.ceil(v.l/v.mu))+i).map(k=>[k,Math.min(30,mmc(v.l,v.mu,k).wq*60)]);
  return{out:{wq:q.wq*60},html:q.rho>=1?'<div class="readout bad">Utilisation ≥ 100%: the queue grows without limit. Add servers.</div>':`<div class="grid g4 g2m"><div class="stat"><small>Utilisation ρ</small><b>${pct(q.rho)}</b></div><div class="stat"><small>Probability a customer waits</small><b>${pct(q.pw)}</b></div><div class="stat"><small>Avg queue length Lq</small><b>${fmt(q.lq,2)}</b></div><div class="stat"><small>Avg wait Wq</small><b>${fmt(q.wq*60,2)} min</b></div></div>${plotXY({x0:cs[0][0],x1:cs[cs.length-1][0],y0:0,y1:Math.max(...cs.map(x=>x[1]))*1.1||1,h:190,fx:t=>fmt(t),fy:t=>fmt(t,1),series:[{pts:cs,l:'wait (min)'}],vlines:[[c,'var(--navy2)','you']],xl:'servers'})}<div class="formula">M/M/c (Erlang C): Poisson arrivals, exponential service, c servers.</div>`}},
 challenge:{text:'A hospital pharmacy gets 50 prescriptions an hour; each pharmacist fills 12 an hour. Find the <b>fewest pharmacists</b> that keep the average wait at or below 2 minutes.',test:(v,o)=>v.l===50&&v.mu===12&&v.tg===2&&o.wq<=2&&mmc(50,12,Math.round(v.c)-1).wq*60>2,why:'Five servers run at 83% utilisation and the wait is long; one more server cuts it sharply. Near full utilisation, a little capacity buys a lot of waiting time.'}});

/* e15 — automation business case + Industry 4.0 maturity */
LABS.i40=(el,m,done)=>calcLab(el,m,done,{inputs:[['capex','Capex: robots, sensors, integration (SAR m)',12],['lab','Labour cost saved per year (SAR m)',2.4],['qual','Scrap and rework saved per year (SAR m)',0.9],['dt','Downtime cost avoided per year (SAR m)',0.8],['mnt','Extra maintenance and software per year (SAR m)',0.7],['yrs','Useful life (years)',8],['r','Discount rate (%)',10]],
 compute:v=>{const cf=v.lab+v.qual+v.dt-v.mnt;const c=[-v.capex,...Array(Math.max(1,Math.round(v.yrs))).fill(cf)];const n=npvf(v.r/100,c),i=irrf(c),pb=cf>0?v.capex/cf:Infinity;
  return{out:{pb},html:`<div class="grid g4 g2m"><div class="stat"><small>Net annual benefit</small><b>${sar(cf,2)}</b></div><div class="stat"><small>NPV</small><b style="color:${n>=0?'var(--ok)':'var(--bad)'}">${sar(n,1)}</b></div><div class="stat"><small>IRR</small><b>${isFinite(i)?pct(i):'—'}</b></div><div class="stat"><small>Payback</small><b>${isFinite(pb)?fmt(pb,1)+' yrs':'never'}</b></div></div><p class="note">Automation cases that rely only on labour savings are often weak. Quality, uptime, safety, and the ability to run more shifts usually decide them.</p>`}},
 challenge:{text:'What is the <b>simple payback</b> in years at the current inputs?',ask:{ans:(v,o)=>o.pb,tol:.1,dp:1,unit:'years',why:()=>'Then test the case without the quality and downtime benefits: if it collapses, those are the benefits to verify in a pilot before scaling.'}}});

/* e16 — CPM + earned value */
const CPMT={A:['Site survey',3,''],B:['Design',5,'A'],C:['Procure equipment',8,'B'],D:['Civil works',6,'B'],E:['Install equipment',4,'CD'],F:['Train operators',3,'B'],G:['Commission',2,'EF'],H:['Handover',1,'G']};
function cpm(){const ks=Object.keys(CPMT),es={},ef={},ls={},lf={};ks.forEach(k=>{es[k]=Math.max(0,...[...CPMT[k][2]].map(p=>ef[p]));ef[k]=es[k]+CPMT[k][1]});const end=Math.max(...ks.map(k=>ef[k]));ks.slice().reverse().forEach(k=>{const sc=ks.filter(s=>CPMT[s][2].includes(k));lf[k]=sc.length?Math.min(...sc.map(s=>ls[s])):end;ls[k]=lf[k]-CPMT[k][1]});return{es,ef,ls,lf,end}}
LABS.cpm=(el,m,done)=>{const r=cpm(),ks=Object.keys(CPMT);
 el.innerHTML=`<h4>Critical path (weeks)</h4><div class="tablewrap"><table class="t" style="min-width:520px"><tr><th>Task</th><th>Duration</th><th>After</th><th>ES</th><th>EF</th><th>LS</th><th>LF</th><th>Slack</th></tr>${ks.map(k=>{const sl=r.ls[k]-r.es[k];return`<tr style="${sl===0?'font-weight:700':''}"><td>${k} · ${CPMT[k][0]}</td><td>${CPMT[k][1]}</td><td>${CPMT[k][2].split('').join(', ')||'—'}</td><td>${r.es[k]}</td><td>${r.ef[k]}</td><td>${r.ls[k]}</td><td>${r.lf[k]}</td><td style="color:${sl===0?'var(--bad)':'var(--ok)'}">${sl}</td></tr>`}).join('')}</table></div><p class="note">Bold rows have zero slack: the critical path. ES/EF: earliest start/finish (forward pass). LS/LF: latest (backward pass).</p>
 <div class="row"><span>Project duration (weeks)?</span><input class="tin" id="pd" type="number" style="max-width:100px"><span>Critical path (e.g. ABCEGH)?</span><input class="tin" id="cp" style="max-width:140px;text-transform:uppercase"><button class="sbtn" id="pc">Check</button></div><div id="pm"></div>
 <h4 style="margin-top:16px">Earned value at week 12</h4><div class="grid g4 g2m">${numIn('bac','Budget at completion (SAR k)',2000)}${numIn('pv','Planned value to date (SAR k)',1200)}${numIn('ev','Earned value (SAR k)',1000)}${numIn('ac','Actual cost (SAR k)',1150)}</div><div id="eo"></div>`;
 const ev=()=>{const bac=V('bac',el),pv=V('pv',el),e=V('ev',el),ac=V('ac',el);const spi=e/pv,cpi=e/ac;$('#eo',el).innerHTML=kv([['Schedule variance (EV − PV)',fmt(e-pv)],['Cost variance (EV − AC)',fmt(e-ac)],['SPI',fmt(spi,2)+(spi<1?' — behind schedule':' — on/ahead')],['CPI',fmt(cpi,2)+(cpi<1?' — over budget':' — on/under budget')],['Estimate at completion (BAC ÷ CPI)',fmt(bac/cpi),1]])};$$('#bac,#pv,#ev,#ac',el).forEach(x=>x.oninput=ev);ev();
 const crit=ks.filter(k=>r.ls[k]===r.es[k]).join('');$('#pc',el).onclick=()=>{const ok=+$('#pd',el).value===r.end&&$('#cp',el).value.toUpperCase().replace(/[^A-Z]/g,'')===crit;$('#pm',el).innerHTML=`<div class="readout ${ok?'ok':'bad'}">${ok?'<b>Correct.</b> Any delay on these tasks delays handover; tasks with slack (like training) can float.':`<b>Duration ${r.end} weeks, critical path ${crit.split('').join('→')}.</b> Do the forward pass: each task starts when its latest predecessor finishes.`}</div>`;if(ok)done()}};

/* ================= MBA Core labs (working models; all figures illustrative) ================= */
/* calcLab: inputs → live model → a challenge that makes you use the model */
function calcLab(el,m,done,cfg){const v0={};cfg.inputs.forEach(([id,l,val])=>v0[id]=val);
  el.innerHTML=`<div class="grid g3 g2m">${cfg.inputs.map(([id,l,val,st])=>numIn('k_'+id,l,val,{step:st})).join('')}</div><div id="kout" style="margin-top:12px"></div>${cfg.challenge?`<div class="card gold" style="box-shadow:none;margin-top:12px"><div class="eyebrow">Challenge</div><p style="margin:.3rem 0">${cfg.challenge.text}</p>${cfg.challenge.ask?`<div class="row"><input class="tin" id="kask" type="number" step="any" inputmode="decimal" style="max-width:180px"><span class="note">${cfg.challenge.ask.unit||''}</span><button class="sbtn" id="kchk">Check</button></div>`:''}<div id="kmsg"></div></div>`:''}`;
  let out={},hit=false;const read=()=>{const v={};cfg.inputs.forEach(([id])=>v[id]=V('k_'+id,el));return v};
  const run=()=>{const v=read();const r=cfg.compute(v,v0);out=r.out||{};$('#kout',el).innerHTML=r.html;
    if(cfg.challenge&&cfg.challenge.test&&!hit&&cfg.challenge.test(v,out,v0)){hit=true;$('#kmsg',el).innerHTML=`<div class="readout ok"><b>Challenge met.</b> ${cfg.challenge.why||''}</div>`;done()}};
  $$('input[id^="k_"]',el).forEach(x=>x.oninput=run);run();
  const ck=$('#kchk',el);if(ck)ck.onclick=()=>{const a=cfg.challenge.ask;const v=read();const t=a.ans(v,out);const g=parseFloat($('#kask',el).value);const ok=Math.abs(g-t)<=a.tol;$('#kmsg',el).innerHTML=`<div class="readout ${ok?'ok':'bad'}"><b>${ok?'Correct.':'Not quite: '+fmt(t,a.dp==null?1:a.dp)+' '+(a.unit||'')}</b> ${a.why?a.why(v,out):''}</div>`;if(ok)done()}}
/* simple XY plot */
function plotXY(o){const W=560,H=o.h||230,L=46,B=30,T=12,Rr=12;const X=x=>L+(x-o.x0)/(o.x1-o.x0)*(W-L-Rr),Y=y=>H-B-(y-o.y0)/(o.y1-o.y0)*(H-B-T);
  const ticks=(a,b,n)=>Array.from({length:n+1},(_,i)=>a+(b-a)*i/n);
  let s=`<div class="chart"><svg viewBox="0 0 ${W} ${H}">`;
  ticks(o.y0,o.y1,4).forEach(t=>{s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width=".6"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end">${o.fy?o.fy(t):fmt(t)}</text>`});
  ticks(o.x0,o.x1,5).forEach(t=>{s+=`<text x="${X(t)}" y="${H-10}" text-anchor="middle">${o.fx?o.fx(t):fmt(t)}</text>`});
  if(o.y0<0&&o.y1>0)s+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mut)" stroke-width="1"/>`;
  (o.series||[]).forEach(se=>{s+=`<polyline fill="none" stroke="${se.c||'var(--gold2)'}" stroke-width="2.2" ${se.dash?'stroke-dasharray="5 4"':''} points="${se.pts.map(p=>X(p[0]).toFixed(1)+','+Y(Math.max(o.y0,Math.min(o.y1,p[1]))).toFixed(1)).join(' ')}"/>`;if(se.l){const p=se.pts[se.pts.length-1];s+=`<text x="${X(p[0])-4}" y="${Y(Math.max(o.y0,Math.min(o.y1,p[1])))-6}" text-anchor="end" style="fill:${se.c||'var(--gold2)'};font-weight:600">${se.l}</text>`}});
  (o.dots||[]).forEach(d=>{s+=`<circle cx="${X(d[0])}" cy="${Y(d[1])}" r="${d[3]||4}" fill="${d[2]||'var(--navy2)'}" opacity=".85"/>${d[4]?`<text x="${X(d[0])+7}" y="${Y(d[1])+4}" style="fill:var(--ink)">${esc(d[4])}</text>`:''}`});
  (o.vlines||[]).forEach(([x,c,l])=>{s+=`<line x1="${X(x)}" x2="${X(x)}" y1="${T}" y2="${H-B}" stroke="${c||'var(--bad)'}" stroke-dasharray="4 3"/>${l?`<text x="${X(x)+4}" y="${T+10}" style="fill:${c||'var(--bad)'}">${l}</text>`:''}`});
  if(o.xl)s+=`<text x="${W-Rr}" y="${H-B-6}" text-anchor="end">${o.xl}</text>`;
  return s+`</svg></div>`}
const kv=rows=>`<div class="kv">${rows.map(([a,b,bold])=>`<span>${bold?'<b>'+a+'</b>':a}</span><span>${bold?'<b>'+b+'</b>':b}</span>`).join('')}</div>`;
const sar=(n,d=1)=>'SAR '+fmt(n,d)+'m';

/* m01 — linked three statements */
LABS.three=(el,m,done)=>calcLab(el,m,done,{inputs:[['rev','Revenue (SAR m)',500],['gm','Gross margin (%)',35],['opex','Operating expenses (SAR m)',90],['da','Depreciation (SAR m)',20],['int','Interest (SAR m)',8],['tax','Tax / zakat rate (%)',20],['dso','Receivable days (DSO)',60],['dio','Inventory days (DIO)',45],['dpo','Payable days (DPO)',30],['capex','Capex (SAR m)',40]],
 compute:v=>{const cogs=v.rev*(1-v.gm/100),gp=v.rev-cogs,ebit=gp-v.opex-v.da,ebt=ebit-v.int,tx=Math.max(0,ebt*v.tax/100),ni=ebt-tx;const ar=v.rev*v.dso/365,inv=cogs*v.dio/365,ap=cogs*v.dpo/365,nwc=ar+inv-ap,dn=nwc-89,cfo=ni+v.da-dn,fcf=cfo-v.capex;
  return{out:{fcf,ni,cfo},html:`<div class="grid g3"><div class="stat"><div class="eyebrow">Income statement</div>${kv([['Revenue',fmt(v.rev,1)],['Gross profit',fmt(gp,1)],['EBIT',fmt(ebit,1)],['Net income',fmt(ni,1),1]])}</div><div class="stat"><div class="eyebrow">Cash flow</div>${kv([['Net income',fmt(ni,1)],['+ Depreciation',fmt(v.da,1)],['− Increase in working capital',fmt(dn,1)],['Operating cash flow',fmt(cfo,1),1],['− Capex',fmt(v.capex,1)],['Free cash flow',fmt(fcf,1),1]])}</div><div class="stat"><div class="eyebrow">Balance sheet (year end)</div>${kv([['Receivables',fmt(ar,1)],['Inventory',fmt(inv,1)],['Payables',fmt(ap,1)],['Net working capital',fmt(nwc,1),1],['Last year NWC','89.0'],['Cash (opening 50)',fmt(50+fcf,1),1]])}</div></div><p class="note">The links: net income starts the cash flow; depreciation is added back because it is not cash; working capital moves on the balance sheet change cash; free cash flow lands in the cash line.</p>`}},
 challenge:{text:'Without touching revenue, margin, costs, tax or capex, get <b>free cash flow to SAR 40m or more</b>. Only the three working-capital day counts may change.',test:(v,o,v0)=>o.fcf>=40&&['rev','gm','opex','da','int','tax','capex'].every(k=>v[k]===v0[k]),why:'Same profit, more cash. Collecting faster or holding less stock releases cash; this is why CFOs watch working capital as closely as margin.'}});

/* m02 — cash conversion cycle */
LABS.ccc=(el,m,done)=>calcLab(el,m,done,{inputs:[['rev','Annual revenue (SAR m)',800],['cogs','Annual cost of goods sold (SAR m)',560],['dso','Receivable days (DSO)',55],['dio','Inventory days (DIO)',70],['dpo','Payable days (DPO)',40]],
 compute:(v,v0)=>{const c=v.dso+v.dio-v.dpo;const tied=x=>x.rev*x.dso/365+x.cogs*x.dio/365-x.cogs*x.dpo/365;const rel=tied(v0)-tied(v);
  return{out:{c},html:`<div class="grid g3"><div class="stat"><small>Cash conversion cycle</small><b>${fmt(c)} days</b><small>DSO + DIO − DPO</small></div><div class="stat"><small>Cash tied in working capital</small><b>${sar(tied(v))}</b></div><div class="stat"><small>Cash released vs start</small><b style="color:${rel>=0?'var(--ok)':'var(--bad)'}">${sar(rel)}</b></div></div>${bars([{l:'DSO',v:v.dso},{l:'DIO',v:v.dio},{l:'DPO',v:-v.dpo,c:'var(--ok)'},{l:'CCC',v:c,c:'var(--navy2)'}],{h:190})}`}},
 challenge:{text:'Bring the cash conversion cycle to <b>40 days or less</b>. Which lever releases the most cash per day changed: DSO or DIO? (Hint: one is measured on revenue, the other on cost.)',test:(v,o)=>o.c<=40,why:'Each DSO day is worth revenue/365 (SAR 2.2m here); each DIO or DPO day is worth COGS/365 (SAR 1.5m). Pushing suppliers too hard on DPO can hurt them, so most programmes start with collections and inventory.'}});

/* m03 — DuPont */
LABS.dupont=(el,m,done)=>calcLab(el,m,done,{inputs:[['ni','Net income (SAR m)',40],['rev','Revenue (SAR m)',500],['ta','Total assets (SAR m)',400],['eq','Equity (SAR m)',250]],
 compute:v=>{const pm=v.ni/v.rev,at=v.rev/v.ta,lev=v.ta/v.eq,roe=pm*at*lev;const P={pm:.06,at:2,lev:1.5};
  return{out:{roe,lev},html:`<div class="tablewrap"><table class="t"><tr><th></th><th>Net margin</th><th>× Asset turnover</th><th>× Leverage</th><th>= ROE</th></tr><tr><td><b>Your company</b></td><td>${pct(pm)}</td><td>${fmt(at,2)}×</td><td>${fmt(lev,2)}×</td><td><b>${pct(roe)}</b></td></tr><tr><td>Peer (low-cost retailer)</td><td>6.0%</td><td>2.00×</td><td>1.50×</td><td>18.0%</td></tr></table></div><p class="note">Same ROE can come from very different businesses: high margin and slow assets, thin margin and fast assets, or borrowed money. Only the first two are operating excellence.</p>`}},
 challenge:{text:'Raise ROE to <b>20% or more</b> while keeping leverage (assets ÷ equity) at <b>2.0× or below</b>.',test:(v,o)=>o.roe>=.2&&o.lev<=2,why:'You reached it through margin or asset efficiency, not just debt. Ask which of those is realistic for this business before promising it to a board.'}});

/* m04 — break-even */
LABS.breakeven=(el,m,done)=>calcLab(el,m,done,{inputs:[['p','Price per unit (SAR)',50,.01],['vc','Variable cost per unit (SAR)',30],['fc','Fixed costs (SAR)',1000000],['q','Current volume (units)',60000]],
 compute:v=>{const cm=v.p-v.vc,be=cm>0?v.fc/cm:Infinity,mos=(v.q-be)/v.q,pr=cm*v.q-v.fc,dol=pr>0?cm*v.q/pr:NaN;const qx=Math.max(v.q,isFinite(be)?be:v.q)*1.6;
  return{out:{mos},html:`<div class="grid g4 g2m"><div class="stat"><small>Contribution / unit</small><b>SAR ${fmt(cm,2)}</b></div><div class="stat"><small>Break-even volume</small><b>${isFinite(be)?fmt(be):'never'}</b></div><div class="stat"><small>Margin of safety</small><b>${pct(mos)}</b></div><div class="stat"><small>Operating leverage</small><b>${isFinite(dol)?fmt(dol,1)+'×':'—'}</b><small>% profit change per 1% volume</small></div></div>${plotXY({x0:0,x1:qx,y0:0,y1:Math.max(v.p,v.vc)*qx,fx:t=>fmt(t/1000)+'k',fy:t=>fmt(t/1e6,1)+'m',series:[{pts:[[0,0],[qx,v.p*qx]],l:'Revenue'},{pts:[[0,v.fc],[qx,v.fc+v.vc*qx]],c:'var(--navy2)',l:'Total cost'},{pts:[[0,v.fc],[qx,v.fc]],c:'var(--mut)',dash:1}],vlines:[[v.q,'var(--ok)','current'],...(isFinite(be)?[[be,'var(--bad)','break-even']]:[])]})}`}},
 challenge:{text:'Changing <b>only the price</b>, reach a <b>20% margin of safety</b> at the current volume.',test:(v,o,v0)=>o.mos>=.2&&v.vc===v0.vc&&v.fc===v0.fc&&v.q===v0.q,why:'Under SAR 1 more per unit does it. That is the power of price on a thin contribution — and why operating leverage cuts both ways when volume falls.'}});

/* m05 — NPV / IRR */
const npvf=(r,c)=>c.reduce((a,x,t)=>a+x/Math.pow(1+r,t),0);
function irrf(c){let lo=-.9,hi=1;if(npvf(lo,c)*npvf(hi,c)>0)return NaN;for(let i=0;i<100;i++){const mi=(lo+hi)/2;if(npvf(lo,c)*npvf(mi,c)<=0)hi=mi;else lo=mi}return(lo+hi)/2}
LABS.npv=(el,m,done)=>calcLab(el,m,done,{inputs:[['r','Discount rate (%)',10,.1],['c0','Year 0 (investment, negative)',-1000],['c1','Year 1',300],['c2','Year 2',350],['c3','Year 3',400],['c4','Year 4',300],['c5','Year 5',200]],
 compute:v=>{const c=[v.c0,v.c1,v.c2,v.c3,v.c4,v.c5],r=v.r/100,n=npvf(r,c),i=irrf(c);let cum=0,pb=null,dc=0,dpb=null;c.forEach((x,t)=>{const p=cum;cum+=x;if(pb==null&&t>0&&cum>=0)pb=t-1+(-p)/x;const pd=dc;dc+=x/Math.pow(1+r,t);if(dpb==null&&t>0&&dc>=0)dpb=t-1+(-pd)/(x/Math.pow(1+r,t))});
  const pts=Array.from({length:41},(_,k)=>[k,npvf(k/100,c)]);const ys=pts.map(p=>p[1]);
  return{out:{n,i},html:`<div class="grid g4 g2m"><div class="stat"><small>NPV at ${fmt(v.r,1)}%</small><b style="color:${n>=0?'var(--ok)':'var(--bad)'}">${fmt(n,1)}</b></div><div class="stat"><small>IRR</small><b>${isFinite(i)?pct(i):'—'}</b></div><div class="stat"><small>Payback</small><b>${pb!=null?fmt(pb,1)+' yrs':'never'}</b></div><div class="stat"><small>Discounted payback</small><b>${dpb!=null?fmt(dpb,1)+' yrs':'never'}</b></div></div>${plotXY({x0:0,x1:40,y0:Math.min(0,...ys),y1:Math.max(...ys,1),fx:t=>t+'%',series:[{pts,l:'NPV profile'}],vlines:[[v.r,'var(--navy2)','your rate'],...(isFinite(i)?[[i*100,'var(--bad)','IRR']]:[])]})}`}},
 challenge:{text:'Find the IRR by hand: change the <b>discount rate</b> until NPV is (almost) zero — within ±5.',test:(v,o)=>Math.abs(o.n)<=5,why:'That is exactly what IRR means: the rate at which NPV is zero. Accept a project when IRR exceeds the cost of capital — but when projects compete or cash flows change sign twice, trust NPV.'}});

/* m06 — WACC and capital structure */
LABS.wacc=(el,m,done)=>{const W=(v,d)=>{const t=v.tax/100,de=d/(1-d),bl=v.bu*(1+(1-t)*de),ke=v.rf/100+bl*v.erp/100,kd=v.kd/100+Math.max(0,d-.3)*.2+Math.max(0,d-.5)*.4;return{ke,kd,bl,w:(1-d)*ke+d*kd*(1-t)}};
 calcLab(el,m,done,{inputs:[['rf','Risk-free rate (%)',4.5,.1],['bu','Unlevered beta',.9,.05],['erp','Equity risk premium (%)',6,.1],['kd','Cost of debt at low leverage (%)',6,.1],['tax','Tax rate (%)',20],['d','Debt share of capital, D/(D+E) (%)',20]],
 compute:v=>{const d=v.d/100,r=W(v,d);const pts=Array.from({length:81},(_,k)=>[k,W(v,k/100).w*100]);let best=pts.reduce((a,b)=>b[1]<a[1]?b:a);
  return{out:{dopt:best[0]},html:`<div class="grid g4 g2m"><div class="stat"><small>Levered beta</small><b>${fmt(r.bl,2)}</b></div><div class="stat"><small>Cost of equity (CAPM)</small><b>${pct(r.ke)}</b></div><div class="stat"><small>After-tax cost of debt</small><b>${pct(r.kd*(1-v.tax/100))}</b></div><div class="stat"><small>WACC</small><b>${pct(r.w)}</b></div></div>${plotXY({x0:0,x1:80,y0:Math.min(...pts.map(p=>p[1]))-1,y1:Math.max(...pts.map(p=>p[1]))+.5,fx:t=>t+'%',fy:t=>fmt(t,1)+'%',series:[{pts,l:'WACC'}],vlines:[[v.d,'var(--navy2)','you']],xl:'debt share of capital'})}<div class="formula">WACC = E/V × Ke + D/V × Kd × (1 − t) · Ke = Rf + β × ERP · β levered = βu × (1 + (1 − t) × D/E)</div>`}},
 challenge:{text:'Find the capital structure that <b>minimises WACC</b> — set the debt share within 5 points of the optimum.',test:(v,o)=>Math.abs(v.d-o.dopt)<=5,why:'Cheap, tax-deductible debt lowers WACC at first; then rising default risk pushes both the cost of debt and the cost of equity up. Real firms also keep a buffer below the optimum for flexibility.'}})};

/* m07 — DCF */
function dcf(v,w,g){const W=w/100,G=g/100;let rev=v.rev,pv=0,f5=0,prev=v.rev;for(let t=1;t<=5;t++){rev=prev*(1+v.g/100);const ebit=rev*v.mg/100,f=ebit*(1-v.tax/100)+rev*v.da/100-rev*v.cx/100-(rev-prev)*v.nwc/100;pv+=f/Math.pow(1+W,t);f5=f;prev=rev}if(W<=G)return{ev:NaN};const tv=f5*(1+G)/(W-G),ptv=tv/Math.pow(1+W,5),ev=pv+ptv;return{ev,ptv,pv,eq:ev-v.nd,ps:(ev-v.nd)/v.sh}}
LABS.dcf=(el,m,done)=>calcLab(el,m,done,{inputs:[['rev','Revenue last year (SAR m)',1000],['g','Revenue growth, years 1–5 (%)',8,.5],['mg','EBIT margin (%)',15,.5],['tax','Tax / zakat (%)',20],['da','Depreciation (% of revenue)',4],['cx','Capex (% of revenue)',5],['nwc','Working capital (% of revenue growth)',10],['w','WACC (%)',10,.1],['tg','Terminal growth (%)',3,.1],['nd','Net debt (SAR m)',400],['sh','Shares (m)',100]],
 compute:v=>{const r=dcf(v,v.w,v.tg);if(!isFinite(r.ev))return{out:{},html:'<div class="readout bad">WACC must be above terminal growth.</div>'};const ws=[-2,-1,0,1,2].map(d=>v.w+d),gs=[-1,-.5,0,.5,1].map(d=>v.tg+d);
  return{out:{tvs:r.ptv/r.ev*100},html:`<div class="grid g4 g2m"><div class="stat"><small>PV of 5-year cash flows</small><b>${fmt(r.pv)}</b></div><div class="stat"><small>PV of terminal value</small><b>${fmt(r.ptv)}</b></div><div class="stat"><small>Enterprise value</small><b>${fmt(r.ev)}</b></div><div class="stat"><small>Value per share</small><b>SAR ${fmt(r.ps,2)}</b></div></div><h4 style="margin-top:12px">Sensitivity: value per share (SAR)</h4><div class="tablewrap"><table class="t"><tr><th>WACC ↓ / g →</th>${gs.map(g=>`<th>${fmt(g,1)}%</th>`).join('')}</tr>${ws.map(w=>`<tr><td><b>${fmt(w,1)}%</b></td>${gs.map(g=>{const x=dcf(v,w,g);const c=w===v.w&&g===v.tg;return`<td style="${c?'background:var(--goldsoft);font-weight:700':''}">${isFinite(x.ev)?fmt(x.ps,1):'—'}</td>`}).join('')}</tr>`).join('')}</table></div>`}},
 challenge:{text:'Read the model: what <b>share of enterprise value</b> comes from the terminal value at your current inputs?',ask:{q:'',ans:(v,o)=>o.tvs,tol:1.5,unit:'%',why:()=>'Usually 60–80%. Most of a DCF\'s value sits beyond the forecast window, which is why the WACC and terminal-growth assumptions deserve the most debate — look how wide the sensitivity grid swings.'}}});

/* m08 — demand, elasticity, profit-maximising price */
LABS.micro=(el,m,done)=>calcLab(el,m,done,{inputs:[['p','Your price (SAR)',50,.5],['a','Demand at price 0 (thousand units)',1000],['b','Units lost per SAR 1 increase (thousand)',10],['c','Marginal cost (SAR)',30],['F','Fixed cost (SAR thousand)',5000]],
 compute:v=>{const Q=p=>Math.max(0,v.a-v.b*p),pf=p=>(p-v.c)*Q(p)-v.F;const q=Q(v.p),e=q>0?-v.b*v.p/q:NaN,ps=(v.a/v.b+v.c)/2,pmax=v.a/v.b;const pts=Array.from({length:61},(_,k)=>{const p=pmax*k/60;return[p,pf(p)]});
  return{out:{ps},html:`<div class="grid g4 g2m"><div class="stat"><small>Quantity</small><b>${fmt(q)}k</b></div><div class="stat"><small>Profit</small><b>${fmt(pf(v.p))}k</b></div><div class="stat"><small>Price elasticity</small><b>${isFinite(e)?fmt(e,2):'—'}</b><small>${isFinite(e)?(Math.abs(e)>1?'elastic':'inelastic'):''}</small></div><div class="stat"><small>Revenue</small><b>${fmt(v.p*q)}k</b></div></div>${plotXY({x0:0,x1:pmax,y0:Math.min(0,...pts.map(p=>p[1])),y1:Math.max(...pts.map(p=>p[1]))*1.1,fx:t=>fmt(t),series:[{pts,l:'Profit'}],vlines:[[v.p,'var(--navy2)','your price']],xl:'price (SAR)'})}<div class="formula">Elasticity = (dQ/dP) × (P/Q). Profit is maximised where marginal revenue = marginal cost.</div>`}},
 challenge:{text:'Set the <b>profit-maximising price</b> (within SAR 1). Then look at the elasticity there.',test:(v,o)=>Math.abs(v.p-o.ps)<=1,why:'With positive marginal cost, the profit-maximising price always sits on the elastic part of demand (|e| > 1). If a firm is pricing where demand is inelastic, it can raise price and earn more.'}});

/* m09 — macro: oil, budget and the Saudi economy (illustrative model) */
LABS.macro=(el,m,done)=>calcLab(el,m,done,{inputs:[['oil','Oil price (USD / barrel)',70,.5],['prod','Crude production (million b/d)',9,.1],['share','Share of oil value reaching the budget (%)',80],['non','Non-oil revenue (SAR bn)',500],['spend','Government spending (SAR bn)',1290],['rate','Policy rate (%)',5,.25]],
 compute:v=>{const k=v.prod*365*v.share/100*3.75/1000;const oilR=k*v.oil,rev=oilR+v.non,bal=rev-v.spend,be=(v.spend-v.non)/k;
  const sig=[v.oil>=80?'Higher oil income supports spending on giga-projects and contractors\' order books.':v.oil<60?'Low oil prices usually mean deficits are financed by borrowing or spending is re-phased; contractors feel it first.':'Moderate oil prices: deficits are manageable, the pace of project awards is the swing factor.',v.rate>=5?'With the riyal pegged to the dollar, the policy rate tracks US rates; high rates weigh on mortgages, SME credit and property.':'Lower rates (following the US) ease mortgage and corporate borrowing costs.','Non-oil revenue (VAT, fees, profits of state entities) is the diversification buffer: every SAR 50bn raised lowers the break-even oil price.'];
  return{out:{be},html:`<div class="grid g4 g2m"><div class="stat"><small>Oil revenue</small><b>SAR ${fmt(oilR)}bn</b></div><div class="stat"><small>Total revenue</small><b>SAR ${fmt(rev)}bn</b></div><div class="stat"><small>Budget balance</small><b style="color:${bal>=0?'var(--ok)':'var(--bad)'}">SAR ${fmt(bal)}bn</b></div><div class="stat"><small>Break-even oil price</small><b>$${fmt(be,1)}</b></div></div><ul>${sig.map(s=>`<li>${s}</li>`).join('')}</ul><p class="note">A teaching model with round, illustrative assumptions — not official figures. For actual numbers, use the Ministry of Finance budget statements and IMF reports in the reading list.</p>`}},
 challenge:{text:'Without reading the break-even tile, move the <b>oil price</b> until the budget balances, then enter that price.',ask:{ans:(v,o)=>o.be,tol:1.5,unit:'USD/bbl',why:()=>'The fiscal break-even is the most quoted macro number in the Gulf. Notice it moves with spending and non-oil revenue as much as with oil itself — that is the logic of diversification.'}}});

/* m10 — pricing simulator: one price vs good-better tiers */
LABS.tiers=(el,m,done)=>{const S=[['Budget',5000,40,10],['Mainstream',3000,70,30],['Premium',1000,120,80]],cB=25,cP=35;
 const sim=(pb,pp,two)=>{let pr=0;const rows=S.map(([n,sz,w,extra])=>{const sb=w-pb,sp=two?w+extra-pp:-1;let ch='none',u=0;if(sp>=0&&sp>sb)ch='Premium tier',u=pp-cP;else if(sb>=0)ch='Basic',u=pb-cB;pr+=u*sz;return[n,sz,w,two?w+extra:'—',ch,u*sz]});return{pr,rows}};
 let best=0;for(let p=20;p<=130;p++)best=Math.max(best,sim(p,0,false).pr);
 calcLab(el,m,done,{inputs:[['pb','Basic price (SAR)',55],['pp','Premium-tier price (SAR, 0 = not offered)',0]],
 compute:v=>{const r=sim(v.pb,v.pp,v.pp>0);return{out:{pr:r.pr},html:`<div class="tablewrap"><table class="t"><tr><th>Segment</th><th>Customers</th><th>Will pay for Basic</th><th>Will pay for Premium</th><th>Chooses</th><th>Profit (SAR)</th></tr>${r.rows.map(x=>`<tr><td>${x[0]}</td><td>${fmt(x[1])}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td><td>${fmt(x[5])}</td></tr>`).join('')}</table></div><div class="grid g2"><div class="stat"><small>Your profit</small><b>SAR ${fmt(r.pr)}</b></div><div class="stat"><small>Best possible with one price</small><b>SAR ${fmt(best)}</b></div></div><p class="note">Unit cost: Basic SAR ${cB}, Premium SAR ${cP}. Each segment picks the option that leaves it the most surplus (value − price).</p>`}},
 challenge:{text:`First find the best single price. Then add a premium tier and <b>beat SAR ${fmt(best)}</b> of profit.`,test:(v,o)=>v.pp>0&&o.pr>best,why:'Tiers let you charge high-value customers more without pricing out the rest. The constraint is self-selection: price Premium so its buyers still prefer it to Basic, and keep Basic cheap enough for the budget segment.'}})};

/* m11 — positioning map */
LABS.position=(el,m,done)=>{const C=CUST('pos');if(C.x==null)Object.assign(C,{x:50,y:50,s:''});const comp=[['Chain A',20,25],['Chain B',35,40],['Chain C',75,80],['Chain D',85,60],['Chain E',45,30]];
 const draw=()=>{const near=Math.min(...comp.map(c=>Math.hypot(c[1]-C.x,c[2]-C.y)));
  el.innerHTML=`<p class="note">Fictional Riyadh coffee chains on two attributes customers care about. Place your new brand where there is real space — and where customers exist.</p>${plotXY({x0:0,x1:100,y0:0,y1:100,h:260,fx:t=>t===0?'cheap':t===100?'pricey':'',fy:t=>t===0?'grab & go':t===100?'experience':'',dots:[...comp.map(c=>[c[1],c[2],'var(--mut)',6,c[0]]),[C.x,C.y,'var(--gold2)',9,'You']],xl:'price →'})}
  <div class="grid g2"><div><label class="f">Price position (0 cheap → 100 premium)</label><input type="range" min="0" max="100" value="${C.x}" id="px" style="width:100%"></div><div><label class="f">Experience (0 grab-and-go → 100 destination)</label><input type="range" min="0" max="100" value="${C.y}" id="py" style="width:100%"></div></div>
  <p class="note">Distance to nearest competitor: <b>${fmt(near)}</b> ${near>=25?'— clear space':'— crowded'}</p>
  <label class="f">Positioning statement: For [target] who [need], [brand] is the [category] that [benefit], unlike [competitor].</label><textarea id="ps">${esc(C.s)}</textarea><div class="ctl"><button class="sbtn" id="sv">Save</button></div><div id="pm"></div>`;
  $('#px',el).oninput=e=>{C.x=+e.target.value;draw()};$('#py',el).oninput=e=>{C.y=+e.target.value;draw()};
  $('#sv',el).onclick=()=>{C.s=$('#ps',el).value;save();const ok=near>=25&&C.s.length>=60&&/for /i.test(C.s)&&/unlike/i.test(C.s);$('#pm',el).innerHTML=`<div class="readout ${ok?'ok':''}">${ok?'<b>Saved.</b> White space is only valuable if there is demand in it: what evidence would show customers want this position?':'Find a spot at least 25 away from the nearest chain, and write the statement using the template (include "For" and "unlike").'}</div>`;if(ok)done()}};draw()};

/* m12 — Five Forces builder */
const PF_PRE={cement:{n:'Saudi cement',v:[4,2,4,2,3],note:'Many regional producers with excess capacity; buyers are contractors who switch on price; energy is a key input.'},ride:{n:'Ride-hailing in Riyadh',v:[5,3,4,3,3],note:'Well-funded rivals, drivers multi-home across apps, riders switch with one tap, regulation shapes entry.'},coffee:{n:'Specialty coffee, Riyadh',v:[4,4,3,2,3],note:'Low entry cost, many new cafés, loyal but fickle customers, substitutes from home brewing and delivery.'}};
const PF=['Rivalry among competitors','Threat of new entrants','Buyer power','Supplier power','Threat of substitutes'];
LABS.porter=(el,m,done)=>{const C=CUST('porter');if(!C.k)Object.assign(C,{k:'cement',v:PF_PRE.cement.v.slice(),t:''});
 const draw=()=>{const avg=C.v.reduce((a,b)=>a+b,0)/5;const att=6-avg;
  el.innerHTML=`<div class="chips">${Object.keys(PF_PRE).map(k=>`<button class="chip ${C.k===k?'on':''}" data-k="${k}">${PF_PRE[k].n}</button>`).join('')}</div><p class="note" style="margin-top:8px">${PF_PRE[C.k].note} Rate each force 1 (weak) to 5 (strong). Strong forces squeeze industry profit.</p>${PF.map((f,i)=>`<div style="margin:8px 0"><div class="row" style="font-size:.9rem"><span>${f}</span><span class="spacer"></span><b>${C.v[i]}</b></div><input type="range" min="1" max="5" value="${C.v[i]}" data-i="${i}" style="width:100%"></div>`).join('')}
  <div class="readout"><b>Industry attractiveness: ${fmt(att,1)} / 5</b> — ${att>=3.5?'structurally attractive':att>=2.5?'average: profits depend on positioning':'tough: expect low average returns'}. Strongest force: <b>${PF[C.v.indexOf(Math.max(...C.v))]}</b>.</div>
  <label class="f">So what? One strategic implication for a company in this industry</label><textarea id="pt">${esc(C.t)}</textarea><div class="ctl"><button class="sbtn" id="sv">Save</button></div>`;
  $$('[data-k]',el).forEach(b=>b.onclick=()=>{C.k=b.dataset.k;C.v=PF_PRE[C.k].v.slice();draw()});$$('input[data-i]',el).forEach(x=>x.oninput=()=>{C.v[+x.dataset.i]=+x.value;draw()});
  $('#sv',el).onclick=()=>{C.t=$('#pt',el).value;save();if(C.t.trim().length>=40){done();toast('Saved')}else toast('Write a fuller implication: what should a company do about the strongest force?')}};draw()};

/* m13 — BCG matrix + Ansoff drill */
LABS.bcg=(el,m,done)=>{const C=CUST('bcg');if(!C.u)C.u=[['Cement',900,2,1.8],['Ready-mix',350,6,0.6],['Precast',120,14,1.4],['Building chemicals',60,18,0.3]];let ok1=false,ok2=false;
 const q=(g,s)=>g>=10?(s>=1?'Star':'Question mark'):(s>=1?'Cash cow':'Dog');
 const drawB=()=>{const lx=s=>Math.log10(Math.max(.1,Math.min(10,s)));
  $('#bb',el).innerHTML=`${plotXY({x0:1,x1:-1,y0:-5,y1:25,h:260,fx:t=>fmt(Math.pow(10,t),1)+'×',fy:t=>t+'%',dots:C.u.map(u=>[lx(u[3]),u[2],'var(--gold2)',5+Math.sqrt(u[1])/3,u[0]]),vlines:[[0,'var(--mut)']],xl:'relative market share (log, high on left)'})}<div class="tablewrap"><table class="t" style="min-width:560px"><tr><th>Unit</th><th>Revenue</th><th>Market growth %</th><th>Relative share</th><th>Quadrant</th></tr>${C.u.map((u,i)=>`<tr><td><input class="tin" data-i="${i}" data-j="0" value="${esc(u[0])}" style="padding:4px 6px;min-width:130px"></td>${[1,2,3].map(j=>`<td><input class="tin" type="number" step="any" data-i="${i}" data-j="${j}" value="${u[j]}" style="padding:4px 6px;max-width:90px"></td>`).join('')}<td><b>${q(u[2],u[3])}</b></td></tr>`).join('')}</table></div><p class="note">Growth line at 10%; relative share = your share ÷ largest rival's. Bubble size = revenue.</p>`;
  $$('#bb input',el).forEach(x=>x.onchange=()=>{const i=+x.dataset.i,j=+x.dataset.j;C.u[i][j]=j?parseFloat(x.value)||0:x.value;save();drawB();ok1=true;chk()})};
 const AO=[['Sell more cement to existing contractors through framework deals','Market penetration'],['Export ready-mix know-how to Iraq','Market development'],['Launch low-carbon cement for giga-projects','Product development'],['Acquire a solar-panel installer','Diversification'],['Win share from rivals in Riyadh with faster delivery','Market penetration']];
 const CELLS=['Market penetration','Product development','Market development','Diversification'];
 el.innerHTML=`<h4>BCG growth-share matrix</h4><p class="note">A fictional building-materials group. Edit any number and watch the unit move.</p><div id="bb"></div><h4 style="margin-top:16px">Ansoff matrix drill</h4><p class="note">Classify each growth option (existing/new products × existing/new markets).</p>${AO.map((a,i)=>`<div style="margin:8px 0"><div style="font-size:.93rem">${a[0]}</div><select class="tin" data-a="${i}" style="margin-top:4px"><option value="">— choose —</option>${CELLS.map(c=>`<option>${c}</option>`).join('')}</select></div>`).join('')}<div class="ctl"><button class="sbtn" id="ac">Check</button></div><div id="am"></div>`;
 const chk=()=>{if(ok1&&ok2)done()};
 $('#ac',el).onclick=()=>{let n=0;$$('[data-a]',el).forEach(s=>{const g=s.value===AO[+s.dataset.a][1];if(g)n++;s.style.borderColor=s.value?g?'var(--ok)':'var(--bad)':''});$('#am',el).innerHTML=`<div class="readout ${n>=4?'ok':''}"><b>${n}/5.</b> Risk rises as you move away from the core: penetration is safest, diversification riskiest. ${n<4?'Red borders are wrong.':''} ${!ok1?'Now change at least one number in the BCG table.':''}</div>`;if(n>=4){ok2=true;chk()}};drawB()};

/* m14 — process analysis and Little's Law */
LABS.process=(el,m,done)=>calcLab(el,m,done,{inputs:[['s1','Step 1: Receive (units/hr)',60],['s2','Step 2: Prepare (units/hr)',45],['s3','Step 3: Assemble (units/hr)',40],['s4','Step 4: Test (units/hr)',55],['s5','Step 5: Pack (units/hr)',70],['d','Demand (units/hr)',50],['wip','Units in process (WIP)',120]],
 compute:v=>{const caps=[v.s1,v.s2,v.s3,v.s4,v.s5],cap=Math.min(...caps),bn=caps.indexOf(cap),th=Math.min(cap,v.d),ft=v.wip/th*60;
  return{out:{ft},html:`${bars(caps.map((c,i)=>({l:'Step '+(i+1),v:th/c*100,c:i===bn?'var(--bad)':'var(--gold2)'})),{h:190,f:x=>fmt(x)+'%'})}<p class="note" style="text-align:center">Utilisation of each step at actual throughput</p><div class="grid g3"><div class="stat"><small>Bottleneck</small><b>Step ${bn+1}</b><small>${fmt(cap)} units/hr</small></div><div class="stat"><small>Throughput</small><b>${fmt(th)} /hr</b><small>${v.d>cap?'demand exceeds capacity':'demand-limited'}</small></div><div class="stat"><small>Lost demand</small><b>${fmt(Math.max(0,v.d-cap))} /hr</b></div></div><div class="formula">Little's Law: WIP = Throughput × Flow time</div>`}},
 challenge:{text:'Using Little\'s Law and the current inputs: what is the <b>average flow time</b> of a unit through the process, in minutes?',ask:{ans:(v,o)=>o.ft,tol:1,unit:'minutes',dp:1,why:()=>'Flow time = WIP ÷ throughput. To cut lead time you either increase throughput (fix the bottleneck) or reduce WIP — which is the core of lean.'}}});

/* m15 — organisational behaviour: situational judgement */
LABS.sjt=(el,m,done)=>{const Q=[
 ['Your manager asks for a market model by Thursday. On Tuesday you realise the client data is missing a region and you cannot finish properly.',[['Work through the night and estimate the missing region quietly',1],['Tell your manager today, with the gap, two options (proxy estimate or one-day delay) and your recommendation',3],['Wait until Thursday and explain then',0],['Email the client directly asking for the data and copy no one',1]],'Raise problems early, with options. Managers forgive gaps; they don\'t forgive surprises.'],
 ['In a team problem-solving session, a senior colleague dismisses your analysis in front of the client.',[['Argue the point there and then until they concede',0],['Stay calm, note the data behind your view in one sentence, and offer to walk through it after the meeting',3],['Say nothing and drop the analysis',1],['Complain to the partner afterwards',1]],'Hold your ground on facts, not ego, and move the disagreement to a private setting.'],
 ['A client counterpart is slow to share data and seems defensive.',[['Escalate to their CEO',0],['Meet them one-on-one, understand what they are worried about, and show how the work helps their area',3],['Work around them using other sources only',1],['Send a firmer reminder email',1]],'Resistance is usually fear of what the data will show. Address the concern, make them a co-owner.'],
 ['Your manager gives feedback that your slides are "too dense". You disagree a little.',[['Thank them, ask for one example of a slide that works well, and apply it to the next deck',3],['Explain why your slides need the detail',1],['Accept silently and change nothing',0],['Ask a peer if the manager is right',1]],'Seek specifics, act on them visibly. You can discuss nuance once you have shown you listened.'],
 ['Two teammates are in conflict and it is slowing the workstream you lead.',[['Ignore it; they are adults',0],['Talk to each separately, then agree clear roles and hand-offs together',3],['Ask the manager to fix it',1],['Take over both pieces of work yourself',1]],'Most team conflict is about unclear roles. Clarify who owns what before it becomes personal.'],
 ['You are asked to join a second project while the first is at a critical stage.',[['Say yes to both and hope it works',0],['Say no outright',1],['Explain your current commitments, ask the two managers to agree priorities, then commit',3],['Say yes, then quietly deprioritise the new one',0]],'Making trade-offs visible protects your reputation for reliability, which is an associate\'s main currency.']];
 let i=0,sc=0;const draw=()=>{if(i>=Q.length){const p=sc/(Q.length*3);el.innerHTML=`<div class="readout ${p>=.65?'ok':''}"><b>${Math.round(p*100)}%.</b> The pattern behind the best answers: raise issues early, keep disagreements on facts and in private, make others co-owners, and make trade-offs visible.</div><button class="sbtn alt" id="ag">Again</button>`;$('#ag',el).onclick=()=>{i=0;sc=0;draw()};if(p>=.65)done();return}
  const q=Q[i],pm=perm(q[1].length);el.innerHTML=`<div class="eyebrow">Situation ${i+1} of ${Q.length}</div><p><b>${q[0]}</b></p>${pm.map(k=>`<button class="qopt" data-k="${k}">${q[1][k][0]}</button>`).join('')}<div id="w"></div>`;
  $$('.qopt',el).forEach(b=>b.onclick=()=>{const k=+b.dataset.k,s=q[1][k][1];sc+=s;$$('.qopt',el).forEach(x=>{x.disabled=true;const v=q[1][+x.dataset.k][1];if(v===3)x.classList.add('right');else if(x===b)x.classList.add('wrong')});$('#w',el).innerHTML=`<div class="readout">${s===3?'<b>Best response.</b> ':`<b>${s} of 3 points.</b> `}${q[2]}</div><div class="ctl"><span class="spacer"></span><button class="sbtn" id="nx">Next →</button></div>`;$('#nx',el).onclick=()=>{i++;draw()};reveal($('#nx',el))})};draw()};

/* m16 — regression and A/B testing */
const ncdf=z=>{const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p};
LABS.stats=(el,m,done)=>{const C=CUST('stats');if(!C.d)C.d='2,24\n3,28\n4,33\n5,34\n6,41\n7,44\n8,45\n9,52\n10,53\n11,60';
 el.innerHTML=`<h4>Regression: advertising spend vs sales</h4><p class="note">One pair per line: x, y (SAR m spend, SAR m sales). Edit freely.</p><div class="grid g2"><textarea id="rd" style="min-height:180px;font-family:var(--mono)">${esc(C.d)}</textarea><div id="ro"></div></div>
 <h4 style="margin-top:16px">A/B test: checkout page</h4><div class="grid g4 g2m">${numIn('va','Visitors A',5000)}${numIn('ca','Conversions A',400)}${numIn('vb','Visitors B',5000)}${numIn('cb','Conversions B',460)}</div><div id="ao"></div>
 <div class="card gold" style="box-shadow:none;margin-top:12px"><div class="eyebrow">Challenge</div><p style="margin:.3rem 0">With the current A/B numbers, what is the <b>two-sided p-value</b>? Is B's lift significant at 95%?</p><div class="row"><input class="tin" id="pv" type="number" step="any" style="max-width:160px" placeholder="e.g. 0.05"><button class="sbtn" id="pc">Check</button></div><div id="pm"></div></div>`;
 let p=1;const reg=()=>{C.d=$('#rd',el).value;const pts=C.d.split('\n').map(l=>l.split(/[,;\s]+/).map(Number)).filter(a=>a.length>=2&&isFinite(a[0])&&isFinite(a[1]));const n=pts.length;if(n<3){$('#ro',el).innerHTML='<p class="note">Need at least 3 points.</p>';return}
   const mx=pts.reduce((a,b)=>a+b[0],0)/n,my=pts.reduce((a,b)=>a+b[1],0)/n;let sxy=0,sxx=0,syy=0;pts.forEach(([x,y])=>{sxy+=(x-mx)*(y-my);sxx+=(x-mx)**2;syy+=(y-my)**2});const b=sxy/sxx,a=my-b*mx,r2=sxy*sxy/(sxx*syy);const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs);
   $('#ro',el).innerHTML=plotXY({x0,x1,y0:Math.min(...ys,a+b*x0)*.9,y1:Math.max(...ys,a+b*x1)*1.05,h:200,dots:pts.map(p=>[p[0],p[1]]),series:[{pts:[[x0,a+b*x0],[x1,a+b*x1]],c:'var(--gold2)'}]})+kv([['Slope (sales per SAR 1 of ads)',fmt(b,2)],['Intercept',fmt(a,2)],['R²',fmt(r2,3)]])+'<p class="note">R² says how much of the variation the line explains — not that ads cause sales. Ask what else moved at the same time.</p>';save()};
 const ab=()=>{const va=V('va',el),ca=V('ca',el),vb=V('vb',el),cb=V('cb',el);const pa=ca/va,pb=cb/vb,pp=(ca+cb)/(va+vb),se=Math.sqrt(pp*(1-pp)*(1/va+1/vb)),z=(pb-pa)/se;p=2*(1-ncdf(Math.abs(z)));
   $('#ao',el).innerHTML=kv([['Conversion A',pct(pa,2)],['Conversion B',pct(pb,2)],['Relative lift',pct((pb-pa)/pa,1)],['z-score',fmt(z,2)]])};
 $('#rd',el).oninput=reg;$$('#va,#ca,#vb,#cb',el).forEach(x=>x.oninput=ab);reg();ab();
 $('#pc',el).onclick=()=>{const g=parseFloat($('#pv',el).value);const ok=Math.abs(g-p)<=Math.max(.003,p*.1);$('#pm',el).innerHTML=`<div class="readout ${ok?'ok':'bad'}"><b>${ok?'Correct':'p ≈ '+fmt(p,3)}</b> — ${p<.05?'significant at 95%: unlikely to be chance alone.':'not significant at 95%: the lift could be noise. Run longer or test a bigger change.'} Two-proportion z-test: z = (p_B − p_A) / √(p(1−p)(1/n_A + 1/n_B)).</div>`;if(ok)done()}};

/* ================= Entrepreneurship labs ================= */
/* generic multi-field canvas builder, saved per profile */
function canvasLab(el,done,key,cfg){const C=CUST(key);C.f=C.f||{};const draw=()=>{el.innerHTML=`<p class="note">${cfg.intro}</p>${cfg.ex?`<div class="ctl"><button class="sbtn alt sm" id="cx">Load an example</button></div>`:''}<div class="grid ${cfg.cols||'g3'}">${cfg.fields.map(([k,l,h])=>`<div class="card" style="box-shadow:none;margin:0;padding:12px"><label class="f" style="margin-top:0"><b>${l}</b>${h?' — '+h:''}</label><textarea data-k="${k}" style="min-height:84px">${esc(C.f[k]||'')}</textarea></div>`).join('')}</div><div class="ctl"><button class="sbtn" id="cs">Save</button><button class="sbtn alt" id="cc">Copy as text</button></div><div id="cm"></div>`;
  $$('textarea[data-k]',el).forEach(t=>t.oninput=()=>{C.f[t.dataset.k]=t.value});
  const cx=$('#cx',el);if(cx)cx.onclick=()=>{C.f=Object.assign({},cfg.ex);save();draw()};
  $('#cc',el).onclick=()=>{try{navigator.clipboard.writeText(cfg.fields.map(([k,l])=>l+':\n'+(C.f[k]||'')).join('\n\n'));toast('Copied')}catch(e){}};
  $('#cs',el).onclick=()=>{save();const filled=cfg.fields.filter(([k])=>(C.f[k]||'').trim().length>=8).length;const ok=filled>=cfg.fields.length;$('#cm',el).innerHTML=`<div class="readout ${ok?'ok':''}">${ok?'<b>Saved.</b> '+cfg.check:`Fill every box with something specific (${filled}/${cfg.fields.length} done).`}</div>`;if(ok)done()}};draw()}

/* s01 — opportunity scoring */
const OPC=[['Pain severity',3],['Market size',2],['Willingness to pay',3],['Founder–market fit',2],['Competition (5 = little)',1],['Regulatory ease (5 = easy)',1]];
LABS.oppscore=(el,m,done)=>{const C=CUST('opp');if(!C.i)C.i=[{n:'',s:[3,3,3,3,3,3]},{n:'',s:[3,3,3,3,3,3]},{n:'',s:[3,3,3,3,3,3]}];
 const sc=s=>s.reduce((a,v,j)=>a+v*OPC[j][1],0)/OPC.reduce((a,c)=>a+5*c[1],0)*100;
 const draw=()=>{el.innerHTML=`<p class="note">Write up to three business ideas (yours, or problems you have seen at work or in Saudi industry). Score each criterion 1–5. Weights in brackets reflect what matters most early on: a painful problem people will pay to solve.</p><div class="grid g3">${C.i.map((it,i)=>`<div class="card" style="box-shadow:none;margin:0"><input class="tin" data-n="${i}" value="${esc(it.n)}" placeholder="Idea ${i+1}">${OPC.map((c,j)=>`<div style="margin-top:6px"><div class="row" style="font-size:.8rem"><span>${c[0]} (×${c[1]})</span><span class="spacer"></span><b>${it.s[j]}</b></div><input type="range" min="1" max="5" value="${it.s[j]}" data-i="${i}" data-j="${j}" style="width:100%"></div>`).join('')}<div class="big" style="margin-top:8px">${fmt(sc(it.s))}<span class="note">/100</span></div></div>`).join('')}</div><div class="ctl"><button class="sbtn" id="sv">Rank my ideas</button></div><div id="om"></div>`;
  $$('[data-n]',el).forEach(x=>x.onchange=()=>{C.i[+x.dataset.n].n=x.value;save()});$$('input[type=range]',el).forEach(x=>x.oninput=()=>{C.i[+x.dataset.i].s[+x.dataset.j]=+x.value;save();draw()});
  $('#sv',el).onclick=()=>{const named=C.i.filter(x=>x.n.trim());if(named.length<2){toast('Name at least two ideas');return}const r=named.slice().sort((a,b)=>sc(b.s)-sc(a.s));$('#om',el).innerHTML=`<div class="readout ok"><b>Top idea: ${esc(r[0].n)} (${fmt(sc(r[0].s))}).</b> A score is a hypothesis, not a verdict. Your next step is ten customer interviews to test the two criteria you scored most generously.</div>`;done()}};draw()};

/* s02 — Mom Test drill */
LABS.momtest=(el,m,done)=>classifyLab(el,done,{intro:'Customer interviews fail when people are polite. Which questions produce reliable evidence?',cats:['Good question','Bad question'],
 items:[['"Would you use an app that helps you schedule maintenance?"','Bad question','hypothetical and leading: people say yes to be nice'],['"Tell me about the last time a pump failed unexpectedly. What happened?"','Good question','specific past behaviour'],['"How much would you pay for this?"','Bad question','opinions about future spending are unreliable'],['"What do you use today to track maintenance, and what does it cost you?"','Good question','current solution and real spend'],['"Do you think this is a good idea?"','Bad question','fishing for compliments'],['"How much time did your team spend on that last month?"','Good question','quantifies the pain with facts'],['"Who else is involved when you buy a solution like this?"','Good question','reveals the buying process'],['"Wouldn\'t it be great if downtime were zero?"','Bad question','leading; everyone agrees']],
 why:'The Mom Test (Fitzpatrick): talk about their life, not your idea; ask about specifics in the past, not opinions about the future; talk less and listen more. Commitments (time, money, introductions) are the real signal.'});

/* s03 — value proposition canvas */
LABS.vpc=(el,m,done)=>canvasLab(el,done,'vpc',{intro:'Customer profile on the left, value map on the right. Fit means your pain relievers and gain creators address the pains and gains that matter most.',cols:'g2',
 fields:[['jobs','Customer jobs','what they are trying to get done'],['prod','Products & services','what you offer'],['pains','Pains','frustrations, risks, costs'],['rel','Pain relievers','how you remove specific pains'],['gains','Gains','outcomes they want'],['gc','Gain creators','how you create those gains']],
 ex:{jobs:'Plant maintenance manager: keep 40 pumps running; report uptime monthly; stay within budget.',prod:'Sensor kit + predictive-maintenance dashboard + monthly reliability review.',pains:'Unplanned failures stop production (SAR 20k/hour); reactive overtime; no early warning.',rel:'Alerts 1–2 weeks before likely failure; ranked list of pumps at risk.',gains:'Predictable schedule; credit from management for uptime; lower spare-parts stock.',gc:'Uptime report auto-generated for management; spare parts ordered just in time.'},
 check:'Test fit: for each top pain, can you point to a specific reliever? If a reliever has no matching pain, it is a feature nobody asked for.'});

/* s04 — lean canvas */
LABS.leancanvas=(el,m,done)=>canvasLab(el,done,'lean',{intro:'Ash Maurya\'s lean canvas: one page, nine boxes, every box a hypothesis to test. Fill it for your top idea from mission 1.',
 fields:[['prob','Problem','top 3'],['seg','Customer segments','early adopters first'],['uvp','Unique value proposition','one clear message'],['sol','Solution','top 3 features'],['ch','Channels','path to customers'],['rev','Revenue streams','model and price'],['cost','Cost structure','fixed and variable'],['met','Key metrics','what you will track'],['adv','Unfair advantage','cannot be easily copied']],
 ex:{prob:'1) Unplanned pump failures in mid-size plants 2) No affordable monitoring 3) Maintenance data on paper',seg:'Mid-size food, water and chemical plants in the Eastern Province; early adopters: plants with recent costly failures',uvp:'Know which pump will fail next — two weeks before it does',sol:'Clip-on vibration sensors; failure-risk ranking; WhatsApp alerts',ch:'Direct sales via plant engineers; pump distributors; industrial-city associations',rev:'SAR 1,500 per pump per year subscription; installation fee',cost:'Sensors (SAR 400/unit), cloud, 3 engineers, sales',met:'Pumps monitored, failures predicted, churn, payback per client',adv:'Failure dataset from Saudi operating conditions (heat, dust, water quality)'},
 check:'Now rank the boxes by risk. The riskiest assumption (usually Problem or Customer segment) is what your next experiment must test.'});

/* s05 — TAM/SAM/SOM */
LABS.tam=(el,m,done)=>calcLab(el,m,done,{inputs:[['plants','Industrial plants in KSA with pumps (count)',8000],['pumps','Average critical pumps per plant',30],['price','Price per pump per year (SAR)',1500],['sam','Share in your target regions & sectors (%)',25],['som','Share you can win in 5 years (%)',8]],
 compute:v=>{const tam=v.plants*v.pumps*v.price/1e6,sam=tam*v.sam/100,som=sam*v.som/100;
  return{out:{som},html:`<div class="grid g3"><div class="stat"><small>TAM: everyone who could buy</small><b>SAR ${fmt(tam,1)}m</b></div><div class="stat"><small>SAM: who you can serve</small><b>SAR ${fmt(sam,1)}m</b></div><div class="stat"><small>SOM: what you can win</small><b>SAR ${fmt(som,1)}m</b></div></div>${bars([{l:'TAM',v:tam,c:'var(--line)'},{l:'SAM',v:sam,c:'#7C8BA3'},{l:'SOM',v:som}],{h:180,f:x=>fmt(x,1)+'m'})}<p class="note">Bottom-up (count customers × price) is more credible to investors than top-down ("1% of a USD 10bn market"). Assumptions here are illustrative — replace them with sourced numbers.</p>`}},
 challenge:{text:'Read your model: what is the <b>SOM</b> in SAR millions at the current inputs?',ask:{ans:(v,o)=>o.som,tol:.2,dp:1,unit:'SAR m',why:()=>'Investors will push on the SOM: how many sales people, how many plants per month, what conversion? Be ready to rebuild it from the sales funnel.'}}});

/* s06 — business models */
LABS.bizmodel=(el,m,done)=>classifyLab(el,done,{intro:'Match each (fictional or generic) business to its core revenue model.',cats:['Marketplace (take rate)','Subscription / SaaS','Freemium','Razor and blade','Transaction fee','Advertising','Licensing','Hardware + service bundle'],
 items:[['A platform matching home-maintenance technicians with households, keeping 15% of each job','Marketplace (take rate)'],['Accounting software billed per company per month','Subscription / SaaS'],['A budgeting app free for basic use, SAR 15/month for premium features','Freemium'],['Cheap coffee machines, profitable capsules','Razor and blade'],['A payment gateway charging 2.5% per card payment','Transaction fee'],['A free news app funded by sponsors','Advertising'],['A university lab earning royalties on a patented desalination membrane','Licensing'],['Predictive-maintenance sensors sold with a yearly monitoring contract','Hardware + service bundle']],pass:6,
 why:'The model decides your unit economics: marketplaces need liquidity on both sides, SaaS needs low churn, freemium needs high conversion, razor-blade needs lock-in.'});

/* s07 — unit economics */
LABS.ltv=(el,m,done)=>calcLab(el,m,done,{inputs:[['arpu','Revenue per customer per month (SAR)',250],['gm','Gross margin (%)',70],['churn','Monthly churn (%)',5,.1],['cac','Customer acquisition cost (SAR)',2400]],
 compute:v=>{const life=v.churn>0?1/(v.churn/100):Infinity,ltv=v.arpu*v.gm/100*life,ratio=ltv/v.cac,pb=v.cac/(v.arpu*v.gm/100);
  return{out:{ratio},html:`<div class="grid g4 g2m"><div class="stat"><small>Average lifetime</small><b>${fmt(life,1)} mo</b></div><div class="stat"><small>LTV (gross-margin based)</small><b>SAR ${fmt(ltv)}</b></div><div class="stat"><small>LTV ÷ CAC</small><b style="color:${ratio>=3?'var(--ok)':'var(--bad)'}">${fmt(ratio,1)}×</b></div><div class="stat"><small>CAC payback</small><b>${fmt(pb,1)} mo</b></div></div><div class="formula">LTV = ARPU × gross margin ÷ monthly churn · Rules of thumb: LTV/CAC ≥ 3, payback ≤ 12 months</div>`}},
 challenge:{text:'Reach <b>LTV/CAC ≥ 3</b>. Which lever is most realistic for an early start-up: lower churn, higher price, or cheaper acquisition?',test:(v,o)=>o.ratio>=3,why:'Churn is usually the highest-leverage fix: halving churn doubles lifetime value. Cheaper CAC from referrals and partnerships also compounds. Price changes need evidence of willingness to pay.'}});

/* s08 — experiment design + sample size */
LABS.experiment=(el,m,done)=>{const C=CUST('exp');C.f=C.f||{};
 el.innerHTML=`<h4>Experiment card</h4><div class="grid g2">${[['h','We believe that…','e.g. plant managers will pay a SAR 500 deposit for a pilot'],['t','To verify, we will…','e.g. pitch 30 managers with a landing page and deposit link'],['m','And measure…','e.g. deposit conversion'],['c','We are right if…','e.g. ≥ 10% pay the deposit']].map(([k,l,p])=>`<div><label class="f">${l}</label><textarea data-k="${k}" style="min-height:60px" placeholder="${p}">${esc(C.f[k]||'')}</textarea></div>`).join('')}</div>
 <h4 style="margin-top:14px">How many people do you need?</h4><div class="grid g4 g2m">${numIn('p1','Baseline conversion (%)',10)}${numIn('p2','Conversion you hope to detect (%)',15)}${numIn('al','Significance α (%)',5)}${numIn('pw','Power (%)',80)}</div><div id="so"></div><div class="ctl"><button class="sbtn" id="sv">Save experiment</button></div><div id="sm"></div>`;
 const zf=p=>{let lo=-6,hi=6;for(let i=0;i<60;i++){const mi=(lo+hi)/2;if(ncdf(mi)<p)lo=mi;else hi=mi}return(lo+hi)/2};
 const calc=()=>{const p1=V('p1',el)/100,p2=V('p2',el)/100,za=zf(1-V('al',el)/200),zb=zf(V('pw',el)/100);const n=Math.ceil((za+zb)**2*(p1*(1-p1)+p2*(1-p2))/((p1-p2)**2));$('#so',el).innerHTML=`<div class="readout"><b>${isFinite(n)?fmt(n):'—'} per group</b> (${isFinite(n)?fmt(2*n):'—'} total) to detect ${pct(p1,0)} → ${pct(p2,0)}. Small effects need large samples: early start-ups should test for <i>big</i> effects, or use qualitative signals such as deposits and letters of intent.</div>`};
 $$('#p1,#p2,#al,#pw',el).forEach(x=>x.oninput=calc);calc();$$('textarea[data-k]',el).forEach(t=>t.oninput=()=>{C.f[t.dataset.k]=t.value});
