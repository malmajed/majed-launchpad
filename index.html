/* ---------- b14 Portfolio management ---------- */
{id:'b14',track:'cfa2',topic:'pm',title:'Multifactor models, VaR, backtesting and active management',mins:60,blurb:'APT and factor models, measuring market risk, the fundamental law, ETFs and honest backtests.',
 lab:{key:'varlab',name:'VaR and the fundamental law',intro:'Compute a parametric VaR, then see what drives an active manager\'s information ratio.'},
 cards:[
  {h:'Economics and markets',b:`<p>Asset prices = expected cash flows discounted at a rate that reflects the real risk-free rate, expected inflation and risk premia. Assets that pay off in bad times (hedges against consumption shocks) have low premia; equities pay off poorly in recessions, so they carry a higher premium. Default-free yields reflect growth, inflation and a term premium; credit spreads widen in downturns.</p>`},
  {h:'Multifactor models',b:`<p><b>APT:</b> E(R) = R<sub>f</sub> + Σ β<sub>i</sub> λ<sub>i</sub>; mispricing invites arbitrage with factor-replicating portfolios. Types: <b>macroeconomic</b> (surprises in GDP, inflation), <b>fundamental</b> (value, size, momentum), <b>statistical</b>. Active risk² = active factor risk + active specific risk. Factor models support return attribution and tilting.</p>`},
  {h:'Measuring market risk',b:`<p><b>VaR</b>: minimum loss at a given probability over a horizon. Methods: parametric (normal; poor for options and fat tails), historical simulation, Monte Carlo. <b>CVaR</b> (expected shortfall) averages losses beyond VaR. Also: incremental and marginal VaR, stress tests and scenario analysis, and sensitivity measures (duration, beta, Greeks). Backtest by counting exceedances.</p>`},
  {h:'Active management',b:`<p>Information ratio IR = active return ÷ active risk. <b>Fundamental law:</b> IR ≈ TC × IC × √BR. Optimal active risk = (IR ÷ SR<sub>B</sub>) × σ<sub>B</sub>; the best Sharpe ratio is √(SR<sub>B</sub>² + IR²). Constraints lower TC; independent bets raise BR.</p>`},
  {h:'ETFs and backtesting',b:`<p>ETFs: <b>creation/redemption</b> by authorised participants keeps prices near NAV; costs include expense ratio, tracking error, bid–ask spread and premiums or discounts. <b>Backtesting</b> pitfalls: survivorship bias, look-ahead bias, data snooping, ignoring costs. Use rolling windows, out-of-sample tests, and scenario or Monte Carlo simulation.</p>`}],
 sets:[
  {t:'A two-factor APT',v:`<p>An analyst uses a two-factor APT model. The risk-free rate is 3%. The risk premium is 4% for factor 1 (GDP surprise) and 1.5% for factor 2 (inflation surprise). Portfolio P has sensitivities of 1.2 to factor 1 and −0.5 to factor 2.</p><p>For an active fund: active factor risk variance is 9 (%²) and active specific risk variance is 7 (%²). The manager's IR is 0.45; the benchmark's Sharpe ratio is 0.40 and its volatility is 18%.</p>`,
   qs:[{q:'Portfolio P\'s expected return under APT is:',o:['7.05%','8.55%','4.80%'],a:0,w:'3 + 1.2 × 4 − 0.5 × 1.5 = 7.05%.'},
    {q:'If P is priced to return 8%, an arbitrageur would:',o:['buy P and short a portfolio with the same factor exposures','short P and buy the replicating portfolio','do nothing, because APT allows mispricing'],a:0,w:'P offers more than its factor exposures justify.'},
    {q:'The fund\'s active risk is:',o:['4.0%','16.0%','5.0%'],a:0,w:'√(9 + 7) = 4%.'},
    {q:'The optimal active risk is closest to:',o:['20.25%','16.0%','8.1%'],a:0,w:'(0.45 ÷ 0.40) × 18% = 20.25%.'}]},
  {t:'Risk measurement at a family office',v:`<p>A family office holds a USD 50 million portfolio with an expected annual return of 8% and annual volatility of 18%. Use 250 trading days and z = 1.645 for 95%.</p><p>Its risk manager backtested the 95% one-day VaR over the past 250 days and found 21 exceedances.</p><p>A quant also backtested a value strategy using today's index constituents for the whole 20-year history.</p>`,
   qs:[{q:'The one-day 95% parametric VaR is closest to:',o:['USD 0.92m','USD 1.48m','USD 0.94m'],a:0,w:'(1.645 × 0.18 ÷ √250 − 0.08 ÷ 250) × 50 = (0.01873 − 0.00032) × 50 = 0.92.'},
    {q:'The backtest result suggests the VaR model:',o:['understates risk','overstates risk','is well calibrated'],a:0,w:'About 12.5 exceedances are expected at 95%; 21 is far more.'},
    {q:'Conditional VaR (expected shortfall) is:',o:['the average loss when the loss exceeds VaR','the worst possible loss','VaR scaled to a 10-day horizon'],a:0,w:'CVaR describes the tail beyond VaR.'},
    {q:'Using today\'s index constituents in the historical test introduces:',o:['survivorship bias','look-ahead bias','data-snooping bias'],a:0,w:'Companies that failed or were removed are excluded, flattering results.'}]}],
 srs:[{q:'APT expected return?',a:'R_f + Σ β_i λ_i.'},{q:'Fundamental law?',a:'IR ≈ TC × IC × √BR.'},{q:'Optimal active risk?',a:'(IR ÷ SR_B) × σ_B.'},{q:'CVaR?',a:'Average loss beyond VaR.'}],
 read:[{t:'Arbitrage pricing theory',s:'Wikipedia',u:WIKI('Arbitrage_pricing_theory')},{t:'Value at risk',s:'Wikipedia',u:WIKI('Value_at_risk')},{t:'Expected shortfall',s:'Wikipedia',u:WIKI('Expected_shortfall')}]},

/* ---------- b15 Item-set technique ---------- */
{id:'b15',track:'cfa2',topic:'fsa',title:'Item-set technique',mins:40,blurb:'How to read a vignette, budget time and avoid the classic traps. Practised on two mixed sets.',
 lab:{key:'itemset',name:'Good practice or trap?',intro:'Eight habits. Which help, which hurt?'},
 cards:[
  {h:'The format',b:`<p>Level II has <b>22 item sets</b> of 4 multiple-choice questions (88 questions), in two sessions of 2 hours 12 minutes, so about <b>18 minutes per set</b>. Each vignette is 1–2 pages with tables and exhibits. There is no penalty for wrong answers. CFA Institute does not publish a minimum passing score.</p>`},
  {h:'Read with purpose',b:`<ol><li>Glance at the four questions first.</li><li>Read the vignette, marking the data each question needs.</li><li>Note the accounting standard (IFRS or US GAAP), units and time periods.</li><li>Answer in the order that suits you; questions are independent.</li></ol>`},
  {h:'Classic traps',b:`<ul><li>Distractors built from a sign error, wrong period, or the trailing vs leading version of a ratio.</li><li>Statements that are "partly correct": judge every clause.</li><li>Irrelevant data included on purpose.</li><li>Ethics vignettes in which most actions are fine.</li></ul>`},
  {h:'Time and energy',b:`<p>Set a checkpoint every 3 sets (~54 minutes). If a set is a disaster, guess, flag and move on; a later set is worth the same. Keep your calculator in the same mode all day (e.g. P/Y = 1, 4+ decimals).</p>`},
  {h:'Study plan',b:`<p>Level II rewards depth: candidates often report 300+ hours. Work topic by topic, then do mixed item sets under time. Track accuracy per topic in this app's exam simulator and spend the final weeks on the highest-weight weak topics: equity, fixed income, FSA, portfolio management and ethics.</p>`}],
 sets:[
  {t:'Integrated FSA: DuPont at Hijaz Steel',v:`<p>Hijaz Steel (fictional) reports under IFRS (SAR m): revenue 2,000; EBIT 300; earnings before tax 250; net income 200; average total assets 2,500; average equity 1,000. Interest paid of 50 is classified in financing cash flows; dividends received are classified as investing.</p><p>A board member asks what would happen to ROE if interest costs rose with everything else unchanged.</p>`,
   qs:[{q:'Hijaz\'s ROE is:',o:['20.0%','15.0%','12.0%'],a:0,w:'0.80 (tax burden) × 0.833 (interest burden) × 15% (EBIT margin) × 0.8 (turnover) × 2.5 (leverage) = 20%.'},
    {q:'The interest burden is:',o:['0.833','0.800','0.150'],a:0,w:'EBT ÷ EBIT = 250 ÷ 300.'},
    {q:'If interest costs rose, the DuPont component that falls directly is:',o:['the interest burden','the EBIT margin','asset turnover'],a:0,w:'EBIT is before interest, so only EBT ÷ EBIT changes.'},
    {q:'Classifying interest paid as financing is:',o:['allowed under IFRS but not under US GAAP','required under both IFRS and US GAAP','allowed only under US GAAP'],a:0,w:'US GAAP requires interest paid in operating cash flows; IFRS allows operating or financing (until IFRS 18 takes effect in 2027).'}]},
  {t:'Ethics: Oasis Wealth',topic:'eth',v:`<p>Oasis Wealth (fictional) claims compliance with the GIPS standards "except for our real-estate composites, which are being updated".</p><p>Rania, CFA, places her personal trades only after all client orders in the same security have been executed. She also tells new clients that she receives a fee from a law firm for each referral, and has told her employer.</p><p>Her colleague presents a strategy's backtested results in a marketing pack, clearly labelled as hypothetical, with the method explained.</p>`,
   qs:[{q:'Oasis Wealth\'s GIPS claim:',o:['is not allowed: compliance must be firm-wide, with no partial claims','is acceptable while composites are being updated','is acceptable if the exception is disclosed in a footnote'],a:0,w:'A firm either complies with all applicable GIPS requirements firm-wide or cannot claim compliance.'},
    {q:'Rania\'s personal trading practice:',o:['is consistent with Standard VI(B) Priority of Transactions','violates VI(B): members must never trade securities that clients hold','violates III(B) Fair Dealing'],a:0,w:'Clients first, then employer, then personal accounts.'},
    {q:'Her referral arrangement:',o:['complies with Standard VI(C) because it is disclosed to clients and her employer','violates VI(C) because referral fees are prohibited','violates IV(B) because she has no written consent from clients'],a:0,w:'VI(C) requires disclosure to employer, clients and prospects, which she made.'},
    {q:'Presenting the backtested results as described:',o:['is consistent with Standard III(D) Performance Presentation','violates III(D) because only actual results may be shown','violates I(C) because hypothetical numbers are misrepresentation'],a:0,w:'Simulated results are allowed if clearly identified as such, with adequate explanation.'}]}],
 srs:[{q:'Level II format?',a:'22 item sets × 4 questions = 88; about 18 minutes per set.'},{q:'First step on an item set?',a:'Read the questions, then the vignette.'},{q:'Interest paid: IFRS vs US GAAP?',a:'IFRS: operating or financing. US GAAP: operating.'},{q:'Partial GIPS compliance claims?',a:'Not allowed.'}],
 read:[{t:'CFA Program Level II exam',s:'CFA Institute',u:CFAI},{t:'GIPS standards',s:'CFA Institute',u:'https://www.gipsstandards.org/'},{t:'DuPont analysis',s:'Wikipedia',u:WIKI('DuPont_analysis')}]},

/* ---------- b16 Level II mock ---------- */
{id:'b16',track:'cfa2',topic:'der',title:'Level II mock',mins:45,blurb:'Mixed item sets under time, then a full simulator run. Choose the right model under pressure.',
 lab:{key:'modelpick',name:'Which valuation model?',intro:'Seven situations. Pick the model that fits the company and the investor.'},
 cards:[
  {h:'How to use this mission',b:`<p>Do the lab and the two mixed item sets here, then open the <b>Practice simulator</b> from the Investment Foundations II track page and run a 5-set or 11-set timed session. Review every wrong answer: write the reason (concept, calculation, or reading) in your reflection.</p>`},
  {h:'The equity model decision',b:`<p>Dividends for minority investors with stable payouts; FCFE for control or non-payers with stable leverage; FCFF for changing leverage; residual income for negative FCF and reliable book values (banks); multiples for quick relative checks. Always ask what the investor actually receives.</p>`},
  {h:'Derivatives checklist',b:`<ul><li>Forward: carry arbitrage, subtract benefits, add costs.</li><li>Swap: par rate from discount factors.</li><li>Binomial: risk-neutral q; American puts may be exercised early.</li><li>BSM: N(d₂) is the exercise probability; delta = N(d₁).</li></ul>`},
  {h:'Corporate issuer checklist',b:`<ul><li>MM with taxes: cost of equity and WACC.</li><li>Buyback accretion: E/P vs after-tax cost of debt.</li><li>M&A: premium, synergies, cash vs stock.</li><li>ERP and build-up rates for private firms.</li></ul>`},
  {h:'Final weeks',b:`<p>Do at least two full-length mocks from a reputable provider and CFA Institute's own practice packs. Keep a mistakes log by topic. In the last week, revise formulas and ethics, sleep well, and keep the calculator settings fixed.</p>`}],
 sets:[
  {t:'An American put on a two-period tree',v:`<p>A stock trades at 50. Each period it moves up by a factor of 1.2 or down by a factor of 0.8. The risk-free rate is 5% per period. Consider two-period European and American puts with a strike of 52.</p>${tbl([['Node','Stock price','Put payoff at expiry'],['Up–up','72','0'],['Up–down','48','4'],['Down–down','32','20']])}`,
   qs:[{q:'The risk-neutral probability of an up move is:',o:['0.625','0.500','0.375'],a:0,w:'(1.05 − 0.8) ÷ (1.2 − 0.8) = 0.625.'},
    {q:'The European put value is closest to:',o:['4.25','5.14','2.00'],a:0,w:'Up node: 1.5 ÷ 1.05 = 1.429. Down node: (2.5 + 7.5) ÷ 1.05 = 9.524. Today: (0.625 × 1.429 + 0.375 × 9.524) ÷ 1.05 = 4.25.'},
    {q:'The American put value is closest to:',o:['5.14','4.25','12.00'],a:0,w:'At the down node, exercise (52 − 40 = 12) beats holding (9.52). Today: (0.625 × 1.429 + 0.375 × 12) ÷ 1.05 = 5.14.'},
    {q:'Early exercise is optimal at the down node because:',o:['the exercise value (12.00) exceeds the continuation value (9.52)','American puts should always be exercised early','the risk-neutral probability is above 0.5'],a:0,w:'Exercising now earns interest on the strike, worth more than the remaining option value.'}]},
  {t:'Mergers: Riyadh Foods bids for Jeddah Dairy',topic:'ci',v:`<p>Riyadh Foods (fictional) offers SAR 1,250 million in cash for Jeddah Dairy, whose standalone market value is SAR 1,000 million. Riyadh estimates the present value of synergies at SAR 300 million.</p><p>Riyadh also considers spinning off its packaging division into a separate listed company, owned by Riyadh's existing shareholders.</p>`,
   qs:[{q:'The gain to Jeddah\'s shareholders is:',o:['SAR 250m','SAR 300m','SAR 50m'],a:0,w:'The takeover premium: 1,250 − 1,000.'},
    {q:'The gain to Riyadh\'s shareholders is:',o:['SAR 50m','SAR 250m','SAR 300m'],a:0,w:'Synergies − premium = 300 − 250.'},
    {q:'If Riyadh paid in shares instead of cash, Jeddah\'s shareholders would:',o:['share in the risk that synergies are not achieved','receive a guaranteed premium','bear no risk after closing'],a:0,w:'In a stock deal, target holders own part of the combined firm, so they share synergy risk.'},
    {q:'A spin-off differs from a divestiture because:',o:['shares of the new company go to existing shareholders and no cash is received','the parent receives cash from a buyer','it requires a cash tender offer'],a:0,w:'A divestiture sells the unit for cash or other consideration.'}]}],
 srs:[{q:'Risk-neutral probability?',a:'(1 + r − d) ÷ (u − d).'},{q:'American put at a node?',a:'max(exercise value, continuation value).'},{q:'Gain to the target in a cash deal?',a:'The premium paid.'},{q:'Spin-off vs divestiture?',a:'Spin-off: shares to existing holders, no cash. Divestiture: sold for consideration.'}],
 read:[{t:'CFA Program: Level II',s:'CFA Institute',u:CFAI},{t:'Mergers and acquisitions',s:'Wikipedia',u:WIKI('Mergers_and_acquisitions')},{t:'Corporate spin-off',s:'Wikipedia',u:WIKI('Corporate_spin-off')}]}
]);

/* ---------- x01 Capital market expectations ---------- */
{id:'x01',track:'cfa3',topic:'aa',title:'Capital market expectations',mins:55,blurb:'Forecast returns and risks for asset classes with discipline, and avoid the classic forecasting traps.',
 lab:{key:'gk',name:'Grinold–Kroner equity return',intro:'Build an expected equity return from income, earnings growth and repricing.'},
 cards:[
  {h:'A disciplined process',b:`<p>Specify what is needed (asset classes, horizon), research history, choose methods, interpret the current environment, set expectations, then monitor. Keep expectations <b>consistent</b> across asset classes (same macro view), because allocation is relative.</p>`},
  {h:'Forecasting traps',b:`<ul><li><b>Data:</b> survivorship bias, appraisal smoothing, regime changes, short histories.</li><li><b>Analyst:</b> data mining, time-period bias, ignoring conditioning information, misreading correlation as causation.</li><li><b>Behavioural:</b> anchoring, status quo, confirmation, overconfidence, recallability.</li></ul><p>Smoothed appraisal data understate volatility and correlation; unsmooth before use.</p>`},
  {h:'Return models',b:`<p><b>Equities:</b> Grinold–Kroner E(R) ≈ D/P + (%ΔE − %ΔS) + %ΔP/E. <b>Bonds:</b> the starting yield is the best simple predictor over a horizon close to duration; adjust for rolldown, expected rate changes, credit losses. <b>Risk-premium build-up:</b> real rate + inflation + term + credit + equity + illiquidity premia.</p>`},
  {h:'Singer–Terhaar',b:`<p>ERP<sub>i</sub> = σ<sub>i</sub> × ρ<sub>i,M</sub> × (ERP<sub>M</sub> ÷ σ<sub>M</sub>) in a fully <b>integrated</b> market; with ρ = 1 if fully <b>segmented</b>. Blend by the degree of integration, then add an illiquidity premium. Emerging markets such as the Gulf have become more integrated since index inclusion.</p>`},
  {h:'Economic analysis and risk',b:`<p>Business cycle phases shape returns: late expansion brings tightening and flatter curves; recessions widen credit spreads. Trend growth = labour growth + productivity. For covariance matrices, use <b>shrinkage</b> (sample blended with a factor-model target) and models for time-varying volatility (ARCH/GARCH).</p>`}],
 sets:[{t:'Expectations for a Gulf equity market',v:`<p>A CIO prepares 10-year expectations for a Gulf equity index: dividend yield 3.0%, expected inflation 2.0%, real earnings growth 3.0%, net buybacks reducing shares by 0.5% a year, and a P/E expected to rise by 0.5% a year.</p><p>For a Singer–Terhaar estimate: the global market Sharpe ratio is 0.30; the index's volatility is 20%; its correlation with the global market is 0.70; the market is judged 80% integrated. An illiquidity premium of 0.5% is added.</p><p>The CIO also reviews a private real estate index based on quarterly appraisals.</p>`,
  qs:[{q:'The Grinold–Kroner expected return is:',o:['9.0%','8.0%','8.5%'],a:0,w:'3.0 − (−0.5) + (2.0 + 3.0) + 0.5 = 9.0%.'},
   {q:'The most judgemental component of that estimate is usually:',o:['the repricing (change in P/E) term','the dividend yield','inflation'],a:0,w:'Valuation changes are hard to forecast and should not be extrapolated indefinitely.'},
   {q:'The blended Singer–Terhaar equity risk premium, before the illiquidity premium, is:',o:['4.56%','4.20%','6.00%'],a:0,w:'Integrated: 20 × 0.7 × 0.3 = 4.2%. Segmented: 20 × 1 × 0.3 = 6.0%. Blend: 0.8 × 4.2 + 0.2 × 6.0 = 4.56%.'},
   {q:'Volatility estimated directly from the appraisal-based index will most likely be:',o:['understated','overstated','unbiased'],a:0,w:'Appraisal smoothing dampens measured volatility and correlations.'}]}],
 quiz:[{q:'Survivorship bias in historical return data tends to:',o:['overstate returns','understate returns','have no effect on averages'],a:0,w:'Failed securities or funds drop out of the sample.'},
  {q:'A shrinkage estimator of the covariance matrix:',o:['blends the sample matrix with a target such as a factor-model matrix','uses only the latest year of data','sets all correlations to zero'],a:0,w:'It reduces estimation error at the cost of a little bias.'},
  {q:'Late in an expansion, a typical pattern is:',o:['central banks tighten and the yield curve flattens','credit spreads widen sharply','inflation falls and rates are cut'],a:0,w:'Spreads usually widen later, as recession approaches.'},
  {q:'For a bond portfolio, the best simple forecast of return over a horizon near its duration is:',o:['its current yield to maturity','its historical average return','the current inflation rate'],a:0,w:'Starting yield explains most of the subsequent return over that horizon.'}],
 cr:[{q:'An adviser estimates the expected return of a Gulf equity market from its 15-year historical average. Explain <b>two</b> weaknesses of this approach and recommend <b>one</b> better method.',model:`<ul><li>Short sample and regime changes (market opening to foreigners, index inclusion, oil cycles) make history unrepresentative.</li><li>Time-period and survivorship bias: results depend on the start and end dates and exclude delisted companies.</li><li>Better: a forward-looking Grinold–Kroner estimate or a Singer–Terhaar risk premium reflecting the market's current degree of integration.</li></ul>`,pts:['First weakness explained (e.g. regime change or short sample)','Second weakness explained (e.g. time-period or survivorship bias)','A better method recommended','The recommendation is justified']},
  {q:'Using the vignette data, calculate the Grinold–Kroner expected return and identify which component you would challenge first.',model:`E(R) = D/P − %ΔS + (inflation + real growth) + %ΔP/E = 3.0 + 0.5 + 5.0 + 0.5 = <b>9.0%</b>. Challenge the <b>repricing</b> term first: a rising P/E for ten years assumes continued multiple expansion, which tends to mean-revert.`,pts:['Correct formula','Correct result: 9.0%','Repricing identified, with reason']}],
 srs:[{q:'Grinold–Kroner?',a:'D/P + (%ΔE − %ΔS) + %ΔP/E.'},{q:'Singer–Terhaar (integrated)?',a:'σ_i × ρ_i,M × market Sharpe ratio.'},{q:'Effect of appraisal smoothing?',a:'Understates volatility and correlation.'},{q:'Best simple bond return forecast?',a:'Current yield, for a horizon near duration.'}],
 read:[{t:'CFA Program Level III',s:'CFA Institute',u:CFAI},{t:'Expected return',s:'Wikipedia',u:WIKI('Expected_return')},{t:'Equity premium puzzle',s:'Wikipedia',u:WIKI('Equity_premium_puzzle')}]},

/* ---------- x02 Strategic and liability-relative asset allocation ---------- */
{id:'x02',track:'cfa3',topic:'aa',title:'Asset allocation: strategic and liability-relative',mins:60,blurb:'Mean–variance and its fixes, surplus optimisation, hedging and return-seeking portfolios, goals-based allocation.',
 lab:{key:'saa',name:'Optimal equity weight',intro:'Maximise risk-adjusted utility for a two-asset portfolio and see how risk aversion moves the answer.'},
 cards:[
  {h:'Good asset classes',b:`<p>Assets within a class should be similar; classes should be mutually exclusive, diversifying, cover most investable wealth, and have capacity. Many investors now also look through classes to <b>risk factors</b> (equity, term, credit, inflation, liquidity).</p>`},
  {h:'Mean–variance optimisation',b:`<p>Maximise U = E(R) − 0.5 λ σ². Problems: outputs very sensitive to inputs, concentrated portfolios, ignores liabilities, single period, ignores skew. Fixes: <b>reverse optimisation</b> (implied returns from market weights), <b>Black–Litterman</b> (blend equilibrium returns with views), constraints, <b>resampling</b>, Monte Carlo for multi-period paths.</p>`},
  {h:'Liability-relative approaches',b:`<ul><li><b>Surplus optimisation:</b> MVO on surplus return (assets − liabilities).</li><li><b>Hedging/return-seeking:</b> a portfolio that moves with liabilities (duration-matched bonds), plus a growth portfolio.</li><li><b>Integrated asset–liability:</b> joint decisions on both sides (banks, insurers).</li></ul><p>A higher funded ratio allows more return-seeking risk.</p>`},
  {h:'Risk budgeting and factor allocation',b:`<p>Allocate <b>risk</b>, not capital: marginal contribution to risk × weight = absolute contribution. In the optimum, the ratio of excess return to marginal risk contribution is equal across assets. <b>Risk parity</b> equalises contributions; critics note it often needs leverage and ignores expected returns.</p>`},
  {h:'Goals-based allocation for individuals',b:`<p>Separate sub-portfolios for needs (high probability, low risk), wants and aspirations, each with its own horizon and required probability. Easy for clients to understand; the sum may be less efficient than one optimised portfolio.</p>`}],
 sets:[{t:'A foundation chooses its policy portfolio',v:`<p>An investment committee compares three allocations (expected return, volatility):</p>${tbl([['Allocation','E(R)','σ'],['A','8.0%','14%'],['B','6.5%','9%'],['C','5.0%','5%']])}<p>Utility is U = E(R) − 0.005 × λ × σ² with returns in percent. The committee's risk aversion is λ = 4. A trustee asks what would change if λ were 2.</p><p>The committee also oversees a defined-benefit pension plan with a funded ratio of 110%.</p>`,
  qs:[{q:'With λ = 4, the allocation with the highest utility is:',o:['B','A','C'],a:0,w:'A: 8 − 0.02 × 196 = 4.08. B: 6.5 − 0.02 × 81 = 4.88. C: 5 − 0.02 × 25 = 4.50.'},
   {q:'With λ = 2, the best allocation is:',o:['A','B','C'],a:0,w:'A: 8 − 1.96 = 6.04. B: 6.5 − 0.81 = 5.69. C: 5 − 0.25 = 4.75.'},
   {q:'In a hedging/return-seeking approach for the pension plan, the hedging portfolio consists of:',o:['assets whose value moves with the liabilities, such as duration-matched bonds','the highest-return assets available','cash, to minimise volatility'],a:0,w:'It hedges the liability; surplus above it can fund the return-seeking portfolio.'},
   {q:'The Black–Litterman model starts from:',o:['equilibrium returns implied by market-capitalisation weights','historical average returns','equal expected returns for all assets'],a:0,w:'Reverse optimisation gives the starting point; views then tilt it.'}]}],
 quiz:[{q:'Risk parity allocates so that:',o:['each asset contributes equally to total risk','each asset has the same capital weight','expected returns are equalised'],a:0,w:'It ignores expected returns and often needs leverage.'},
  {q:'A key criticism of unconstrained MVO is that it:',o:['produces concentrated portfolios that are highly sensitive to inputs','always holds every asset class','ignores volatility'],a:0,w:'Small changes in expected returns cause large weight swings.'},
  {q:'Goals-based allocation is especially useful for:',o:['individuals with distinct goals and horizons','banks managing duration gaps','index funds'],a:0,w:'It maps each goal to a sub-portfolio and a required probability of success.'},
  {q:'A pension plan\'s surplus is:',o:['assets minus liabilities','assets divided by liabilities','contributions minus benefits'],a:0,w:'The funded ratio is assets ÷ liabilities.'}],
 cr:[{q:'A corporate pension plan is 95% funded, and its sponsor is in a cyclical industry. Recommend an asset-only or a liability-relative approach, and justify with <b>two</b> reasons.',model:`<b>Liability-relative.</b> (1) The plan's objective is to pay defined benefits, so risk should be measured against liabilities (surplus volatility), not in isolation. (2) The plan is underfunded and the sponsor's ability to make extra contributions may fall in a downturn, when assets also fall; hedging liability rate risk protects the funded status.`,pts:['Correct recommendation (liability-relative)','Reason 1: objective is to fund liabilities / surplus risk','Reason 2: underfunding and sponsor risk correlation']},
  {q:'Explain how a risk-budgeting approach differs from mean–variance optimisation of capital weights.',model:`MVO chooses capital weights to maximise expected utility. Risk budgeting allocates the portfolio's <b>total risk</b> across assets or factors: each asset's contribution (weight × marginal contribution to risk) is set to a budget, and the portfolio is efficient when excess return per unit of marginal risk is equal across assets.`,pts:['MVO described correctly','Risk budgeting allocates risk contributions','Optimality condition or example given']}],
 srs:[{q:'Mean–variance utility?',a:'U = E(R) − 0.5λσ² (or −0.005λσ² in percent).'},{q:'Black–Litterman starting point?',a:'Reverse-optimised equilibrium returns.'},{q:'Hedging portfolio?',a:'Assets that move with liabilities.'},{q:'Risk parity?',a:'Equal risk contributions.'}],
 read:[{t:'Black–Litterman model',s:'Wikipedia',u:WIKI('Black%E2%80%93Litterman_model')},{t:'Risk parity',s:'Wikipedia',u:WIKI('Risk_parity')},{t:'Liability-driven investment',s:'Wikipedia',u:WIKI('Liability_driven_investment')}]},

/* ---------- x03 Constraints, goals and rebalancing ---------- */
{id:'x03',track:'cfa3',topic:'aa',title:'Asset allocation: constraints, goals and rebalancing',mins:50,blurb:'Size, liquidity, horizon and tax constraints; behavioural biases; and when and how to rebalance.',
 lab:{key:'rebal',name:'Corridor rebalancing',intro:'Let markets move a 60/40 portfolio and decide whether, and how much, to rebalance.'},
 cards:[
  {h:'Constraints that shape allocation',b:`<ul><li><b>Size:</b> very large funds struggle to deploy in small asset classes; small investors may lack access to private markets.</li><li><b>Liquidity:</b> spending needs and capital calls.</li><li><b>Time horizon:</b> changing human capital and liabilities.</li><li><b>Regulation, taxes, ESG preferences.</b></li></ul>`},
  {h:'Tax-aware allocation',b:`<p>Optimise on <b>after-tax</b> returns and risks: after-tax σ = pre-tax σ × (1 − t). <b>Asset location:</b> put tax-inefficient assets (high-yield bonds, REITs) in tax-advantaged accounts. Rebalancing can trigger capital gains, so taxable investors use wider or asymmetric corridors.</p>`},
  {h:'Rebalancing',b:`<p><b>Calendar</b> rebalancing is simple; <b>percent-range (corridor)</b> rebalancing is more disciplined. Wider corridors: higher transaction costs, higher risk tolerance, higher correlation with the rest of the portfolio, more taxes. Narrower corridors: more volatile assets. Rebalancing is contrarian; it pays in mean-reverting markets and costs in trending ones.</p>`},
  {h:'Behavioural biases in allocation',b:`<ul><li><b>Loss aversion:</b> too little risk; holding losers.</li><li><b>Illusion of control:</b> concentrated positions, e.g. in an employer's stock.</li><li><b>Mental accounting:</b> separate pots; goals-based design can use it constructively.</li><li><b>Representativeness and availability:</b> chasing recent winners.</li><li><b>Familiarity/home bias.</b></li></ul>`},
  {h:'When to revisit the strategic allocation',b:`<p>Material changes to goals, constraints, liabilities, or long-term capital market expectations. Not for short-term market moves; that is tactical allocation (with its own risk budget and evaluation) or simply rebalancing.</p>`}],
 sets:[{t:'A 60/40 portfolio after a strong year',v:`<p>A SAR 100 million portfolio had a target of 60% equities and 40% bonds, with a corridor of ±5 percentage points for equities. Over the year equities returned 25% and bonds −2%.</p><p>The investor is taxable, and equity trades cost 0.4% each way.</p>`,
  qs:[{q:'The equity weight at year end is closest to:',o:['65.7%','63.8%','62.5%'],a:0,w:'Equity 75.0; bonds 39.2; total 114.2; 75 ÷ 114.2 = 65.7%.'},
   {q:'To restore the target, the investor should:',o:['sell about SAR 6.48m of equities','sell about SAR 0.77m of equities','do nothing: the weight is within the corridor'],a:0,w:'75 − 0.6 × 114.2 = 6.48. Selling 0.77 only returns it to the 65% edge.'},
   {q:'Compared with a tax-exempt investor, this taxable investor should generally use:',o:['wider corridors','narrower corridors','calendar rebalancing every month'],a:0,w:'Realising gains has a tax cost, just like transaction costs.'},
   {q:'If equities were more highly correlated with the rest of the portfolio, the optimal corridor would be:',o:['wider','narrower','unchanged'],a:0,w:'Drift from a highly correlated asset changes total risk less.'}]}],
 quiz:[{q:'An executive keeps 40% of her wealth in her employer\'s shares because she "knows the company". The main bias is:',o:['illusion of control / familiarity','loss aversion','hindsight bias'],a:0,w:'Concentration plus correlation with her human capital.'},
  {q:'A small family office is most likely to face which constraint in private equity?',o:['limited access and minimum commitments','capacity limits from being too large','regulatory capital charges'],a:0,w:'Scale works against small investors in private markets.'},
  {q:'After-tax standard deviation equals:',o:['pre-tax standard deviation × (1 − t)','pre-tax standard deviation ÷ (1 − t)','pre-tax standard deviation'],a:0,w:'Taxes reduce both gains and losses (assuming full use of losses).'},
  {q:'Rebalancing tends to add value when markets are:',o:['mean-reverting','trending strongly','perfectly efficient and random'],a:0,w:'Selling winners and buying losers helps when moves reverse.'}],
 cr:[{q:'A client says: "I won\'t sell my bank shares at a loss; and I keep my bonus money in a separate fun account." Identify <b>two</b> biases and explain how each could affect her allocation.',model:`<ul><li><b>Loss aversion</b> (disposition effect): refusing to sell losers keeps an unintended concentration and risk.</li><li><b>Mental accounting</b>: treating the bonus as a separate pot can lead to inconsistent risk-taking; a goals-based structure can harness it by assigning the account an explicit goal and risk level.</li></ul>`,pts:['Loss aversion identified','Effect of loss aversion explained','Mental accounting identified','Effect of mental accounting explained']},
  {q:'Recommend calendar or corridor rebalancing for a taxable individual with high trading costs and a volatile equity allocation. Justify.',model:`<b>Corridor rebalancing</b> with <b>wide</b> (possibly asymmetric) bands: it trades only when drift is material, which limits costs and realised gains, while still controlling risk from the volatile equity allocation.`,pts:['Corridor recommended','Cost and tax justification','Risk-control justification']}],
 srs:[{q:'Factors for wider corridors?',a:'Higher costs, taxes, risk tolerance, correlation with the rest of the portfolio.'},{q:'Asset location?',a:'Tax-inefficient assets in tax-advantaged accounts.'},{q:'Illusion of control effect?',a:'Over-concentration.'},{q:'When to change the SAA?',a:'When goals, constraints or long-term expectations change materially.'}],
 read:[{t:'Rebalancing investments',s:'Wikipedia',u:WIKI('Rebalancing_investments')},{t:'Loss aversion',s:'Wikipedia',u:WIKI('Loss_aversion')},{t:'Mental accounting',s:'Wikipedia',u:WIKI('Mental_accounting')}]},

/* ---------- x04 Active vs passive and equity ---------- */
{id:'x04',track:'cfa3',topic:'pc',title:'Portfolio construction: active vs passive and equity',mins:55,blurb:'When to be active, core–satellite structures, active risk budgets and the roles of equity.',
 lab:{key:'coresat',name:'Core–satellite',intro:'Combine an index fund, an enhanced index and an active manager; see alpha, active risk and the IR.'},
 cards:[
  {h:'Active or passive?',b:`<p>Consider market efficiency (large-cap developed markets are hard to beat), fees and taxes, the investor's confidence in finding skilled managers, tolerance for tracking error, and ESG or other preferences. Many investors combine both.</p>`},
  {h:'Building blocks of active management',b:`<p>Active return comes from <b>factor tilts</b> (rewarded factors such as value, momentum, quality), <b>alpha skill</b> (security selection, timing), <b>sizing</b> of positions, and <b>breadth</b> (number of independent decisions). Fundamental law: IR ≈ TC × IC × √BR.</p>`},
  {h:'Core–satellite and risk budgets',b:`<p>A low-cost passive or enhanced core plus active satellites. With uncorrelated active returns, total active risk = √(Σ w² × TE²). Set an active risk budget and allocate it where expected IR is highest. Watch out for <b>closet indexers</b> charging active fees.</p>`},
  {h:'Roles of equity',b:`<p>Capital appreciation over long horizons, dividend income, diversification (international equities), and a partial inflation hedge over long horizons (poor in the short run). Segment by size, style, geography and sector; style boxes help monitor drift.</p>`},
  {h:'Costs and engagement',b:`<p>Costs: management fees, trading costs, taxes, and the drag from cash. Investors also exercise <b>stewardship</b>: proxy voting and engagement on governance and material ESG issues; the benefits are partly shared with free-riders.</p>`}],
 sets:[{t:'A family office\'s equity structure',v:`<p>A family office holds its equity allocation as: 50% index fund (no alpha or tracking error), 30% enhanced index (expected alpha 1.0%, tracking error 2.0%), and 20% active manager (expected gross alpha 3.0%, tracking error 6.0%, fee 0.6% above the index fund). Managers' active returns are uncorrelated.</p>`,
  qs:[{q:'The portfolio\'s active risk is closest to:',o:['1.34%','1.80%','2.40%'],a:0,w:'√((0.3 × 2)² + (0.2 × 6)²) = √1.80 = 1.34%. 1.80 is the variance.'},
   {q:'Expected alpha after fees is:',o:['0.78%','0.90%','1.20%'],a:0,w:'0.3 × 1.0 + 0.2 × (3.0 − 0.6) = 0.78%.'},
   {q:'The portfolio\'s information ratio is closest to:',o:['0.58','0.67','0.43'],a:0,w:'0.78 ÷ 1.34 = 0.58.'},
   {q:'Shifting 10% from the index fund to the active manager would:',o:['raise both expected alpha and active risk','raise alpha and lower active risk','leave active risk unchanged'],a:0,w:'The active manager adds alpha and tracking error.'}]}],
 quiz:[{q:'A "closet indexer" has:',o:['low active share and an active fee','high active share and a passive fee','high tracking error and low fees'],a:0,w:'It charges for activity it does not deliver.'},
  {q:'Which market segment is usually hardest for active managers to beat after fees?',o:['US large-cap equities','frontier-market small caps','distressed debt'],a:0,w:'Efficiency is highest where coverage and liquidity are greatest.'},
  {q:'Equities hedge inflation:',o:['partially, over long horizons; poorly in the short run','perfectly in all periods','not at all'],a:0,w:'Unexpected inflation usually hurts equities at first.'},
  {q:'Breadth in the fundamental law refers to:',o:['the number of independent active decisions per year','the number of stocks in the benchmark','the portfolio\'s sector count'],a:0,w:'Correlated bets add little breadth.'}],
 cr:[{q:'Recommend active or passive management for a client\'s US large-cap equity allocation. The client is fee-sensitive and has a low tolerance for tracking error. Justify with <b>two</b> reasons.',model:`<b>Passive.</b> (1) US large caps are highly efficient, so finding persistent alpha after fees is difficult. (2) The client is fee-sensitive and dislikes tracking error, both of which passive management minimises.`,pts:['Passive recommended','Market efficiency reason','Fees / tracking-error reason']},
  {q:'Calculate the active risk of a portfolio with 40% in a manager with 4% tracking error and 60% in an index fund. Explain how the answer changes if a second active manager with uncorrelated active returns replaces part of the index.',model:`Active risk = 0.4 × 4% = <b>1.6%</b>. Adding an uncorrelated manager adds its (w × TE)² to the variance, so active risk rises, but by less than a simple sum, because of diversification between managers.`,pts:['1.6% calculated','Direction of change explained','Diversification between managers noted']}],
 srs:[{q:'Active risk of uncorrelated managers?',a:'√(Σ w² TE²).'},{q:'Fundamental law?',a:'IR ≈ TC × IC × √BR.'},{q:'Closet indexer?',a:'Low active share, active fee.'},{q:'Core–satellite?',a:'Passive core plus active satellites.'}],
 read:[{t:'Tracking error',s:'Wikipedia',u:WIKI('Tracking_error')},{t:'Active management',s:'Wikipedia',u:WIKI('Active_management')},{t:'SPIVA scorecards',s:'S&P Dow Jones Indices',u:'https://www.spglobal.com/spdji/en/research-insights/spiva/'}]},

/* ---------- x05 Fixed income and LDI ---------- */
{id:'x05',track:'cfa3',topic:'pc',title:'Portfolio construction: fixed income and liability-driven',mins:60,blurb:'Roles of bonds, immunisation and cash-flow matching, and closing duration gaps with derivatives.',
 lab:{key:'ldi',name:'Close the duration gap',intro:'Match the BPV of assets to liabilities using futures.'},
 cards:[
  {h:'Roles of fixed income',b:`<p>Diversification (usually low or negative correlation with equities in recessions), regular income, liability matching, and inflation hedging with inflation-linked bonds. The 2022 bond sell-off showed correlation can turn positive when inflation is the shock.</p>`},
  {h:'Liabilities and immunisation',b:`<p>Type I liabilities have known amounts and dates. To immunise a single liability: match PV and Macaulay duration (or BPV), with asset <b>convexity</b> just above the liability's (minimise dispersion), and rebalance as time passes. Multiple liabilities: match PV and BPV, and asset convexity must exceed liability convexity.</p>`},
  {h:'Cash-flow matching vs duration matching',b:`<p><b>Cash-flow matching</b> buys bonds whose flows meet each liability: no reinvestment or curve risk, but costly and inflexible. <b>Duration matching</b> is cheaper and flexible, but exposed to non-parallel shifts and needs rebalancing. <b>Contingent immunisation</b>: manage actively while the surplus stays above a floor.</p>`},
  {h:'Derivatives in LDI',b:`<p>Futures: N = (BPV<sub>L</sub> − BPV<sub>A</sub>) ÷ BPV<sub>futures</sub>. <b>Receive-fixed swaps</b> add duration without cash. Swaptions give optional protection. Hedge ratios below 100% leave deliberate rate exposure. Collateral and liquidity needs must be planned.</p>`},
  {h:'Index-based fixed income',b:`<p>Full replication is costly for bond indices with thousands of illiquid issues. <b>Stratified sampling</b> matches key risk factors (duration, sector, quality, key rate durations) with fewer bonds. Alternatives: ETFs and total return swaps. A <b>laddered</b> portfolio spreads maturities evenly, giving liquidity and diversification of reinvestment risk.</p>`}],
 sets:[{t:'A pension plan\'s rate hedge',v:`<p>A pension plan has liabilities with a present value of SAR 500 million and a duration of 12. Its assets are worth SAR 450 million with a duration of 8. A bond futures contract has a BPV of SAR 95 per contract. The plan wants a 100% hedge of its rate exposure.</p>`,
  qs:[{q:'The BPV gap is:',o:['SAR 240,000','SAR 600,000','SAR 360,000'],a:0,w:'Liabilities: 500m × 12 × 0.0001 = 600,000. Assets: 450m × 8 × 0.0001 = 360,000.'},
   {q:'To close the gap, the plan should:',o:['buy about 2,526 futures','sell about 2,526 futures','buy about 6,316 futures'],a:0,w:'240,000 ÷ 95 = 2,526. Assets are too short, so add duration.'},
   {q:'An alternative way to add duration is to:',o:['enter a receive-fixed interest-rate swap','enter a pay-fixed interest-rate swap','buy floating-rate notes'],a:0,w:'Receive-fixed behaves like a long fixed-rate bond.'},
   {q:'For multiple liabilities, immunisation requires matching PV and BPV and:',o:['asset convexity greater than liability convexity','asset convexity lower than liability convexity','zero convexity'],a:0,w:'This ensures assets fall less, and rise more, than liabilities as rates move in a parallel shift.'}]}],
 quiz:[{q:'A key risk of duration-matching that cash-flow matching avoids is:',o:['non-parallel yield curve shifts','credit risk','currency risk'],a:0,w:'Matching each cash flow removes structural (curve) risk.'},
  {q:'Stratified sampling in bond indexing means:',o:['matching the index\'s key risk characteristics with fewer bonds','buying every bond in the index','buying the highest-yielding bonds'],a:0,w:'Cells by duration, sector and quality.'},
  {q:'A laddered bond portfolio provides:',o:['regular maturities, liquidity and diversified reinvestment timing','maximum convexity','the highest possible yield'],a:0,w:'Each year a rung matures.'},
  {q:'A Type I liability has:',o:['known amount and known timing','uncertain amount and known timing','uncertain amount and timing'],a:0,w:'For example a zero-coupon obligation.'}],
 cr:[{q:'Explain <b>two</b> risks that can cause an immunised single-liability portfolio to fall short, and how a manager can reduce each.',model:`<ul><li><b>Non-parallel shifts (structural risk):</b> reduce by minimising dispersion of asset cash flows around the liability date (a bullet rather than a barbell).</li><li><b>Duration drift as time passes and yields change:</b> rebalance periodically to keep duration matched.</li><li>(Also acceptable: credit downgrades/defaults; reinvestment of coupons; call risk — use high-quality, non-callable bonds.)</li></ul>`,pts:['First risk explained','Mitigation for first risk','Second risk explained','Mitigation for second risk']},
  {q:'Compare cash-flow matching with duration matching for a plan with a small number of large, well-defined liabilities.',model:`Cash-flow matching suits a few known liabilities: it removes reinvestment and curve risk and needs little rebalancing, but it can cost more (bonds may not fit exactly) and is inflexible. Duration matching is cheaper and more flexible but exposed to non-parallel shifts and needs rebalancing.`,pts:['Cash-flow matching advantages','Cash-flow matching drawbacks','Duration matching trade-offs']}],
 srs:[{q:'Futures to close a BPV gap?',a:'(BPV_L − BPV_A) ÷ BPV per contract.'},{q:'Swap that adds duration?',a:'Receive-fixed.'},{q:'Multiple-liability immunisation condition?',a:'Match PV and BPV; asset convexity > liability convexity.'},{q:'Contingent immunisation?',a:'Active management until the surplus falls to a floor, then immunise.'}],
 read:[{t:'Immunization (finance)',s:'Wikipedia',u:WIKI('Immunization_(finance)')},{t:'Liability-driven investment',s:'Wikipedia',u:WIKI('Liability_driven_investment')},{t:'Bond ladder',s:'Wikipedia',u:WIKI('Bond_ladder')}]},

/* ---------- x06 Trading, execution and monitoring ---------- */
{id:'x06',track:'cfa3',topic:'pc',title:'Trading, execution and monitoring',mins:50,blurb:'Choose a trading strategy, measure costs with implementation shortfall, and govern execution.',
 lab:{key:'isf',name:'Implementation shortfall',intro:'Split the cost of a partly filled order into delay, execution, opportunity and fees.'},
 cards:[
  {h:'Why we trade',b:`<p>Profit seeking (alpha with a decay rate), risk management (hedges), cash flows (subscriptions, redemptions), and corporate actions or index changes. Short alpha decay means urgency; large orders relative to volume mean patience.</p>`},
  {h:'Trade strategy inputs',b:`<p>Order size vs average daily volume, urgency, security liquidity and volatility, the manager's risk aversion (fear of prices running away), and information leakage. High urgency → arrival-price or aggressive algorithms; low urgency and large size → scheduled (VWAP, TWAP, percent of volume) or liquidity-seeking algorithms and dark pools.</p>`},
  {h:'Measuring costs',b:`<p><b>Implementation shortfall</b> compares the real portfolio with a paper portfolio traded instantly at the decision price: delay + execution + opportunity + fees. <b>VWAP</b> benchmarks are easy to game and ignore unfilled shares. Arrival-price and market-adjusted versions are common.</p>`},
  {h:'Trade governance',b:`<p>A best-execution policy; an order-handling and allocation policy; a list of eligible brokers and venues; monitoring of execution quality; and handling of trade errors. Consistent with the Standards: fair allocation and duty of loyalty in execution.</p>`},
  {h:'Monitoring and rebalancing',b:`<p>Monitor changes in investor circumstances, market conditions and portfolio drift. Rebalance within policy; review the IPS at least annually and after major events.</p>`}],
 sets:[{t:'A partly filled order',v:`<p>A portfolio manager decides to buy 10,000 shares when the price is SAR 50.00. The order reaches the trading desk when the price is SAR 50.20. 8,000 shares are filled at an average of SAR 50.40; commissions total SAR 400. The rest of the order is cancelled when the price closes at SAR 51.00.</p><p>Another order is for 30% of a stock's average daily volume, with low urgency and a concern about information leakage.</p>`,
  qs:[{q:'Total implementation shortfall is:',o:['112 bp','72 bp','80 bp'],a:0,w:'Paper gain 10,000; real gain 8,000 × 0.60 − 400 = 4,400; shortfall 5,600 on 500,000 = 112 bp.'},
   {q:'The delay cost is:',o:['32 bp','40 bp','8 bp'],a:0,w:'8,000 × 0.20 = 1,600 ÷ 500,000 = 32 bp.'},
   {q:'The opportunity cost is:',o:['40 bp','32 bp','20 bp'],a:0,w:'2,000 unfilled × (51.00 − 50.00) = 2,000 = 40 bp.'},
   {q:'For the second order, the most appropriate approach is:',o:['a liquidity-seeking algorithm using dark pools','an aggressive arrival-price algorithm','a single market order at the open'],a:0,w:'Large, patient orders aim to minimise impact and leakage.'}]}],
 quiz:[{q:'A weakness of the VWAP benchmark is that it:',o:['can be gamed and ignores unfilled orders','is impossible to calculate','always overstates costs'],a:0,w:'Traders can time trades to match VWAP.'},
  {q:'High urgency is most associated with:',o:['short alpha decay','large orders in illiquid stocks','low volatility'],a:0,w:'The information will soon be priced.'},
  {q:'A percent-of-volume algorithm:',o:['trades a fixed share of market volume','trades only at the close','trades only in dark pools'],a:0,w:'Participation adjusts to volume.'},
  {q:'Trade governance should include:',o:['a best-execution policy and broker review','commission targets for each broker','allocating fills to the best-paying clients'],a:0,w:'Fair allocation and best execution are core duties.'}],
 cr:[{q:'Recommend a trading strategy for an order to sell 2% of ADV in a large-cap stock after negative news the market has not yet absorbed. Justify.',model:`Use an <b>aggressive arrival-price (urgent) strategy</b>: the order is small relative to volume, so impact is limited, and the alpha decays quickly as the news is priced, so delay is costly.`,pts:['Urgent / arrival-price strategy recommended','Small size relative to volume','Fast alpha decay']},
  {q:'Explain why implementation shortfall is preferred to VWAP for evaluating execution.',model:`IS measures the full cost against the decision price, including delay and the opportunity cost of unfilled shares; VWAP ignores unfilled orders and the cost of delay, and traders can match it by spreading trades through the day even when that is costly.`,pts:['IS includes delay and opportunity cost','VWAP weaknesses (unfilled / gaming)']}],
 srs:[{q:'IS components?',a:'Delay + execution + opportunity + fees.'},{q:'Urgent order algorithm?',a:'Arrival price / aggressive.'},{q:'Large patient order?',a:'Scheduled or liquidity-seeking; dark pools.'},{q:'VWAP weakness?',a:'Gaming; ignores unfilled orders.'}],
 read:[{t:'Implementation shortfall',s:'Wikipedia',u:WIKI('Implementation_shortfall')},{t:'Algorithmic trading',s:'Wikipedia',u:WIKI('Algorithmic_trading')},{t:'Best execution',s:'Wikipedia',u:WIKI('Best_execution')}]},

/* ---------- x07 Derivatives, currency and risk management ---------- */
{id:'x07',track:'cfa3',topic:'der',title:'Derivatives, currency and risk management',mins:60,blurb:'Change exposures with futures, swaps and options; manage currency risk; build a risk framework.',
 lab:{key:'betafut',name:'Beta overlay and currency return',intro:'Lower a portfolio\'s beta with index futures and combine local and currency returns.'},
 cards:[
  {h:'Equity exposures with derivatives',b:`<p>Futures: N = (β<sub>T</sub> − β<sub>S</sub>) ÷ β<sub>f</sub> × (S ÷ F). <b>Total return swaps</b> give or remove exposure without trading the stock. Options strategies: <b>protective put</b> (floor), <b>covered call</b> (income, capped upside), <b>collar</b> (put financed by a call), spreads, and straddles (long volatility).</p>`},
  {h:'Interest-rate exposures',b:`<p>Duration with futures or swaps; payer and receiver swaptions; caps and floors. Calendar spreads in futures express curve views. Volatility positions use options; the VIX curve shows term structure of implied volatility.</p>`},
  {h:'Strategic currency decisions',b:`<p>Hedge more when the horizon is short, the portfolio is fixed income (currency adds a lot of relative risk to bonds), the client is risk-averse, and hedging costs are low. Hedge less for equities over long horizons and when currency adds diversification. Policy spectrum: passive hedging → discretionary → active → currency overlay.</p>`},
  {h:'Currency tactics and costs',b:`<p>Views from economic fundamentals, technicals, the carry trade, and volatility. <b>Roll yield</b> from forward points can help or hurt. <b>Cross hedges</b> and minimum-variance hedge ratios (regression of asset return on FX) handle illiquid currencies. Pegs reduce, but do not remove, risk.</p>`},
  {h:'Risk management framework',b:`<p>Risk governance (board sets risk appetite), identification and measurement (VaR, stress tests, scenario analysis), and monitoring and reporting. Risks can be accepted, avoided, transferred (insurance, derivatives) or mitigated. Risk budgets link to the return objective.</p>`}],
 sets:[{t:'A SAR equity portfolio overlay',v:`<p>A SAR 200 million equity portfolio has a beta of 1.10. The manager wants to cut beta to 0.60 for three months without selling shares. Index futures trade at 2,000 points with a multiplier of SAR 250; the futures beta is 1.0.</p><p>The fund also holds a European stock that returned 6% in euros, while the euro fell 3% against the riyal.</p>`,
  qs:[{q:'The manager should:',o:['sell 200 futures','buy 200 futures','sell 440 futures'],a:0,w:'(0.60 − 1.10) × 200m ÷ (2,000 × 250) = −200.'},
   {q:'The SAR return on the European stock is closest to:',o:['2.82%','3.00%','9.18%'],a:0,w:'1.06 × 0.97 − 1 = 2.82%.'},
   {q:'A zero-cost collar on the equity portfolio means:',o:['buying a put and selling a call, limiting both downside and upside','buying a call and selling a put','buying both a put and a call'],a:0,w:'The call premium pays for the put.'},
   {q:'If the euro trades at a forward discount to the riyal, hedging euro assets will:',o:['cost a negative roll yield','earn a positive roll yield','have no cost'],a:0,w:'Selling the euro forward below spot locks in a loss of the forward points.'}]}],
 quiz:[{q:'A covered call position:',o:['earns premium income but caps upside','limits downside to zero','is long volatility'],a:0,w:'Short call against a long stock.'},
  {q:'A long straddle profits when:',o:['the price moves sharply in either direction','the price stays near the strike','volatility falls'],a:0,w:'It is a long-volatility position.'},
  {q:'Currency hedging is usually more valuable for:',o:['foreign bond portfolios','long-horizon foreign equity portfolios','domestic portfolios'],a:0,w:'Currency volatility is large relative to bond volatility.'},
  {q:'A minimum-variance hedge ratio is estimated by:',o:['regressing the asset\'s domestic-currency return on the currency return','matching the asset\'s market value exactly','using the forward points'],a:0,w:'It captures the correlation between asset and currency.'}],
 cr:[{q:'A SAR-based investor holds a portfolio of EUR government bonds and has a three-year horizon. Recommend a strategic hedge ratio and justify with <b>two</b> reasons.',model:`Recommend a <b>high hedge ratio</b> (close to 100%). (1) Currency volatility is large relative to the volatility of government bonds, so unhedged currency dominates risk. (2) The horizon is short, so there is little time for currency moves to mean-revert. (Also acceptable: bond-currency correlation offers little diversification.)`,pts:['High hedge ratio recommended','Reason: FX volatility vs bond volatility','Reason: short horizon (or low diversification)']},
  {q:'A client wants to protect gains on a stock position over six months while keeping some upside, at little or no premium cost. Describe a suitable strategy and its payoff.',model:`A <b>zero-cost collar</b>: buy an out-of-the-money put (floor) and sell an out-of-the-money call (cap) with premiums that offset. Losses are limited below the put strike; gains are capped at the call strike; the net premium is about zero.`,pts:['Collar identified','Payoff described (floor and cap)','Cost explained']}],
 srs:[{q:'Futures to change beta?',a:'(β_T − β_S) ÷ β_f × S ÷ F.'},{q:'Domestic-currency return?',a:'(1 + R_FC)(1 + R_FX) − 1.'},{q:'Collar?',a:'Long put + short call.'},{q:'When to hedge currency more?',a:'Short horizon, fixed income, risk-averse client, low costs.'}],
 read:[{t:'Collar (finance)',s:'Wikipedia',u:WIKI('Collar_(finance)')},{t:'Currency overlay',s:'Wikipedia',u:WIKI('Currency_overlay')},{t:'Saudi Central Bank (SAMA)',s:'SAMA',u:'https://www.sama.gov.sa/'}]},

/* ---------- x08 Performance measurement ---------- */
{id:'x08',track:'cfa3',topic:'perf',title:'Performance measurement, attribution and manager selection',mins:55,blurb:'Attribution, appraisal measures, good benchmarks, and selecting managers without fooling yourself.',
 lab:{key:'brinson',name:'Brinson–Fachler attribution',intro:'Split active return into allocation, selection and interaction effects.'},
 cards:[
  {h:'Three parts of evaluation',b:`<p><b>Measurement</b> (what was the return?), <b>attribution</b> (why?), and <b>appraisal</b> (was it skill?). Attribution can be returns-based, holdings-based or transaction-based (most accurate, most data).</p>`},
  {h:'Attribution methods',b:`<p><b>Brinson</b>: allocation, selection, interaction by sector. <b>Factor-based</b>: active return from factor exposures plus a residual. <b>Fixed income</b>: duration, curve, sector and credit effects. <b>Risk attribution</b>: where active risk comes from. Micro attribution looks at managers; macro at the sponsor's decisions.</p>`},
  {h:'Appraisal measures',b:`<ul><li><b>Sharpe:</b> excess return ÷ σ.</li><li><b>Treynor:</b> excess return ÷ β.</li><li><b>Information ratio:</b> active return ÷ active risk.</li><li><b>Sortino:</b> excess over a target ÷ downside deviation.</li><li><b>Appraisal ratio:</b> alpha ÷ residual risk.</li><li>Capture ratios and drawdown for asymmetric strategies.</li></ul>`},
  {h:'Valid benchmarks',b:`<p>A valid benchmark is specified in advance, appropriate to the style, measurable, unambiguous, reflective of the manager's current investment opinions, accountable (accepted by the manager) and investable. Custom security-based benchmarks are best for specialised managers; peer groups fail several tests (survivorship, not investable).</p>`},
  {h:'Manager selection',b:`<p>Investment due diligence (philosophy, process, people, portfolio) and <b>operational</b> due diligence (valuation, compliance, custody, conflicts). With H₀ "no skill": a <b>Type I error</b> hires an unskilled manager; a <b>Type II error</b> rejects a skilled one. Fees: ad valorem vs performance-based (symmetric, with high-water marks and hurdles).</p>`}],
 sets:[{t:'Attributing a two-sector portfolio',v:`<p>An equity manager's results for the year:</p>${tbl([['Sector','Portfolio weight','Benchmark weight','Portfolio return','Benchmark return'],['A','70%','50%','10%','8%'],['B','30%','50%','4%','5%']])}<p>The plan sponsor asks whether the benchmark is appropriate; the manager chose it after the year ended.</p>`,
  qs:[{q:'The total allocation effect (Brinson–Fachler) is:',o:['0.60%','0.30%','1.00%'],a:0,w:'Benchmark return 6.5%. A: 0.2 × (8 − 6.5) = 0.3. B: −0.2 × (5 − 6.5) = 0.3. Total 0.6%.'},
   {q:'The total selection effect is:',o:['0.50%','1.00%','0.60%'],a:0,w:'A: 0.5 × 2 = 1.0. B: 0.5 × (−1) = −0.5. Total 0.5%.'},
   {q:'Active return and the interaction effect are:',o:['1.70% and 0.60%','1.70% and 0.50%','1.20% and 0.60%'],a:0,w:'Portfolio 8.2% − benchmark 6.5% = 1.7% = 0.6 + 0.5 + 0.6.'},
   {q:'The benchmark choice is a problem because a valid benchmark must be:',o:['specified in advance','the lowest-return index available','a peer-group median'],a:0,w:'Choosing it after the fact invites cherry-picking.'}]}],
 quiz:[{q:'With the null hypothesis "the manager has no skill", hiring an unskilled manager is a:',o:['Type I error','Type II error','correct decision'],a:0,w:'Rejecting a true null.'},
  {q:'The Sortino ratio uses:',o:['downside deviation','total standard deviation','beta'],a:0,w:'It penalises only harmful volatility.'},
  {q:'Peer-group benchmarks are weak mainly because they are:',o:['not investable and suffer survivorship bias','too easy to calculate','always too high'],a:0,w:'They fail several validity tests.'},
  {q:'Operational due diligence focuses on:',o:['valuation, custody, compliance and conflicts','the manager\'s stock picks','past returns only'],a:0,w:'Many fund failures are operational, not investment, failures.'}],
 cr:[{q:'Interpret the attribution in the vignette: what were the manager\'s skills this year?',model:`The manager added 1.7%: 0.6% from <b>allocation</b> (overweighting sector A, which beat the benchmark), 0.5% from <b>selection</b> (strong picks in A outweighed weak picks in B), and 0.6% from <b>interaction</b> (overweighting the sector where selection was good). Both allocation and selection contributed positively.`,pts:['Allocation explained','Selection explained (A good, B weak)','Interaction explained']},
  {q:'Evaluate the manager\'s benchmark against <b>two</b> properties of a valid benchmark.',model:`It was <b>not specified in advance</b>, so it may be chosen to flatter results. It may not be <b>accountable</b> or reflect the manager's process if it was picked after the fact. A valid benchmark would be agreed at the start and match the style and universe.`,pts:['Specified in advance property applied','Second property applied (accountable, appropriate, etc.)']}],
 srs:[{q:'Allocation effect (Brinson–Fachler)?',a:'(w_p − w_b)(R_b,i − R_B).'},{q:'Selection effect?',a:'w_b(R_p,i − R_b,i).'},{q:'Type I error in manager selection?',a:'Hiring an unskilled manager.'},{q:'Benchmark validity?',a:'Specified in advance, appropriate, measurable, unambiguous, reflective, accountable, investable.'}],
 read:[{t:'Performance attribution',s:'Wikipedia',u:WIKI('Performance_attribution')},{t:'Sortino ratio',s:'Wikipedia',u:WIKI('Sortino_ratio')},{t:'Information ratio',s:'Wikipedia',u:WIKI('Information_ratio')}]},

/* ---------- x09 Ethics and GIPS ---------- */
{id:'x09',track:'cfa3',topic:'eth',title:'Ethics and GIPS',mins:50,blurb:'Ethics in portfolio management, the Asset Manager Code, and the GIPS standards for firms.',
 lab:{key:'gips',name:'GIPS: required or not?',intro:'Eight practices under the 2020 GIPS standards for firms.'},
 cards:[
  {h:'Ethics at Level III',b:`<p>Cases apply the Code and Standards to portfolio management: suitability across the whole portfolio, fair allocation of trades, soft dollars used for the client's benefit, proxy voting in clients' interests, and disclosure of conflicts. Expect to <b>explain</b> violations and recommend corrective action.</p>`},
  {h:'The Asset Manager Code',b:`<p>A voluntary code for firms: loyalty to clients, investment process and actions, trading, risk management, compliance and support, performance and valuation, and disclosures. Firms claim compliance firm-wide and notify CFA Institute; there is no partial claim.</p>`},
  {h:'GIPS fundamentals',b:`<p>Define the <b>firm</b>; include all actual, fee-paying, discretionary portfolios in at least one <b>composite</b>; use required return methods and valuations (at least monthly); present at least five years (building to ten) of compliant history; follow presentation and disclosure rules. Compliance is firm-wide.</p>`},
  {h:'Verification and claims',b:`<p><b>Verification</b> by an independent third party tests firm-wide policies; it is recommended, not required. A <b>performance examination</b> of a specific composite is optional. Firms may not claim "in compliance except for…" or link simulated results to actual ones.</p>`},
  {h:'Pooled funds and advertising',b:`<p>The 2020 edition added provisions for pooled funds (pooled fund reports) and a section for firms that report to asset owners. Advertisements follow specific GIPS advertising guidelines and must not mislead.</p>`}],
 sets:[{t:'Dunes Asset Management',v:`<p>Dunes Asset Management (fictional) prepares to claim GIPS compliance.</p><p><b>1.</b> It defines the firm as its whole asset-management business. Two non-fee-paying staff accounts are excluded from composites.</p><p><b>2.</b> Its marketing shows a composite with five years of actual results, extended back two more years with a model portfolio "to show the full cycle".</p><p><b>3.</b> A portfolio manager, Lina, uses client brokerage commissions to buy research that benefits all her clients' accounts.</p><p><b>4.</b> Dunes votes proxies on client shares through a policy that maximises long-term value for clients, and records each vote.</p>`,
  qs:[{q:'Excluding the non-fee-paying staff accounts from composites (statement 1) is:',o:['allowed: the requirement covers actual, fee-paying, discretionary portfolios','a violation: all accounts must be included','allowed only if verified'],a:0,w:'Non-fee-paying portfolios may be included but are not required to be.'},
   {q:'Extending the composite with model results (statement 2):',o:['is not permitted under GIPS','is permitted if labelled','is required for a full cycle'],a:0,w:'Simulated or model results may never be linked to actual performance.'},
   {q:'Lina\'s use of client commissions (statement 3) is:',o:['consistent with her duties if the research benefits the clients','a violation of loyalty in every case','allowed only for one client at a time'],a:0,w:'Soft dollars must be used for research that benefits the clients whose trades generated them.'},
   {q:'Dunes\' proxy-voting practice (statement 4) is:',o:['consistent with the duty of loyalty','a violation: proxies should never be voted','unnecessary, since voting has no value'],a:0,w:'Proxies are an asset to be voted in clients\' interests, with a documented policy.'}]}],
 quiz:[{q:'GIPS verification is:',o:['recommended, not required','required for all firms','prohibited for small firms'],a:0,w:'It is strongly encouraged.'},
  {q:'A firm may claim GIPS compliance:',o:['only firm-wide','for selected composites','for any five-year period it chooses'],a:0,w:'No partial claims.'},
  {q:'The Asset Manager Code applies to:',o:['firms, voluntarily','individual candidates only','regulators'],a:0,w:'It complements the Code and Standards for individuals.'},
  {q:'When first claiming compliance, a firm must present at least:',o:['five years of compliant performance (or since inception)','one year','twenty years'],a:0,w:'Then it adds years until it reaches ten.'}],
 cr:[{q:'Identify the GIPS problem in statement 2 of the vignette and recommend how Dunes should present its history.',model:`Linking model results to actual composite performance is <b>not permitted</b>. Dunes should present only the five years of actual composite results; if it shows model results at all, they must be clearly labelled as supplemental, separate from, and not linked to, the actual track record.`,pts:['Violation identified (linking model results)','Correct presentation recommended']},
  {q:'A manager allocates a hot IPO only to the firm\'s performance-fee accounts. Explain which Standard is involved and what the firm should do.',model:`Standard III(B) <b>Fair Dealing</b> (and duties of loyalty): allocations should be fair to all clients for whom the IPO is suitable. The firm should allocate pro rata to all eligible accounts according to a written allocation policy and review allocations for favouritism.`,pts:['III(B) Fair Dealing identified','Corrective policy recommended']}],
 srs:[{q:'GIPS: who must be in composites?',a:'All actual, fee-paying, discretionary portfolios.'},{q:'Is verification required?',a:'No, it is recommended.'},{q:'Can model results be linked to actual?',a:'Never.'},{q:'Minimum initial track record?',a:'Five years (or since inception), building to ten.'}],
 read:[{t:'GIPS standards',s:'CFA Institute',u:'https://www.gipsstandards.org/'},{t:'Code of Ethics and Standards',s:'CFA Institute',u:CFAS},{t:'Asset Manager Code',s:'CFA Institute',u:'https://rpc.cfainstitute.org/codes-and-standards/asset-manager-code'}]},

/* ---------- x10 Constructed-response technique ---------- */
{id:'x10',track:'cfa3',topic:'aa',title:'Constructed-response technique',mins:45,blurb:'Command words, answer templates and time management for Level III written answers. Practised on an IPS case.',
 lab:{key:'crtech',name:'Strong or weak answer?',intro:'Eight habits seen in Level III answers. Which earn points?'},
 cards:[
  {h:'The format',b:`<p>The Level III exam combines <b>item sets</b> (multiple choice) and <b>constructed-response</b> (written) questions on case vignettes. Constructed responses are graded by charterholders against a key. Points go to correct, specific, justified answers, not to length.</p>`},
  {h:'Command words',b:`<ul><li><b>Calculate:</b> formula, inputs, answer.</li><li><b>Determine / Identify:</b> a direct choice.</li><li><b>Justify / Explain:</b> reasons tied to the case.</li><li><b>Recommend:</b> a choice plus why.</li><li><b>Discuss / Evaluate:</b> both sides, then a conclusion.</li></ul>`},
  {h:'A reusable template',b:`<p><b>Answer first</b>, then <b>"because"</b> + one or two case-specific facts. For calculations, write the formula with numbers, then the result with units. Use bullet points. If a template table is provided, fill only what is asked.</p>`},
  {h:'The IPS for individuals',b:`<p><b>Return objective</b>: required return from spending needs and growth goals (state it nominal or real). <b>Risk</b>: ability (horizon, wealth vs needs, flexibility) and willingness (attitudes, behaviour); the overall tolerance is the lower of the two when they conflict. <b>Constraints</b>: time horizon (single or multi-stage), liquidity, taxes, legal, unique circumstances.</p>`},
  {h:'Time',b:`<p>Budget time in proportion to points. If stuck, write the formula and a sensible assumption; partial credit is common. Never leave a part blank.</p>`}],
 sets:[{t:'The Al-Mutairi family IPS',v:`<p>Dr Sara Al-Mutairi, 58, plans to retire in two years. Her portfolio is SAR 6 million. After retirement she will need SAR 300,000 a year from the portfolio, rising with inflation of 2.5%. She wants to preserve the real value of the portfolio for her children. She has no other pension. She says: "I lost sleep in 2020; I never want to see a 20% drop again."</p><p>She plans to give SAR 500,000 to her daughter for a home next year.</p>`,
  qs:[{q:'Ignoring the gift, her required nominal return after retirement (multiplicative) is closest to:',o:['7.6%','5.0%','7.5%'],a:0,w:'Real need: 300,000 ÷ 6,000,000 = 5.0%. Nominal: 1.05 × 1.025 − 1 = 7.6%. After the gift the base falls to SAR 5.5m and the need rises to about 8.1%.'},
   {q:'Her willingness to take risk is best described as:',o:['below average','above average','average'],a:0,w:'Her statement shows strong aversion to drawdowns.'},
   {q:'The SAR 500,000 gift is best treated as:',o:['a near-term liquidity requirement','a long-term return objective','a tax constraint'],a:0,w:'It must be held in liquid, low-risk assets.'},
   {q:'Her time horizon is best described as:',o:['multi-stage: two years to retirement, then a long retirement and bequest stage','single-stage of two years','single-stage of five years'],a:0,w:'Pre-retirement and retirement stages differ.'}]}],
 quiz:[{q:'"Justify" in a constructed-response question requires:',o:['reasons tied to the case facts','a calculation only','a restatement of the question'],a:0,w:'A conclusion without reasons earns partial credit at best.'},
  {q:'When ability and willingness to take risk conflict, overall risk tolerance is usually set:',o:['nearer the lower of the two, with education','at the higher of the two','at the average'],a:0,w:'Respect the client\'s limits while educating them.'},
  {q:'The best way to present a calculation is:',o:['formula, inputs, result with units','result only','a paragraph describing the method'],a:0,w:'Graders can award method points.'},
  {q:'A multi-stage time horizon is common for:',o:['individuals approaching retirement','money-market funds','overnight traders'],a:0,w:'Different stages have different needs.'}],
 cr:[{q:'Formulate Dr Al-Mutairi\'s <b>return objective</b> after retirement.',topic:'aa',model:`She needs SAR 300,000 a year from SAR 6 million: <b>5.0% real</b>, about <b>7.6% nominal</b> (1.05 × 1.025 − 1), to fund spending and preserve the real value of the portfolio for her children. After the SAR 500,000 gift, the base is SAR 5.5 million and the requirement rises to about 5.45% real (about 8.1% nominal).`,pts:['Spending rate calculated (5.0% real)','Inflation added correctly (≈7.6% nominal)','Gift effect considered']},
  {q:'Determine whether her <b>overall</b> risk tolerance is below average, average or above average. Justify with reference to ability and willingness.',topic:'pc',model:`<b>Below average.</b> Ability is about average: a long retirement horizon, but no pension, a demanding spending rate and a near-term gift. Willingness is below average: she cannot tolerate a 20% drawdown. When they conflict, use the lower.`,pts:['Below average determined','Ability assessed with case facts','Willingness assessed with case facts','Rule for conflict applied']}],
 srs:[{q:'Answer template?',a:'Answer first, then "because" + case facts; formula and units for calculations.'},{q:'IPS constraints?',a:'Time horizon, liquidity, taxes, legal/regulatory, unique circumstances.'},{q:'Ability vs willingness conflict?',a:'Lean to the lower; educate the client.'},{q:'Real to nominal required return?',a:'(1 + real)(1 + inflation) − 1.'}],
 read:[{t:'CFA Program: Level III exam',s:'CFA Institute',u:CFAI},{t:'Investment policy statement',s:'Wikipedia',u:WIKI('Investment_policy_statement')},{t:'Risk aversion',s:'Wikipedia',u:WIKI('Risk_aversion')}]}
]);

/* ================= CFA Level III: pathway missions x11–x22 ================= */
addMissions([
/* ================= Portfolio Management pathway ================= */
{id:'x11',track:'cfa3',topic:'path',path:'pm',title:'Pathway PM: index and active equity',mins:55,blurb:'Index construction and replication; active equity styles, long–short structures and portfolio construction.',
 lab:{key:'activeshare',name:'Active share',intro:'Compare a four-stock portfolio with its benchmark and measure how active it really is.'},
 cards:[
  {h:'Index construction',b:`<p>Choices: universe, weighting (market-cap, float-adjusted, equal, fundamental), and rebalancing/reconstitution rules. Equal weighting tilts to small caps and needs more trading; fundamental weighting tilts to value. Reconstitution days bring predictable flows and price pressure.</p>`},
  {h:'Passive implementation',b:`<p><b>Full replication</b> (liquid, few constituents), <b>stratified sampling</b> and <b>optimisation</b> (many or illiquid constituents). Vehicles: index funds, ETFs, futures, total return swaps. Tracking error comes from fees, cash drag, sampling, transaction costs, and dividend timing. Securities lending can offset costs.</p>`},
  {h:'Active approaches',b:`<p><b>Fundamental</b> (judgement, concentrated, bottom-up) vs <b>quantitative</b> (rules, breadth, factor-based). Styles: value, growth, GARP, momentum, quality, income. Activism seeks change through engagement. Biases in fundamental work: confirmation, overconfidence, illusion of control.</p>`},
  {h:'Long–short and extensions',b:`<p>Market-neutral long–short isolates selection. <b>130/30</b>: 130% long, 30% short, 100% net, 160% gross; it relaxes the long-only constraint (raising the transfer coefficient). Costs: borrowing fees, short squeezes, unlimited loss on shorts.</p>`},
  {h:'Portfolio construction',b:`<p>Decide the number and size of positions; manage the <b>active risk budget</b>; use active share (holdings difference) and tracking error (return difference) together. A concentrated stock picker has high active share and moderate tracking error; a factor-timer may have low active share and high tracking error.</p>`}],
 sets:[{t:'Two equity managers',v:`<p>Manager X holds four stocks at 40%, 30%, 20% and 10%; the benchmark holds the same stocks at 25% each. Manager X's tracking error is 2%.</p><p>Manager Y runs a 130/30 fund. An index fund the client owns tracked its benchmark with 0.35% tracking error last year, and charges a 0.10% fee.</p>`,
  qs:[{q:'Manager X\'s active share is:',o:['20%','40%','15%'],a:0,w:'½ × (15 + 5 + 5 + 15) = 20%.'},
   {q:'With 20% active share and 2% tracking error, Manager X is closest to a:',o:['closet indexer','concentrated stock picker','factor bettor'],a:0,w:'Low active share and low tracking error.'},
   {q:'Manager Y\'s gross and net exposures are:',o:['160% gross, 100% net','130% gross, 70% net','100% gross, 160% net'],a:0,w:'130 + 30 = 160 gross; 130 − 30 = 100 net.'},
   {q:'Likely sources of the index fund\'s tracking error include:',o:['fees, cash drag and sampling','active stock selection','leverage'],a:0,w:'Passive funds deviate for implementation reasons.'}]}],
 quiz:[{q:'Equal-weighted indices tend to tilt toward:',o:['smaller companies','the largest companies','growth stocks only'],a:0,w:'Small caps get the same weight as large caps.'},
  {q:'Full replication is most suitable when the index has:',o:['few, liquid constituents','thousands of illiquid constituents','no published constituents'],a:0,w:'Otherwise sampling or optimisation is cheaper.'},
  {q:'Relaxing the long-only constraint mainly raises the:',o:['transfer coefficient','information coefficient','breadth'],a:0,w:'Views can be expressed fully, including negative ones.'},
  {q:'A risk unique to short positions is:',o:['potentially unlimited losses and recall of borrowed shares','limited upside','dividend income'],a:0,w:'Prices can rise without limit.'}],
 cr:[{q:'Recommend a replication method for an index fund tracking a 1,800-stock emerging-market small-cap index, and justify.',model:`<b>Stratified sampling or optimisation.</b> Full replication would be costly: many constituents are small and illiquid with high trading costs. Sampling matches the index's key characteristics (country, sector, size, style) with fewer holdings at an acceptable tracking error.`,pts:['Sampling/optimisation recommended','Cost/illiquidity justification','Risk characteristics matched']},
  {q:'Compare active share and tracking error as measures of active management.',model:`<b>Active share</b> measures how different holdings are from the benchmark; <b>tracking error</b> measures the volatility of return differences. They differ because tracking error depends on correlations: many small, diversified bets give high active share but low tracking error, while a few large factor bets give lower active share but higher tracking error.`,pts:['Active share defined','Tracking error defined','Why they can diverge']}],
 srs:[{q:'Active share?',a:'½ Σ |w_p − w_b|.'},{q:'130/30 exposures?',a:'160% gross, 100% net.'},{q:'Sources of index tracking error?',a:'Fees, cash drag, sampling, trading costs.'},{q:'Equal weighting tilt?',a:'Smaller companies.'}],
 read:[{t:'Index fund',s:'Wikipedia',u:WIKI('Index_fund')},{t:'130–30 fund',s:'Wikipedia',u:WIKI('130%E2%80%9330_fund')},{t:'Active management',s:'Wikipedia',u:WIKI('Active_management')}]},

{id:'x12',track:'cfa3',topic:'path',path:'pm',title:'Pathway PM: fixed income strategies',mins:60,blurb:'Yield curve strategies, expected return decomposition, and active credit management.',
 lab:{key:'fiexp',name:'Expected bond return',intro:'Add income, rolldown, the effect of a rate view, and credit losses.'},
 cards:[
  {h:'Static curve strategies',b:`<p>If you expect the curve to stay put: <b>carry</b> (hold higher-yielding, longer bonds), <b>rolldown</b> (ride the curve), and buy-and-hold. Repo financing can lever carry. Risk: the curve does not stay put.</p>`},
