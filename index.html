{id:'c01',track:'consult',title:'How engagements work',mins:30,blurb:'The life of a strategy engagement, who does what, and how a firm like Strategy& thinks about capabilities.',
 lab:{key:'phases',name:'Engagement-phase sorter',intro:'Place ten real activities in the phase where they belong.'},
 cards:[
  {h:'An engagement is a question with a deadline',b:`<p>Every engagement starts from one <b>key question</b> the client sponsor cares about, for example "How do we restore margin to 30% by 2027?". Everything else (team, workplan, deck) exists to answer it.</p><p>Write the question down on day one and test every analysis against it: <i>does this help answer the question?</i></p>`},
  {h:'Four phases',b:`<ul><li><b>Scope:</b> agree the question, success criteria, approach, team and fees (the proposal).</li><li><b>Diagnose:</b> build the fact base. Interviews, data, baseline, benchmarks.</li><li><b>Design:</b> generate options, evaluate them, build business cases, design the target model.</li><li><b>Deliver:</b> implementation plan, PMO, KPIs, early wins, handover.</li></ul><p>Phases overlap and loop back, but the logic holds.</p>`},
  {h:'Who does what',b:`<ul><li><b>Partner/Director:</b> owns the client relationship and the answer; shows up at key moments.</li><li><b>Manager:</b> runs the project day to day, owns the storyline and the workplan.</li><li><b>Senior Associate / Associate:</b> owns a workstream: analysis, interviews, slides.</li><li><b>Client counterparts:</b> the sponsor (who pays and decides) and the working team (who has the data).</li></ul><p>As an associate, your fastest route to trust is owning a piece end to end: "I'll have the baseline by Wednesday and I'll flag issues by Monday."</p>`},
  {h:'Capabilities-driven strategy',b:`<p>Strategy&'s signature idea, from <i>The Coherence Premium</i> (Leinwand & Mainardi): companies win through a few <b>distinctive capabilities</b> that fit together and support a clear "way to play". Most companies spread money across too many things.</p><p>Ask in any engagement: <i>what are the 3–6 things this company must be better at than anyone, and does the spending match?</i></p>`},
  {h:'The rhythm of a project',b:`<ul><li><b>Weekly:</b> team problem-solving session, client check-in, updated workplan.</li><li><b>Every 3–6 weeks:</b> steering committee (SteerCo) with senior client leaders: decisions, not updates.</li><li><b>Daily:</b> the ghost deck evolves: the storyline is drafted early and filled with evidence.</li></ul><div class="formula">Good associate habit: end each day by updating the page you own and writing the 3 things you'll do tomorrow.</div>`}],
 quiz:[
  {q:'What should be agreed before any analysis starts?',o:['The final recommendation','The key question and what success looks like','The slide template','The team dinner'],a:1,w:'Analysis without an agreed question wastes days. The question frames the whole engagement.'},
  {q:'Which activity belongs mainly to the Diagnose phase?',o:['Writing the proposal','Building the baseline and benchmarks','Setting up the PMO','Coaching implementation owners'],a:1,w:'Diagnose builds the fact base: where performance stands today and how far it is from peers.'},
  {q:'What is a SteerCo for?',o:['Weekly status updates','Senior client decisions at key milestones','Data collection','Team social time'],a:1,w:'A steering committee should leave with decisions. If a SteerCo is only an update, it is a missed opportunity.'},
  {q:'In capabilities-driven strategy, companies win mainly by…',o:['Being good at everything','A few distinctive, mutually reinforcing capabilities','Cutting cost across the board','Copying the market leader'],a:1,w:'Coherence: a clear way to play, a small set of capabilities that support it, and a portfolio that fits.'},
  {q:'Who typically owns the storyline day to day?',o:['The partner','The engagement manager','The client sponsor','The associate'],a:1,w:'The manager owns the storyline and workplan. Associates own pages and workstreams within it.'},
  {q:'The best way for a new associate to earn trust quickly is to…',o:['Speak first in every meeting','Own one workstream end to end and flag issues early','Make the most slides','Avoid asking questions'],a:1,w:'Reliability beats volume: clear ownership, clear deadlines, no surprises.'}],
 srs:[{q:'The four phases of a strategy engagement?',a:'Scope → Diagnose → Design → Deliver.'},{q:'What is a key question?',a:'The single question the client sponsor needs answered, agreed on day one; every analysis must help answer it.'},{q:'Capabilities-driven strategy in one line?',a:'Win through a few distinctive, mutually reinforcing capabilities that support a clear way to play, and align spending to them (The Coherence Premium).'},{q:'What should a SteerCo produce?',a:'Decisions from senior client leaders, not just status updates.'}],
 read:[{t:'The Coherence Premium',s:'Harvard Business Review, 2010',n:'Leinwand & Mainardi: the origin of capabilities-driven strategy',u:'https://hbr.org/2010/06/the-coherence-premium'},{t:'Consulting Is More Than Giving Advice',s:'Harvard Business Review, 1982',n:'Turner: the hierarchy of consulting purposes',u:'https://hbr.org/1982/09/consulting-is-more-than-giving-advice'},{t:'How to master the seven-step problem-solving process',s:'McKinsey',u:'https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/how-to-master-the-seven-step-problem-solving-process'}]},

{id:'c02',track:'consult',title:'Structured thinking and MECE',mins:30,blurb:'Mutually exclusive, collectively exhaustive: the habit behind every good consulting structure.',
 lab:{key:'mece',name:'MECE drill',intro:'Eight proposed splits. Is each one MECE, overlapping, or missing something?'},
 cards:[
  {h:'MECE',b:`<p><b>Mutually Exclusive:</b> no item fits in two buckets. <b>Collectively Exhaustive:</b> every item fits in some bucket.</p><p>MECE structures stop you double-counting and stop you missing the answer. They also make your thinking easy to follow.</p>`},
  {h:'Four ways to split anything',b:`<ul><li><b>Algebraic:</b> profit = revenue − cost; revenue = price × volume.</li><li><b>Process:</b> steps in sequence (source → make → deliver).</li><li><b>Segments:</b> customers, products, regions, channels.</li><li><b>Opposites / frameworks:</b> internal vs external; supply vs demand; 3Cs; 4Ps.</li></ul><p>Algebraic splits are the most reliably MECE. Prefer them when you can.</p>`},
  {h:'One dimension per level',b:`<p>The most common error is mixing dimensions at the same level: "consumers, businesses, young people" mixes customer type with age, so they overlap.</p><p>Fix: pick one dimension per level, then split again below it (consumers → by age).</p>`},
  {h:'MECE "enough"',b:`<p>In real problems, perfect MECE is rare. An "Other" bucket is acceptable if it is small. What matters: no material overlap, and no plausible answer left out.</p><div class="formula">Test: could two colleagues put the same item in different buckets? Is there an answer that fits nowhere?</div>`},
  {h:'Structure is communication',b:`<p>Say your structure out loud before content: "I'd look at this in three parts: market, competition, and our capabilities." Number the parts. Go deep in the order you announced.</p><p>Interviewers and clients judge structure in the first minute.</p>`}],
 quiz:[
  {q:'"Revenue: sell more to existing customers, win new customers." What is wrong?',o:['Overlap','Gap: price is missing','Nothing','Too many buckets'],a:1,w:'Revenue = price × volume. Both buckets are about volume; price and mix are missing.'},
  {q:'Which split is most reliably MECE?',o:['Brainstormed themes','Algebraic (e.g. profit = revenue − cost)','Stakeholder opinions','Alphabetical'],a:1,w:'Algebraic identities are MECE by construction.'},
  {q:'"Customers: corporate, SMEs, Riyadh-based" — the issue is…',o:['A gap','Mixing dimensions, so buckets overlap','Too few buckets','No issue'],a:1,w:'Riyadh-based is geography; corporate and SME are size. A Riyadh SME fits two buckets.'},
  {q:'When is an "Other" bucket acceptable?',o:['Never','When it is small and the main buckets are distinct','When it is the largest bucket','Always'],a:1,w:'A large "Other" means your structure is not doing its job.'},
  {q:'What should you do before diving into content in a case?',o:['Ask for the answer','State your structure out loud, numbered','Start calculating','Summarise the prompt three times'],a:1,w:'Announcing structure makes your thinking followable and lets the interviewer steer you.'},
  {q:'Which pair is a natural MECE split for "why are deliveries late?"',o:['Supply vs demand (plus the planning system between them)','Good vs bad','Morning vs evening','Saudi vs foreign staff'],a:0,w:'Late deliveries come from too little capacity, too much demand, or poor matching of the two.'}],
 srs:[{q:'MECE stands for?',a:'Mutually Exclusive, Collectively Exhaustive.'},{q:'Most common MECE error?',a:'Mixing two dimensions at the same level (e.g. customer type and age), causing overlap.'},{q:'Four ways to split a problem?',a:'Algebraic, process, segments, opposites/frameworks.'},{q:'Two-question MECE test?',a:'Could an item go in two buckets? Is there an answer that fits in none?'}],
 read:[{t:'How to master the seven-step problem-solving process',s:'McKinsey',u:'https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/how-to-master-the-seven-step-problem-solving-process'},{t:'The Minto Pyramid Principle',s:'Barbara Minto',n:'The book that popularised MECE grouping',u:'https://www.barbaraminto.com/'},{t:'HBR on structured problem solving',s:'Harvard Business Review search',u:HBRS('structured problem solving')}]},

{id:'c03',track:'consult',title:'Issue trees',mins:35,blurb:'Turn a fuzzy question into a tree of answerable ones.',
 lab:{key:'tree',name:'Issue-tree builder',intro:'Build a tree for one of three client questions, run the self-check, then compare with a model.'},
 cards:[
  {h:'What an issue tree does',b:`<p>An issue tree breaks the key question into sub-questions until each leaf is small enough to answer with one analysis. It is your plan for the work and your map for the team.</p>`},
  {h:'Diagnostic vs solution trees',b:`<ul><li><b>Diagnostic ("why?")</b>: why has margin fallen? → revenue per tonne, volume, cost per tonne…</li><li><b>Solution ("how?")</b>: how can we restore margin? → raise price, cut energy, change mix…</li></ul><p>Do the diagnostic first if the cause is unknown. Never mix why and how in one tree.</p>`},
  {h:'Rules of a good tree',b:`<ul><li>Each level is MECE.</li><li>Each child answers the parent's question ("why?" or "how?").</li><li>3–5 branches per node; 3–4 levels deep at most.</li><li>Leaves are specific enough to name the analysis and data.</li></ul>`},
  {h:'From tree to workplan',b:`<p>Each leaf becomes a line in the workplan: <b>analysis → data source → owner → date</b>. Prune leaves that would not change the answer even if true. That is the 80/20 in practice.</p>`},
  {h:'Draw it, then talk it',b:`<p>On a whiteboard, the tree is a conversation tool: "These are the four reasons it could be; the data says it is mainly this one, so we will focus here." Clients remember the picture, not the paragraph.</p>`}],
 quiz:[
  {q:'A diagnostic tree answers…',o:['How?','Why?','Who?','When?'],a:1,w:'Diagnostic trees explain causes; solution trees list ways to act.'},
  {q:'How deep should a tree usually go?',o:['1 level','3–4 levels','10 levels','As deep as possible'],a:1,w:'Deeper than four levels is usually a sign you should split it into two trees.'},
  {q:'A leaf is "done" when…',o:['It sounds smart','You can name the analysis and data that answers it','It has a number','The client likes it'],a:1,w:'Leaves must be answerable. If you cannot name the analysis, go one level deeper.'},
  {q:'What does pruning mean?',o:['Deleting branches you dislike','Dropping leaves that would not change the answer even if true','Removing the top level','Making fonts smaller'],a:1,w:'Pruning focuses effort on what moves the decision.'},
  {q:'Which is a solution-tree branch for "How do we cut plant cost 15%?"',o:['Why has energy cost risen?','Reduce yield loss','Energy prices rose in 2024','Our cost is high'],a:1,w:'"Reduce yield loss" is an action; the others are diagnoses or facts.'},
  {q:'Children of a node should be…',o:['Interesting','MECE and answering the parent','Alphabetical','Equal in size'],a:1,w:'Each level must split the parent cleanly.'}],
 srs:[{q:'Diagnostic vs solution tree?',a:'Diagnostic asks "why?" (causes); solution asks "how?" (actions). Do not mix them.'},{q:'Rules of a good issue tree?',a:'MECE at each level; children answer the parent; 3–5 branches; 3–4 levels; leaves answerable by one analysis.'},{q:'From leaf to workplan?',a:'Analysis → data source → owner → date.'},{q:'What is pruning?',a:'Dropping leaves that would not change the answer even if true.'}],
 read:[{t:'How to master the seven-step problem-solving process',s:'McKinsey',n:'Includes the logic tree step',u:'https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/how-to-master-the-seven-step-problem-solving-process'},{t:'Issue trees and logic trees',s:'HBR search',u:HBRS('logic tree problem solving')},{t:'MIT OCW search: problem structuring',s:'MIT OpenCourseWare',u:'https://ocw.mit.edu/search/?q=problem%20solving'}]},

{id:'c04',track:'consult',title:'Hypothesis-driven problem solving',mins:35,blurb:'Start with an answer you could be wrong about, then try to prove it wrong fast.',
 lab:{key:'hypo',name:'Hypothesis and workplan builder',intro:'Write a Day-1 answer, three supporting hypotheses, and the analysis that would kill each.'},
 cards:[
  {h:'The Day-1 answer',b:`<p>Hypothesis-driven teams write their best guess at the answer on day one, based on experience and early facts. It is not a conclusion; it is a <b>direction for the work</b>.</p><p>Why: it focuses analysis on what would prove or disprove the guess, instead of "boiling the ocean".</p>`},
  {h:'A good hypothesis is falsifiable',b:`<p>"Costs are too high" cannot be wrong. "Energy cost per tonne rose 40% and explains most of the margin fall" can be tested with one analysis.</p><div class="formula">Write the result that would kill it. If you cannot, it is not a hypothesis.</div>`},
  {h:'Hypothesis tree',b:`<p>Governing hypothesis at the top; 2–4 supporting hypotheses that, if all true, prove it. Each has an analysis attached. This is an issue tree phrased as claims.</p>`},
  {h:'Be ready to be wrong',b:`<p>The danger is confirmation bias: looking only for data that supports you. Good teams actively try to kill their hypothesis early, and change it without ego. A killed hypothesis is progress.</p>`},
  {h:'Analysis that matters',b:`<p>For each analysis ask: <b>"So what?"</b> If the result came back either way, would we decide differently? If not, skip it. Prefer quick, rough analyses that settle a question over perfect ones that arrive late.</p>`}],
 quiz:[
  {q:'Which is a well-formed hypothesis?',o:['Costs are too high','We should improve operations','The filling line is the bottleneck in peak weeks and causes most late orders','Let us look at the data'],a:2,w:'Specific, testable, and you can say what result would kill it.'},
  {q:'Why start with a Day-1 answer?',o:['To impress the client','To focus analysis on what would prove or disprove it','Because data is never needed','To finish early'],a:1,w:'It focuses scarce time on decisive analyses.'},
  {q:'The biggest risk of hypothesis-driven work is…',o:['Too much data','Confirmation bias','Too many slides','Slow typing'],a:1,w:'Seeking only supporting evidence. Counter it by naming the kill test upfront.'},
  {q:'"So what?" tests whether…',o:['A slide looks good','An analysis would change the decision','The client is happy','Numbers add up'],a:1,w:'If the answer would not change what you do, the analysis is optional.'},
  {q:'If your hypothesis is disproved, you should…',o:['Hide the result','Reframe the hypothesis using what you learned','Start over from zero','Ask for more time'],a:1,w:'A killed hypothesis narrows the search. Update and move on.'},
  {q:'Supporting hypotheses should be…',o:['As many as possible','2–4, which together prove the governing one','Unrelated to each other','Written after the analysis'],a:1,w:'Together they must be sufficient to prove the top claim.'}],
 srs:[{q:'What makes a hypothesis good?',a:'It is specific and falsifiable: you can name the result that would kill it.'},{q:'Main risk of hypothesis-driven work?',a:'Confirmation bias. Counter it by defining the kill test first.'},{q:'The "So what?" test?',a:'Would the result of this analysis change the decision? If not, skip or simplify it.'},{q:'Hypothesis tree structure?',a:'Governing hypothesis + 2–4 supporting hypotheses that jointly prove it, each with an analysis.'}],
 read:[{t:'The Discipline of Business Experimentation',s:'Harvard Business Review, 2014',n:'Thomke & Manzi: testing ideas rigorously',u:'https://hbr.org/2014/12/the-discipline-of-business-experimentation'},{t:'How to master the seven-step problem-solving process',s:'McKinsey',u:'https://www.mckinsey.com/capabilities/strategy-and-corporate-finance/our-insights/how-to-master-the-seven-step-problem-solving-process'},{t:'Hypothesis-driven thinking',s:'HBR search',u:HBRS('hypothesis driven')}]},

{id:'c05',track:'consult',title:'Profitability cases',mins:40,blurb:'The most common case type: profits fell, find out why and fix it.',
 lab:{key:'sim',sim:'cement',name:'Case simulator: Najd Cement',intro:'A guided, timed case with exhibits. Write before you reveal.'},
 cards:[
  {h:'The profit tree',b:`<div class="formula">Profit = (Price × Volume) − (Variable cost per unit × Volume) − Fixed cost</div><p>Split each branch further: price by product and channel; volume by market size × share; variable cost by input; fixed cost by type.</p>`},
  {h:'Inside or outside?',b:`<p>Early question: is this a company problem or an industry problem? If competitors are suffering equally, look at market forces (demand, oversupply, input prices, regulation). If only the client, look inside (operations, pricing, mix, share loss).</p>`},
  {h:'Quantify the bridge',b:`<p>Before brainstorming, build a <b>profit bridge</b>: how much of the decline came from price, volume, variable cost and fixed cost? This prevents you from fixing a small problem brilliantly.</p><div class="formula">Price effect = Δprice × new volume<br>Volume effect = Δvolume × old unit margin<br>Cost effect = Δunit cost × new volume</div>`},
  {h:'Levers, grouped',b:`<ul><li><b>Revenue:</b> price, mix, volume (share, new segments, exports).</li><li><b>Variable cost:</b> inputs, yield, energy, logistics.</li><li><b>Fixed cost:</b> overhead, footprint, capacity.</li></ul><p>For each lever: impact, cost, time, risk. Recommend 2–3, not 10.</p>`},
  {h:'Synthesis',b:`<p>End with: the cause (quantified), 2–3 actions with impact, and the next step. Answer first. "Margin fell 16 points mainly because energy per tonne rose 46%. We recommend…"</p>`}],
 quiz:[
  {q:'Price fell from 100 to 90; volume is now 1,000 units. Price effect on profit?',o:['−1,000','−10,000','−100','+10,000'],a:1,w:'Δprice × new volume = −10 × 1,000 = −10,000.'},
  {q:'Why check competitors early?',o:['To copy them','To tell whether it is an industry or a company problem','To find their prices','Interviewers like it'],a:1,w:'It decides whether you look at market forces or internal issues first.'},
  {q:'What is a profit bridge?',o:['A slide transition','A breakdown of profit change into price, volume and cost effects','A type of loan','A Gantt chart'],a:1,w:'It quantifies where the money went, so you focus on the biggest driver.'},
  {q:'Variable cost per unit rose 5 on 2,000 units. Effect?',o:['−5,000','−10,000','−2,000','−2,500'],a:1,w:'5 × 2,000 = 10,000 lower profit.'},
  {q:'A strong recommendation contains…',o:['Every lever you can think of','2–3 prioritised actions with impact and a next step','Only the cause','A request for more data'],a:1,w:'Prioritise. Ten actions signal that you have not decided.'},
  {q:'Volume fell 0.3 Mt; old unit margin was SAR 135/t. Volume effect?',o:['−SAR 40.5m','−SAR 135m','−SAR 4m','+SAR 40.5m'],a:0,w:'0.3m × 135 = 40.5m.'}],
 srs:[{q:'Profit equation for cases?',a:'Profit = (Price − Variable cost per unit) × Volume − Fixed cost.'},{q:'Three effects in a profit bridge?',a:'Price effect (Δp × new volume), volume effect (Δvolume × old unit margin), cost effects (Δunit cost × volume; Δfixed).'},{q:'First diagnostic question in a profitability case?',a:'Is it an industry problem or a company-specific problem?'},{q:'Shape of a good case synthesis?',a:'Answer first: cause quantified → 2–3 prioritised actions with impact → next step.'}],
 read:[{t:'The power of pricing',s:'McKinsey Quarterly, 2003',n:'Why a 1% price increase moves profit so much',u:'https://www.mckinsey.com/capabilities/growth-marketing-and-sales/our-insights/the-power-of-pricing'},{t:'Interviewing at McKinsey',s:'McKinsey Careers',u:'https://www.mckinsey.com/careers/interviewing'},{t:'Interviewing at Bain',s:'Bain Careers',u:'https://www.bain.com/careers/hiring-process/interviewing/'}]},

{id:'c06',track:'consult',title:'Market sizing and estimation',mins:30,blurb:'Estimate anything with a clear chain of logic and fast, sensible maths.',
 lab:{key:'sprint',name:'Case-math sprint + guided estimation',intro:'A timed ten-question sprint, then a guided Fermi estimate.'},
 cards:[
  {h:'Top-down vs bottom-up',b:`<ul><li><b>Top-down:</b> start from a big number and narrow (population → households → cars → tyres).</li><li><b>Bottom-up:</b> build from units (shops × sales per shop; plants × capacity).</li></ul><p>The best answers do one and sanity-check with the other.</p>`},
  {h:'Write the equation first',b:`<div class="formula">Market = units × purchase frequency × price</div><p>State the chain before any numbers. Interviewers score the logic more than the final figure.</p>`},
  {h:'Round aggressively',b:`<p>Use numbers that are easy to multiply: 35m ≈ 36m if you are dividing by 6, 0.18 ≈ 0.2 for a first pass. Keep track of whether you rounded up or down and adjust at the end if needed.</p><div class="formula">Divide by splitting: 360 / 24 = 360 / 12 / 2 = 15</div>`},
  {h:'Segment when it matters',b:`<p>If one segment behaves very differently (fleets vs private cars; Riyadh vs rural), split it. Do not segment for decoration: only when the numbers differ enough to change the answer.</p>`},
  {h:'Sanity-check out loud',b:`<p>"That gives about 20 million tyres, or roughly two per car per year, which feels right for 25,000 km a year." Then name the most sensitive assumption.</p>`}],
 quiz:[
  {q:'360 / 24 = ?',o:['12','15','18','14'],a:1,w:'360 / 12 = 30, / 2 = 15.'},
  {q:'A good estimate starts with…',o:['The final number','An equation for the chain of logic','A Google search','The hardest assumption'],a:1,w:'Equation first, numbers second.'},
  {q:'Bottom-up sizing of coffee shop revenue in Riyadh would start from…',o:['Saudi GDP','Number of shops × cups per day × price','World coffee prices','Population growth'],a:1,w:'Bottom-up builds from units of supply or demand.'},
  {q:'When should you segment?',o:['Always','When segments behave differently enough to change the answer','Never','Only if asked'],a:1,w:'Segment for accuracy, not decoration.'},
  {q:'15% of 640 ≈ ?',o:['86','96','106','64'],a:1,w:'10% = 64, 5% = 32, total 96.'},
  {q:'After reaching a number you should…',o:['Move on immediately','Sanity-check it and name the most sensitive assumption','Ask if it is right','Recalculate with more decimals'],a:1,w:'A sanity check shows judgement, which is what interviewers want.'}],
 srs:[{q:'Top-down vs bottom-up sizing?',a:'Top-down narrows a big number (population → buyers); bottom-up builds from units (shops × sales). Use one, check with the other.'},{q:'Generic market-size equation?',a:'Units (buyers) × purchase frequency × price.'},{q:'Fast way to divide by 24?',a:'Divide by 12, then by 2.'},{q:'How to close an estimate?',a:'Sanity-check against another view and name the most sensitive assumption.'}],
 read:[{t:'Fermi problem',s:'Wikipedia',n:'The method behind every market-sizing question',u:'https://en.wikipedia.org/wiki/Fermi_problem'},{t:'Market sizing',s:'HBR search',u:HBRS('market sizing')},{t:'Interviewing at McKinsey',s:'McKinsey Careers',u:'https://www.mckinsey.com/careers/interviewing'}]},

{id:'c07',track:'consult',title:'Market-entry cases',mins:40,blurb:'Should we enter, and how? The case type behind most Saudi localisation decisions.',
 lab:{key:'sim',sim:'entry',name:'Case simulator: HanVolt in Saudi Arabia',intro:'A battery-pack maker weighs a Saudi plant. Watch the gap between the headline market and the serviceable one.'},
 cards:[
  {h:'Four questions',b:`<ol><li><b>Is the market attractive?</b> Size, growth, profitability, policy.</li><li><b>Can we win?</b> Competitors, our advantage, cost to serve vs importing.</li><li><b>Do the economics work?</b> Breakeven, NPV, payback.</li><li><b>How should we enter?</b> Mode, partner, timing, risks.</li></ol>`},
  {h:'Headline vs serviceable market',b:`<p>The total market is rarely the market you can serve. Narrow it: which segments, which customers can buy from <i>this</i> plant, what share can we realistically win? Compare that volume to breakeven.</p>`},
  {h:'Entry modes',b:`<ul><li>Export via distributor (lowest commitment)</li><li>Licensing / franchising</li><li>Contract manufacturing</li><li>Joint venture with a local partner</li><li>Acquisition</li><li>Greenfield plant (highest commitment)</li></ul><p>More control means more capital and risk.</p>`},
  {h:'The Saudi lens',b:`<p>In the Kingdom, entry cases often hinge on: local-content requirements in government and giga-project procurement, industrial-fund financing, investment licensing with MISA, Saudisation targets, and anchor customers. Ask about them explicitly.</p>`},
  {h:'Phasing and triggers',b:`<p>Strong recommendations are often conditional: "Enter via JV now; build the full plant when contracted volume passes X." Triggers turn uncertainty into a plan.</p>`}],
 quiz:[
  {q:'The total EV market is USD 1.35bn but locally assembled demand gives 9,000 packs against a 16,700 breakeven. Best conclusion?',o:['Build the full plant','Full plant does not break even on local demand alone; find more anchor volume or a lighter entry','Exit the country','Ignore breakeven'],a:1,w:'Serviceable volume vs breakeven drives the decision.'},
  {q:'Which entry mode needs the least capital?',o:['Greenfield','Acquisition','Export via distributor','Joint venture'],a:2,w:'Exporting through a distributor uses existing capacity and partners.'},
  {q:'Breakeven volume = ?',o:['Fixed cost / price','Fixed cost / contribution per unit','Price / variable cost','Capex / revenue'],a:1,w:'Each unit contributes (price − variable cost) to cover fixed cost.'},
  {q:'Why do JVs appeal for Saudi entry?',o:['They avoid all risk','Local partner brings market access, relationships and sometimes licences','They are always cheaper','Required by law in all sectors'],a:1,w:'Partners lower execution risk; the trade-off is shared control and profit.'},
  {q:'A trigger in a recommendation is…',o:['A risk','A condition that unlocks the next phase','A KPI dashboard','A deadline'],a:1,w:'E.g. "build phase 2 once contracted volume exceeds 20,000 units".'},
  {q:'First question in a market-entry case?',o:['Which city?','Is the market attractive?','What should we name the company?','Who is the CEO?'],a:1,w:'Start from attractiveness, then ability to win, economics and mode.'}],
 srs:[{q:'Four questions of a market-entry case?',a:'Is the market attractive? Can we win? Do the economics work? How should we enter?'},{q:'Breakeven volume formula?',a:'Fixed cost ÷ contribution per unit (price − variable cost).'},{q:'Entry modes from low to high commitment?',a:'Export → licensing → contract manufacturing → JV → acquisition → greenfield.'},{q:'Saudi-specific entry factors?',a:'Local content, industrial-fund financing, MISA licensing, Saudisation, anchor customers.'}],
 read:[{t:'Distance Still Matters',s:'Harvard Business Review, 2001',n:'Ghemawat\'s CAGE framework for international expansion',u:'https://hbr.org/2001/09/distance-still-matters-the-hard-reality-of-global-expansion'},{t:'Invest Saudi',s:'Ministry of Investment portal',u:'https://investsaudi.sa/'},{t:'Market entry strategy',s:'HBR search',u:HBRS('market entry strategy')}]},

{id:'c08',track:'consult',title:'Growth and M&A cases',mins:40,blurb:'Is the target worth more to us than we pay? Synergies, premiums and walk-away prices.',
 lab:{key:'synergy',name:'Synergy calculator + case simulator',intro:'Play with the synergy model, then run the Al-Wafra / Nakheel case.'},
 cards:[
  {h:'Growth options',b:`<p>Growth comes from the core (more share, price, frequency), adjacencies (new products, customers, regions), or new businesses. Each can be organic (build) or inorganic (buy, partner).</p>`},
  {h:'The M&A test',b:`<div class="formula">Value created = Standalone value + Synergies − Integration cost − Price paid</div><p>Because price ≈ standalone value + premium, the deal creates value only if <b>synergies − integration > premium</b>.</p>`},
  {h:'Cost vs revenue synergies',b:`<p><b>Cost synergies</b> (procurement, overlapping distribution, overhead, footprint) are more controllable and usually realised. <b>Revenue synergies</b> (cross-selling, new channels) depend on customers and execution, and are often missed. Risk-weight them.</p>`},
  {h:'Valuing synergies quickly',b:`<p>A simple case approach: run-rate synergies × (1 − tax) × a capitalisation multiple (or ÷ cost of capital), minus one-off integration costs. Add a phase-in if they take years.</p>`},
  {h:'Walk-away price',b:`<p>Market value + synergy value = the most you should pay. Decide it before negotiations begin, and stick to it. Deal fever is real.</p>`}],
 quiz:[
  {q:'Premium SAR 450m, synergy value after integration SAR 510m. Value created?',o:['SAR 60m','SAR 960m','−SAR 60m','SAR 510m'],a:0,w:'510 − 450 = 60.'},
  {q:'Which synergies are usually more reliable?',o:['Revenue','Cost','Both equally','Neither'],a:1,w:'Cost synergies are more within management control.'},
  {q:'Pre-tax synergies 50/yr, tax 20%, multiple 10×, integration 100. Value?',o:['500','400','300','250'],a:2,w:'50 × 0.8 × 10 = 400, minus 100 = 300.'},
  {q:'Walk-away price = ?',o:['Asking price','Market value + synergy value','Book value','Revenue × 2'],a:1,w:'Paying more transfers all the synergy value to the seller and then some.'},
  {q:'Cross-selling revenue of 100 at 25% margin, 60% probability. Expected profit?',o:['15','25','60','100'],a:0,w:'100 × 25% × 60% = 15.'},
  {q:'A common reason acquisitions destroy value is…',o:['Paying too much and missing synergies','Low interest rates','Too much due diligence','Good integration'],a:0,w:'Overpaying plus under-delivered synergies.'}],
 srs:[{q:'When does an acquisition create value?',a:'When synergy value minus integration costs exceeds the premium paid.'},{q:'Quick synergy valuation?',a:'Run-rate synergies × (1 − tax) × multiple (or ÷ cost of capital) − one-off integration cost.'},{q:'Why risk-weight revenue synergies?',a:'They depend on customers and execution and are frequently not realised.'},{q:'Walk-away price?',a:'Market (standalone) value + value of synergies; decide before negotiating.'}],
 read:[{t:'The Big Idea: The New M&A Playbook',s:'Harvard Business Review, 2011',u:'https://hbr.org/2011/03/the-big-idea-the-new-ma-playbook'},{t:'M&A synergies',s:'HBR search',u:HBRS('acquisition synergies')},{t:'Strategies for Diversification',s:'Harvard Business Review, 1957',n:'Ansoff\'s growth matrix, the original',u:'https://hbr.org/1957/09/strategies-for-diversification'}]},

{id:'c09',track:'consult',title:'Operations and cost-reduction cases',mins:40,blurb:'Your home ground: connect yield, OEE and energy to the P&L.',
 lab:{key:'sim',sim:'costout',name:'Case simulator: Jubail Compounds',intro:'Find SAR 63m of savings in a polymer plant without touching safety or quality.'},
 cards:[
  {h:'Baseline first',b:`<p>Lay out the cost base by nature (energy, labour, maintenance, materials, overhead) and by unit (line, site, function). You cannot prioritise what you have not measured.</p>`},
  {h:'Volume × rate',b:`<div class="formula">Energy cost = tonnes × kWh per tonne × SAR per kWh</div><p>Every cost line splits into a driver (how much) and a rate (at what price). Levers attack one or the other: buy cheaper, or use less.</p>`},
  {h:'Hidden levers in process industries',b:`<ul><li><b>Yield:</b> 1% less scrap on an expensive input often beats any labour saving.</li><li><b>OEE:</b> availability × performance × quality.</li><li><b>Maintenance:</b> reactive to planned to predictive.</li><li><b>Energy:</b> heat recovery, motors and drives, tariffs.</li></ul>`},
  {h:'Capacity is not cash',b:`<p>OEE and productivity gains create capacity. They only become savings if you close a shift, idle a line, avoid an investment, or sell the extra output. Always finish the sentence: "…which saves SAR X because…"</p>`},
  {h:'Sustain it',b:`<p>Cost programmes fail in year two. Recommend owners, KPIs in the monthly review, and incentives. Engineers recognise this as control loops: measure, compare, act.</p>`}],
 quiz:[
  {q:'OEE with availability 90%, performance 90%, quality 95%?',o:['76.9%','85%','90%','95%'],a:0,w:'0.9 × 0.9 × 0.95 = 0.7695.'},
  {q:'Resin spend SAR 1bn; scrap falls from 3% to 2%. Saving?',o:['SAR 1m','SAR 10m','SAR 100m','SAR 30m'],a:1,w:'1% × 1,000 = 10.'},
  {q:'An OEE gain on a line saves money when…',o:['Always, automatically','You use the freed capacity: fewer shifts, avoided capex, or more sales','Never','Only if energy prices fall'],a:1,w:'Capacity must be monetised.'},
  {q:'Which split helps find levers for energy cost?',o:['By month','Volume × consumption per unit × price','By colour','By manager'],a:1,w:'Driver × rate shows whether to use less or pay less.'},
  {q:'Moving from reactive to planned maintenance mainly improves…',o:['Availability and maintenance cost','Marketing','Price','Tax'],a:0,w:'Fewer breakdowns, less overtime and fewer emergency parts.'},
  {q:'Why do cost programmes often fade?',o:['Too much success','No owners, KPIs or follow-up after the consultants leave','Inflation','Good communication'],a:1,w:'Sustainability needs owners, KPIs and a review rhythm.'}],
 srs:[{q:'OEE formula?',a:'Availability × Performance × Quality.'},{q:'Driver × rate decomposition?',a:'Cost = volume driver × consumption per unit × unit price; levers use less or pay less.'},{q:'Why is yield a big lever?',a:'It multiplies the most expensive input; small % gains are large SAR amounts.'},{q:'"Capacity is not cash" means?',a:'Productivity gains save money only when you close shifts or lines, avoid capex, or sell more.'}],
 read:[{t:'Decoding the DNA of the Toyota Production System',s:'Harvard Business Review, 1999',u:'https://hbr.org/1999/09/decoding-the-dna-of-the-toyota-production-system'},{t:'Cost reduction programmes',s:'HBR search',u:HBRS('cost reduction')},{t:'Interviewing at Bain',s:'Bain Careers',u:'https://www.bain.com/careers/hiring-process/interviewing/'}]},

{id:'c10',track:'consult',title:'Pricing and new-product cases',mins:35,blurb:'Floors, ceilings and the value in between.',
 lab:{key:'evc',name:'EVC calculator + case simulator',intro:'Set a price from the customer\'s economics, then run the PumpSense case.'},
 cards:[
  {h:'Three lenses',b:`<ul><li><b>Cost-based:</b> the floor. Below it you lose money.</li><li><b>Competitor-based:</b> the reference customers know.</li><li><b>Value-based:</b> the ceiling: what it is worth to the customer.</li></ul>`},
  {h:'Economic value to the customer',b:`<div class="formula">EVC = price of next-best alternative + value of your differentiation</div><p>Differentiation value can be positive (saves downtime) or negative (switching costs, risk). Price below EVC so the customer has a reason to switch.</p>`},
  {h:'Pricing is powerful',b:`<p>For a typical company, a 1% price rise improves operating profit far more than a 1% volume rise, because price falls straight to the bottom line. That is why pricing cases come up so often.</p>`},
  {h:'New products: will it sell?',b:`<p>Size the market (who buys, how many, how often), estimate adoption over time, test willingness to pay (interviews, conjoint, pilots), and check cannibalisation of existing products.</p>`},
  {h:'Reduce perceived risk',b:`<p>New offers face scepticism. Pilots, guarantees, outcome-based pricing and tiers lower the barrier. Engineers can quantify the outcome: hours of downtime avoided, kWh saved.</p>`}],
 quiz:[
  {q:'Alternative costs 50; your product saves an extra 30 of value. EVC?',o:['30','50','80','20'],a:2,w:'50 + 30 = 80.'},
  {q:'Which is the price ceiling?',o:['Cost','Competitor price','EVC','Marketing budget'],a:2,w:'Above EVC, a rational customer prefers the alternative.'},
  {q:'Why not price exactly at EVC?',o:['It is illegal','Customer has no incentive to switch','It is too low','Competitors would copy'],a:1,w:'Leave part of the value with the customer.'},
  {q:'Cannibalisation means…',o:['Stealing competitor share','New product takes sales from your existing products','Price war','Cost cutting'],a:1,w:'Net new revenue = new product revenue − lost sales of old products.'},
  {q:'Outcome-based pricing charges for…',o:['Hours worked','Results delivered (e.g. downtime avoided)','Number of sensors','Nothing'],a:1,w:'It shares risk and aligns price with value.'},
  {q:'A 1% price rise typically affects profit more than 1% volume because…',o:['Volume does not matter','Extra price has no extra cost attached','Customers like higher prices','Tax'],a:1,w:'Price increases flow straight to profit; extra volume carries variable cost.'}],
 srs:[{q:'EVC formula?',a:'Next-best alternative price + value of differentiation.'},{q:'Pricing floor and ceiling?',a:'Floor: cost to serve. Ceiling: EVC. Price in between, below EVC.'},{q:'Why does price beat volume for profit?',a:'A price increase carries no extra variable cost; it flows straight to profit.'},{q:'Ways to lower adoption risk for a new offer?',a:'Pilots, guarantees, outcome-based pricing, tiers, bundles.'}],
 read:[{t:'The power of pricing',s:'McKinsey Quarterly',u:'https://www.mckinsey.com/capabilities/growth-marketing-and-sales/our-insights/the-power-of-pricing'},{t:'Value-based pricing',s:'HBR search',u:HBRS('value-based pricing')},{t:'Marketing Myopia',s:'Harvard Business Review',n:'Levitt: define the business by customer needs',u:'https://hbr.org/2004/07/marketing-myopia'}]},

{id:'c11',track:'consult',title:'Reading exhibits fast',mins:25,blurb:'Read a chart in 20 seconds and say the "so what".',
 lab:{key:'exhibits',name:'Timed exhibit drill',intro:'Six generated charts, timed. Read the title and units first.'},
 cards:[
  {h:'Read in this order',b:`<ol><li>Title and subtitle</li><li>Units and period</li><li>Axes and legend</li><li>Source and footnotes</li><li>Only then: the data</li></ol><p>Misreading units is the most common, and most avoidable, error.</p>`},
  {h:'Absolute vs relative',b:`<p>The biggest bar may grow slowest. Say which you mean: "Cement added the most revenue (+SAR 80m), but glass grew fastest (+35%)."</p>`},
  {h:'Find the outlier',b:`<p>Exhibits in cases usually hide one insight: an outlier segment, a trend break, a gap between two series. Look for what is different, not what is normal.</p>`},
  {h:'Say the "so what"',b:`<p>Never just describe. "Revenue rose 12%" is a fact. "Revenue rose 12% but almost all of it is price, so volume is flat. Let us check market share." is an insight that moves the case.</p>`},
  {h:'Quick maths on charts',b:`<div class="formula">Share = part / total · Growth = (new − old) / old · CAGR ≈ total growth / years (for small rates)</div><p>Round, then state the approximation: "about a third".</p>`}],
 quiz:[
  {q:'First thing to read on an exhibit?',o:['The tallest bar','Title, units and period','The source','The colours'],a:1,w:'Units and period determine what every number means.'},
  {q:'Segment A grew from 200 to 240; B from 50 to 70. Which grew fastest in %?',o:['A (20%)','B (40%)','Same','Cannot tell'],a:1,w:'B: 20/50 = 40%; A: 40/200 = 20%.'},
  {q:'Which segment added more absolute revenue in that example?',o:['A (+40)','B (+20)','Same','Cannot tell'],a:0,w:'Absolute and relative growth point to different segments here.'},
  {q:'"Revenue rose 12%" is a…',o:['Insight','Description; you still need the "so what"','Recommendation','Hypothesis'],a:1,w:'Add implication: why it matters and what to check next.'},
  {q:'Part 45, total 180. Share?',o:['20%','25%','30%','40%'],a:1,w:'45/180 = 1/4.'},
  {q:'Exhibits in cases usually contain…',o:['No useful information','One key insight, often an outlier or trend break','Only noise','Mistakes on purpose'],a:1,w:'Look for what is different.'}],
 srs:[{q:'Order for reading an exhibit?',a:'Title → units/period → axes/legend → source → data.'},{q:'Absolute vs relative growth?',a:'Absolute = change in amount; relative = % change. The largest absolute gain may be the slowest % growth.'},{q:'Fact vs insight?',a:'A fact describes; an insight adds the implication and what to do or check next.'},{q:'Growth formula?',a:'(new − old) / old.'}],
 read:[{t:'Storytelling with Data',s:'Cole Nussbaumer Knaflic',n:'Blog and resources on reading and building charts',u:'https://www.storytellingwithdata.com/'},{t:'Edward Tufte',s:'edwardtufte.com',n:'The classic on the visual display of quantitative information',u:'https://www.edwardtufte.com/'},{t:'Data visualisation',s:'HBR search',u:HBRS('data visualization')}]},

{id:'c12',track:'consult',title:'Pyramid principle and storylining',mins:40,blurb:'Answer first, then the reasons, then the evidence.',
 lab:{key:'story',name:'Storyline builder',intro:'SCQA, governing thought, three key lines: rendered as a pyramid you can check.'},
 cards:[
  {h:'Answer first',b:`<p>Senior readers want the conclusion before the reasoning. Start with the <b>governing thought</b>, the answer in one sentence, then support it. This is the opposite of how we learn in school (background → method → result).</p>`},
  {h:'SCQA',b:`<ul><li><b>Situation:</b> what the reader already agrees with.</li><li><b>Complication:</b> what changed or went wrong.</li><li><b>Question:</b> the question this raises in the reader's mind.</li><li><b>Answer:</b> your governing thought.</li></ul><p>SCQA is the introduction; the pyramid is the body.</p>`},
  {h:'The pyramid',b:`<p>Under the governing thought, 3 (2–5) <b>key lines</b> that together prove it. Under each, the supporting evidence. Ideas at each level are MECE and of the same kind: all reasons, or all steps.</p>`},
  {h:'Deductive vs inductive',b:`<p><b>Inductive</b> (grouping): three independent reasons all support the answer, which is robust because any one can fall. <b>Deductive</b> (chain): A, therefore B, therefore C, which is fragile and slow for busy readers. Prefer inductive at the top.</p>`},
  {h:'Deck = pyramid',b:`<p>Executive summary = governing thought + key lines. Each section = a key line. Each slide title = a supporting point. If you read only the slide titles, you should get the whole argument (the "title test").</p>`}],
 quiz:[
  {q:'In SCQA, the Complication is…',o:['The answer','What changed or went wrong','The background','The data'],a:1,w:'It creates the tension that makes the reader ask the Question.'},
  {q:'Where does the governing thought go?',o:['At the end','At the top, first','In the appendix','Nowhere'],a:1,w:'Answer first.'},
  {q:'Key lines under the governing thought should be…',o:['Mixed reasons and steps','MECE and of the same kind','As many as possible','In random order'],a:1,w:'Consistent type and MECE grouping make the argument clear.'},
  {q:'Why prefer inductive grouping at the top?',o:['It is longer','Each reason stands alone, so the argument is robust','It sounds academic','It needs no data'],a:1,w:'A deductive chain breaks if one link breaks.'},
  {q:'The "title test" checks whether…',o:['Titles fit on one line','Reading only slide titles gives the whole argument','Titles use the brand font','Titles are questions'],a:1,w:'Titles should form the storyline.'},
  {q:'The executive summary is…',o:['A list of activities','The governing thought plus the key lines','The appendix','The methodology'],a:1,w:'It is the top two levels of the pyramid.'}],
 srs:[{q:'SCQA?',a:'Situation, Complication, Question, Answer.'},{q:'Governing thought?',a:'Your answer to the reader\'s question, in one sentence, placed first.'},{q:'Inductive vs deductive structure?',a:'Inductive groups independent supports (robust); deductive chains steps (fragile, slower). Prefer inductive at the top.'},{q:'Title test?',a:'Reading only the slide titles should tell the whole story.'}],
 read:[{t:'The Minto Pyramid Principle',s:'Barbara Minto',u:'https://www.barbaraminto.com/'},{t:'Writing clearly for business',s:'HBR search',u:HBRS('pyramid principle')},{t:'The Necessary Art of Persuasion',s:'Harvard Business Review, 1998',u:'https://hbr.org/1998/05/the-necessary-art-of-persuasion'}]},

{id:'c13',track:'consult',title:'Slide-writing',mins:35,blurb:'Action titles, one message per slide, and evidence that proves the title.',
 lab:{key:'slides',name:'Slide critique',intro:'Four slides. Pick the best title, spot the problems, and rewrite.'},
 cards:[
  {h:'Action titles',b:`<p>A title states the message as a full sentence: "Energy cost per tonne rose 46% since 2022 and drives most of the margin decline", not "Energy costs". Aim for one or two lines.</p>`},
  {h:'One slide, one message',b:`<p>If a slide makes two points, it makes neither. Split it. The body exists only to prove the title.</p>`},
  {h:'Does the body prove the title?',b:`<p>Check every slide: if the title says "most profitable", the chart must show profit, not revenue. Partners catch mismatches in seconds, and they cost you credibility.</p>`},
  {h:'Ghost decks',b:`<p>Before analysis is done, sketch the deck: titles written as hypotheses, boxes describing the chart you expect. It shows the team what to produce and exposes gaps early. Update titles as data arrives.</p>`},
  {h:'Hygiene',b:`<ul><li>Units, period and source on every chart</li><li>One highlight colour for the point you are making</li><li>No 3-D, no unnecessary gridlines</li><li>Readable in 30 seconds</li><li>Consistent number formats (SAR m, %, one decimal)</li></ul>`}],
 quiz:[
  {q:'Which is an action title?',o:['Market overview','Saudi EV sales will reach 150k by 2030, but only 60k will be assembled locally','EV market','Analysis of EV sales 2024–2030'],a:1,w:'It states a specific message.'},
  {q:'A slide has a revenue chart titled "B is the most profitable segment". Problem?',o:['None','The chart does not prove the title','Title too short','Needs more colours'],a:1,w:'Revenue ≠ profit. Evidence must match the claim.'},
  {q:'What is a ghost deck?',o:['A deleted deck','A sketch of the storyline with hypothesis titles before analysis is done','A deck with no images','An old template'],a:1,w:'It drives the workplan from the storyline.'},
  {q:'How many messages per slide?',o:['One','Two','Three','As many as fit'],a:0,w:'One message, proven by the body.'},
  {q:'Highlight colour should be used for…',o:['Decoration','The data point that makes the message','Every bar','Logos'],a:1,w:'Colour directs the eye to the point.'},
  {q:'Every chart needs…',o:['3-D effects','Units, period and source','A photo','Animation'],a:1,w:'Without them the reader cannot trust or interpret the chart.'}],
 srs:[{q:'Action title?',a:'A full-sentence message (≤2 lines) stating the "so what" of the slide.'},{q:'Ghost deck?',a:'Storyline sketched early with hypothesis titles and placeholder charts; updated as data arrives.'},{q:'Key slide check?',a:'Does the body prove the title?'},{q:'Chart hygiene must-haves?',a:'Units, period, source; one highlight colour; no 3-D; readable in 30 s.'}],
 read:[{t:'Storytelling with Data',s:'Cole Nussbaumer Knaflic',u:'https://www.storytellingwithdata.com/'},{t:'Presentation design',s:'HBR search',u:HBRS('presentation slides')},{t:'The Minto Pyramid Principle',s:'Barbara Minto',u:'https://www.barbaraminto.com/'}]},

{id:'c14',track:'consult',title:'Client communication',mins:30,blurb:'Interviews, workshops, status updates and managing up.',
 lab:{key:'email',name:'Message critique',intro:'Three real-world messages to a manager and a client. Improve them.'},
 cards:[
  {h:'Bottom line up front',b:`<p>Every message: answer or status in the first line, the ask with a date in the second, detail after. Subject lines should carry the ask: "Decision needed by Sunday: supplier consolidation".</p>`},
  {h:'Client interviews',b:`<ul><li>Send 3–5 questions in advance</li><li>Open broad ("What would you change if you were CEO?"), then go specific</li><li>Listen 80%; ask for numbers and examples</li><li>Ask "Who else should I speak to?" and "What data would show this?"</li><li>Write notes within 24 hours</li></ul>`},
  {h:'Workshops',b:`<p>Define the decision or output first. Pre-wire key participants so there are no surprises. Facilitate, do not present. Capture agreements and owners on the spot.</p>`},
  {h:'Pre-wiring',b:`<p>Never surprise a senior client in a meeting. Show key findings one-on-one first, especially when they affect that person's area. Meetings should ratify, not reveal.</p>`},
  {h:'Managing up',b:`<p>From <i>Managing Your Boss</i>: understand your manager's goals, pressures and preferred style (reader or listener?), and adapt. Bring problems with options. Keep them informed: no surprises in either direction.</p>`}],
 quiz:[
  {q:'The first line of a status email should contain…',o:['Greetings','The answer or status and the key ask','Background','Your schedule'],a:1,w:'Busy readers may read only two lines.'},
  {q:'Pre-wiring means…',o:['Setting up the projector','Sharing key findings one-on-one before a meeting','Sending the agenda','Booking the room'],a:1,w:'Avoid surprising stakeholders in public.'},
  {q:'A good question to end a client interview?',o:['Any questions for me?','Who else should I speak to, and what data would show this?','Was that useful?','Can we finish early?'],a:1,w:'It expands your network and evidence base.'},
  {q:'In a workshop, the consultant mainly…',o:['Presents slides','Facilitates toward a defined output','Takes no notes','Decides for the client'],a:1,w:'The client should own the outcome.'},
  {q:'Asking a senior client for data, you should state…',o:['Only the deadline','What exactly, by when, and why it matters to them','That it is urgent','Nothing, just attach the request'],a:1,w:'Specific, dated, and framed around their interest.'},
  {q:'"Bring problems with options" helps because…',o:['It hides problems','It lets your manager decide quickly and builds trust','It is faster to type','It avoids meetings'],a:1,w:'Managers value judgement, not just escalation.'}],
 srs:[{q:'BLUF?',a:'Bottom line up front: answer and ask in the first two lines, detail after.'},{q:'Pre-wiring?',a:'Showing key findings one-on-one before a group meeting so the meeting ratifies rather than reveals.'},{q:'Two questions to end every client interview?',a:'Who else should I speak to? What data would show this?'},{q:'Managing your boss in three habits?',a:'Understand their goals and style; bring problems with options; no surprises.'}],
 read:[{t:'Managing Your Boss',s:'Harvard Business Review',n:'Gabarro & Kotter',u:'https://hbr.org/2005/01/managing-your-boss'},{t:'The Necessary Art of Persuasion',s:'Harvard Business Review, 1998',n:'Conger',u:'https://hbr.org/1998/05/the-necessary-art-of-persuasion'},{t:'Writing better emails',s:'HBR search',u:HBRS('writing email')}]},

{id:'c15',track:'consult',title:'Case-interview mastery',mins:45,blurb:'A full, timed mock case with scoring — solo or with a live partner.',
 lab:{key:'mock',name:'Full mock case (30 minutes)',intro:'Red Sea Foods. Talk out loud, then score yourself on the four dimensions interviewers use.'},
 cards:[
  {h:'What interviewers score',b:`<ul><li><b>Structure:</b> a clear, MECE, tailored approach — not a memorised framework.</li><li><b>Maths and analytics:</b> fast, accurate, with sanity checks.</li><li><b>Insight and synthesis:</b> the "so what" at each step, and a crisp recommendation.</li><li><b>Communication:</b> answer first, signposting, calm under pressure.</li></ul>`},
  {h:'The first two minutes',b:`<p>Restate the question and objective. Ask 2–3 clarifying questions (goal, timeframe, constraints). Take a moment to structure on paper. Then walk the interviewer through your structure, and say where you would start and why.</p>`},
  {h:'Drive the case',b:`<p>Candidate-led cases expect you to choose the next step: "Given margin fell mainly from cost, I would like to look at the variable-cost breakdown." Interviewer-led cases test each step separately. In both, connect each finding back to the question.</p>`},
  {h:'Maths under pressure',b:`<p>Say the approach before computing. Write numbers neatly with units. Round sensibly. Check orders of magnitude. If you make an error and notice it, say so and fix it — that scores well.</p>`},
  {h:'Close like a partner',b:`<p>"My recommendation is X, for three reasons… The main risk is Y, which we would mitigate by Z. Next steps are…" 60 seconds, answer first, numbers in.</p>`}],
 quiz:[
  {q:'Which is NOT one of the four common scoring dimensions?',o:['Structure','Maths','Insight and synthesis','Knowing the firm\'s history'],a:3,w:'Firms score how you think and communicate.'},
  {q:'Best first move after hearing the case prompt?',o:['Start calculating','Restate the objective and ask clarifying questions','Name a framework','Give the answer'],a:1,w:'Make sure you are solving the right problem.'},
  {q:'You notice a maths mistake. You should…',o:['Hope nobody sees','Say so and correct it','Restart the case','Blame rounding'],a:1,w:'Self-correction shows rigour.'},
  {q:'In a candidate-led case you should…',o:['Wait for instructions','Propose the next area to explore and why','Ask for the answer','Cover every branch equally'],a:1,w:'Driving the case is part of the test.'},
  {q:'A memorised framework applied rigidly signals…',o:['Strong preparation','Weak thinking; tailor the structure to the case','Good communication','Speed'],a:1,w:'Interviewers want tailored structure.'},
  {q:'The closing recommendation should include…',o:['A summary of every step','Answer, reasons, risk, next steps in about a minute','Only the risks','Questions for the interviewer'],a:1,w:'Answer first, then support, risks and next steps.'}],
 srs:[{q:'Four case-interview scoring dimensions?',a:'Structure; maths & analytics; insight & synthesis; communication.'},{q:'First two minutes of a case?',a:'Restate the objective, ask 2–3 clarifying questions, structure on paper, walk through the structure and where to start.'},{q:'Shape of a closing recommendation?',a:'Answer → 2–3 reasons → main risk and mitigation → next steps, in about 60 seconds.'},{q:'Candidate-led vs interviewer-led?',a:'Candidate-led: you choose next steps. Interviewer-led: each step is posed. Always link findings to the question.'}],
 read:[{t:'Interviewing at McKinsey',s:'McKinsey Careers',u:'https://www.mckinsey.com/careers/interviewing'},{t:'Interviewing at Bain',s:'Bain Careers',u:'https://www.bain.com/careers/hiring-process/interviewing/'},{t:'Case interview preparation',s:'BCG Careers',u:'https://careers.bcg.com/global/en/case-interview-preparation'}]}
]);

CASES.push(
{id:'w01',title:'Al-Rashid Precision Components: To Automate or Not?',teaser:'A plant GM must decide whether to spend SAR 38m automating a machining cell, with jobs, Saudisation targets and an anchor customer on the line.',byline:'Teaching case · Operations strategy · Fictional company, illustrative data',
 body:`<p class="dropcap">On a Thursday evening in late September, Huda Al-Rashid sat in her office overlooking the machining hall of Al-Rashid Precision Components in Dammam's Second Industrial City. The company, founded by her father in 1998, made machined steel and aluminium parts for pumps, valves and, increasingly, for a new automotive supply chain forming around the Kingdom's vehicle plants. Revenue had reached SAR 310m. Huda, a mechanical engineer who had become general manager two years earlier, had until the board meeting on the 14th to recommend whether to invest SAR 38m in a robotic machining cell.</p>
<p>The case for automation was strong on paper. The automotive customer, a Tier-1 supplier to a new EV assembly plant, had offered a five-year contract worth SAR 55m a year, conditional on tolerances of ±10 microns and a defect rate below 300 parts per million. The current manual cell achieved about 1,800 ppm on similar parts. "We can't hit their quality with people and our current machines," the quality manager, Sami, had told her. "Not consistently."</p>
<p>The case against was also real. The new cell would need nine fewer operators on each of two shifts. Al-Rashid had worked hard to reach the Platinum band in Nitaqat, and its Saudi operators were some of the best-trained in the city. Her father, still chairman, had built the company's reputation on loyalty. "We are not a company that replaces people with machines," he had said at dinner. And the robot supplier, from Germany, had installed only two cells in the GCC.</p>
<p>Her finance director, Faisal, had prepared the numbers (Exhibit 1). His view was blunt: "Without the cell, we don't get the contract. Without the contract, we are a pump-parts shop in a market that grows 3% a year." Huda's operations head proposed a third way: retrain the 18 operators as cell technicians, programmers and quality inspectors for the new automotive line, and phase the investment, starting with one robot. It would cost more and take longer, and the customer wanted first parts in nine months.</p>
<p>Huda looked at the spreadsheet again. The question was not only whether the investment paid back. It was what kind of company Al-Rashid would be in ten years.</p>`,
 exhibits:[{t:'Investment case prepared by the finance director (SAR m)',h:`<table class="t"><tr><th></th><th>Full cell now</th><th>Phased (1 robot, then 3)</th></tr><tr><td>Capex</td><td>38</td><td>14 now + 27 in year 2</td></tr><tr><td>Contract revenue (if won), per year</td><td>55</td><td>55 (customer has not agreed to phasing)</td></tr><tr><td>Contribution margin on contract</td><td>24%</td><td>22%</td></tr><tr><td>Operator cost saved per year</td><td>3.2</td><td>1.1 rising to 3.2</td></tr><tr><td>Retraining cost</td><td>0.6</td><td>1.4</td></tr><tr><td>First parts</td><td>Month 8</td><td>Month 11</td></tr></table>`,s:'Contract is for five years. Company cost of capital: 10%.'}],
 questions:[
  {q:'What is the economic case for the full cell? Estimate the annual cash benefit and a simple payback.',note:'Contract contribution 55 × 24% = SAR 13.2m a year, plus SAR 3.2m operator savings = about SAR 16.4m a year. Payback on SAR 38m ≈ 2.3 years, inside a five-year contract. Over five years at 10%, the annuity factor is about 3.79, so PV of benefits ≈ 62m vs 38m capex: NPV ≈ SAR 24m before retraining costs and terminal value.',pts:['Calculated contract contribution (≈ SAR 13.2m/yr)','Added operator savings for ≈ SAR 16.4m/yr','Payback around 2.3 years','Noted the contract term (5 years) or discounting']},
  {q:'What are the main risks of each option?',note:'Full cell: supplier inexperience in the GCC, ramp-up delays, single-customer dependence, cultural and reputational cost of redundancies. Phased: the customer may reject the 11-month timeline and lose the contract entirely; lower margin; two capex decisions. Both: technology risk on ±10 µm.',pts:['Delivery and ramp-up risk with an unproven supplier','Customer concentration / dependence on one contract','Phased option risks losing the contract on timing','People, culture and reputation risk']},
  {q:'How should Huda handle the people question?',note:'Separate the investment decision from the redundancy assumption. Automation does not have to mean dismissals: the automotive line creates new technician, programming and quality roles. Commit publicly to redeploy and retrain, use natural attrition, and partner with a technical college. This protects Nitaqat standing and the chairman\'s values and builds a scarce capability (automation skills) that becomes a competitive advantage.',pts:['Reframed: automation can redeploy rather than dismiss','Retraining into new roles (programming, maintenance, quality)','Linked to Saudisation / Nitaqat and the chairman\'s values','Saw the skills as a capability and advantage']},
  {q:'What should Huda recommend to the board on the 14th?',note:'A strong answer: invest in the full cell now to secure the contract (the phased option likely fails the customer\'s timeline), with three conditions: (1) a performance guarantee and on-site support from the supplier, (2) a redeployment commitment for all 18 operators funded from the SAR 3.2m annual saving, (3) negotiate a volume floor or longer term with the customer to reduce concentration risk. Present it as becoming an automotive-grade supplier, not as replacing people.',pts:['Clear recommendation (invest now, or a well-argued alternative)','Conditions that mitigate the main risks','People commitment built into the plan','Framed as a strategic choice about the company\'s future']}]},

{id:'w02',title:'Tahweel Logistics: The Last-Mile Dilemma',teaser:'A Riyadh delivery start-up has 14 months of runway. Expand to Jeddah and Dammam, or fix unit economics at home first?',byline:'Teaching case · Entrepreneurship and unit economics · Fictional company, illustrative data',
 body:`<p class="dropcap">Nora Al-Qahtani had started Tahweel in 2023 with two vans and a promise to Riyadh's online shops: same-day delivery with live tracking and cash-on-delivery handled cleanly. Two years later, Tahweel delivered 9,000 parcels a day for 340 merchants, had raised SAR 30m in a seed and Series A, and employed 160 drivers and 25 office staff. Its brand was strong among small e-commerce sellers on social media.</p>
<p>The board meeting was in three weeks. Her lead investor, a regional VC, was pushing for expansion. "Jeddah and Dammam are open right now. Two of the big players are focused on enterprise accounts. If we don't take the SME segment there in the next 12 months, someone else will. Growth is what the Series B investors will pay for."</p>
<p>Her CFO, Omar, saw it differently. Every parcel lost money (Exhibit 1). Failed first-attempt deliveries, around 18%, were the biggest problem: each one cost a second trip. Driver utilisation was low outside the 4–9 pm peak. "We have 14 months of runway at current burn," Omar said. "Expansion adds SAR 1.1m a month for at least six months before the new cities break even. That leaves us about eight months. If the Series B slips, we're dead."</p>
<p>Nora had two plans on her desk. Plan A: launch both cities in Q1 with the current model. Plan B: spend six months on unit economics in Riyadh: a pickup-point network with petrol stations and pharmacies to cut failed deliveries; dynamic pricing for same-day vs next-day; and route batching software. Then expand, with a better model, in Q3.</p>
<p>She knew both were defensible. She also knew that investors often say they want growth but invest in businesses that look like they will one day make money.</p>`,
 exhibits:[{t:'Unit economics per parcel, Riyadh, last quarter (SAR)',h:`<table class="t"><tr><th></th><th>Today</th><th>Plan B target</th></tr><tr><td>Average price charged to merchant</td><td>16.0</td><td>17.0</td></tr><tr><td>Driver cost</td><td>9.5</td><td>8.0</td></tr><tr><td>Vehicle and fuel</td><td>3.0</td><td>2.6</td></tr><tr><td>Failed-delivery re-attempts</td><td>2.7</td><td>1.0</td></tr><tr><td>Cash handling and payment fees</td><td>1.1</td><td>0.9</td></tr><tr><td>Hub and sorting</td><td>1.2</td><td>1.0</td></tr><tr><td><b>Contribution per parcel</b></td><td><b>−1.5</b></td><td><b>?</b></td></tr></table>`,s:'Monthly fixed overhead (office, tech, management): SAR 1.4m. Volume: 9,000 parcels/day, 26 days/month.'}],
 questions:[
  {q:'Calculate contribution per parcel under Plan B and the monthly contribution at today\'s volume.',note:'Plan B costs: 8.0 + 2.6 + 1.0 + 0.9 + 1.0 = 13.5; contribution = 17.0 − 13.5 = SAR 3.5 per parcel. Monthly parcels 9,000 × 26 = 234,000. Today: −1.5 × 234k = −SAR 351k/month contribution. Plan B: +3.5 × 234k = +SAR 819k/month, covering more than half the SAR 1.4m fixed overhead.',pts:['Plan B contribution ≈ SAR 3.5/parcel','Monthly volume ≈ 234,000 parcels','Today ≈ −SAR 0.35m/month vs Plan B ≈ +SAR 0.82m/month','Related contribution to the SAR 1.4m fixed overhead']},
  {q:'What does Plan A do to the business if unit economics stay the same?',note:'Expansion replicates a model that loses SAR 1.5 on every parcel: more volume means more losses. Burn rises by SAR 1.1m a month, runway falls to about eight months, and the company depends on a Series B arriving on time. Growth with negative contribution is not scaling; it is accelerating losses.',pts:['Recognised that negative unit economics scale losses','Runway falls to about 8 months','Dependence on Series B timing','Named this as a financing risk, not just an operating one']},
  {q:'What is the strongest argument for Plan A, and how could Nora capture its benefit without its risk?',note:'Strongest argument: land-grab in the SME segment; first-mover relationships with merchants are sticky. A hybrid: sign merchant agreements and pickup-point partners in Jeddah and Dammam now (low cost), serve them via a partner 3PL or next-day only, while fixing Riyadh. Launch own fleet in Q3 with the Plan B model.',pts:['Acknowledged the competitive window and merchant stickiness','Proposed a low-cost way to hold the position (partners, pre-signing, next-day)','Sequenced own-fleet launch after fixing the model','Kept burn under control']},
  {q:'What should Nora tell the board?',note:'Recommend Plan B with a hybrid foothold. Frame it for investors: "We will raise our Series B on positive contribution and a repeatable city playbook, which commands a higher valuation." Set measurable milestones: failed deliveries below 8%, contribution above SAR 3 per parcel by month 6, then launch Jeddah. This aligns with what late-stage investors actually fund.',pts:['Clear recommendation','Investor framing (fundability and valuation)','Measurable milestones and a launch trigger','Addressed the competitive risk']}]},

{id:'w03',title:'Wadi Steel: Responding to an Import Surge',teaser:'Cheap imported rebar is flooding the market. Match prices, defend premium segments, or push for trade remedies?',byline:'Teaching case · Competitive strategy · Fictional company, illustrative data',
 body:`<p class="dropcap">Khalid Al-Dosari had been CEO of Wadi Steel for four years when the import surge began. Wadi Steel produced 1.4 million tonnes of rebar a year from two electric-arc furnaces in Jubail, selling mainly to contractors and distributors serving residential and infrastructure projects. Over nine months, imported rebar from overcapacity markets had arrived at prices 12–15% below Wadi's list price. Import share of the Saudi rebar market had risen from 8% to 21%.</p>
<p>His sales director wanted to match import prices immediately. "Our distributors are telling us they will switch. If we lose them now, we will not get them back when the surge ends." His CFO warned that matching would cut EBITDA by more than half. "We would be paying to keep volume that the imports would take at a loss anyway."</p>
<p>The strategy team had prepared a market map (Exhibit 1). Not all customers were the same. Giga-project contractors required certified grades, traceable mill certificates and just-in-time delivery to site, and they faced local-content scoring in their own procurement. Distributors selling to small builders cared mainly about price. A smaller segment of precast and specialty fabricators valued consistent quality and technical support.</p>
<p>A third option was on the table: work with the industry association to file a petition for trade remedies. The process would take months and the outcome was uncertain. Meanwhile, two competitors had already cut prices. Khalid had to decide before the quarterly pricing round.</p>`,
 exhibits:[{t:'Wadi Steel customer segments',h:`<table class="t"><tr><th>Segment</th><th>Share of Wadi volume</th><th>Import penetration</th><th>Price sensitivity</th><th>What they value</th></tr><tr><td>Giga-project contractors</td><td>35%</td><td>Low</td><td>Low</td><td>Certified grades, delivery to site, local content</td></tr><tr><td>Distributors (small builders)</td><td>50%</td><td>High</td><td>High</td><td>Price, credit terms</td></tr><tr><td>Precast and fabricators</td><td>15%</td><td>Medium</td><td>Medium</td><td>Consistent quality, technical support</td></tr></table>`,s:'Wadi EBITDA: SAR 520m. Average price SAR 2,600/t. Matching imports across all volume would reduce average price by about SAR 330/t.'}],
 questions:[
  {q:'Use Five Forces thinking: which forces have shifted, and what does that mean for industry profitability?',note:'Threat of substitutes/new entrants via imports has risen sharply (imports act as new entrants with lower cost). Buyer power has increased in the distributor segment because buyers have credible alternatives. Rivalry intensifies as competitors cut price. Supplier power (scrap, power) is unchanged. Net: lower industry profitability, especially in commodity segments.',pts:['Imports as increased entry/rivalry pressure','Higher buyer power in the distributor segment','Competitor price cuts increase rivalry','Concluded that profitability falls mainly in commodity segments']},
  {q:'What would matching import prices across all segments cost? Is it necessary?',note:'SAR 330/t × 1.4 Mt ≈ SAR 462m, close to all of the SAR 520m EBITDA. It is not necessary: giga-project contractors (35%) have low import penetration and value certification and local content; cutting price there gives away margin for nothing.',pts:['Calculated ≈ SAR 460m impact','Compared it with SAR 520m EBITDA','Recognised that segments differ','Identified the giga-project segment as defensible without price cuts']},
  {q:'Design a segmented response.',note:'Giga-projects: hold price, strengthen the moat (certified grades, site logistics, local-content documentation, framework agreements). Precast/fabricators: modest targeted discounts plus technical service and quality guarantees. Distributors: selective response: protect key accounts with volume rebates and credit terms rather than list-price cuts; accept losing some marginal volume; consider a fighter brand. In parallel: support the trade-remedy petition with data.',pts:['Different moves for different segments','Strengthened non-price advantages for contractors','Targeted rather than across-the-board price action for distributors','Trade remedy as a parallel, not sole, response']},
  {q:'What would you recommend to Khalid, and what should he watch?',note:'Recommend the segmented response with a clear volume floor (e.g. keep furnace utilisation above 80%) and a pricing review every month. Watch: import prices and volumes, distributor churn, competitor moves, the trade-remedy timeline. The principle: compete on what imports cannot match (certification, logistics, local content), not on what they can (price).',pts:['Clear recommendation','A utilisation or volume floor','Leading indicators to monitor','The principle: compete where imports are weak']}]},

{id:'w04',title:'The First Steering Committee',teaser:'An associate on his first engagement has 14 hours to rebuild a storyline his manager says "doesn\'t answer the question".',byline:'Teaching case · Consulting practice and organisational behaviour · Fictional firm and people',
 body:`<p class="dropcap">It was 7:40 pm when Faisal's manager, Reem, closed her laptop and turned to him. "The deck has sixty pages of good analysis," she said. "But it doesn't answer the question. The SteerCo is at nine tomorrow. Can you rebuild the storyline tonight? Send me the new executive summary and the first ten slides by 11."</p>
<p>Faisal, an industrial engineer in his fourth month at Meridian Partners, had spent three weeks on the engagement for a Saudi industrial conglomerate. The key question, agreed at kick-off, was: <i>Should the group consolidate its four packaging plants into two, and if so, which two?</i> Faisal had built the cost baseline, visited all four plants, and modelled transport costs to customers. He was proud of the work.</p>
<p>He opened the deck. It began with eight pages of market overview, then plant-by-plant profiles, then the cost model, then the transport analysis. On slide 52, the recommendation appeared: consolidate into Riyadh and Jeddah, closing Dammam and Qassim, saving SAR 74m a year after SAR 120m of one-off costs.</p>
<p>He realised Reem was right. A CEO reading this would wait fifty pages for the answer. And there was something else. The Dammam plant manager, Abdullah, would be in the room. Faisal had interviewed him twice; Abdullah had been generous with his time and data. He did not yet know the recommendation.</p>
<p>Faisal also had a doubt he had not raised. His transport model assumed customers in the Eastern Province would accept two-day delivery from Riyadh. Two of the largest customers had told him informally they would not. He had not modelled what happened if they left.</p>
<p>He had fourteen hours, a storyline to rebuild, a stakeholder to think about, and an analysis gap he had not mentioned to anyone.</p>`,
 exhibits:[{t:'Current deck structure',h:`<table class="t"><tr><th>Section</th><th>Slides</th></tr><tr><td>Market overview</td><td>1–8</td></tr><tr><td>Plant profiles</td><td>9–24</td></tr><tr><td>Cost baseline</td><td>25–38</td></tr><tr><td>Transport model</td><td>39–51</td></tr><tr><td>Recommendation</td><td>52</td></tr><tr><td>Appendix</td><td>53–60</td></tr></table>`,s:'Savings SAR 74m/yr; one-off cost SAR 120m. Eastern Province customers: 22% of volume.'}],
 questions:[
  {q:'Rewrite the executive summary as a pyramid: governing thought and three key lines.',note:'Governing thought: "Consolidate into Riyadh and Jeddah: it saves SAR 74m a year for a one-off SAR 120m, provided we protect Eastern Province service." Key lines: (1) The four-plant network carries SAR 74m of avoidable cost (utilisation, overhead). (2) Riyadh and Jeddah are the right sites: lowest cost and closest to 78% of demand. (3) The main risk, Eastern Province service, is manageable with a cross-dock in Dammam. Then a decision request.',pts:['Governing thought states the answer and the number','Three key lines of the same type, MECE','The risk is in the storyline, not hidden','Ends with a decision or next step for the SteerCo']},
  {q:'What should Faisal do about the transport-model gap tonight?',note:'Tell Reem immediately, not after the meeting. Quantify roughly: 22% of volume in the Eastern Province; if the two largest customers leave, what share and contribution is at risk? Propose a mitigation (cross-dock or a small finishing site in Dammam) and adjust the savings range. Hiding it risks the firm\'s credibility and the client\'s decision. Raising it with options is exactly what managers value.',pts:['Raise it with Reem before the SteerCo','Quick quantification of the downside','Proposed a mitigation option','Recognised the integrity and credibility stakes']},
  {q:'How should the team handle Abdullah, the Dammam plant manager?',note:'Pre-wire: Reem or the partner should speak with Abdullah (and his superior) before the meeting, privately, explaining the recommendation, the reasoning, and what it means for him and his people. No one should learn their plant is closing on a slide in front of peers. Consider the client\'s HR and communication plan; the SteerCo decision may be "approve in principle, subject to people plan".',pts:['Pre-wire before the meeting','Senior person (manager/partner/client) does it, not the associate alone','Respect and dignity for the affected team','Link to a people and communication plan']},
  {q:'What does this case teach about the associate role?',note:'Analysis is necessary but not sufficient: the value is in the answer, communicated so the client can decide. Associates should draft the storyline early (ghost deck), surface doubts as soon as they arise, and think about the people in the room, not just the numbers.',pts:['Answer-first communication','Ghost deck / storyline early','Raise doubts early with options','Stakeholder awareness']}]}
);
